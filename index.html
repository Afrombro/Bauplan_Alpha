// ── Hilfsfunktionen ─────────────────────────────────────────────────────────
function ntNetto(n){ return (n.positionen||[]).reduce((s,p)=>(parseFloat(p.menge)||0)*(parseFloat(p.ep)||0)+s,0); }
function ntBrutto(n){ const net=ntNetto(n); return net+(net*(parseFloat(n.mwst)||8.1)/100); }
function ntLoad(){ try{ const d=localStorage.getItem('bp_nachtraege_v2'); return d?JSON.parse(d):NT_DEMO_DATA; }catch(e){ return NT_DEMO_DATA; } }
function ntSave(arr){ try{ localStorage.setItem('bp_nachtraege_v2',JSON.stringify(arr)); }catch(e){} }
function ntNewId(){ return 'nt_'+Date.now(); }

// ── Shared Mini-Components ──────────────────────────────────────────────────
function NtBadge({status}){
  const s=NT_STATUS_CFG[status]||{l:status,c:C.muted,bg:'rgba(255,255,255,.06)',icon:'?'};
  return <span style={{background:s.bg,color:s.c,padding:'3px 10px',borderRadius:'12px',fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.05em',display:'inline-flex',alignItems:'center',gap:'5px',whiteSpace:'nowrap'}}>
    <span>{s.icon}</span>{s.l}
  </span>;
}

function NtStatCard({label,count,chf,color,onClick}){
  return <div onClick={onClick} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'13px 14px',textAlign:'center',cursor:onClick?'pointer':'default',transition:'border-color .15s'}}
    onMouseEnter={e=>onClick&&(e.currentTarget.style.borderColor=color)}
    onMouseLeave={e=>onClick&&(e.currentTarget.style.borderColor=C.border)}>
    <div style={{fontSize:'28px',fontWeight:'800',color,lineHeight:'1',letterSpacing:'-.02em'}}>{count}</div>
    <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',margin:'4px 0 3px',fontWeight:'700'}}>{label}</div>
    <div style={{fontSize:'11px',color:C.muted}}>CHF {fmtCHF(chf)}</div>
  </div>;
}

// ── STATUS MODAL ─────────────────────────────────────────────────────────────
function NtStatusModal({nachtrag, onApply, onClose}){
  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',backdropFilter:'blur(8px)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'#1C1C1A',border:`1px solid ${C.gold}`,borderRadius:'16px',padding:'24px',maxWidth:'380px',width:'100%'}}>
      <div style={{fontSize:'18px',fontWeight:'800',color:C.gold,marginBottom:'4px'}}>Status ändern</div>
      <div style={{fontSize:'12px',color:C.dim,marginBottom:'18px'}}>{nachtrag.nr} — {nachtrag.titel}</div>
      {Object.entries(NT_STATUS_CFG).map(([k,s])=><div key={k} onClick={()=>onApply(k)}
        style={{display:'flex',alignItems:'center',gap:'12px',padding:'12px 14px',borderRadius:'10px',
          border:`1px solid ${nachtrag.status===k?s.c:'rgba(255,255,255,.08)'}`,
          background:nachtrag.status===k?s.bg:'rgba(255,255,255,.02)',
          cursor:'pointer',marginBottom:'7px',transition:'all .15s'}}
        onMouseEnter={e=>{if(nachtrag.status!==k){e.currentTarget.style.background=s.bg;e.currentTarget.style.borderColor=s.c;}}}
        onMouseLeave={e=>{if(nachtrag.status!==k){e.currentTarget.style.background='rgba(255,255,255,.02)';e.currentTarget.style.borderColor='rgba(255,255,255,.08)';}}}>
        <span style={{fontSize:'18px',color:s.c}}>{s.icon}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:s.c}}>{s.l}</div>
          {k==='genehmigt'&&<div style={{fontSize:'11px',color:C.dim,marginTop:'1px'}}>SIA 118 Art. 87 — Preis verbindlich</div>}
          {k==='eingereicht'&&<div style={{fontSize:'11px',color:C.dim,marginTop:'1px'}}>Bauherr erhält Unterlagen zur Prüfung</div>}
        </div>
        {nachtrag.status===k&&<span style={{fontSize:'11px',color:s.c,fontWeight:'700'}}>Aktuell</span>}
      </div>)}
      <button onClick={onClose} style={{marginTop:'4px',width:'100%',padding:'10px',borderRadius:'9px',border:`1px solid ${C.border}`,background:'transparent',color:C.muted,cursor:'pointer',fontSize:'13px'}}>Abbrechen</button>
    </div>
  </div>;
}

// ── POSITIONS EDITOR ─────────────────────────────────────────────────────────
function NtPosEditor({positionen, onChange}){
  const addPos = () => onChange([...positionen,{id:Date.now(),beschrieb:'',menge:'',einheit:'m²',ep:''}]);
  const delPos = (id) => onChange(positionen.filter(p=>p.id!==id));
  const updPos = (id,k,v) => onChange(positionen.map(p=>p.id===id?{...p,[k]:v}:p));
  const total = positionen.reduce((s,p)=>(parseFloat(p.menge)||0)*(parseFloat(p.ep)||0)+s,0);
  const isNeg = total < 0;

  const cellInput = {background:'transparent',border:'none',color:C.main,padding:'8px 10px',fontSize:'13px',outline:'none',width:'100%'};

  return <div style={{marginBottom:'16px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
      <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700'}}>Positionen / Nachtragspreis *</label>
      <button type="button" onClick={addPos} style={{padding:'4px 12px',borderRadius:'7px',border:`1px solid ${C.border}`,background:'transparent',color:C.muted,fontSize:'11px',cursor:'pointer'}}>+ Position</button>
    </div>
    <div style={{background:'rgba(255,255,255,.03)',border:`1px solid ${C.border}`,borderRadius:'10px',overflow:'hidden'}}>
      {/* Header */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px 70px 100px 30px',background:'rgba(255,255,255,.04)',padding:'7px 0',borderBottom:`1px solid ${C.border}`}}>
        {['Beschrieb','Menge','Einheit','EP (CHF)',''].map((h,i)=><div key={i} style={{padding:'0 10px',fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.05em',fontWeight:'700',textAlign:i>=1&&i<4?'right':'left'}}>{h}</div>)}
      </div>
      {/* Rows */}
      {positionen.map((p,i)=>{
        const rowTotal = (parseFloat(p.menge)||0)*(parseFloat(p.ep)||0);
        return <div key={p.id} style={{display:'grid',gridTemplateColumns:'1fr 80px 70px 100px 30px',borderTop:i>0?`1px solid rgba(255,255,255,.04)`:'none',alignItems:'center'}}>
          <input value={p.beschrieb} onInput={e=>updPos(p.id,'beschrieb',e.target.value)} placeholder="z.B. Mattenbewehrung Q335" style={{...cellInput,borderRight:`1px solid rgba(255,255,255,.04)`}}/>
          <input type="number" value={p.menge} onInput={e=>updPos(p.id,'menge',e.target.value)} placeholder="0" style={{...cellInput,textAlign:'right',borderRight:`1px solid rgba(255,255,255,.04)`}}/>
          <input value={p.einheit} onInput={e=>updPos(p.id,'einheit',e.target.value)} placeholder="m²" style={{...cellInput,textAlign:'center',borderRight:`1px solid rgba(255,255,255,.04)`}}/>
          <div style={{padding:'8px 10px',textAlign:'right',fontSize:'12px',color:rowTotal<0?C.red:rowTotal>0?C.muted:C.dim,borderRight:`1px solid rgba(255,255,255,.04)`}}>
            <input type="number" value={p.ep} onInput={e=>updPos(p.id,'ep',e.target.value)} placeholder="0.00" step="0.01" style={{...cellInput,textAlign:'right',padding:'0',width:'100%'}}/>
          </div>
          <button type="button" onClick={()=>delPos(p.id)} style={{background:'none',border:'none',color:'rgba(255,255,255,.25)',cursor:'pointer',fontSize:'15px',padding:'0 8px',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
        </div>;
      })}
      {positionen.length===0&&<div style={{padding:'16px',textAlign:'center',color:C.dim,fontSize:'13px'}}>Noch keine Positionen</div>}
      {/* Total */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:`rgba(${isNeg?'232,115,90':'200,169,110'},.06)`,borderTop:`1px solid ${C.border}`}}>
        <span style={{fontSize:'12px',color:C.dim}}>Netto exkl. MWST</span>
        <span style={{fontSize:'17px',fontWeight:'800',color:isNeg?C.red:C.gold,letterSpacing:'-.01em'}}>CHF {fmtCHF(total)}</span>
      </div>
    </div>
  </div>;
}

// ── FORMULAR (Neuer / Bearbeiten) ────────────────────────────────────────────
function NtFormular({initial, onSave, onCancel, nachtraege}){
  const {projekte} = useApp();
  const isEdit = !!initial?.id;

  const nextNr = 'NT-' + String((nachtraege?.length||0)+1).padStart(3,'0');
  const [f, setF] = useState(initial || {
    nr:nextNr, datum:today(), titel:'', projektId:'', projekt:'',
    unternehmer:'', gewerk:'', art:'zusatz', beschrieb:'',
    mwst:'8.1', fristTage:'0', notiz:'',
  });
  const [pos, setPos]   = useState(initial?.positionen||[{id:1,beschrieb:'',menge:'',einheit:'m²',ep:''}]);
  const [err, setErr]   = useState({});
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const artCfg = NT_ART_CFG.find(a=>a.v===f.art)||NT_ART_CFG[0];

  const si = {width:'100%',background:'rgba(255,255,255,.06)',border:`1px solid rgba(255,255,255,.12)`,borderRadius:'10px',padding:'10px 14px',color:C.main,fontSize:'14px',outline:'none',transition:'border-color .15s'};

  const validate = () => {
    const e={};
    if(!f.titel.trim()) e.titel='Pflichtfeld';
    if(!f.unternehmer.trim()) e.unternehmer='Pflichtfeld';
    if(pos.filter(p=>p.beschrieb||p.menge||p.ep).length===0) e.pos='Mind. eine Position erfassen';
    setErr(e); return Object.keys(e).length===0;
  };

  const handleSave = () => {
    if(!validate()) return;
    const cleanPos = pos.filter(p=>p.beschrieb||p.menge||p.ep).map(p=>({...p,menge:parseFloat(p.menge)||0,ep:parseFloat(p.ep)||0}));
    const proj = projekte?.find(p=>p.id==f.projektId);
    const n = {
      ...f,
      id: initial?.id||ntNewId(),
      projekt: proj?.name||f.projekt||'—',
      positionen: cleanPos,
      mwst: parseFloat(f.mwst)||8.1,
      fristTage: parseInt(f.fristTage)||0,
      status: initial?.status||'offen',
      verlauf: isEdit
        ? [...(initial?.verlauf||[]),{datum:today(),aktion:'bearbeitet',text:'Nachtrag aktualisiert'}]
        : [{datum:today(),aktion:'erstellt',text:'Nachtrag erstellt und eingereicht'}],
    };
    onSave(n);
  };

  return <div style={{background:'#171715',border:`2px solid ${C.gold}`,borderRadius:'16px',padding:'22px 20px',marginBottom:'16px'}}>
    {/* Title bar */}
    <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'18px',paddingBottom:'14px',borderBottom:`1px solid ${C.border}`}}>
      <div style={{width:'36px',height:'36px',background:`rgba(200,169,110,.15)`,border:`1px solid rgba(200,169,110,.3)`,borderRadius:'9px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>📋</div>
      <div>
        <div style={{fontSize:'17px',fontWeight:'800',color:C.gold}}>{isEdit?'Nachtrag bearbeiten':'Neuer Nachtrag'}</div>
        <div style={{fontSize:'11px',color:C.dim}}>SIA 118 Art. 84–91 · Bestellungsänderung</div>
      </div>
    </div>

    {/* SIA Info Box */}
    <div style={{background:'rgba(200,169,110,.05)',border:`1px solid rgba(200,169,110,.15)`,borderRadius:'9px',padding:'10px 14px',marginBottom:'16px',fontSize:'12px',color:'#A88848',lineHeight:'1.6'}}>
      <strong style={{color:C.gold}}>SIA 118 {artCfg.sia}</strong> — {artCfg.desc}
    </div>

    {/* Basis */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:'12px',marginBottom:'12px'}}>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Nr.</label>
        <input value={f.nr} onInput={e=>upd('nr',e.target.value)} style={si} placeholder="NT-001"/>
      </div>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Datum</label>
        <input type="date" value={f.datum} onInput={e=>upd('datum',e.target.value)} style={si}/>
      </div>
    </div>

    <div style={{marginBottom:'12px'}}>
      <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Titel / Kurzbezeichnung *</label>
      <input value={f.titel} onInput={e=>upd('titel',e.target.value)} style={{...si,borderColor:err.titel?C.red:undefined}} placeholder="z.B. Zusätzliche Bewehrung Bodenplatte"/>
      {err.titel&&<div style={{fontSize:'11px',color:C.red,marginTop:'3px'}}>{err.titel}</div>}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'12px'}}>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Projekt</label>
        {projekte?.length>0
          ? <select value={f.projektId} onChange={e=>upd('projektId',e.target.value)} style={{...si,background:'#1A1A18'}}>
              <option value="">— Kein Projekt zugeordnet —</option>
              {projekte.map(p=><option key={p.id} value={p.id}>{p.nr} · {p.name}</option>)}
            </select>
          : <input value={f.projekt} onInput={e=>upd('projekt',e.target.value)} style={si} placeholder="Projektname"/>
        }
      </div>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Unternehmer *</label>
        <input value={f.unternehmer} onInput={e=>upd('unternehmer',e.target.value)} style={{...si,borderColor:err.unternehmer?C.red:undefined}} placeholder="Firma AG"/>
        {err.unternehmer&&<div style={{fontSize:'11px',color:C.red,marginTop:'3px'}}>{err.unternehmer}</div>}
      </div>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Gewerk</label>
        <select value={f.gewerk} onChange={e=>upd('gewerk',e.target.value)} style={{...si,background:'#1A1A18'}}>
          <option value="">— wählen —</option>
          {NT_GEWERKE.map(g=><option key={g} value={g}>{g}</option>)}
        </select>
      </div>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Art (SIA 118)</label>
        <select value={f.art} onChange={e=>upd('art',e.target.value)} style={{...si,background:'#1A1A18'}}>
          {NT_ART_CFG.map(a=><option key={a.v} value={a.v}>{a.sia} · {a.l}</option>)}
        </select>
      </div>
    </div>

    <div style={{marginBottom:'16px'}}>
      <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Begründung / Sachverhalt</label>
      <textarea value={f.beschrieb} onInput={e=>upd('beschrieb',e.target.value)} rows="3"
        style={{...si,height:'80px',resize:'vertical',fontFamily:'inherit',lineHeight:'1.5'}}
        placeholder="Warum entstand dieser Nachtrag? Auf was bezieht er sich? (SIA 118 Art. 87)"/>
    </div>

    {/* Positionen */}
    <NtPosEditor positionen={pos} onChange={setPos}/>
    {err.pos&&<div style={{fontSize:'11px',color:C.red,marginBottom:'10px'}}>⚠ {err.pos}</div>}

    {/* MWST + Bauzeit */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'16px'}}>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>MWST %</label>
        <input type="number" value={f.mwst} onInput={e=>upd('mwst',e.target.value)} step="0.1" style={si}/>
      </div>
      <div>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Bauzeitverlängerung (Tage · SIA 118 Art. 90)</label>
        <input type="number" value={f.fristTage} onInput={e=>upd('fristTage',e.target.value)} min="0" style={si} placeholder="0"/>
      </div>
      <div style={{gridColumn:'1/-1'}}>
        <label style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',display:'block',marginBottom:'5px'}}>Interne Notiz</label>
        <input value={f.notiz} onInput={e=>upd('notiz',e.target.value)} style={si} placeholder="z.B. Angebot geprüft, Verhandlung läuft…"/>
      </div>
    </div>

    {/* Buttons */}
    <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
      <button type="button" onClick={handleSave}
        style={{background:C.gold,color:C.dark,fontWeight:'700',padding:'11px 24px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'14px',letterSpacing:'-.01em'}}>
        {isEdit?'✓ Änderungen speichern':'✓ Nachtrag erfassen'}
      </button>
      <button type="button" onClick={onCancel}
        style={{background:'rgba(255,255,255,.06)',border:`1px solid ${C.border}`,color:C.muted,padding:'11px 20px',borderRadius:'10px',cursor:'pointer',fontSize:'13px'}}>
        Abbrechen
      </button>
    </div>
  </div>;
}

// ── DETAIL ANSICHT ────────────────────────────────────────────────────────────
function NtDetail({nachtrag, onBack, onEdit, onChangeStatus, onDelete}){
  const netto  = ntNetto(nachtrag);
  const mwst   = netto * (parseFloat(nachtrag.mwst)||8.1) / 100;
  const brutto = netto + mwst;
  const isNeg  = netto < 0;
  const artCfg = NT_ART_CFG.find(a=>a.v===nachtrag.art)||NT_ART_CFG[0];
  const stCfg  = NT_STATUS_CFG[nachtrag.status]||{c:C.muted,bg:'rgba(255,255,255,.06)'};

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    {/* Header */}
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'14px 18px',display:'flex',alignItems:'center',gap:'12px'}}>
      <button onClick={onBack} style={{background:'rgba(255,255,255,.08)',border:`1px solid ${C.border}`,color:C.main,padding:'7px 14px',borderRadius:'9px',fontSize:'13px',cursor:'pointer',fontWeight:'600'}}>← Zurück</button>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'13px',color:C.dim,marginBottom:'1px'}}>{nachtrag.nr}</div>
        <div style={{fontSize:'17px',fontWeight:'800',color:C.main,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{nachtrag.titel}</div>
      </div>
      <NtBadge status={nachtrag.status}/>
    </div>

    <div style={{padding:'16px 18px'}}>
      {/* Betrag Hero */}
      <div style={{background:stCfg.bg,border:`1px solid ${stCfg.c}33`,borderRadius:'14px',padding:'20px',marginBottom:'16px',textAlign:'center'}}>
        <div style={{fontSize:'13px',color:C.muted,marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700'}}>Nettobetrag</div>
        <div style={{fontSize:'36px',fontWeight:'900',color:isNeg?C.red:C.gold,letterSpacing:'-.02em'}}>
          {isNeg?'−':'+'}CHF {fmtCHF(Math.abs(netto))}
        </div>
        <div style={{fontSize:'12px',color:C.dim,marginTop:'6px'}}>inkl. MWST {nachtrag.mwst}%: CHF {fmtCHF(Math.abs(brutto))}</div>
        {nachtrag.fristTage>0&&<div style={{marginTop:'8px',display:'inline-block',background:'rgba(224,160,64,.12)',border:'1px solid rgba(224,160,64,.25)',borderRadius:'7px',padding:'4px 12px',fontSize:'12px',color:'#E0A040',fontWeight:'700'}}>⏱ +{nachtrag.fristTage} Tage Bauzeitverlängerung</div>}
      </div>

      {/* Info Grid */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
          {[
            ['Datum',         fmtDate(nachtrag.datum)],
            ['Projekt',       nachtrag.projekt||'—'],
            ['Unternehmer',   nachtrag.unternehmer||'—'],
            ['Gewerk',        nachtrag.gewerk||'—'],
          ].map(([l,v])=><div key={l}>
            <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',marginBottom:'3px'}}>{l}</div>
            <div style={{fontSize:'14px',color:C.main}}>{v}</div>
          </div>)}
        </div>
        <div style={{marginTop:'12px',paddingTop:'12px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',marginBottom:'5px'}}>Art der Bestellungsänderung</div>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <span style={{background:`rgba(200,169,110,.1)`,color:C.gold,fontSize:'11px',padding:'3px 10px',borderRadius:'6px',fontWeight:'700'}}>{artCfg.sia}</span>
            <span style={{fontSize:'13px',color:C.muted}}>{artCfg.l}</span>
          </div>
          <div style={{fontSize:'12px',color:C.dim,marginTop:'6px',lineHeight:'1.5'}}>{artCfg.desc}</div>
        </div>
        {nachtrag.beschrieb&&<div style={{marginTop:'12px',paddingTop:'12px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',fontWeight:'700',marginBottom:'5px'}}>Sachverhalt</div>
          <div style={{fontSize:'13px',color:C.muted,lineHeight:'1.6'}}>{nachtrag.beschrieb}</div>
        </div>}
        {nachtrag.notiz&&<div style={{marginTop:'10px',padding:'9px 12px',background:'rgba(200,169,110,.04)',border:`1px solid rgba(200,169,110,.12)`,borderRadius:'7px',fontSize:'12px',color:'#A88848'}}>
          📝 {nachtrag.notiz}
        </div>}
      </div>

      {/* Positionen Tabelle */}
      {(nachtrag.positionen||[]).length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',overflow:'hidden',marginBottom:'12px'}}>
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,fontSize:'12px',fontWeight:'700',color:C.muted,textTransform:'uppercase',letterSpacing:'.05em'}}>Positionen</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'rgba(255,255,255,.03)'}}>
            {['Pos.','Beschrieb','Menge','Einheit','EP CHF','Total CHF'].map((h,i)=><th key={h} style={{padding:'8px 12px',textAlign:i>=2?'right':'left',fontSize:'11px',color:C.dim,fontWeight:'700',textTransform:'uppercase',letterSpacing:'.04em'}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {nachtrag.positionen.map((p,i)=>{
              const tot=(parseFloat(p.menge)||0)*(parseFloat(p.ep)||0);
              return <tr key={p.id} style={{borderTop:`1px solid rgba(255,255,255,.04)`}}>
                <td style={{padding:'9px 12px',color:C.dim,fontSize:'12px'}}>{i+1}</td>
                <td style={{padding:'9px 12px',fontSize:'13px',color:C.main}}>{p.beschrieb}</td>
                <td style={{padding:'9px 12px',textAlign:'right',fontSize:'13px',color:C.muted}}>{p.menge}</td>
                <td style={{padding:'9px 12px',fontSize:'13px',color:C.dim}}>{p.einheit}</td>
                <td style={{padding:'9px 12px',textAlign:'right',fontSize:'13px',color:C.muted}}>{fmtCHF(p.ep)}</td>
                <td style={{padding:'9px 12px',textAlign:'right',fontSize:'13px',fontWeight:'700',color:tot<0?C.red:C.gold}}>{fmtCHF(tot)}</td>
              </tr>;
            })}
          </tbody>
          <tfoot>
            <tr style={{borderTop:`1px solid ${C.border}`}}>
              <td colSpan="5" style={{padding:'9px 12px',textAlign:'right',fontSize:'12px',color:C.dim}}>Netto exkl. MWST</td>
              <td style={{padding:'9px 12px',textAlign:'right',fontWeight:'700',color:isNeg?C.red:C.gold,fontSize:'14px'}}>{fmtCHF(netto)}</td>
            </tr>
            <tr>
              <td colSpan="5" style={{padding:'6px 12px',textAlign:'right',fontSize:'12px',color:C.dim}}>MWST {nachtrag.mwst}%</td>
              <td style={{padding:'6px 12px',textAlign:'right',color:C.muted,fontSize:'13px'}}>{fmtCHF(mwst)}</td>
            </tr>
            <tr style={{background:`rgba(${isNeg?'232,115,90':'200,169,110'},.06)`}}>
              <td colSpan="5" style={{padding:'10px 12px',textAlign:'right',fontWeight:'700',color:isNeg?C.red:C.gold}}>Total inkl. MWST</td>
              <td style={{padding:'10px 12px',textAlign:'right',fontWeight:'900',color:isNeg?C.red:C.gold,fontSize:'16px'}}>{fmtCHF(brutto)}</td>
            </tr>
          </tfoot>
        </table>
      </div>}

      {/* Verlauf */}
      {(nachtrag.verlauf||[]).length>0&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div style={{fontSize:'12px',fontWeight:'700',color:C.muted,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'12px'}}>Verlauf</div>
        {nachtrag.verlauf.map((v,i)=>{
          const sc = NT_STATUS_CFG[v.aktion]||{c:C.gold,bg:'rgba(200,169,110,.2)'};
          return <div key={i} style={{display:'flex',gap:'12px',paddingBottom:'12px',marginBottom:i<nachtrag.verlauf.length-1?'12px':'0',borderBottom:i<nachtrag.verlauf.length-1?`1px solid ${C.border}`:'none'}}>
            <div style={{width:'28px',height:'28px',borderRadius:'50%',background:sc.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:sc.c,flexShrink:0,fontWeight:'700',border:`1px solid ${sc.c}33`}}>{i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:'12px',color:C.dim,marginBottom:'2px'}}>{fmtDate(v.datum)}</div>
              <div style={{fontSize:'13px',color:C.main}}>{v.text}</div>

      {/* Action Buttons */}
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        <button onClick={()=>onChangeStatus(nachtrag)}
          style={{background:`rgba(200,169,110,.12)`,border:`1px solid rgba(200,169,110,.25)`,color:C.gold,padding:'10px 18px',borderRadius:'10px',cursor:'pointer',fontSize:'13px',fontWeight:'600'}}>
          ↕ Status ändern
        </button>
        <button onClick={()=>onEdit(nachtrag)}
          style={{background:'rgba(255,255,255,.06)',border:`1px solid ${C.border}`,color:C.muted,padding:'10px 18px',borderRadius:'10px',cursor:'pointer',fontSize:'13px'}}>
          ✏ Bearbeiten
        </button>
        <button onClick={()=>{if(confirm('Nachtrag löschen?'))onDelete(nachtrag.id);}}
          style={{marginLeft:'auto',background:'rgba(232,115,90,.08)',border:`1px solid rgba(232,115,90,.2)`,color:C.red,padding:'10px 16px',borderRadius:'10px',cursor:'pointer',fontSize:'13px'}}>
          🗑 Löschen
        </button>
      </div>
    </div>
  </div>;
}

// ── HAUPTKOMPONENTE: NachtraegeSeite ─────────────────────────────────────────
function NachtraegeSeite(){
  const [nachtraege, setNachtraege] = useState(()=>ntLoad());
  const [view, setView]             = useState('liste');   // liste|detail|formular
  const [selId, setSelId]           = useState(null);
  const [editData, setEditData]     = useState(null);
  const [filter, setFilter]         = useState('alle');
  const [search, setSearch]         = useState('');
  const [statusFor, setStatusFor]   = useState(null);

  const save = (arr) => { setNachtraege(arr); ntSave(arr); };

  const onSave = (n) => {
    const isEdit = nachtraege.some(x=>x.id===n.id);
    save(isEdit ? nachtraege.map(x=>x.id===n.id?n:x) : [n,...nachtraege]);
    setView('detail'); setSelId(n.id); setEditData(null);
  };

  const onDelete = (id) => {
    save(nachtraege.filter(n=>n.id!==id));
    setView('liste'); setSelId(null);
  };

  const applyStatus = (status) => {
    save(nachtraege.map(n=>n.id===statusFor.id
      ? {...n, status, verlauf:[...(n.verlauf||[]),{datum:today(),aktion:status,text:`Status geändert → ${NT_STATUS_CFG[status]?.l||status}`}]}
      : n
    ));
    setStatusFor(null);
    if(selId) setView('detail'); // refresh detail
  };

  // Stats
  const total   = nachtraege.length;
  const gen     = nachtraege.filter(n=>n.status==='genehmigt');
  const pend    = nachtraege.filter(n=>['offen','eingereicht','verhandlung'].includes(n.status));
  const abg     = nachtraege.filter(n=>n.status==='abgelehnt');
  const tAll    = nachtraege.reduce((s,n)=>s+ntNetto(n),0);
  const tGen    = gen.reduce((s,n)=>s+ntNetto(n),0);
  const tPend   = pend.reduce((s,n)=>s+ntNetto(n),0);

  // Filtered list
  const filtered = nachtraege.filter(n=>{
    if(filter!=='alle'&&n.status!==filter) return false;
    if(search){ const q=search.toLowerCase(); return (n.titel+n.projekt+n.unternehmer+n.gewerk).toLowerCase().includes(q); }
    return true;
  });

  // CSV Export
  const exportCSV = () => {
    const rows = [['Nr.','Datum','Titel','Projekt','Gewerk','Unternehmer','Art','Status','Netto CHF','Brutto CHF'],
      ...nachtraege.map(n=>[n.nr,n.datum,n.titel,n.projekt||'',n.gewerk||'',n.unternehmer||'',n.art||'',n.status,ntNetto(n).toFixed(2),ntBrutto(n).toFixed(2)])];
    const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv); a.download='Nachtraege_'+today()+'.csv'; a.click();
  };

  // Views
  const sel = nachtraege.find(n=>n.id===selId);

  if(view==='detail'&&sel) return <>
    <NtDetail nachtrag={sel}
      onBack={()=>setView('liste')}
      onEdit={n=>{setEditData(n);setView('formular');}}
      onChangeStatus={setStatusFor}
      onDelete={id=>{onDelete(id);}}/>
    {statusFor&&<NtStatusModal nachtrag={statusFor} onApply={applyStatus} onClose={()=>setStatusFor(null)}/>}
  </>;

  if(view==='formular') return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'14px 18px',display:'flex',alignItems:'center',gap:'12px'}}>
      <button onClick={()=>{setView(selId?'detail':'liste');setEditData(null);}} style={{background:'rgba(255,255,255,.08)',border:`1px solid ${C.border}`,color:C.main,padding:'7px 14px',borderRadius:'9px',fontSize:'13px',cursor:'pointer',fontWeight:'600'}}>← Zurück</button>
      <div style={{fontSize:'17px',fontWeight:'800'}}>{editData?.id?'Nachtrag bearbeiten':'Neuer Nachtrag'}</div>
    </div>
    <div style={{padding:'16px 18px'}}>
      <NtFormular initial={editData} onSave={onSave} onCancel={()=>{setView(selId?'detail':'liste');setEditData(null);}} nachtraege={nachtraege}/>
    </div>
  </div>;

  // Liste (main view)
  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    {/* Header */}
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 18px'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:'16px'}}>
        <div>
          <div style={{fontSize:'24px',fontWeight:'800',letterSpacing:'-.02em',color:C.main,marginBottom:'3px'}}>📋 Nachträge</div>
          <div style={{fontSize:'13px',color:C.muted}}>Bestellungsänderungen · SIA 118 Art. 84–91</div>
        </div>
        <button onClick={()=>{setEditData(null);setSelId(null);setView('formular');}}
          style={{background:C.gold,color:C.dark,fontWeight:'700',padding:'10px 18px',borderRadius:'10px',border:'none',cursor:'pointer',fontSize:'13px',display:'flex',alignItems:'center',gap:'6px',flexShrink:0}}>
          + Neuer Nachtrag
        </button>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
        <NtStatCard label="Total" count={total} chf={tAll} color={C.gold} onClick={()=>setFilter('alle')}/>
        <NtStatCard label="Genehmigt" count={gen.length} chf={tGen} color={C.green} onClick={()=>setFilter('genehmigt')}/>
        <NtStatCard label="Pendent" count={pend.length} chf={tPend} color="#E0A040" onClick={()=>setFilter('offen')}/>
        <NtStatCard label="Abgelehnt" count={abg.length} chf={0} color={C.red} onClick={()=>setFilter('abgelehnt')}/>
      </div>
    </div>

    <div style={{padding:'16px 18px'}}>
      {/* Filter + Search + Export */}
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px',alignItems:'center'}}>
        {['alle','offen','eingereicht','verhandlung','genehmigt','abgelehnt'].map(f=>{
          const s=NT_STATUS_CFG[f];
          return <button key={f} onClick={()=>setFilter(f)}
            style={{padding:'5px 14px',borderRadius:'20px',border:`1px solid ${filter===f?(s?.c||C.gold):C.border}`,background:filter===f?(s?.bg||'rgba(200,169,110,.12)'):'transparent',color:filter===f?(s?.c||C.gold):C.dim,fontSize:'12px',cursor:'pointer',fontWeight:filter===f?'700':'400',textTransform:'capitalize',transition:'all .15s'}}>
            {f==='alle'?`Alle (${total})`:s?.l||f}
          </button>;
        })}
        <div style={{marginLeft:'auto',display:'flex',gap:'8px',alignItems:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',background:'rgba(255,255,255,.05)',border:`1px solid ${C.border}`,borderRadius:'20px',padding:'6px 14px'}}>
            <span style={{color:C.dim,fontSize:'13px'}}>🔍</span>
            <input value={search} onInput={e=>setSearch(e.target.value)} placeholder="Suchen…"
              style={{background:'none',border:'none',color:C.main,fontSize:'13px',outline:'none',width:'130px'}}/>
          </div>
          <button onClick={exportCSV}
            style={{background:'rgba(255,255,255,.06)',border:`1px solid ${C.border}`,color:C.muted,padding:'7px 14px',borderRadius:'9px',cursor:'pointer',fontSize:'12px'}}>
            ⬇ CSV
          </button>
        </div>
      </div>

      {/* Empty state */}
      {filtered.length===0&&<div style={{textAlign:'center',padding:'70px 20px',color:C.dim}}>
        <div style={{fontSize:'48px',marginBottom:'12px',opacity:.3}}>📭</div>
        <div style={{fontSize:'16px',color:C.muted,marginBottom:'6px'}}>Keine Nachträge gefunden</div>
        <div style={{fontSize:'13px'}}>
          {filter!=='alle'?<span>Filter <strong style={{color:C.gold}}>{filter}</strong> entfernen</span>
            :<span>Erstelle deinen ersten Nachtrag mit <strong style={{color:C.gold}}>+ Neuer Nachtrag</strong></span>}
        </div>
      </div>}

      {/* Nachtrag Karten */}
      {filtered.map(n=>{
        const netto = ntNetto(n);
        const isNeg = netto < 0;
        const stCfg = NT_STATUS_CFG[n.status]||{c:C.muted,bg:'rgba(255,255,255,.06)',icon:'?',l:n.status};
        const artCfg= NT_ART_CFG.find(a=>a.v===n.art)||{sia:'Art. 84'};
        return <div key={n.id} onClick={()=>{setSelId(n.id);setView('detail');}}
          style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'14px',marginBottom:'10px',overflow:'hidden',cursor:'pointer',transition:'border-color .15s'}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=stCfg.c}
          onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          {/* Status stripe */}
          <div style={{height:'3px',background:`linear-gradient(90deg,${stCfg.c},transparent)`}}/>
          <div style={{padding:'14px 16px'}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:'10px',marginBottom:'10px'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'5px',flexWrap:'wrap'}}>
                  <span style={{fontSize:'11px',fontWeight:'800',color:C.gold,background:'rgba(200,169,110,.1)',padding:'2px 9px',borderRadius:'5px'}}>{n.nr}</span>
                  <span style={{fontSize:'10px',color:stCfg.c,background:stCfg.bg,padding:'2px 8px',borderRadius:'5px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.04em'}}>{stCfg.icon} {stCfg.l}</span>
                  <span style={{fontSize:'10px',color:'#A88848',background:'rgba(200,169,110,.06)',padding:'2px 8px',borderRadius:'5px'}}>{artCfg.sia}</span>
                  {n.fristTage>0&&<span style={{fontSize:'10px',color:'#E0A040',background:'rgba(224,160,64,.1)',padding:'2px 8px',borderRadius:'5px'}}>⏱ +{n.fristTage}d</span>}
                </div>
                <div style={{fontSize:'15px',fontWeight:'700',color:C.main,marginBottom:'3px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.titel}</div>
                <div style={{fontSize:'12px',color:C.muted}}>{n.projekt||'—'} · {n.unternehmer||'—'} · {fmtDate(n.datum)}</div>
                {n.gewerk&&<div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>{n.gewerk}</div>}
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:'18px',fontWeight:'800',color:isNeg?C.red:C.gold,letterSpacing:'-.01em'}}>{isNeg?'−':'+'}CHF {fmtCHF(Math.abs(netto))}</div>
                <div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>{(n.positionen||[]).length} Positionen</div>
              </div>
            </div>
            {n.beschri            {n.beschrieb&&<div style={{fontSize:'12px',color:C.dim,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.beschrieb}</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}



function WissensModule() {
  const ref = useRef(null);
  useEffect(() => {
    const iframe = ref.current;
    if (!iframe) return;
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open(); doc.write(WIKI_SRC); doc.close();
    } catch(e) { iframe.srcdoc = WIKI_SRC; }
  }, []);
  return <iframe ref={ref} style={{width:"100%",height:"calc(100vh - 60px)",border:"none",display:"block",background:"#0f0f0c"}} title="Wissensdatenbank"/>;
}

          </div>
          <span style={{fontSize:"28px",opacity:.5}}>→</span>
        </div>
      </div>
    </div>
  </div>;
}


function ToolsPage() {
  const {setNav} = useApp();
  const [active, setActive] = useState(null);
  if(active==="ebf")      return <div style={{minHeight:"100vh",background:C.dark}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"14px 18px",display:"flex",alignItems:"center",gap:"12px"}}>
      <button onClick={()=>setActive(null)} style={{background:"rgba(255,255,255,.08)",border:`1px solid ${C.border}`,color:C.main,padding:"7px 14px",borderRadius:"9px",fontSize:"13px",cursor:"pointer",fontWeight:"600"}}>← Zurück</button>
      <div style={{fontSize:"17px",fontWeight:"800"}}>m² EBF-Rechner</div>
    </div>
    <EBFRechner/>
  </div>;
  if(active==="nachweise") return <div style={{minHeight:"100vh",background:C.dark}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"14px 18px",display:"flex",alignItems:"center",gap:"12px"}}>
      <button onClick={()=>setActive(null)} style={{background:"rgba(255,255,255,.08)",border:`1px solid ${C.border}`,color:C.main,padding:"7px 14px",borderRadius:"9px",fontSize:"13px",cursor:"pointer",fontWeight:"600"}}>← Zurück</button>
      <div style={{fontSize:"17px",fontWeight:"800"}}>⚡ Energienachweise</div>
    </div>
    <Energienachweise/>
  </div>;
  if(active==="nachtraege") return <NachtraegeSeite/>;
  const tools=[
    {id:"nachtraege",ic:"📋",label:"Nachträge Pro",desc:"SIA 118 Art. 84–91 · Bestellungsänderungen erfassen und verwalten",color:C.gold},
    {id:"nachweise", ic:"⚡",label:"Energienachweise",desc:"SIA 380/1, MINERGIE, MuKEn · Nachweis-Assistent für alle Kantone",color:C.green},
    {id:"ebf",       ic:"m²",label:"EBF-Rechner",desc:"Energiebezugsfläche nach SIA 380 mit kantonalen PV-Regeln",color:C.blue},
  ];
  return <div style={{minHeight:"100vh",background:C.dark,paddingBottom:"90px"}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"52px 18px 18px"}}>
      <div style={{fontSize:"24px",fontWeight:"800",letterSpacing:"-.02em",marginBottom:"3px"}}>🛠 Tools</div>
      <div style={{fontSize:"13px",color:C.muted}}>Planungs-Werkzeuge & Berechnungen</div>
    </div>
    <div style={{padding:"18px",display:"flex",flexDirection:"column",gap:"12px"}}>
      {tools.map(t=><div key={t.id} onClick={()=>setActive(t.id)}
        style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"16px",padding:"22px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:"18px",transition:"border-color .15s"}}
        onMouseEnter={e=>e.currentTarget.style.borderColor=t.color}
        onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
        <div style={{width:"52px",height:"52px",borderRadius:"14px",background:`${t.color}18`,border:`1px solid ${t.color}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",flexShrink:0}}>{t.ic}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"16px",fontWeight:"700",color:C.main,marginBottom:"5px"}}>{t.label}</div>
          <div style={{fontSize:"13px",color:C.muted,lineHeight:"1.5"}}>{t.desc}</div>
        </div>
        <div style={{fontSize:"20px",color:C.dim,flexShrink:0}}>›</div>
      </div>)}
    </div>
  </div>;
}


function SidebarNav({open, onClose}) {
  const {projekte, nav, setNav} = useApp();
  const [exp, setExp] = useState({projekte:true});
  const toggle = k => setExp(p=>({...p,[k]:!p[k]}));
  const go = (page,id=null) => { setNav({page,id}); if(window.innerWidth<1024) onClose(); };
  const isAct = (page,id=null) => nav.page===page&&(!id||nav.id===id);
  const iStyle = (act,col=C.gold) => ({display:"flex",alignItems:"center",gap:"9px",padding:"8px 12px",borderRadius:"9px",cursor:"pointer",background:act?`rgba(200,169,110,.12)`:"transparent",color:act?col:C.muted,fontSize:"14px",fontWeight:act?"600":"400",transition:"all .12s",borderLeft:`2px solid ${act?col:"transparent"}`,userSelect:"none"});
  const cStyle = (act) => ({display:"flex",alignItems:"center",gap:"8px",padding:"6px 12px 6px 34px",borderRadius:"8px",cursor:"pointer",background:act?"rgba(200,169,110,.08)":"transparent",color:act?C.gold:C.dim,fontSize:"13px",transition:"all .12s",userSelect:"none"});
  const gStyle = (act) => ({display:"flex",alignItems:"center",gap:"8px",padding:"5px 12px 5px 52px",borderRadius:"7px",cursor:"pointer",background:act?"rgba(200,169,110,.06)":"transparent",color:act?C.gold:"#666",fontSize:"12px",transition:"all .12s",userSelect:"none"});
  const chev = (e) => <span style={{fontSize:"10px",opacity:.5,marginLeft:"auto",transition:"transform .15s",transform:e?"rotate(90deg)":"none"}}>▶</span>;
  const sep = <div style={{height:"1px",background:"rgba(255,255,255,.06)",margin:"8px 10px"}}/>;
  const pActive = nav.page==="projekte"||nav.page==="projekt-detail"||nav.page==="neu-projekt";
  return <>
    {open&&window.innerWidth<1024&&<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:49}}/>}
    <div style={{position:"fixed",top:0,left:0,bottom:0,width:"252px",background:"#111110",borderRight:"1px solid rgba(255,255,255,.08)",zIndex:50,transform:open?"translateX(0)":"translateX(-100%)",transition:"transform .25s cubic-bezier(.4,0,.2,1)",display:"flex",flexDirection:"column",overflowY:"auto",overflowX:"hidden"}}>
      <div style={{padding:"16px 12px 12px",display:"flex",alignItems:"center",gap:"10px",borderBottom:"1px solid rgba(255,255,255,.07)",flexShrink:0}}>
        <div style={{width:"32px",height:"32px",borderRadius:"9px",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",color:"#0D0D0B",fontSize:"16px",flexShrink:0}}>B</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"14px",fontWeight:"700",color:"#FFF",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>BauPlan Schweiz</div>
          <div style={{fontSize:"10px",color:"#555"}}>Navigation</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:"18px",padding:"2px 6px",borderRadius:"6px",flexShrink:0}}>✕</button>
      </div>
      <div style={{padding:"8px 4px",flex:1}}>
        <div style={iStyle(isAct("home"))} onClick={()=>go("home")}><span>⌂</span> Home</div>
        {sep}
        <div style={iStyle(pActive)} onClick={()=>toggle("projekte")}><span>📁</span><span style={{flex:1}}>Projekte</span>{chev(exp.projekte)}</div>
        {exp.projekte&&<>
          {projekte.map(p=>{const pk="p_"+p.id; const pa=isAct("projekt-detail",p.id); const ap=SIA.find(x=>x.id===p.aktivPhase);
            return <div key={p.id}>
              <div style={cStyle(pa)} onClick={()=>toggle(pk)}>
                <span style={{fontSize:"10px",opacity:.4}}>▷</span>
                <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                {exp[pk]?<span style={{fontSize:"9px",opacity:.4}}>▼</span>:<span style={{fontSize:"9px",opacity:.4}}>▶</span>}
              </div>
              {exp[pk]&&[{ic:"◎",l:"Überblick",t:"uebersicht"},{ic:"◈",l:"Phasen",t:"phasen"},{ic:"📋",l:"Nachträge",t:"nachtraege_proj"},{ic:"💰",l:"Finanzen",t:"kosten"},{ic:"📋",l:"Offerten",t:"offerten"},{ic:"🧾",l:"Rechnungen",t:"rechnungen"},{ic:"⏱",l:"Stunden",t:"stunden"},{ic:"📝",l:"Ausschreibung",t:"ausschreibung"},{ic:"👥",l:"Team",t:"team"}].map(item=>
                <div key={item.t} style={gStyle(pa&&nav.dtab===item.t)} onClick={e=>{e.stopPropagation();setNav({page:"projekt-detail",id:p.id,dtab:item.t});if(window.innerWidth<1024)onClose();}}>
                  <span>{item.ic}</span>{item.l}
                </div>
              )}
            </div>;
          })}
          <div style={cStyle(isAct("neu-projekt"))} onClick={()=>go("neu-projekt")}><span style={{color:C.gold}}>＋</span><span style={{color:C.gold}}>Neues Projekt</span></div>
        </>}
        {sep}
        <div style={iStyle(isAct("nachtraege"))} onClick={()=>go("nachtraege")}><span>📋</span> Nachträge</div>
        <div style={iStyle(isAct("stunden_global"))} onClick={()=>go("stunden_global")}><span>⏱</span> Stunden</div>
        <div style={iStyle(isAct("tools"))} onClick={()=>toggle("tools")}><span>🛠</span><span style={{flex:1}}>Tools</span>{chev(exp.tools)}</div>
        {exp.tools&&<>
          <div style={cStyle(false)} onClick={()=>go("nachweise")}><span>⚡</span> Energienachweise</div>
          <div style={cStyle(isAct("ebf"))} onClick={()=>go("ebf")}><span>m²</span> EBF-Rechner</div>
        </>}
        {sep}
        <div style={iStyle(isAct("wissen"))} onClick={()=>go("wissen")}><span>📚</span> Wissensdatenbank</div>
        {sep}
        <div style={iStyle(isAct("profil"))} onClick={()=>go("profil")}><span>◯</span> Profil & Einstellungen</div>
      </div>
      <div style={{padding:"10px 12px",borderTop:"1px solid rgba(255,255,255,.06)",flexShrink:0}}>
        <div style={{fontSize:"10px",color:"#444",textAlign:"center"}}>BauPlan Schweiz · Demo</div>
      </div>
    </div>
  </>;
}

function App(){
  const [appState,setAppState]=useState("onboarding"); // onboarding | app
  const [user,setUser]=useState(null);
  const [users,setUsers]=useState(DEMO_USERS);
  const [projekte,setProjekte]=useState(INIT_PROJEKTE);
  const [offerten,setOfferten]=useState(INIT_OFFERTEN);
  const [rechnungen,setRechnungen]=useState(INIT_RECHNUNGEN);
  const [stunden,setStunden]=useState(INIT_STUNDEN);
  const [firma,setFirma]=useState(INIT_FIRMA);
  const [nav,setNav]=useState({page:"home"});
  const [sidebarOpen,setSidebarOpen]=useState(window.innerWidth>=1024);

  const enterApp=(userData)=>{
    // If user brought custom firma data, update firma state
    if(userData.firma){setFirma(p=>({...p,...userData.firma}));}
    const u={...userData};delete u.firma;
    setUser(u);
    setUsers(p=>[...p.filter(x=>x.email!==u.email),u]);
    setAppState("app");
  };

  // For direct demo login
  window.enterAppDirect=(u)=>{setUser(u);setAppState("app");};

  if(appState==="onboarding") return <Onboarding onComplete={enterApp}/>;

  const ctx={user,setUser,users,setUsers,projekte,setProjekte,offerten,setOfferten,rechnungen,setRechnungen,stunden,setStunden,firma,setFirma,nav,setNav};
  const canEdit=["admin","planer"].includes(user.rolle);
  const showNav=nav.page!=="neu-projekt";

  const renderPage=()=>{
    const {page,id}=nav;
    if(page==="home")            return <HomeDashboard/>;
    if(page==="tools")           return <ToolsPage/>;
    if(page==="nachtraege")      return <NachtraegeSeite/>;
    if(page==="wissen")          return <WissensModule/>;
    if(page==="projekte")        return <HomeDashboard/>;
    if(page==="projekt-detail") return <ProjektDetail id={id}/>;
    if(page==="neu-projekt")    return <NeuProjekt/>;
    if(page==="nachweise")      return <Energienachweise/>;
    if(page==="stunden_global")  return <StundenGlobal/>;
    if(page==="ebf")             return <EBFRechner/>;
    if(page==="profil")         return <Profil onLogoutToOnboarding={()=>{setUser(null);setAppState("onboarding");}}/>;
    return <ProjektListe/>;
  };

  return <AppCtx.Provider value={ctx}>
    <div style={{minHeight:"100vh",background:C.dark}}>
      <SidebarNav open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
      {sidebarOpen&&window.innerWidth<1024&&<div onClick={()=>setSidebarOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:48}}/>}
      <div style={{marginLeft:sidebarOpen&&window.innerWidth>=1024?"252px":"0",transition:"margin-left .25s cubic-bezier(.4,0,.2,1)"}}>
        <button onClick={()=>setSidebarOpen(p=>!p)} style={{position:"fixed",top:"14px",left:sidebarOpen&&window.innerWidth>=1024?"264px":"14px",zIndex:60,background:"rgba(20,20,18,.95)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,.12)",color:"#CCC",borderRadius:"10px",width:"38px",height:"38px",fontSize:"16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"left .25s cubic-bezier(.4,0,.2,1)"}}>
          {sidebarOpen?"←":"☰"}
        </button>
        {renderPage()}
        {showNav&&<BottomNav nav={nav} setNav={setNav} canEdit={canEdit}/>}
      </div>
    </div>
  </AppCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
