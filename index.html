// ─── Status Modal ─────────────────────────────────────────────────────────
function NtStatusDlg({n,onApply,onClose}){
  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.mid,border:`1px solid ${C.gold}55`,borderRadius:'16px',padding:'22px',maxWidth:'360px',width:'100%'}}>
      <div style={{fontSize:'14px',color:C.gold,fontWeight:'700',marginBottom:'5px'}}>Status ändern</div>
      <div style={{fontSize:'11px',color:C.dim,fontFamily:'monospace',marginBottom:'14px'}}>{n.nr} — {n.titel}</div>
      {Object.entries(NT_ST).map(([k,s])=><div key={k} onClick={()=>onApply(k)}
        style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 13px',borderRadius:'9px',border:`1px solid ${n.status===k?s.c:'rgba(255,255,255,.08)'}`,background:n.status===k?s.bg:'transparent',cursor:'pointer',marginBottom:'6px'}}>
        <div style={{width:'8px',height:'8px',borderRadius:'50%',background:s.c,flexShrink:0}}/>
        <span style={{color:s.c,fontWeight:'600',fontSize:'13px',flex:1}}>{s.l}</span>
        {n.status===k&&<span style={{fontSize:'10px',color:s.c}}>✓</span>}
      </div>)}
      <Btn onClick={onClose} variant="ghost" full style={{marginTop:'6px'}}>Abbrechen</Btn>
    </div>
  </div>;
}

// ─── Main Page ────────────────────────────────────────────────────────────
function NachtraegeSeite(){
  const [list,setList]=useState(()=>nt_load());
  const [fil,setFil]=useState('alle');
  const [q,setQ]=useState('');
  const [showForm,setShowForm]=useState(false);
  const [editN,setEditN]=useState(null);
  const [statusN,setStatusN]=useState(null);

  const save=arr=>{setList(arr);nt_save(arr);};

  const visible=list.filter(n=>{
    if(fil!=='alle'&&n.status!==fil)return false;
    if(q){const s=q.toLowerCase();if(!(n.titel+n.projekt+n.unternehmer+n.gew).toLowerCase().includes(s))return false;}
    return true;
  });

  const tot=s=>list.filter(n=>n.status===s).reduce((a,n)=>a+nt_netto(n),0);
  const cnt=s=>list.filter(n=>n.status===s).length;

  const handleSave=n=>{
    const upd=list.find(x=>x.id===n.id)?list.map(x=>x.id===n.id?n:x):[n,...list];
    save(upd);setShowForm(false);setEditN(null);
  };
  const handleDel=id=>{if(!window.confirm('Nachtrag löschen?'))return;save(list.filter(n=>n.id!==id));};
  const handleStatus=(n,s)=>{
    save(list.map(x=>x.id===n.id?{...x,status:s,verlauf:[...(x.verlauf||[]),{d:NT_ISO(),t:'Status → '+(NT_ST[s]?.l||s)}]}:x));
    setStatusN(null);
  };

  const exportCSV=()=>{
    const r=[['Nr','Datum','Titel','Projekt','Gewerk','Status','Netto CHF','MWST%','Brutto CHF'],
      ...list.map(n=>{const nt=nt_netto(n);return[n.nr,n.datum,n.titel,n.projekt||'',n.gew||'',NT_ST[n.status]?.l||n.status,nt.toFixed(2),n.mwst||8.1,(nt*(1+(n.mwst||8.1)/100)).toFixed(2)];})];
    const csv=r.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='Nachtraege_BauPlan.csv';a.click();
  };

  const PILLS=['alle','offen','eingereicht','genehmigt','verhandlung','abgelehnt'];
  const allNetto=list.reduce((a,n)=>a+nt_netto(n),0);

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    {/* Header */}
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(200,169,110,.12)',border:`1px solid rgba(200,169,110,.25)`,borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>📋</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',letterSpacing:'-.02em',color:'#FFF'}}>Nachträge</div>
          <div style={{fontSize:'12px',color:C.dim}}>Bestellungsänderungen · SIA 118 Art. 84–91</div>
        </div>
      </div>
    </div>

    <div style={{padding:'16px 18px'}}>
      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'16px'}}>
        {[
          {v:list.length,   l:'Total',      chf:allNetto,        c:C.gold},
          {v:cnt('genehmigt'), l:'Genehmigt', chf:tot('genehmigt'), c:'#6BAF7A'},
          {v:cnt('offen')+cnt('eingereicht')+cnt('verhandlung'),l:'Pendent',chf:list.filter(n=>['offen','eingereicht','verhandlung'].includes(n.status)).reduce((a,n)=>a+nt_netto(n),0),c:'#E0A040'},
          {v:cnt('abgelehnt'), l:'Abgelehnt',chf:tot('abgelehnt'),c:C.red},
        ].map(s=><div key={s.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'12px 14px',textAlign:'center'}}>
          <div style={{fontSize:'24px',fontWeight:'800',color:s.c,letterSpacing:'-.02em',lineHeight:'1'}}>{s.v}</div>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',margin:'3px 0 2px'}}>{s.l}</div>
          <div style={{fontSize:'11px',color:C.muted,fontFamily:'monospace'}}>CHF {nt_fmtChf(s.chf)}</div>
        </div>)}
      </div>

      {/* Filter + Search */}
      <div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px',alignItems:'center'}}>
        {PILLS.map(p=><button key={p} onClick={()=>setFil(p)} style={{padding:'5px 13px',borderRadius:'18px',border:`1px solid ${fil===p?C.gold:'rgba(255,255,255,.1)'}`,background:fil===p?'rgba(200,169,110,.15)':'transparent',color:fil===p?C.gold:'#888',fontSize:'12px',cursor:'pointer',fontWeight:fil===p?'700':'400',textTransform:'capitalize'}}>{p}</button>)}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'6px',background:C.card,border:`1px solid ${C.border}`,borderRadius:'18px',padding:'5px 13px'}}>
          <span style={{color:C.dim}}>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Suchen…" style={{background:'none',border:'none',color:'#FFF',fontSize:'12px',outline:'none',width:'140px'}}/>
        </div>
      </div>

      {/* Actions */}
      <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
        <Btn onClick={()=>{setEditN(null);setShowForm(true);}} variant="gold">＋ Neuer Nachtrag</Btn>
        <Btn onClick={exportCSV} variant="ghost">⬇ CSV</Btn>
      </div>

      {/* Form */}
      {showForm&&<NtForm init={editN} count={list.length} onSave={handleSave} onCancel={()=>{setShowForm(false);setEditN(null);}}/>}

      {/* Empty */}
      {visible.length===0&&<div style={{textAlign:'center',padding:'60px 20px'}}>
        <div style={{fontSize:'40px',opacity:.3,marginBottom:'10px'}}>📭</div>
        <div style={{fontSize:'15px',color:C.muted,marginBottom:'4px'}}>Keine Nachträge</div>
        <div style={{fontSize:'12px',color:C.dim}}>{q||fil!=='alle'?'Filter anpassen':'Erstelle deinen ersten Nachtrag'}</div>
      </div>}

      {/* Cards */}
      {visible.map(n=><NtCard key={n.id} n={n}
        onEdit={n=>{setEditN(n);setShowForm(true);}}
        onDelete={handleDel}
        onStatus={setStatusN}
      />)}
    </div>

    {/* Status Dialog */}
    {statusN&&<NtStatusDlg n={statusN} onApply={s=>handleStatus(statusN,s)} onClose={()=>setStatusN(null)}/>}
  </div>;
}

function wiki_load() {
  try { const d=localStorage.getItem(WIKI_LS_KEY); return d?JSON.parse(d):JSON.parse(JSON.stringify(SEED)); }
  catch(e) { return JSON.parse(JSON.stringify(SEED)); }
}
function wiki_save(arr) { try{localStorage.setItem(WIKI_LS_KEY,JSON.stringify(arr));}catch(e){} }
function wiki_newId(arr) { return 'a'+(Math.max(0,...arr.map(a=>parseInt(a.id.slice(1))||0))+1); }

// ─── Article Detail View ─────────────────────────────────────────────────
function WikiArtikel({artikel, onBack, onEdit}) {

    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'16px 18px',display:'flex',alignItems:'center',gap:'12px'}}>

        <div style={{fontSize:'11px',color:cat.c,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'2px'}}>{cat.ic} {cat.l}</div>
        <div style={{fontSize:'17px',fontWeight:'800',color:'#FFF',letterSpacing:'-.01em'}}>{artikel.titel}</div>
      </div>
      <Btn onClick={()=>onEdit(artikel)} variant="outline" size="sm">✏ Edit</Btn>
    </div>
    <div style={{padding:'20px 18px',maxWidth:'720px',margin:'0 auto'}}>
      {artikel.norm && <div style={{display:'inline-flex',alignItems:'center',gap:'7px',background:'rgba(200,169,110,.1)',border:'1px solid rgba(200,169,110,.2)',borderRadius:'8px',padding:'5px 12px',marginBottom:'18px',fontSize:'12px',color:C.gold,fontFamily:'monospace'}}>

      <div

          .replace(/<strong>/g,'<strong style="color:#FFF">')
          .replace(/class="callout rule"/g,'style="background:rgba(91,143,185,.1);border-left:3px solid #5B8FB9;border-radius:8px;padding:12px 14px;margin:14px 0;display:flex;gap:10px"')
          .replace(/class="callout warn"/g,'style="background:rgba(232,115,90,.1);border-left:3px solid #E8735A;border-radius:8px;padding:12px 14px;margin:14px 0;display:flex;gap:10px"')
          .replace(/class="callout tip"/g,'style="background:rgba(107,175,122,.1);border-left:3px solid #6BAF7A;border-radius:8px;padding:12px 14px;margin:14px 0;display:flex;gap:10px"')
          .replace(/class="callout-icon"/g,'style="font-size:18px;flex-shrink:0"')

// ─── Article Editor ───────────────────────────────────────────────────────
function WikiEditor({artikel, artikelList, onSave, onCancel, onDelete}) {
  const isNew = !artikel;
  const blank = {id:wiki_newId(artikelList),kat:'nachtraege',titel:'',tags:[],norm:'',preview:'',content:'<p>Inhalt hier einfügen...</p>'};
  const [f, setF] = useState(artikel||blank);
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const tagStr = (f.tags||[]).join(', ');
  return <div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
    <div style={{fontSize:'15px',color:C.gold,fontWeight:'700',marginBottom:'14px'}}>{isNew?'✦ Neuer Artikel':'✏ Artikel bearbeiten'}</div>
    <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
      <Field label="Titel *"><Input value={f.titel} onChange={v=>upd('titel',v)} placeholder="Artikeltitel"/></Field>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
        <Field label="Kategorie">
          <select value={f.kat} onChange={e=>upd('kat',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
            {Object.entries(WIKI_CATS).filter(([k])=>k!=='alle').map(([k,v])=><option key={k} value={k}>{v.ic} {v.l}</option>)}
          </select>
        </Field>
        <Field label="Norm-Referenz"><Input value={f.norm||''} onChange={v=>upd('norm',v)} placeholder="z.B. SIA 118 Art. 84"/></Field>
      </div>
      <Field label="Tags (kommagetrennt)"><Input value={tagStr} onChange={v=>upd('tags',v.split(',').map(t=>t.trim()).filter(Boolean))} placeholder="Nachtrag, SIA 118, Preis"/></Field>
      <Field label="Vorschautext"><Textarea value={f.preview||''} onChange={v=>upd('preview',v)} placeholder="Kurze Zusammenfassung (erscheint in der Listenansicht)"/></Field>
      <Field label="Inhalt (HTML)">
        <textarea
          value={f.content||''}
          onChange={e=>upd('content',e.target.value)}
          style={{...sBase,fontSize:'13px',height:'200px',resize:'vertical',fontFamily:'monospace'}}
          placeholder="<p>Inhalt mit HTML formatieren...</p>&#10;<h3>Abschnitt</h3>&#10;<ul><li>Punkt 1</li></ul>"
        />
      </Field>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        <Btn onClick={()=>{if(!f.titel.trim())return alert('Titel Pflichtfeld');onSave(f);}} variant="gold">✓ Speichern</Btn>
        <Btn onClick={onCancel} variant="ghost">Abbrechen</Btn>
        {!isNew && <Btn onClick={()=>{if(window.confirm('Artikel löschen?'))onDelete(f.id);}} variant="danger" style={{marginLeft:'auto'}}>🗑 Löschen</Btn>}
      </div>
    </div>
  </div>;
}

  const [kat,     setKat]       = useState('alle');
  const [search,  setSearch]    = useState('');
  const [selArt,  setSelArt]    = useState(null);   // viewing article
  const [editArt, setEditArt]   = useState(null);   // null=closed, obj=editing, 'new'=new
  const [showEd,  setShowEd]    = useState(false);

  const save = arr => { setArtikel(arr); wiki_save(arr); };

  const handleSave = a => {
    const upd = artikel.find(x=>x.id===a.id)
      ? artikel.map(x=>x.id===a.id?a:x)
      : [...artikel, a];
    save(upd); setShowEd(false); setEditArt(null);
    setSelArt(a);
  };
  const handleDelete = id => {
    save(artikel.filter(a=>a.id!==id));
    setShowEd(false); setEditArt(null); setSelArt(null);
  };

  const filtered = artikel.filter(a => {
    if (kat!=='alle' && a.kat!==kat) return false;
    if (search) {
      const q=search.toLowerCase();
      if (!(a.titel+a.preview+(a.tags||[]).join(' ')).toLowerCase().includes(q)) return false;
    }
    return true;
  });

  // Article detail view
  if (selArt) return <WikiArtikel
    artikel={selArt}
    onBack={()=>setSelArt(null)}
    onEdit={a=>{setEditArt(a);setShowEd(true);setSelArt(null);}}
  />;

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    {/* Header */}
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(180,120,200,.12)',border:'1px solid rgba(180,120,200,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>📚</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',letterSpacing:'-.02em',color:'#FFF'}}>Wissensdatenbank</div>
          <div style={{fontSize:'12px',color:C.dim}}>SIA 118, Werkvertrag, Normen & Praxistipps</div>
        </div>
        <div style={{marginLeft:'auto'}}>
          <Btn onClick={()=>{setEditArt(null);setShowEd(true);}} variant="gold" size="sm">＋ Artikel</Btn>
        </div>
      </div>
      {/* Search */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'8px 14px'}}>
        <span style={{color:C.dim,fontSize:'15px'}}>🔍</span>
        <input
          value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Artikel suchen… z.B. Nachtrag, SIA 118, Mängel"
          style={{background:'none',border:'none',color:'#FFF',fontSize:'14px',outline:'none',flex:1}}
        />
        {search && <button onClick={()=>setSearch('')} style={{background:'none',border:'none',color:C.dim,cursor:'pointer',fontSize:'16px'}}>✕</button>}
      </div>
    </div>

    <div style={{padding:'14px 18px'}}>
      {/* Editor */}
      {showEd && <WikiEditor
        artikel={editArt}
        artikelList={artikel}
        onSave={handleSave}
        onCancel={()=>{setShowEd(false);setEditArt(null);}}
        onDelete={handleDelete}
      />}

      {/* Category filter pills */}
      <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'16px'}}>
        {Object.entries(WIKI_CATS).map(([k,v])=>{
          const cnt = k==='alle'?artikel.length:artikel.filter(a=>a.kat===k).length;
          const act = kat===k;
          return <button key={k} onClick={()=>setKat(k)} style={{
            display:'flex',alignItems:'center',gap:'5px',
            padding:'6px 13px',borderRadius:'20px',
            border:`1px solid ${act?v.c:'rgba(255,255,255,.1)'}`,
            background:act?`${v.c}18`:'transparent',
            color:act?v.c:'#888',
            fontSize:'12px',cursor:'pointer',fontWeight:act?'700':'400',
          }}>
            <span>{v.ic}</span>
            <span>{v.l}</span>
            <span style={{background:'rgba(255,255,255,.08)',borderRadius:'10px',padding:'0 6px',fontSize:'10px',color:act?v.c:C.dim}}>{cnt}</span>
          </button>;
        })}
      </div>

      {/* Article list */}
      {filtered.length===0 && <div style={{textAlign:'center',padding:'50px 20px'}}>
        <div style={{fontSize:'36px',opacity:.3,marginBottom:'10px'}}>📭</div>
        <div style={{fontSize:'15px',color:C.muted,marginBottom:'4px'}}>Keine Artikel gefunden</div>
        <div style={{fontSize:'12px',color:C.dim}}>{search?'Suchbegriff anpassen':'Wähle eine andere Kategorie'}</div>
      </div>}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:'12px'}}>
        {filtered.map(a => {
          const cat = WIKI_CATS[a.kat] || WIKI_CATS.praxis;
          return <div key={a.id}
            onClick={()=>{setShowEd(false);setSelArt(a);}}
            style={{
              background:C.card, border:`1px solid ${C.border}`,
              borderTop:`3px solid ${cat.c}`,
              borderRadius:'12px', padding:'16px',
              cursor:'pointer', transition:'border-color .15s',
            }}
            onMouseEnter={e=>e.currentTarget.style.borderColor=cat.c}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}
          >
            <div style={{display:'flex',alignItems:'center',gap:'7px',marginBottom:'8px'}}>
              <span style={{background:`${cat.c}15`,color:cat.c,padding:'2px 8px',borderRadius:'5px',fontSize:'10px',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.05em'}}>{cat.ic} {cat.l}</span>
              {a.norm && <span style={{fontSize:'10px',color:C.dim,fontFamily:'monospace'}}>{a.norm}</span>}
            </div>
            <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',marginBottom:'6px',lineHeight:'1.4'}}>{a.titel}</div>
            <div style={{fontSize:'12px',color:C.muted,lineHeight:'1.55'}}>{a.preview}</div>
            {(a.tags||[]).length>0 && <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'10px'}}>
              {a.tags.slice(0,3).map(t=><span key={t} style={{background:'rgba(255,255,255,.06)',color:C.dim,padding:'1px 7px',borderRadius:'4px',fontSize:'10px'}}>{t}</span>)}
            </div>}
          </div>;
        })}
      </div>
    </div>
  </div>;
}

const fin_fmt  = v => (parseFloat(v)||0).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});

const fin_fmtDate = d => { if(!d)return'—'; const[y,m,dd]=d.split('-'); return`${dd}.${m}.${y}`; };
const fin_iso = () => new Date().toISOString().split('T')[0];

// ─── KPI Card ─────────────────────────────────────────────────────────────
function FinKpi({label, value, sub, color, icon}) {
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',flex:1,minWidth:'120px'}}>
    <div style={{fontSize:'20px',marginBottom:'4px'}}>{icon}</div>

    {sub && <div style={{fontSize:'11px',color:C.muted}}>{sub}</div>}
  </div>;
}

// ─── Dashboard Tab ────────────────────────────────────────────────────────
function FinDashboard() {
  const {offerten,rechnungen,stunden,projekte,firma} = useApp();
  const mwst = parseFloat(firma.mwstSatz)||8.1;
  const now  = new Date();
  const year = now.getFullYear();

  const rechBezahlt  = rechnungen.filter(r=>r.status==='bezahlt');
  const rechOffen    = rechnungen.filter(r=>r.status!=='bezahlt');
  const umsatzYTD    = rechBezahlt.reduce((a,r)=>(a+(parseFloat(r.betrag)||0))*(1+mwst/100),0);
  const offenBetrag  = rechOffen.reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);
  const offPipeline  = offerten.filter(o=>o.status==='gesendet'||o.status==='wartend');
  const offPipeVal   = offPipeline.reduce((a,o)=>a+(parseFloat(o.totalNetto)||0)*(1+mwst/100),0);
  const mwstFaellig  = rechBezahlt.reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(mwst/100),0);
  const stdTotal     = stunden.reduce((a,s)=>a+(s.stunden||0),0);

  // Aging buckets
  const today = new Date();
  const aging = {a30:0, a60:0, a90:0};
  rechOffen.forEach(r => {
    if(!r.datum) return;
    const days = Math.floor((today - new Date(r.datum))/(1000*60*60*24));
    const brutto = (parseFloat(r.betrag)||0)*(1+mwst/100);
    if(days<=30) aging.a30+=brutto;
    else if(days<=60) aging.a60+=brutto;
    else aging.a90+=brutto;
  });

  return <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
    {/* KPI row */}
    <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
      <FinKpi icon="💰" label="Umsatz YTD" value={fin_fmtM(umsatzYTD)} sub={`${rechBezahlt.length} Rechnungen bezahlt`} color={C.green}/>
      <FinKpi icon="🧾" label="Offen" value={fin_fmtM(offenBetrag)} sub={`${rechOffen.length} Rechnungen ausstehend`} color={rechOffen.length>0?C.red:C.green}/>
      <FinKpi icon="📋" label="Pipeline" value={fin_fmtM(offPipeVal)} sub={`${offPipeline.length} Offerten ausstehend`} color={C.blue}/>
      <FinKpi icon="📊" label="MWST fällig" value={'CHF '+fin_fmt(mwstFaellig)} sub={`${mwst}% auf bezahlte Rechnungen`} color={C.gold}/>
    </div>

    {/* Aging */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px'}}>
      <div style={{fontSize:'12px',fontWeight:'700',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'12px'}}>Forderungen Aging</div>
      <div style={{display:'flex',gap:'8px'}}>
        {[['0–30 Tage',aging.a30,C.green],['31–60 Tage',aging.a60,C.gold],['über 60 Tage',aging.a90,C.red]].map(([l,v,c])=>
          <div key={l} style={{flex:1,background:`${c}12`,border:`1px solid ${c}33`,borderRadius:'9px',padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:'18px',fontWeight:'800',color:c}}>CHF {fin_fmt(v)}</div>
            <div style={{fontSize:'11px',color:C.dim,marginTop:'3px'}}>{l}</div>
          </div>
        )}
      </div>
    </div>

    {/* Recent invoices */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px'}}>
      <div style={{fontSize:'12px',fontWeight:'700',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'10px'}}>Neueste Rechnungen</div>
      {rechnungen.slice(0,5).map(r => {
        const proj = projekte.find(p=>p.id===r.projektId);
        const brutto = (parseFloat(r.betrag)||0)*(1+mwst/100);
        const stDays = r.datum?Math.floor((today-new Date(r.datum))/(86400000)):0;
        const col    = r.status==='bezahlt'?C.green:stDays>60?C.red:stDays>30?C.gold:C.muted;
        return <div key={r.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:`1px solid rgba(255,255,255,.04)`}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:'13px',fontWeight:'600',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.bezeichnung||r.nr}</div>
            <div style={{fontSize:'11px',color:C.dim}}>{proj?.name||'Kein Projekt'} · {fin_fmtDate(r.datum)}</div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontSize:'13px',fontWeight:'700',color:C.gold}}>CHF {fin_fmt(brutto)}</div>
            <div style={{fontSize:'10px',color:col,fontWeight:'700',textTransform:'uppercase'}}>{r.status==='bezahlt'?'Bezahlt':stDays>0?`${stDays}d offen`:'Neu'}</div>
          </div>
        </div>;
      })}
      {rechnungen.length===0 && <div style={{textAlign:'center',padding:'20px',color:C.dim}}>Noch keine Rechnungen</div>}
    </div>

    {/* Stunden + Projekte stats */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'14px'}}>
        <div style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Stunden YTD</div>
        <div style={{fontSize:'28px',fontWeight:'800',color:C.blue}}>{stdTotal.toFixed(0)}h</div>
        <div style={{fontSize:'11px',color:C.muted,marginTop:'3px'}}>{stunden.length} Einträge total</div>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'14px'}}>
        <div style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'6px'}}>Aktive Projekte</div>
        <div style={{fontSize:'28px',fontWeight:'800',color:C.purple}}>{projekte.filter(p=>['31','32','33','41','51','52'].includes(p.aktivPhase)).length}</div>
        <div style={{fontSize:'11px',color:C.muted,marginTop:'3px'}}>von {projekte.length} Projekten total</div>
      </div>
    </div>
  </div>;
}

// ─── Rechnungen Global Tab ────────────────────────────────────────────────
function FinRechnungen() {
  const {rechnungen,setRechnungen,projekte,firma} = useApp();
  const [filter, setFilter] = useState('alle');
  const [mahnModal, setMahnModal] = useState(null);
  const [mahnHistory, setMahnHistory] = useState(()=>{try{return JSON.parse(localStorage.getItem('bp_mahnungen_v1')||'{}');}catch(e){return {};}});
  const saveMahnHistory = (id,stufe) => { const u={...mahnHistory,[id]:stufe}; setMahnHistory(u); localStorage.setItem('bp_mahnungen_v1',JSON.stringify(u)); };
  const mwst = parseFloat(firma.mwstSatz)||8.1;
  const today = new Date();

  const enriched = rechnungen.map(r => {
    const proj  = projekte.find(p=>p.id===r.projektId);
    const days  = r.datum?Math.floor((today-new Date(r.datum))/(86400000)):0;
    const brutto= (parseFloat(r.betrag)||0)*(1+mwst/100);
    const status= r.status==='bezahlt'?'bezahlt':days>60?'überfällig':r.status||'offen';
    return {...r,_proj:proj,_days:days,_brutto:brutto,_displayStatus:status};
  });

  const filtered = filter==='alle'?enriched:enriched.filter(r=>r._displayStatus===filter);

  const setStatus = (id,st) => setRechnungen(prev=>prev.map(r=>r.id===id?{...r,status:st}:r));

  const pillCols = {alle:C.gold,offen:C.blue,überfällig:C.red,bezahlt:C.green};

  return <div>
    <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'12px'}}>
      {['alle','offen','überfällig','bezahlt'].map(f=><button key={f} onClick={()=>setFilter(f)} style={{padding:'5px 13px',borderRadius:'18px',border:`1px solid ${filter===f?(pillCols[f]||C.gold):'rgba(255,255,255,.1)'}`,background:filter===f?`${pillCols[f]||C.gold}18`:'transparent',color:filter===f?(pillCols[f]||C.gold):'#888',fontSize:'12px',cursor:'pointer',fontWeight:filter===f?'700':'400',textTransform:'capitalize'}}>{f}</button>)}
    </div>
    {filtered.length===0?<div style={{textAlign:'center',padding:'40px',color:C.dim}}>Keine Rechnungen</div>:null}
    {filtered.map(r=>{
      const stCol = r._displayStatus==='bezahlt'?C.green:r._displayStatus==='überfällig'?C.red:C.blue;
      return <div key={r.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${stCol}`,borderRadius:'11px',padding:'13px 15px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.bezeichnung||r.nr}</div>
          <div style={{fontSize:'11px',color:C.muted,marginTop:'2px'}}>{r._proj?.name||'Kein Projekt'} · {fin_fmtDate(r.datum)}</div>
        </div>
        <span style={{fontSize:'10px',fontWeight:'700',color:stCol,background:`${stCol}18`,padding:'2px 9px',borderRadius:'10px',textTransform:'uppercase',flexShrink:0}}>{r._displayStatus}{r._days>0&&r._displayStatus!=='bezahlt'?` (${r._days}d)`:''}</span>
        <div style={{textAlign:'right',flexShrink:0}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:C.gold}}>CHF {fin_fmt(r._brutto)}</div>
          {r._displayStatus!=='bezahlt'&&<button onClick={()=>setStatus(r.id,'bezahlt')} style={{background:'rgba(107,175,122,.12)',border:'1px solid rgba(107,175,122,.3)',color:C.green,fontSize:'10px',padding:'2px 8px',borderRadius:'6px',cursor:'pointer',marginTop:'3px'}}>✓ Bezahlt</button>}
          {r._displayStatus!=='bezahlt'&&<button onClick={()=>setMahnModal(r)} style={{background:'rgba(224,160,64,.1)',border:'1px solid rgba(224,160,64,.25)',color:'#E0A040',fontSize:'10px',padding:'2px 8px',borderRadius:'6px',cursor:'pointer',marginTop:'3px'}}>🔔 Mahnen</button>}
        </div>
      </div>;
    })}
  {mahnModal&&<MahnwesenModal rechnung={mahnModal} projekt={null} onClose={()=>setMahnModal(null)} onMarkiert={saveMahnHistory}/>}
  </div>;
}

// ─── Offerten Pipeline Tab ────────────────────────────────────────────────
function FinOfferten() {
  const {offerten,projekte,firma} = useApp();
  const mwst = parseFloat(firma.mwstSatz)||8.1;
  const total   = offerten.length;
  const angenom = offerten.filter(o=>o.status==='angenommen').length;
  const quote   = total>0?Math.round(angenom/total*100):0;

  const statCols = {draft:C.dim,gesendet:C.blue,angenommen:C.green,abgelehnt:C.red,wartend:C.gold};

  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'14px'}}>
      {[
        [offerten.length,'Total',C.gold],
        [offerten.filter(o=>['gesendet','wartend'].includes(o.status)).length,'Ausstehend',C.blue],
        [angenom,'Angenommen',C.green],
        [`${quote}%`,'Quote',quote>=60?C.green:quote>=40?C.gold:C.red],
      ].map(([v,l,c])=><div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px',textAlign:'center'}}>
        <div style={{fontSize:'22px',fontWeight:'800',color:c,letterSpacing:'-.02em'}}>{v}</div>
        <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.05em',marginTop:'2px'}}>{l}</div>
      </div>)}
    </div>
    {offerten.map(o=>{
      const proj  = projekte.find(p=>p.id===o.projektId);
      const brutto= (parseFloat(o.totalNetto)||0)*(1+mwst/100);
      const sc    = statCols[o.status]||C.dim;
      return <div key={o.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${sc}`,borderRadius:'11px',padding:'13px 15px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.titel||o.nr}</div>
          <div style={{fontSize:'11px',color:C.muted,marginTop:'2px'}}>{proj?.name||'Kein Projekt'} · {fin_fmtDate(o.datum)}</div>
        </div>
        <span style={{fontSize:'10px',fontWeight:'700',color:sc,background:`${sc}18`,padding:'2px 9px',borderRadius:'10px',textTransform:'capitalize',flexShrink:0}}>{o.status||'Entwurf'}</span>
        <div style={{fontSize:'14px',fontWeight:'700',color:C.gold,flexShrink:0}}>CHF {fin_fmt(brutto)}</div>
      </div>;
    })}
    {offerten.length===0&&<div style={{textAlign:'center',padding:'40px',color:C.dim}}>Noch keine Offerten</div>}
  </div>;
}

// ─── Kontakte Tab ─────────────────────────────────────────────────────────
function FinKontakte() {
  const [kontakte, setKontakte] = useState(()=>fin_loadKontakte());
  const [search,   setSearch]   = useState('');
  const [typFil,   setTypFil]   = useState('alle');
  const [showForm, setShowForm] = useState(false);
  const [editK,    setEditK]    = useState(null);

  const save = arr => { setKontakte(arr); fin_saveKontakte(arr); };

  const visible = kontakte.filter(k=>{
    if(typFil!=='alle'&&k.typ!==typFil)return false;
    if(search){const q=search.toLowerCase();if(!(k.name+k.vorname+k.nachname+k.ort+k.email).toLowerCase().includes(q))return false;}
    return true;
  });

  const handleSave = k => {
    const upd = kontakte.find(x=>x.id===k.id)?kontakte.map(x=>x.id===k.id?k:x):[...kontakte,k];
    save(upd); setShowForm(false); setEditK(null);
  };

  return <div>
    {/* Search + Filter */}
    <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap',alignItems:'center'}}>
      <div style={{flex:1,display:'flex',alignItems:'center',gap:'6px',background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'7px 12px',minWidth:'180px'}}>

      </div>
      <select value={typFil} onChange={e=>setTypFil(e.target.value)} style={{...sBase,fontSize:'13px',background:C.mid,width:'auto'}}>
        <option value="alle">Alle Typen</option>
        {Object.entries(FIN_KONTAKT_TYPEN).map(([k,v])=><option key={k} value={k}>{v.ic} {v.l}</option>)}
      </select>
      <Btn onClick={()=>{setEditK(null);setShowForm(true);}} variant="gold" size="sm">＋ Kontakt</Btn>
    </div>

    {/* Form */}
    {showForm && <KontaktForm initial={editK} onSave={handleSave} onCancel={()=>{setShowForm(false);setEditK(null);}}

        const typ = FIN_KONTAKT_TYPEN[k.typ]||FIN_KONTAKT_TYPEN.sonstiges;

              {(k.vorname||k.nachname)&&<div style={{fontSize:'12px',color:C.muted}}>{k.vorname} {k.nachname}</div>}

// 1. SVG CHART HELPERS

function SvgBarChart({data, height=110, showVals=true}) {
  if(!data||!data.length) return null;
  const max = Math.max(...data.map(d=>d.v), 1);
  const W   = 100/data.length;
  return <svg width="100%" viewBox={`0 0 ${data.length*50} ${height+28}`} style={{overflow:'visible'}}>
    {data.map((d,i)=>{
      const h  = Math.max((d.v/max)*height, d.v>0?3:0);
      const x  = i*50 + 4;
      const y  = height - h;
      const bw = 42;
      return <g key={i}>
        <rect x={x} y={y} width={bw} height={h} fill={d.c||C.gold} rx="3" opacity=".85"/>
        <text x={x+bw/2} y={height+14} textAnchor="middle" fontSize="9" fill={C.dim}>{d.l}</text>
        {showVals&&d.v>0&&<text x={x+bw/2} y={Math.max(y-4,8)} textAnchor="middle" fontSize="9" fill={C.muted}>{d.vl||d.v}</text>}
      </g>;
    })}
    <line x1="0" y1={height} x2={data.length*50} y2={height} stroke={C.border} strokeWidth="1"/>
  </svg>;
}

function SvgDonut({value, max, color, label, sub}) {
  const pct   = Math.min(value/Math.max(max,1), 1);
  const r     = 38, cx=50, cy=50, stroke=10;
  const circ  = 2*Math.PI*r;
  const dash  = pct*circ;
  return <div style={{textAlign:'center'}}>
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth={stroke}/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color||C.gold} strokeWidth={stroke}
        strokeDasharray={`${dash} ${circ-dash}`} strokeDashoffset={circ/4} strokeLinecap="round"/>
      <text x={cx} y={cy-4} textAnchor="middle" fontSize="14" fontWeight="700" fill={color||C.gold}>{Math.round(pct*100)}%</text>
      <text x={cx} y={cy+10} textAnchor="middle" fontSize="8" fill={C.dim}>{sub||''}</text>
    </svg>
    {label&&<div style={{fontSize:'11px',color:C.muted,marginTop:'-6px'}}>{label}</div>}
  </div>;
}

const CK_LS = 'bp_checklisten_v1';

function FristenKalender() {
  const {projekte, rechnungen, firma} = useApp();
  const [nachtraege] = useState(()=>{ try{const d=localStorage.getItem('bp_nt_v1');return d?JSON.parse(d):[];}catch(e){return[];} });
  const [horizon, setHorizon] = useState(60); // days ahead
  const today  = new Date();
  const mwst   = parseFloat(firma.mwstSatz)||8.1;

  const addDays = (d, n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
  const isoToDate = s => s ? new Date(s) : null;
  const fmtDat  = d => { if(!d)return'—'; return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}); };
  const daysLeft= d => { if(!d)return 999; return Math.ceil((d-today)/(86400000)); };

  // Collect all deadlines
  const deadlines = [];

  // Rechnungen: Fälligkeitsdatum
  rechnungen.filter(r=>r.status!=='bezahlt').forEach(r => {
    const datum = isoToDate(r.datum);
    if(!datum) return;
    const faellig = addDays(datum, parseFloat(firma.zahlungsfrist)||30);
    const dl = daysLeft(faellig);
    if(dl <= horizon) deadlines.push({
      id:'r_'+r.id, typ:'rechnung', icon:'🧾', farbe: dl<0?C.red:dl<=7?'#E0A040':C.green,
      titel: r.bezeichnung||r.nr, sub: 'Rechnung · CHF '+(((parseFloat(r.betrag)||0)*(1+mwst/100)).toLocaleString('de-CH',{minimumFractionDigits:0,maximumFractionDigits:0})),
      datum: faellig, daysLeft: dl,
      projektName: projekte.find(p=>p.id===r.projektId)?.name||'—',
      prioritaet: dl<0?3:dl<=7?2:1,
    });
  });

  // Nachträge: Fristen
  nachtraege.filter(n=>n.frist>0&&n.status!=='genehmigt'&&n.status!=='abgelehnt').forEach(n => {
    const datum = isoToDate(n.datum);
    if(!datum) return;
    const faellig = addDays(datum, (n.frist||0)*7); // weeks
    const dl = daysLeft(faellig);
    if(dl <= horizon) deadlines.push({
      id:'n_'+n.id, typ:'nachtrag', icon:'📋', farbe: dl<0?C.red:dl<=14?'#E0A040':C.blue,
      titel: n.titel, sub: `Nachtrag ${n.nr} · ${n.frist} Tage Frist`,
      datum: faellig, daysLeft: dl,
      projektName: n.projekt||'—',
      prioritaet: dl<0?3:dl<=14?2:1,
    });
  });

  // SIA Phasen: aktive Phase Deadline (grob: 90 Tage wenn in_bearbeitung)
  projekte.forEach(p => {
    const ap = SIA.find(x=>x.id===p.aktivPhase);
    if(!ap) return;
    const status = p.phasenStatus[p.aktivPhase]||'nicht_begonnen';
    if(status==='freigegeben') return;
    // Simulate a deadline for active phases in progress
    const datumKey = `ckl_deadline_${p.id}_${p.aktivPhase}`;
    const stored   = localStorage.getItem(datumKey);
    if(!stored) return;
    const faellig  = new Date(stored);
    const dl = daysLeft(faellig);
    if(dl <= horizon) deadlines.push({
      id:'p_'+p.id+'_'+ap.id, typ:'phase', icon:'◈',
      farbe: dl<0?C.red:dl<=14?'#E0A040':ap.color||C.gold,
      titel: `SIA ${ap.nr} — ${ap.label}`, sub: `Projekt: ${p.name}`,
      datum: faellig, daysLeft: dl,
      projektName: p.name, prioritaet: dl<0?3:dl<=14?2:1,
    });
  });

  // Sort by urgency
  deadlines.sort((a,b) => a.daysLeft - b.daysLeft);

  const groups = [
    {label:'⚠ Überfällig',     items: deadlines.filter(d=>d.daysLeft<0),    bg:'rgba(232,115,90,.07)',border:C.red},
    {label:'🔶 Diese Woche',    items: deadlines.filter(d=>d.daysLeft>=0&&d.daysLeft<=7),  bg:'rgba(224,160,64,.07)',border:'#E0A040'},
    {label:'🟡 Nächste 30 Tage',items: deadlines.filter(d=>d.daysLeft>7&&d.daysLeft<=30), bg:'rgba(255,255,255,.03)',border:C.border},
    {label:'🟢 Weitere',        items: deadlines.filter(d=>d.daysLeft>30),   bg:'transparent',border:C.border},
  ].filter(g=>g.items.length>0);

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(224,160,64,.12)',border:'1px solid rgba(224,160,64,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>📅</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>Fristen & Termine</div>
          <div style={{fontSize:'12px',color:C.dim}}>{deadlines.filter(d=>d.daysLeft<0).length} überfällig · {deadlines.filter(d=>d.daysLeft>=0&&d.daysLeft<=7).length} diese Woche</div>
        </div>
      </div>
      <div style={{display:'flex',gap:'6px'}}>
        {[30,60,90].map(d=><button key={d} onClick={()=>setHorizon(d)} style={{padding:'4px 12px',borderRadius:'14px',border:`1px solid ${horizon===d?C.gold:C.border}`,background:horizon===d?'rgba(200,169,110,.15)':'transparent',color:horizon===d?C.gold:'#888',fontSize:'11px',cursor:'pointer'}}>
          {d} Tage
        </button>)}
      </div>
    </div>

    <div style={{padding:'16px 18px'}}>
      {deadlines.length===0 && <div style={{textAlign:'center',padding:'60px 20px',color:C.dim}}>
        <div style={{fontSize:'40px',marginBottom:'10px',opacity:.3}}>✅</div>
        <div style={{fontSize:'15px',color:C.muted}}>Alles im grünen Bereich</div>
        <div style={{fontSize:'12px',marginTop:'4px'}}>Keine Fristen in den nächsten {horizon} Tagen</div>
      </div>}
      {groups.map(g=><div key={g.label} style={{marginBottom:'20px'}}>
        <div style={{fontSize:'13px',fontWeight:'700',color:'#FFF',marginBottom:'10px',display:'flex',alignItems:'center',gap:'8px'}}>
          {g.label}
          <span style={{background:'rgba(255,255,255,.08)',borderRadius:'10px',padding:'1px 8px',fontSize:'11px',color:C.muted}}>{g.items.length}</span>
        </div>
        {g.items.map(d=>{
          const abs = Math.abs(d.daysLeft);
          const label = d.daysLeft<0?`${abs} Tage überfällig`:d.daysLeft===0?'Heute fällig':`in ${abs} Tag${abs===1?'':'en'}`;
          return <div key={d.id} style={{background:g.bg,border:`1px solid ${g.border}`,borderLeft:`3px solid ${d.farbe}`,borderRadius:'11px',padding:'13px 15px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'}}>
            <div style={{fontSize:'22px',flexShrink:0}}>{d.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.titel}</div>
              <div style={{fontSize:'11px',color:C.muted,marginTop:'2px'}}>{d.sub}</div>
              <div style={{fontSize:'10px',color:C.dim,marginTop:'1px'}}>{d.projektName}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:'12px',fontWeight:'700',color:d.farbe}}>{label}</div>
              <div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>{fmtDat(d.datum)}</div>
            </div>
          </div>;
        })}
      </div>)}
    </div>
  </div>;
}

// 3. PROJEKTPROFITABILITÄT COMPONENT (used in Finanzen + ProjektDetail)
// ═══════════════════════════════════════════════════════════════════════════

function ProjektProfit({projekt}) {
  const {offerten, rechnungen, stunden, firma} = useApp();
  const mwst      = parseFloat(firma.mwstSatz)||8.1;
  const p         = projekt;
  const pOff      = offerten.filter(o=>o.projektId===p.id);
  const pRech     = rechnungen.filter(r=>r.projektId===p.id);
  const pStd      = stunden.filter(s=>s.projektId===p.id);

  const honorarSoll  = pOff.filter(o=>o.status==='angenommen').reduce((a,o)=>a+(parseFloat(o.totalNetto)||0),0);
  const faktRech     = pRech.filter(r=>r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0),0);
  const offeneRech   = pRech.filter(r=>r.status!=='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0),0);
  const stdTotal     = pStd.reduce((a,s)=>a+(s.stunden||0),0);
  const stdNetto     = faktRech + offeneRech;
  const effStd       = stdTotal>0 ? (stdNetto/stdTotal) : 0;
  const budgetUsed   = honorarSoll>0 ? stdNetto/honorarSoll*100 : 0;

  const stdColor = effStd>=120?C.green:effStd>=80?'#E0A040':C.red;
  const budgColor= budgetUsed<=80?C.green:budgetUsed<=100?'#E0A040':C.red;

  return <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'8px'}}>
      {[
        {l:'Honorar genehmigt', v:`CHF ${(honorarSoll/1000).toFixed(0)}k`,    c:C.gold},
        {l:'Fakturiert',        v:`CHF ${(faktRech/1000).toFixed(0)}k`,       c:C.green},
        {l:'Offen',             v:`CHF ${(offeneRech/1000).toFixed(0)}k`,     c:offeneRech>0?'#E0A040':C.dim},
        {l:'Stunden erfasst',   v:`${stdTotal.toFixed(0)}h`,                  c:C.blue},
      ].map(item=><div key={item.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px',textAlign:'center'}}>
        <div style={{fontSize:'18px',fontWeight:'800',color:item.c}}>{item.v}</div>
        <div style={{fontSize:'10px',color:C.dim,marginTop:'2px',textTransform:'uppercase',letterSpacing:'.04em'}}>{item.l}</div>
      </div>)}
    </div>

    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px'}}>
      <div style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'12px'}}>Profitabilität</div>
      <div style={{display:'flex',gap:'16px',justifyContent:'center'}}>
        {stdNetto>0&&<SvgDonut value={faktRech} max={honorarSoll||stdNetto} color={C.green} label="Fakturiert" sub="von Soll"/>}
        {stdTotal>0&&<SvgDonut value={clamp(effStd,0,200)} max={200} color={stdColor} label="Eff. Stundensatz" sub={`CHF ${effStd.toFixed(0)}/h`}/>}
        {honorarSoll>0&&<SvgDonut value={clamp(budgetUsed,0,150)} max={150} color={budgColor} label="Budget" sub={`${budgetUsed.toFixed(0)}%`}/>}
      </div>
    </div>

    {stdTotal>0&&stdNetto>0&&<div style={{background:`${effStd>=100?'rgba(107,175,122,.08)':'rgba(232,115,90,.08)'}`,border:`1px solid ${effStd>=100?'rgba(107,175,122,.2)':'rgba(232,115,90,.2)'}`,borderRadius:'10px',padding:'12px'}}>
      <div style={{fontSize:'12px',fontWeight:'700',color:effStd>=100?C.green:C.red}}>
        {effStd>=140?'🚀 Sehr profitabel':'effStd>=100'?'✓ Profitabel':effStd>=70?'⚠ Grenzwertig':'⛔ Nicht rentabel'}
      </div>
      <div style={{fontSize:'12px',color:C.muted,marginTop:'3px'}}>
        CHF {effStd.toFixed(0)}/h effektiv · {stdTotal.toFixed(1)}h total · {pRech.length} Rechnungen
      </div>
    </div>}
  </div>;
}

// Profitability overview of ALL projects
function ProfitabilitaetUebersicht() {
  const {projekte, offerten, rechnungen, stunden, firma, setNav} = useApp();
  const mwst = parseFloat(firma.mwstSatz)||8.1;

  const calcProfit = p => {
    const pOff  = offerten.filter(o=>o.projektId===p.id&&o.status==='angenommen');
    const pRech = rechnungen.filter(r=>r.projektId===p.id);
    const pStd  = stunden.filter(s=>s.projektId===p.id);
    const honorar= pOff.reduce((a,o)=>a+(parseFloat(o.totalNetto)||0),0);
    const fakturiert= pRech.reduce((a,r)=>a+(parseFloat(r.betrag)||0),0);
    const std   = pStd.reduce((a,s)=>a+(s.stunden||0),0);
    const effStd= std>0 ? fakturiert/std : 0;
    return {p, honorar, fakturiert, std, effStd};
  };

  const data = projekte.map(calcProfit).filter(d=>d.std>0||d.fakturiert>0);
  data.sort((a,b)=>b.effStd-a.effStd);

  const totalFakt= data.reduce((a,d)=>a+d.fakturiert,0);
  const totalStd = data.reduce((a,d)=>a+d.std,0);
  const avgEff   = totalStd>0?totalFakt/totalStd:0;

  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'16px'}}>
      {[
        {l:'Ø Stundensatz',v:`CHF ${avgEff.toFixed(0)}/h`,c:avgEff>=100?C.green:C.gold},
        {l:'Total Stunden', v:`${totalStd.toFixed(0)}h`,  c:C.blue},
        {l:'Total Umsatz',  v:`CHF ${(totalFakt/1000).toFixed(0)}k`,c:C.gold},
      ].map(item=><div key={item.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px',textAlign:'center'}}>
        <div style={{fontSize:'18px',fontWeight:'800',color:item.c,letterSpacing:'-.01em'}}>{item.v}</div>
        <div style={{fontSize:'10px',color:C.dim,marginTop:'2px',textTransform:'uppercase',letterSpacing:'.04em'}}>{item.l}</div>
      </div>)}
    </div>

    {data.length===0 && <div style={{textAlign:'center',padding:'40px',color:C.dim}}>
      <div style={{fontSize:'30px',marginBottom:'8px',opacity:.3}}>📊</div>
      <div>Noch keine Daten. Stunden und Rechnungen erfassen.</div>
    </div>}

    {data.map((d,i)=>{
      const col = d.effStd>=120?C.green:d.effStd>=80?'#E0A040':d.effStd>0?C.red:C.dim;
      const ap  = SIA.find(x=>x.id===d.p.aktivPhase);
      return <div key={d.p.id} onClick={()=>setNav({page:'projekt-detail',id:d.p.id})}
        style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${col}`,borderRadius:'11px',padding:'13px 15px',marginBottom:'8px',cursor:'pointer',display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{width:'28px',height:'28px',borderRadius:'50%',background:col+'22',border:`1px solid ${col}44`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'800',color:col,flexShrink:0}}>#{i+1}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.p.name}</div>
          <div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>{ap?`SIA ${ap.nr}`:''} · {d.std.toFixed(0)}h · CHF {(d.fakturiert/1000).toFixed(1)}k fakturiert</div>
        </div>
        <div style={{textAlign:'right',flexShrink:0}}>
          <div style={{fontSize:'16px',fontWeight:'800',color:col}}>CHF {d.effStd.toFixed(0)}/h</div>
          <div style={{fontSize:'10px',color:col,fontWeight:'700'}}>{d.effStd>=120?'Top':'d.effStd>=80'?'OK':d.effStd>0?'Tief':'—'}</div>
        </div>
      </div>;
    })}
  </div>;
}

// 4. BERICHTE & ANALYSEN

function FinBerichte() {
  const {rechnungen, offerten, stunden, projekte, firma} = useApp();
  const [bTab, setBTab] = useState('umsatz');
  const mwst = parseFloat(firma.mwstSatz)||8.1;

  const now   = new Date();
  const year  = now.getFullYear();

  // Monthly revenue (last 12 months)
  const months = Array.from({length:12},(_, i)=>{
    const d = new Date(year, now.getMonth()-11+i, 1);
    return {y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString('de-CH',{month:'short'})};
  });
  const monthlyRev = months.map(({y,m,label})=>{
    const v = rechnungen.filter(r=>r.status==='bezahlt'&&r.datum).filter(r=>{
      const d=new Date(r.datum); return d.getFullYear()===y&&d.getMonth()===m;
    }).reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);
    return {l:label, v:Math.round(v/100)/10, vl:v>0?`CHF ${(v/1000).toFixed(0)}k`:'', c:C.gold};
  });

  // MWST quarterly
  const quarters = ['Q1','Q2','Q3','Q4'].map((ql,qi)=>{
    const ms = [qi*3, qi*3+1, qi*3+2];
    const v  = rechnungen.filter(r=>r.status==='bezahlt'&&r.datum).filter(r=>{
      const d=new Date(r.datum); return d.getFullYear()===year&&ms.includes(d.getMonth());
    }).reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(mwst/100),0);
    return {l:ql, v:Math.round(v), vl:`CHF ${v.toFixed(0)}`, c:'#B478C8'};
  });

  // Top projects by revenue
  const topProj = projekte.map(p=>{
    const v = rechnungen.filter(r=>r.projektId===p.id&&r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);
    return {name:p.name.substring(0,22), v, kanton:p.kanton};
  }).filter(d=>d.v>0).sort((a,b)=>b.v-a.v).slice(0,8).map(d=>({l:d.name.substring(0,14), v:Math.round(d.v/100)/10, vl:`CHF ${(d.v/1000).toFixed(0)}k`, c:C.blue}));

  // Stunden per Mitarbeiter
  const users = {};
  stunden.forEach(s=>{users[s.userId]=(users[s.userId]||0)+(s.stunden||0);});

  const BTABS = [{id:'umsatz',l:'Umsatz'},{id:'mwst',l:'MWST'},{id:'projekte',l:'Top Projekte'},{id:'profitabilitaet',l:'Profitabilität'},{id:'export',l:'📥 Export'}];

  // Export CSV for Treuhänder
  const exportTreuhaender = () => {
    const rechSorted = rechnungen.slice().sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
    const rows = [
      ['Datum','Beleg-Nr','Beschreibung','Projekt','Netto CHF','MWST%','MWST CHF','Brutto CHF','Status'],
      ...rechSorted.map(r=>{
        const proj=projekte.find(p=>p.id===r.projektId);
        const netto=parseFloat(r.betrag)||0;
        const mwstV=netto*(mwst/100);
        return[r.datum||'',r.nr||'',r.bezeichnung||r.nr||'',proj?.name||'—',netto.toFixed(2),mwst,mwstV.toFixed(2),(netto+mwstV).toFixed(2),r.status||''];
      })
    ];
    const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=`BauPlan_Buchungsliste_${year}.csv`;a.click();
  };
  const exportMWST = () => {
    const q1=quarters[0].v,q2=quarters[1].v,q3=quarters[2].v,q4=quarters[3].v;
    const total=q1+q2+q3+q4;
    const txt=`MWST-DEKLARATION ${year}\n\nFirma: ${firma.name}\nMWST-Nr: ${firma.mwstNr||'—'}\nMWST-Satz: ${mwst}%\n\nQ1: CHF ${q1.toFixed(2)}\nQ2: CHF ${q2.toFixed(2)}\nQ3: CHF ${q3.toFixed(2)}\nQ4: CHF ${q4.toFixed(2)}\n\nJahrestotal MWST: CHF ${total.toFixed(2)}\n\nHinweis: Diese Aufstellung dient als Grundlage für die MWST-Abrechnung bei der ESTV.\nBitte mit Ihrem Treuhänder überprüfen.`;
    const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download=`MWST_${year}.txt`;a.click();
  };

  const totalFakt = rechnungen.filter(r=>r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);
  const totalMwstYear = rechnungen.filter(r=>r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(mwst/100),0);

  return <div>
    {/* Sub-tabs */}
    <div style={{display:'flex',gap:'4px',marginBottom:'16px',flexWrap:'wrap'}}>
      {BTABS.map(t=><button key={t.id} onClick={()=>setBTab(t.id)} style={{padding:'6px 13px',borderRadius:'18px',border:`1px solid ${bTab===t.id?C.gold:C.border}`,background:bTab===t.id?'rgba(200,169,110,.15)':'transparent',color:bTab===t.id?C.gold:'#888',fontSize:'12px',cursor:'pointer',fontWeight:bTab===t.id?'700':'400'}}>{t.l}</button>)}
    </div>

    {bTab==='umsatz'&&<div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
          <div style={{fontSize:'12px',fontWeight:'700',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em'}}>Umsatz letzte 12 Monate</div>
          <div style={{fontSize:'18px',fontWeight:'800',color:C.green}}>CHF {(totalFakt/1000).toFixed(0)}k <span style={{fontSize:'12px',color:C.dim}}>YTD</span></div>
        </div>
        <SvgBarChart data={monthlyRev} height={100}/>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px'}}>
        <div style={{fontSize:'12px',fontWeight:'700',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'10px'}}>Kennzahlen {year}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
          {[
            ['Rechnungen gestellt',rechnungen.length],
            ['Davon bezahlt',rechnungen.filter(r=>r.status==='bezahlt').length],
            ['Offerten total',offerten.length],

function CkListeProjekt({projektId}) {
  const LS_KEY = `bp_ck_${projektId}`;
  const [checks, setChecks] = useState(()=>{
    try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):{};} catch(e){return {};}
  });
  const {projekte} = useApp();
  const p = projekte.find(x=>x.id===projektId);
  if(!p) return null;

  const save = obj => { setChecks(obj); try{localStorage.setItem(LS_KEY,JSON.stringify(obj));}catch(e){} };
  const toggle = (phase, idx) => {
    const key = `${phase}_${idx}`;
    save({...checks, [key]: !checks[key]});
  };

  // Show phases that are active or in progress
  const relevantPhases = SIA.filter(ph=>{
    const st = p.phasenStatus[ph.id]||'nicht_begonnen';
    return st !== 'nicht_begonnen' && SIA_CHECKLISTS[ph.id];
  });
  if(relevantPhases.length===0) return <div style={{textAlign:'center',padding:'30px',color:C.dim}}>Starte eine SIA-Phase um die Checkliste zu sehen.</div>;

  return <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
    {relevantPhases.map(ph=>{
      const ck    = SIA_CHECKLISTS[ph.id];
      const done  = ck.items.filter((_,i)=>checks[`${ph.id}_${i}`]).length;
      const total = ck.items.length;
      const pct   = Math.round(done/total*100);
      const col   = pct===100?C.green:pct>=60?'#E0A040':C.gold;
      return <div key={ph.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${ph.color}`,borderRadius:'12px',overflow:'hidden'}}>
        <div style={{padding:'12px 15px',display:'flex',alignItems:'center',gap:'10px'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF'}}>{ck.label}</div>
            <div style={{height:'4px',background:'rgba(255,255,255,.08)',borderRadius:'2px',marginTop:'6px',overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:col,borderRadius:'2px',transition:'width .3s'}}/>
            </div>
          </div>
          <span style={{fontSize:'13px',fontWeight:'800',color:col,flexShrink:0}}>{done}/{total}</span>
        </div>
        <div style={{padding:'0 15px 12px'}}>
          {ck.items.map((item,i)=>{
            const done = checks[`${ph.id}_${i}`];
            return <div key={i} onClick={()=>toggle(ph.id,i)} style={{display:'flex',alignItems:'center',gap:'10px',padding:'7px 0',borderBottom:i<ck.items.length-1?`1px solid rgba(255,255,255,.04)`:'none',cursor:'pointer'}}>
              <div style={{width:'18px',height:'18px',borderRadius:'4px',border:`1.5px solid ${done?ph.color:'rgba(255,255,255,.2)'}`,background:done?ph.color+'22':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:'11px',color:ph.color}}>
                {done?'✓':''}
              </div>
              <span style={{fontSize:'13px',color:done?C.dim:'#DDD',textDecoration:done?'line-through':'none',flex:1}}>{item}</span>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>;
}

// 7. TEAM-AUSLASTUNG (in StundenGlobal)
// ═══════════════════════════════════════════════════════════════════════════

function TeamAuslastung() {
  const {stunden, projekte, users, user} = useApp();
  const [week, setWeek] = useState(0); // 0=current, -1=last, etc.
  const isAdmin = user.rolle==='admin';
  if(!isAdmin) return <div style={{padding:'20px',textAlign:'center',color:C.dim}}>Nur Admins sehen die Team-Auslastung.</div>;

  const getWeekStart = offset => {
    const d = new Date();
    const day = d.getDay();
    const diff = d.getDate() - day + (day===0?-6:1) + offset*7;
    return new Date(d.setDate(diff));
  };

  const weekStart = getWeekStart(week);
  const weekEnd   = new Date(weekStart.getTime() + 6*86400000);
  const inWeek    = s => {
    if(!s.datum) return false;
    const d = new Date(s.datum);
    return d >= weekStart && d <= weekEnd;
  };

  const userStats = users.map(u => {
    const uStd = stunden.filter(s=>s.userId===u.id&&inWeek(s));
    const total = uStd.reduce((a,s)=>a+(s.stunden||0),0);
    const byProj = {};
    uStd.forEach(s=>{ byProj[s.projektId]=(byProj[s.projektId]||0)+(s.stunden||0); });
    return {u, total, byProj};
  });

  const TARGET_HRS = 40;

  return <div style={{marginTop:'16px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
      <div style={{fontSize:'13px',fontWeight:'700',color:'#FFF'}}>
        Team-Auslastung {weekStart.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})} – {weekEnd.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})}
      </div>
      <div style={{display:'flex',gap:'4px'}}>
        {[-2,-1,0].map(w=><button key={w} onClick={()=>setWeek(w)} style={{padding:'4px 10px',borderRadius:'7px',border:`1px solid ${week===w?C.gold:C.border}`,background:week===w?'rgba(200,169,110,.15)':'transparent',color:week===w?C.gold:'#888',fontSize:'11px',cursor:'pointer'}}>{w===0?'Heute':w===-1?'Vorwoche':'vor 2W'}</button>)}
      </div>
    </div>
    {userStats.map(({u, total, byProj})=>{
      const pct = Math.min(total/TARGET_HRS*100,100);
      const col = total>=TARGET_HRS?C.green:total>=TARGET_HRS*0.6?'#E0A040':C.red;
      const topProj = Object.entries(byProj).sort((a,b)=>b[1]-a[1]).slice(0,3);
      return <div key={u.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'11px',padding:'13px 15px',marginBottom:'8px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'8px'}}>
          <div style={{width:'32px',height:'32px',borderRadius:'50%',background:(u.farbe||C.gold)+'22',border:`1.5px solid ${u.farbe||C.gold}55`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:'700',color:u.farbe||C.gold,flexShrink:0}}>
            {(u.kuerzel||(u.name||'?').split(' ').map(n=>n[0]).join('')).slice(0,2).toUpperCase()}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:'13px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
            <div style={{height:'5px',background:'rgba(255,255,255,.08)',borderRadius:'3px',marginTop:'4px',overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:col,borderRadius:'3px',transition:'width .3s'}}/>
            </div>
          </div>
          <div style={{textAlign:'right',flexShrink:0}}>
            <span style={{fontSize:'14px',fontWeight:'800',color:col}}>{total.toFixed(1)}h</span>
            <span style={{fontSize:'11px',color:C.dim}}> / {TARGET_HRS}h</span>
          </div>
        </div>
        {topProj.length>0&&<div style={{display:'flex',gap:'5px',flexWrap:'wrap'}}>
          {topProj.map(([pId,h])=>{
            const proj=projekte.find(p=>p.id==pId||p.id===parseInt(pId));
            return proj?<span key={pId} style={{fontSize:'10px',background:'rgba(255,255,255,.05)',color:C.muted,padding:'2px 7px',borderRadius:'4px'}}>{proj.name.substring(0,18)}: {h.toFixed(1)}h</span>:null;
          })}
        </div>}
      </div>;
    })}
  </div>;
}

  const hasFilter   = kantone.length>0 || phasen.length>0 || minBkp || maxBkp;

  const apply = () => {
    const filtered = projekte.filter(p => {
      if(kantone.length>0 && !kantone.includes(p.kanton)) return false;
      if(phasen.length>0 && !phasen.includes(p.aktivPhase)) return false;
      if(minBkp && (parseFloat(p.bkpSumme)||0) < parseFloat(minBkp)*1000) return false;
      if(maxBkp && (parseFloat(p.bkpSumme)||0) > parseFloat(maxBkp)*1000) return false;
      return true;
    });
    onFilter(filtered);
    setOpen(false);
  };
  const reset = () => { setKantone([]); setPhasen([]); setMinBkp(''); setMaxBkp(''); onFilter(projekte); };

  const toggleArr = (arr, setArr, val) => setArr(prev => prev.includes(val)?prev.filter(x=>x!==val):[...prev,val]);

  return <div style={{marginBottom:'10px'}}>
    <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
      <button onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',gap:'6px',padding:'7px 13px',borderRadius:'9px',border:`1px solid ${hasFilter?C.gold:C.border}`,background:hasFilter?'rgba(200,169,110,.12)':'transparent',color:hasFilter?C.gold:'#888',fontSize:'12px',cursor:'pointer',fontWeight:hasFilter?'700':'400'}}>
        ⚙ Filter {hasFilter?`(aktiv)`:''}
      </button>
      {hasFilter&&<button onClick={reset} style={{fontSize:'11px',color:C.red,background:'none',border:'none',cursor:'pointer'}}>✕ Reset</button>}
    </div>
    {open&&<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginTop:'8px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px'}}>
        {/* Kantone */}
        <div>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'7px'}}>Kanton</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
            {alleKantone.map(k=><button key={k} onClick={()=>toggleArr(kantone,setKantone,k)} style={{padding:'3px 9px',borderRadius:'6px',border:`1px solid ${kantone.includes(k)?C.gold:C.border}`,background:kantone.includes(k)?'rgba(200,169,110,.15)':'transparent',color:kantone.includes(k)?C.gold:'#888',fontSize:'11px',cursor:'pointer'}}>{k}</button>)}
          </div>
        </div>
        {/* Phasen */}
        <div>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'7px'}}>SIA-Phase</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
            {SIA.map(ph=><button key={ph.id} onClick={()=>toggleArr(phasen,setPhasen,ph.id)} style={{padding:'3px 9px',borderRadius:'6px',border:`1px solid ${phasen.includes(ph.id)?ph.color:C.border}`,background:phasen.includes(ph.id)?ph.color+'18':'transparent',color:phasen.includes(ph.id)?ph.color:'#888',fontSize:'11px',cursor:'pointer'}}>SIA {ph.nr}</button>)}
          </div>
        </div>
        {/* BKP */}
        <div>
          <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'7px'}}>BKP-Volumen (CHF k)</div>
          <div style={{display:'flex',gap:'6px',alignItems:'center'}}>
            <input type="number" value={minBkp} onChange={e=>setMinBkp(e.target.value)} placeholder="Min" style={{...sBase,fontSize:'13px',width:'80px'}}/>
            <span style={{color:C.dim}}>–</span>
            <input type="number" value={maxBkp} onChange={e=>setMaxBkp(e.target.value)} placeholder="Max" style={{...sBase,fontSize:'13px',width:'80px'}}/>
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
        <Btn onClick={apply} variant="gold" size="sm">Filter anwenden</Btn>
        <Btn onClick={()=>setOpen(false)} variant="ghost" size="sm">Abbrechen</Btn>
      </div>
    </div>}
  </div>;
}

function bh_load(key, demo) { try{const d=localStorage.getItem(key);return d?JSON.parse(d):JSON.parse(JSON.stringify(demo));}catch(e){return JSON.parse(JSON.stringify(demo));} }
function bh_save(key,data) { try{localStorage.setItem(key,JSON.stringify(data));}catch(e){} }
const bh_iso = () => new Date().toISOString().split('T')[0];
const bh_relDate = d => {
  if(!d) return '—';
  const diff = Math.floor((new Date()-new Date(d))/(86400000));
  if(diff===0) return 'Heute';
  if(diff===1) return 'Gestern';
  if(diff<7)  return `vor ${diff} Tagen`;
  return new Date(d).toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'});
};

        <div style={{flex:1}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:'6px',marginBottom:'8px'}}>
            <span style={{background:post.type==='frage'?'rgba(91,143,185,.15)':'rgba(180,120,200,.15)',color:post.type==='frage'?C.blue:'#B478C8',border:`1px solid ${post.type==='frage'?C.blue+'44':'#B478C844'}`,padding:'2px 9px',borderRadius:'8px',fontSize:'11px',fontWeight:'700'}}>{post.type==='frage'?'❓ Frage':'💬 Diskussion'}</span>
            <span style={{fontSize:'11px',color:C.dim}}>{post.views} Aufrufe</span>
          </div>
          <h2 style={{fontSize:'20px',fontWeight:'800',color:'#FFF',lineHeight:'1.3',marginBottom:'14px'}}>{post.titel}</h2>
          <div style={{fontSize:'14px',color:'#CCC',lineHeight:'1.7',marginBottom:'14px'}}>{post.inhalt}</div>
          {(post.tags||[]).length>0&&<div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}}>
            {post.tags.map(t=><span key={t} style={{background:'rgba(255,255,255,.06)',color:C.muted,padding:'2px 8px',borderRadius:'4px',fontSize:'11px'}}>{t}</span>)}
          </div>}
          <BhAuthor name={post.autor} date={post.datum}/>
        </div>
      </div>

      {/* Answers */}
      <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',marginBottom:'12px'}}>
        {answers.length} {answers.length===1?'Antwort':'Antworten'}
      </div>
      {bestA&&<BhAnswer a={bestA} isBest={true} postId={post.id} onSaveWiki={onSaveWiki}/>}
      {otherA.map(a=><BhAnswer key={a.id} a={a} isBest={false} postId={post.id}
        onMarkBest={post.type==='frage'?id=>onMarkBest(post.id,id):null}
        onSaveWiki={onSaveWiki}
      />)}
      {answers.length===0&&<div style={{textAlign:'center',padding:'30px',color:C.dim,background:'rgba(255,255,255,.02)',borderRadius:'10px',marginBottom:'16px'}}>
        <div style={{fontSize:'24px',marginBottom:'8px',opacity:.4}}>💬</div>
        <div style={{fontSize:'14px'}}>Noch keine Antworten. Sei der Erste!</div>
      </div>}

      {/* Answer form */}
      <div style={{marginTop:'20px',paddingTop:'20px',borderTop:`1px solid ${C.border}`}}>
        <div style={{fontSize:'15px',fontWeight:'700',color:'#FFF',marginBottom:'12px'}}>Deine Antwort</div>
        <Textarea value={answerText} onChange={setAnswerText} placeholder={post.type==='frage'?'Schreibe deine Antwort…  Sei präzise, nenne SIA-Artikel wo relevant.':'Dein Beitrag zur Diskussion…'}/>
        <div style={{marginTop:'10px'}}>
          <Btn onClick={submitAnswer} variant="gold">Antwort veröffentlichen</Btn>
        </div>
      </div>
    </div>
  </div>;
}

          {i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:'7px',flexWrap:'wrap'}}>

          <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'4px'}}>
            {(p.badges||[]).slice(0,3).map(b=><BhBadge key={b} badge={b}/>)}
          </div>

    })}
  </div>;
}

// ─── Main Bauhütte Page ───────────────────────────────────────────────────
function BauhüttePage() {
  const [posts,     setPosts]    = useState(()=>bh_load(BH_LS_POSTS,    BH_DEMO_POSTS));
  const [answers,   setAnswers]  = useState(()=>bh_load(BH_LS_ANSWERS,  BH_DEMO_ANSWERS));
  const [tab,       setTab]      = useState('feed');
  const [katFil,    setKatFil]   = useState('alle');
  const [typeFil,   setTypeFil]  = useState('alle');
  const [search,    setSearch]   = useState('');
  const [selPost,   setSelPost]  = useState(null);
  const [showNew,   setShowNew]  = useState(false);
  const {setNav}                 = useApp();

  const saveAll = (p,a) => { bh_save(BH_LS_POSTS,p); bh_save(BH_LS_ANSWERS,a); };

  const handleNewPost = p => { const upd=[p,...posts]; setPosts(upd); bh_save(BH_LS_POSTS,upd); setShowNew(false); setSelPost(p); };
  const handleNewAnswer = a => {
    const newA=[...answers,a];
    const newP=posts.map(p=>p.id===a.postId?{...p,answers:(p.answers||0)+1}:p);
    setAnswers(newA); setPosts(newP); saveAll(newP,newA);
  };
  const handleMarkBest = (postId,answerId) => {
    const newP=posts.map(p=>p.id===postId?{...p,akzeptiert:answerId}:p);
    setPosts(newP); bh_save(BH_LS_POSTS,newP);
    if(selPost&&selPost.id===postId) setSelPost({...selPost,akzeptiert:answerId});
  };
  const handleSaveWiki = a => {
    // Open wiki editor pre-filled (navigate to wissen with prefill)
    setNav({page:'wissen',_prefill:{titel:selPost?.titel||'',content:`<p>${a.inhalt}</p>`,kat:'nachtraege',preview:a.inhalt.substring(0,120)+'…'}});
  };

  const openPost = p => { const upd=posts.map(x=>x.id===p.id?{...x,views:(x.views||0)+1}:x); setPosts(upd); bh_save(BH_LS_POSTS,upd); setSelPost({...p,views:(p.views||0)+1}); };

  const filtered = posts.filter(p=>{
    if(typeFil!=='alle'&&p.type!==typeFil) return false;
    if(katFil!=='alle'&&p.kat!==katFil) return false;
    if(search){ const q=search.toLowerCase(); if(!(p.titel+(p.inhalt||'')+(p.tags||[]).join(' ')).toLowerCase().includes(q)) return false; }
    return true;
  });
  const sorted = filtered.slice().sort((a,b)=>
    tab==='top'?b.votes-a.votes:tab==='unanswered'?a.answers-b.answers:new Date(b.datum)-new Date(a.datum)
  );

  // Post Detail
  if(selPost) return <BhPostDetail
    post={selPost} allAnswers={answers}
    onBack={()=>setSelPost(null)}
    onMarkBest={handleMarkBest}
    onNewAnswer={handleNewAnswer}
    onSaveWiki={handleSaveWiki}
  />;

  const TABS=[{id:'feed',l:'Neu'},{id:'top',l:'Top'},{id:'unanswered',l:'Unbeantwortet'},{id:'mvp',l:'🏆 MVP'}];

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    {/* Header */}
    <div style={{background:'linear-gradient(180deg,rgba(200,169,110,.06) 0%,transparent 100%)',borderBottom:`1px solid ${C.border}`,padding:'52px 18px 0'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'14px'}}>
        <div style={{width:'44px',height:'44px',background:'linear-gradient(135deg,rgba(200,169,110,.2),rgba(200,169,110,.08))',border:`1px solid rgba(200,169,110,.3)`,borderRadius:'12px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',flexShrink:0}}>🏚</div>
        <div>
          <div style={{fontSize:'24px',fontWeight:'800',letterSpacing:'-.03em',color:'#FFF'}}>Bauhütte</div>
          <div style={{fontSize:'12px',color:C.dim}}>Community für Schweizer Fachplaner · {posts.length} Beiträge</div>
        </div>
        <Btn onClick={()=>{setShowNew(true);setKatFil('alle');}} variant="gold" size="sm" style={{marginLeft:'auto'}}>＋ Beitrag</Btn>
      </div>
      {/* Search */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'8px 14px',marginBottom:'12px'}}>
        <span style={{color:C.dim,fontSize:'14px'}}>🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Fragen, Themen, Tags durchsuchen…" style={{background:'none',border:'none',color:'#FFF',fontSize:'14px',outline:'none',flex:1}}/>
        {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',color:C.dim,cursor:'pointer',fontSize:'16px'}}>✕</button>}
      </div>
      {/* Tabs */}
      <div style={{display:'flex',gap:'2px',background:'rgba(255,255,255,.04)',borderRadius:'10px 10px 0 0',padding:'3px 3px 0',overflowX:'auto'}}>
        {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'8px 14px',borderRadius:'7px 7px 0 0',border:'none',fontSize:'12px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',background:tab===t.id?C.dark:'transparent',color:tab===t.id?C.gold:C.dim,borderBottom:tab===t.id?`2px solid ${C.gold}`:'2px solid transparent'}}>{t.l}</button>)}
      </div>
    </div>

    <div style={{padding:'14px 18px'}}>
      {/* New post form */}
      {showNew&&<BhNewPostForm onSave={handleNewPost} onCancel={()=>setShowNew(false)}/>}

      {/* MVP tab */}
      {tab==='mvp'&&<BhMVP/>}

      {/* Feed */}
      {tab!=='mvp'&&<>
        {/* Category filter */}
        <div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px'}}>
          <button onClick={()=>setKatFil('alle')} style={{padding:'4px 12px',borderRadius:'16px',border:`1px solid ${katFil==='alle'?C.gold:C.border}`,background:katFil==='alle'?'rgba(200,169,110,.12)':'transparent',color:katFil==='alle'?C.gold:'#888',fontSize:'11px',cursor:'pointer',fontWeight:katFil==='alle'?'700':'400'}}>Alle</button>
          {Object.entries(BH_CATS).map(([k,v])=><button key={k} onClick={()=>setKatFil(k)} style={{padding:'4px 10px',borderRadius:'16px',border:`1px solid ${katFil===k?v.c:C.border}`,background:katFil===k?`${v.c}18`:'transparent',color:katFil===k?v.c:'#888',fontSize:'11px',cursor:'pointer',fontWeight:katFil===k?'700':'400'}}>{v.ic} {v.l}</button>)}
        </div>
        {/* Type filter */}
        <div style={{display:'flex',gap:'6px',marginBottom:'12px'}}>
          {[{v:'alle',l:'Alle Typen'},{v:'frage',l:'❓ Fragen'},{v:'diskussion',l:'💬 Diskussionen'}].map(t=><button key={t.v} onClick={()=>setTypeFil(t.v)} style={{padding:'4px 12px',borderRadius:'16px',border:`1px solid ${typeFil===t.v?C.muted:C.border}`,background:typeFil===t.v?'rgba(255,255,255,.07)':'transparent',color:typeFil===t.v?'#DDD':'#888',fontSize:'11px',cursor:'pointer',fontWeight:typeFil===t.v?'700':'400'}}>{t.l}</button>)}
        </div>

        {/* Post list */}
        {sorted.length===0&&<div style={{textAlign:'center',padding:'50px 20px',color:C.dim}}>
          <div style={{fontSize:'32px',marginBottom:'10px',opacity:.3}}>📭</div>
          <div style={{fontSize:'15px',color:C.muted,marginBottom:'4px'}}>Keine Beiträge gefunden</div>
          <div style={{fontSize:'12px'}}>Sei der Erste und stelle eine Frage!</div>
        </div>}

        {sorted.map(p=>{
          const cat = BH_CATS[p.kat]||BH_CATS.praxis;
          const hasAccepted = !!p.akzeptiert;
          return <div key={p.id} onClick={()=>openPost(p)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'14px 16px',marginBottom:'8px',cursor:'pointer',display:'flex',gap:'12px',transition:'border-color .12s'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=cat.c}
            onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            {/* Vote/answer count column */}
            <div style={{display:'flex',flexDirection:'column',gap:'6px',alignItems:'center',flexShrink:0,minWidth:'40px'}}>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:'14px',fontWeight:'800',color:C.gold}}>{p.votes}</div>
                <div style={{fontSize:'9px',color:C.dim,textTransform:'uppercase'}}>Votes</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:'14px',fontWeight:'800',color:hasAccepted?C.green:p.answers>0?C.muted:'rgba(255,255,255,.15)'}}>{p.answers}</div>
                <div style={{fontSize:'9px',color:C.dim,textTransform:'uppercase'}}>Antw.</div>
              </div>
            </div>
            {/* Content */}
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',marginBottom:'5px'}}>
                <span style={{background:p.type==='frage'?'rgba(91,143,185,.12)':'rgba(180,120,200,.12)',color:p.type==='frage'?C.blue:'#B478C8',border:`1px solid ${p.type==='frage'?C.blue+'33':'#B478C833'}`,padding:'1px 7px',borderRadius:'6px',fontSize:'10px',fontWeight:'700',flexShrink:0}}>{p.type==='frage'?'Frage':'Diskussion'}</span>
                <span style={{fontSize:'10px',background:`${cat.c}15`,color:cat.c,padding:'1px 7px',borderRadius:'6px',fontWeight:'600',flexShrink:0}}>{cat.ic} {cat.l}</span>
                {hasAccepted&&<span style={{fontSize:'10px',color:C.green,fontWeight:'700',flexShrink:0}}>✓ Beantwortet</span>}
              </div>
              <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',lineHeight:'1.35',marginBottom:'6px',overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{p.titel}</div>
              <div style={{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
                <BhAuthor name={p.autor} date={p.datum} small={true}/>
                <span style={{fontSize:'10px',color:C.dim}}>· {p.views} Aufrufe</span>
                {(p.tags||[]).slice(0,2).map(t=><span key={t} style={{background:'rgba(255,255,255,.05)',color:C.dim,padding:'1px 6px',borderRadius:'4px',fontSize:'10px'}}>{t}</span>)}
              </div>
            </div>
          </div>;
        })}
      </>}
    </div>
  </div>;
}

// 1. BAUTAGEBUCH
