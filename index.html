function BkpKostenschaetzer({bkpSumme}){
  const [gebTyp,setGebTyp]=useState("mfh");
  const [qualitaet,setQualitaet]=useState("standard");
  const bkp2=parseFloat(bkpSumme)||0;
  const gt=GEBAEUDE_TYPEN.find(g=>g.id===gebTyp)||GEBAEUDE_TYPEN[0];
  const qf=QUALITAET_FAKTOREN.find(q=>q.id===qualitaet)?.faktor||1;

  const calc=(range)=>({min:Math.round(bkp2*range[0]*qf),max:Math.round(bkp2*range[1]*qf)});
  const hlks=calc(gt.bkp26);
  const elektro=calc(gt.bkp27);
  const aufzug=calc(gt.bkp28);
  const total={min:hlks.min+elektro.min+aufzug.min,max:hlks.max+elektro.max+aufzug.max};

  if(bkp2<=0) return <div style={{padding:"14px",background:"rgba(255,255,255,0.03)",borderRadius:"12px",textAlign:"center",color:C.dim,fontSize:"12px"}}>
    Bitte zuerst BKP Gesamtbaukosten im Projekt erfassen.
  </div>;

  return <div>
    <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:"12px",padding:"14px",marginBottom:"14px"}}>
      <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Kostenschätzer (Erfahrungswerte eBKP-H)</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}}>
        <Field label="Gebäudetyp">
          <Select value={gebTyp} onChange={setGebTyp} options={GEBAEUDE_TYPEN.map(g=>({value:g.id,label:g.label}))}/>
        </Field>
        <Field label="Standard">
          <Select value={qualitaet} onChange={setQualitaet} options={QUALITAET_FAKTOREN.map(q=>({value:q.id,label:q.label}))}/>
        </Field>
      </div>
      <div style={{fontSize:"10px",color:C.dim,marginBottom:"12px",padding:"6px 10px",background:"rgba(255,255,255,0.03)",borderRadius:"6px"}}>
        Basis: {fmtCHF(bkp2)} Gesamtbaukosten · {QUALITAET_FAKTOREN.find(q=>q.id===qualitaet)?.desc}
      </div>

      {[
        {label:"BKP 26 — HLKS",range:hlks,color:"#E8735A"},
        {label:"BKP 27 — Elektro",range:elektro,color:"#5B8FB9"},
        {label:"BKP 28 — Aufzüge/Sonstiges",range:aufzug,color:"#B478C8"},
      ].map(({label,range,color})=><div key={label} style={{marginBottom:"10px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
          <span style={{fontSize:"12px",fontWeight:"600",color:C.main}}>{label}</span>
          <span style={{fontSize:"12px",fontWeight:"700",color}}>{fmtCHF(range.min)} – {fmtCHF(range.max)}</span>
        </div>
        <div style={{height:"6px",background:"rgba(255,255,255,0.06)",borderRadius:"3px",overflow:"hidden"}}>
          <div style={{height:"100%",width:`${(range.max/total.max)*100}%`,background:color,borderRadius:"3px",opacity:0.7}}/>
        </div>
      </div>)}

      <div style={{borderTop:`1px solid ${C.border}`,paddingTop:"10px",marginTop:"6px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:"13px",fontWeight:"800",color:C.main}}>Total BKP 26–28</span>
        <div style={{textAlign:"right"}}>
          <span style={{fontSize:"14px",fontWeight:"800",color:C.gold}}>{fmtCHF(total.min)} – {fmtCHF(total.max)}</span>
          <div style={{fontSize:"10px",color:C.dim}}>{Math.round(total.min/bkp2*100)}–{Math.round(total.max/bkp2*100)}% der Bausumme</div>
        </div>
      </div>
      <div style={{marginTop:"10px",padding:"8px 10px",background:"rgba(255,255,255,0.03)",borderRadius:"8px"}}>
        <div style={{fontSize:"9px",color:C.dim,lineHeight:"1.5"}}>⚠ Schätzwerte basierend auf Erfahrungswerten eBKP-H. Für verbindliche Kosten: Ausschreibung erstellen.</div>
      </div>
    </div>
  </div>;
}

// AUSSCHREIBUNGS-MODUL
// ═══════════════════════════════════════════════════════════════════════════

function AusschreibungFormular({projektId,onClose}){
  const {projekte,firma}=useApp();
  const proj=projekte.find(p=>p.id===projektId);
  const [step,setStep]=useState(0); // 0=Upload/Start, 1=Typ+Gewerke, ...
  const [aiMode,setAiMode]=useState(false);
  const [uploadedFile,setUploadedFile]=useState(null);
  const [uploadedFileB64,setUploadedFileB64]=useState(null);
  const [aiLoading,setAiLoading]=useState(false);
  const [aiError,setAiError]=useState("");
  const [ausTyp,setAusTyp]=useState("detail");
  const [vergabeArt,setVergabeArt]=useState("einladung");
  const [gewerkeAuswahl,setGewerkeAuswahl]=useState(["heizung"]);
  const [titel,setTitel]=useState(`Ausschreibung ${proj?.name||""}`);
  const [eingabeFrist,setEingabeFrist]=useState("");
  const [ausfBeginn,setAusfBeginn]=useState("");
  const [ausfEnde,setAusfEnde]=useState("");
  const [einlFirmen,setEinlFirmen]=useState([{id:1,name:"",email:""}]);
  const [bemerkungen,setBemerkungen]=useState("");

  // Positionen: {id, bkp, bez, einheit, menge, beschrieb, checked, gewerk}
  const [allPos,setAllPos]=useState({});

  // ── FILE UPLOAD + AI ANALYSE ──────────────────────────────────────────
  const handleFileUpload=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setUploadedFile(file);
    const reader=new FileReader();
    reader.onload=ev=>{
      const b64=ev.target.result.split(",")[1];
      setUploadedFileB64(b64);
    };
    reader.readAsDataURL(file);
  };

  const analyseWithAI=async()=>{
    if(!uploadedFileB64)return;
    setAiLoading(true);
    setAiError("");
    try{
      const isPdf=uploadedFile?.type==="application/pdf";
      const isImg=uploadedFile?.type?.startsWith("image/");
      const mediaType=uploadedFile?.type||"application/pdf";

      const systemPrompt=`Du bist ein erfahrener Schweizer Fachplaner für Gebäudetechnik (HLKSE).
Analysiere das beigefügte Dokument (Plan, Baubeschreibung, Raumprogramm o.ä.) und erstelle daraus eine strukturierte Ausschreibung.

Antworte NUR mit einem JSON-Objekt, KEIN Markdown, KEINE Erklärungen davor oder danach.

Das JSON muss folgende Struktur haben:
{
  "titel": "Titel der Ausschreibung",
  "gewerke": ["heizung","lueftung","sanitaer","elektro","klima","ga"],
  "ausTyp": "detail",
  "zusammenfassung": "Kurze Beschreibung was analysiert wurde",
  "positionen": [
    {
      "gewerk": "heizung",
      "bkp": "242.0",
      "bez": "Bezeichnung der Position",
      "einheit": "Stk",
      "menge": 1,
      "beschrieb": "Detaillierter Leistungsbeschrieb für Schweizer Ausschreibung, inkl. technische Anforderungen, Normen (SWKI, SIA, NIN, VKF wo relevant)"
    }
  ]
}

Wichtige Regeln:
- Verwende korrekte BKP-Nummern (242.x Heizung, 244.x Lüftung, 246.x Kälte, 25x Sanitär, 23x Elektro, 248.x GA)
- Schreibe professionelle Leistungsbeschriebe auf Deutsch, wie ein erfahrener Planer
- Schätze realistische Mengen basierend auf dem Dokument
- Wähle nur Gewerke die aus dem Dokument ersichtlich sind
- Wenn unklar: lieber weniger aber präzise Positionen als viele unklare`;

      const userContent=isPdf
        ?[{type:"document",source:{type:"base64",media_type:"application/pdf",data:uploadedFileB64}},{type:"text",text:"Analysiere diesen Plan/dieses Dokument und erstelle die Ausschreibung als JSON."}]
        :isImg
        ?[{type:"image",source:{type:"base64",media_type:mediaType,data:uploadedFileB64}},{type:"text",text:"Analysiere diesen Plan und erstelle die Ausschreibung als JSON."}]
        :[{type:"text",text:"Analysiere das hochgeladene Dokument und erstelle die Ausschreibung als JSON."}];

      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:4000,
          system:systemPrompt,
          messages:[{role:"user",content:userContent}]
        })
      });
      const data=await resp.json();
      const raw=data.content?.map(c=>c.text||"").join("").trim();
      // Strip markdown fences if present
      const clean=raw.replace(/^```json\s*/,"").replace(/^```\s*/,"").replace(/\s*```$/,"").trim();
      const parsed=JSON.parse(clean);

      // Apply AI results: set gewerke, titel, positionen
      if(parsed.titel) setTitel(parsed.titel);
      if(parsed.ausTyp) setAusTyp(parsed.ausTyp);

      const newGewerke=parsed.gewerke||["heizung"];
      setGewerkeAuswahl(newGewerke);

      // Init pos data for all gewerke
      const initAll={};
      newGewerke.forEach(gw=>Object.assign(initAll,initPosForGewerk(gw)));

      // Mark AI-suggested positions as checked and apply AI beschrieb
      if(parsed.positionen){
        parsed.positionen.forEach((aiPos,idx)=>{
          const key=`ai_${aiPos.gewerk}_${idx}`;
          initAll[key]={
            key,
            gewerk:aiPos.gewerk,
            bkp:aiPos.bkp,
            bez:aiPos.bez,
            einheit:aiPos.einheit||"Stk",
            menge:aiPos.menge||1,
            beschrieb:aiPos.beschrieb,
            gruppe:`BKP ${aiPos.bkp?.split(".")[0]} — KI-generiert`,
            checked:true,
            aiGenerated:true,
          };
        });
      }
      setPosData(initAll);
      setAiMode(true);
      setStep(1);
    } catch(err){
      console.error(err);
      setAiError("Analyse fehlgeschlagen: "+err.message+". Bitte manuell weiterfahren.");
      setStep(1);
    }
    setAiLoading(false);
  };

  // Init positions when gewerk changes
  const initPosForGewerk=(gw)=>{
    const gruppen=BKP_LV_POSITIONEN[gw]||[];
    const newPos={};
    gruppen.forEach(g=>{
      g.unterpositionen.forEach((p,i)=>{
        const key=`${gw}_${g.bkp}_${i}`;
        newPos[key]={...p,key,gewerk:gw,gruppe:g.gruppe,checked:false};
      });
    });
    return newPos;
  };

  // Initialize on mount
  const [posData,setPosData]=useState(()=>{
    const init={};
    gewerkeAuswahl.forEach(gw=>Object.assign(init,initPosForGewerk(gw)));
    return init;
  });

  const addGewerk=(gw)=>{
    if(!gewerkeAuswahl.includes(gw)){
      setGewerkeAuswahl(p=>[...p,gw]);
      setPosData(p=>({...p,...initPosForGewerk(gw)}));
    }
  };
  const removeGewerk=(gw)=>{
    setGewerkeAuswahl(p=>p.filter(x=>x!==gw));
    setPosData(p=>{
      const n={...p};
      Object.keys(n).filter(k=>k.startsWith(gw+"_")).forEach(k=>delete n[k]);
      return n;
    });
  };

  const togglePos=(key)=>setPosData(p=>({...p,[key]:{...p[key],checked:!p[key].checked}}));
  const updatePos=(key,field,val)=>setPosData(p=>({...p,[key]:{...p[key],[field]:val}}));

  const checkedCount=Object.values(posData).filter(p=>p.checked).length;
  const checkedPos=Object.values(posData).filter(p=>p.checked);

  // Group checked positions by gewerk for preview
  const byGewerk={};
  checkedPos.forEach(p=>{byGewerk[p.gewerk]=byGewerk[p.gewerk]||[];byGewerk[p.gewerk].push(p);});

  return <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.88)",zIndex:200,overflowY:"auto"}}>
    <div style={{maxWidth:"740px",margin:"0 auto",padding:"20px 16px 80px"}}>

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}}>
        <div>
          <div style={{fontSize:"18px",fontWeight:"800",color:C.gold}}>📝 Ausschreibung erstellen</div>
          <div style={{fontSize:"12px",color:C.dim}}>Schritt {step} von 4 · {proj?.name}</div>
        </div>
        <span onClick={onClose} style={{color:C.dim,cursor:"pointer",fontSize:"22px"}}>✕</span>
      </div>

      {/* ── STEP 0: Upload / Start ── */}
      {step===0&&<div>
        <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>

          {/* Option A: KI-Analyse */}
          <div style={{background:"rgba(200,169,110,0.06)",border:"2px solid rgba(200,169,110,0.3)",borderRadius:"14px",padding:"20px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px"}}>
              <div style={{width:"38px",height:"38px",borderRadius:"10px",background:"rgba(200,169,110,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px"}}>✨</div>
              <div>
                <div style={{fontSize:"14px",fontWeight:"800",color:C.gold}}>KI-Analyse (empfohlen)</div>
                <div style={{fontSize:"11px",color:C.dim}}>Plan oder Dokument hochladen → KI erstellt Ausschreibung</div>
              </div>
            </div>

            <div style={{fontSize:"11px",color:C.muted,marginBottom:"14px",lineHeight:"1.6"}}>
              Lade einen <strong style={{color:C.main}}>PDF-Plan, eine Baubeschreibung, ein Raumprogramm oder ein Leistungsprogramm</strong> hoch. Claude analysiert das Dokument und erstellt automatisch eine Ausschreibung mit realistischen Mengen und professionellen Beschrieben.
            </div>

            <div style={{background:"rgba(255,255,255,0.03)",border:"2px dashed rgba(200,169,110,0.3)",borderRadius:"10px",padding:"20px",textAlign:"center",marginBottom:"12px",cursor:"pointer"}}
              onClick={()=>document.getElementById("ausschr-upload").click()}>
              <input id="ausschr-upload" type="file" accept=".pdf,.png,.jpg,.jpeg" style={{display:"none"}} onChange={handleFileUpload}/>
              {uploadedFile
                ?<div>
                  <div style={{fontSize:"18px",marginBottom:"6px"}}>📄</div>
                  <div style={{fontSize:"13px",fontWeight:"700",color:C.gold}}>{uploadedFile.name}</div>
                  <div style={{fontSize:"11px",color:C.dim,marginTop:"3px"}}>{(uploadedFile.size/1024).toFixed(1)} KB · Klicken zum Ändern</div>
                </div>
                :<div>
                  <div style={{fontSize:"28px",marginBottom:"8px",opacity:0.5}}>📎</div>
                  <div style={{fontSize:"13px",fontWeight:"700",color:C.muted}}>PDF oder Bild hier ablegen</div>
                  <div style={{fontSize:"10px",color:C.dim,marginTop:"4px"}}>oder klicken zum Auswählen · PDF, PNG, JPG</div>
                </div>}
            </div>

            {aiError&&<div style={{padding:"10px 12px",background:"rgba(232,115,90,0.1)",border:"1px solid rgba(232,115,90,0.3)",borderRadius:"8px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",color:"#E8735A"}}>{aiError}</div>
            </div>}

            {(()=>{
              const {user}=useApp();
              const plan=user?.plan||"starter";
              const hasAI=["team","studio","enterprise"].includes(plan);
              if(!hasAI) return <div style={{padding:"12px 14px",background:"rgba(91,143,185,0.08)",border:"1px solid rgba(91,143,185,0.2)",borderRadius:"10px",textAlign:"center"}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:C.blue,marginBottom:"4px"}}>✨ KI-Ausschreibung — Team-Plan</div>
                <div style={{fontSize:"11px",color:C.dim}}>Diese Funktion ist ab dem Team-Plan (CHF 399/Mt.) verfügbar.</div>
              </div>;
              return <Btn onClick={analyseWithAI} disabled={!uploadedFile||aiLoading} variant="gold" size="lg" full>
              {aiLoading
                ?<span style={{display:"flex",alignItems:"center",gap:"8px",justifyContent:"center"}}>
                  <span style={{display:"inline-block",width:"14px",height:"14px",border:"2px solid #C8A96E",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
                  Analysiere Dokument...
                </span>
                :<span>✨ KI-Ausschreibung erstellen</span>}
            </Btn>;
            })()}
            <div style={{fontSize:"10px",color:C.dim,marginTop:"8px",textAlign:"center"}}>Unterstützt: Grundrisspläne, Baubeschreibungen, Raumprogramme, Schemata</div>
          </div>

          {/* Option B: Manuell */}
          <div style={{background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:"14px",padding:"16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}}>
              <div style={{width:"38px",height:"38px",borderRadius:"10px",background:"rgba(255,255,255,0.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px"}}>📋</div>
              <div>
                <div style={{fontSize:"13px",fontWeight:"700",color:C.main}}>Manuell erstellen</div>
                <div style={{fontSize:"11px",color:C.dim}}>BKP-Positionen selbst auswählen und bearbeiten</div>
              </div>
            </div>
            <Btn onClick={()=>setStep(1)} variant="outline" size="lg" full>Manuell → Gewerk & Positionen wählen</Btn>
          </div>
        </div>
      </div>}

      {/* Progress Bar (nur ab Step 1) */}
      {step>0&&<div style={{display:"flex",gap:"6px",marginBottom:"20px"}}>
        {["Typ & Gewerke","BKP Positionen","Bedingungen","Vorschau"].map((s,i)=>
          <div key={s} style={{flex:1,textAlign:"center"}}>
            <div style={{height:"3px",borderRadius:"2px",background:step>i?C.gold:"rgba(255,255,255,0.1)",marginBottom:"4px"}}/>
            <div style={{fontSize:"9px",color:step===i+1?C.gold:C.dim,fontWeight:step===i+1?"700":"400"}}>{s}</div>
          </div>)}
      </div>}

      {/* ── STEP 1: Typ + Gewerke ── */}
      {step===1&&<div>
        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Ausschreibungsart</div>
          {AUSSCHREIBUNG_TYPEN.map(t=><div key={t.id} onClick={()=>setAusTyp(t.id)}
            style={{padding:"11px 13px",borderRadius:"10px",cursor:"pointer",marginBottom:"8px",
              border:`2px solid ${ausTyp===t.id?t.color:"rgba(255,255,255,0.08)"}`,
              background:ausTyp===t.id?`${t.color}0F`:"rgba(255,255,255,0.02)"}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"3px"}}>
              <span style={{fontSize:"15px",color:ausTyp===t.id?t.color:"#555"}}>{t.icon}</span>
              <span style={{fontSize:"13px",fontWeight:"700",color:ausTyp===t.id?t.color:C.main}}>{t.label}</span>
            </div>
            <div style={{fontSize:"10px",color:C.dim,paddingLeft:"23px"}}>{t.desc}</div>
          </div>)}
        </Card>

        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Vergabeverfahren</div>
          {VERGABE_ARTEN.map(v=><div key={v.id} onClick={()=>setVergabeArt(v.id)}
            style={{display:"flex",gap:"10px",padding:"9px 12px",borderRadius:"9px",cursor:"pointer",marginBottom:"5px",
              border:`1px solid ${vergabeArt===v.id?C.gold:"rgba(255,255,255,0.08)"}`,
              background:vergabeArt===v.id?"rgba(200,169,110,0.08)":"transparent"}}>
            <div style={{width:"16px",height:"16px",borderRadius:"50%",border:`2px solid ${vergabeArt===v.id?C.gold:"#444"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:"2px"}}>
              {vergabeArt===v.id&&<div style={{width:"7px",height:"7px",borderRadius:"50%",background:C.gold}}/>}
            </div>
            <div>
              <div style={{fontSize:"12px",fontWeight:"700",color:vergabeArt===v.id?C.gold:C.main}}>{v.label}</div>
              <div style={{fontSize:"10px",color:C.dim}}>{v.desc}</div>
            </div>
          </div>)}
        </Card>

        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Gewerke auswählen</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px"}}>
            {GEWERKE.map(g=>{
              const sel=gewerkeAuswahl.includes(g.id);
              return <div key={g.id} onClick={()=>sel?removeGewerk(g.id):addGewerk(g.id)}
                style={{padding:"10px 12px",borderRadius:"9px",cursor:"pointer",
                  border:`2px solid ${sel?g.color:"rgba(255,255,255,0.08)"}`,
                  background:sel?`${g.color}12`:"rgba(255,255,255,0.02)"}}>
                <div style={{display:"flex",alignItems:"center",gap:"7px"}}>
                  <span style={{fontSize:"16px"}}>{g.icon}</span>
                  <div>
                    <div style={{fontSize:"12px",fontWeight:"700",color:sel?g.color:C.muted}}>{g.label}</div>
                    <div style={{fontSize:"9px",color:C.dim}}>BKP {g.bkp}</div>
                  </div>
                </div>
              </div>;
            })}
          </div>
          {gewerkeAuswahl.length>0&&<div style={{padding:"8px 10px",background:"rgba(200,169,110,0.06)",borderRadius:"8px"}}>
            <span style={{fontSize:"10px",color:C.gold,fontWeight:"600"}}>{gewerkeAuswahl.length} Gewerk{gewerkeAuswahl.length!==1?"e":""} gewählt</span>
          </div>}
        </Card>

        <Field label="Titel der Ausschreibung" style={{marginBottom:"14px"}}>
          <Input value={titel} onChange={setTitel} placeholder="z.B. Heizung/Lüftung/Sanitär Wohnüberbauung XY"/>
        </Field>
        <Btn onClick={()=>{if(gewerkeAuswahl.length>0)setStep(2);}} variant="gold" size="lg" full>Weiter: BKP Positionen →</Btn>
      </div>}

      {/* ── STEP 2: BKP Positionen ── */}
      {step===2&&<div>
        <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:"12px",padding:"11px 14px",marginBottom:"14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:"11px",color:C.gold,fontWeight:"600"}}>{AUSSCHREIBUNG_TYPEN.find(t=>t.id===ausTyp)?.label}</span>
          <span style={{fontSize:"11px",color:C.dim}}>{checkedCount} Position{checkedCount!==1?"en":""} gewählt</span>
        </div>

        {gewerkeAuswahl.map(gwId=>{
          const gw=GEWERKE.find(g=>g.id===gwId);
          const gruppen=BKP_LV_POSITIONEN[gwId]||[];
          return <div key={gwId} style={{marginBottom:"16px"}}>
            {/* Gewerk Header */}
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px",padding:"8px 12px",background:`${gw?.color}12`,border:`1px solid ${gw?.color}33`,borderRadius:"10px"}}>
              <span style={{fontSize:"16px"}}>{gw?.icon}</span>
              <span style={{fontSize:"13px",fontWeight:"800",color:gw?.color}}>{gw?.label}</span>
              <span style={{fontSize:"10px",color:C.dim}}>BKP {gw?.bkp}</span>
            </div>

            {gruppen.map(gruppe=><Card key={gruppe.gruppe} style={{padding:"14px",marginBottom:"8px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"10px",paddingBottom:"7px",borderBottom:`1px solid ${C.border}`}}>
                {gruppe.gruppe}
              </div>
              {gruppe.unterpositionen.map((pos,i)=>{
                const key=`${gwId}_${gruppe.bkp}_${i}`;
                const posState=posData[key]||pos;
                const sel=posState.checked;
                return <div key={key} style={{marginBottom:"10px"}}>
                  {/* Position Kopfzeile */}
                  <div onClick={()=>togglePos(key)}
                    style={{display:"flex",gap:"10px",padding:"10px 12px",borderRadius:"9px",cursor:"pointer",
                      border:`1px solid ${sel?gw?.color:"rgba(255,255,255,0.06)"}`,
                      background:sel?`${gw?.color}08`:"rgba(255,255,255,0.02)"}}>
                    <div style={{width:"18px",height:"18px",borderRadius:"5px",border:`2px solid ${sel?gw?.color:"#444"}`,background:sel?gw?.color:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",marginTop:"2px"}}>
                      {sel&&<span style={{fontSize:"11px",color:"#0D0D0B",fontWeight:"900"}}>✓</span>}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"3px"}}>
                        <span style={{fontSize:"12px",fontWeight:"700",color:sel?C.main:C.muted}}>{pos.bez}</span>
                        <span style={{fontSize:"9px",fontWeight:"700",color:gw?.color,background:`${gw?.color}18`,padding:"1px 7px",borderRadius:"3px",flexShrink:0,marginLeft:"8px"}}>BKP {pos.bkp}</span>
                      </div>
                      <div style={{display:"flex",gap:"8px"}}>
                        <span style={{fontSize:"10px",color:C.dim}}>{pos.menge} {pos.einheit}</span>
                      </div>
                    </div>
                  </div>

                  {/* Editierfelder wenn ausgewählt */}
                  {sel&&<div style={{padding:"12px 14px",background:"rgba(255,255,255,0.02)",border:`1px solid ${gw?.color}22`,borderRadius:"0 0 9px 9px",borderTop:"none",marginTop:"-1px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 80px 70px",gap:"8px",marginBottom:"8px"}}>
                      <Field label="Bezeichnung">
                        <Input value={posState.bez||pos.bez} onChange={v=>updatePos(key,"bez",v)} placeholder="Bezeichnung"/>
                      </Field>
                      <Field label="Menge">
                        <Input value={posState.menge||pos.menge} onChange={v=>updatePos(key,"menge",v)} placeholder="1" type="number"/>
                      </Field>
                      <Field label="Einheit">
                        <Select value={posState.einheit||pos.einheit} onChange={v=>updatePos(key,"einheit",v)} options={["Stk","m","m²","m³","Psch","kg","h","kWp","kW"].map(e=>({value:e,label:e}))}/>
                      </Field>
                    </div>
                    <Field label="Leistungsbeschrieb (editierbar)">
                      <Textarea value={posState.beschrieb||pos.beschrieb} onChange={v=>updatePos(key,"beschrieb",v)} rows={3} style={{fontSize:"11px"}}/>
                    </Field>
                  </div>}
                </div>;
              })}
            </Card>)}
          </div>;
        })}

        <div style={{display:"flex",gap:"10px"}}>
          <Btn onClick={()=>setStep(1)} variant="outline" size="lg" style={{flex:1}}>← Zurück</Btn>
          <Btn onClick={()=>setStep(3)} variant="gold" size="lg" style={{flex:2}}>Weiter ({checkedCount} Pos.) →</Btn>
        </div>
      </div>}

      {/* ── STEP 3: Bedingungen ── */}
      {step===3&&<div>
        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Fristen</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
            <Field label="Eingabefrist Offerten"><Input value={eingabeFrist} onChange={setEingabeFrist} type="date"/></Field>
            <Field label="Ausführungsbeginn"><Input value={ausfBeginn} onChange={setAusfBeginn} type="date"/></Field>
          </div>
          <Field label="Ausführungsende"><Input value={ausfEnde} onChange={setAusfEnde} type="date"/></Field>
        </Card>

        {vergabeArt==="einladung"&&<Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Eingeladene Firmen</div>
          {einlFirmen.map((f,i)=><div key={f.id} style={{display:"grid",gridTemplateColumns:"1fr 1fr 28px",gap:"8px",marginBottom:"8px",alignItems:"center"}}>
            <Input value={f.name} onChange={v=>setEinlFirmen(p=>p.map((x,j)=>j===i?{...x,name:v}:x))} placeholder="Firmenname"/>
            <Input value={f.email} onChange={v=>setEinlFirmen(p=>p.map((x,j)=>j===i?{...x,email:v}:x))} placeholder="E-Mail" type="email"/>
            {einlFirmen.length>1&&<span onClick={()=>setEinlFirmen(p=>p.filter((_,j)=>j!==i))} style={{color:C.red,cursor:"pointer",fontSize:"14px",textAlign:"center"}}>✕</span>}
          </div>)}
          <Btn onClick={()=>setEinlFirmen(p=>[...p,{id:Date.now(),name:"",email:""}])} variant="outline" size="sm">+ Firma</Btn>
        </Card>}

        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Vertragsbedingungen</div>
          <div style={{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"12px"}}>
            {["Offerte in CHF exkl. MwSt","Preise gelten 90 Tage","Ausführung gem. SIA-Normen und NIN","Werkvertrag nach OR Art. 363ff","SUVA-Vorschriften einhalten","Referenzliste beifügen","Zertifikate/Nachweise beifügen","Fabrikatsliste mit Offerte einreichen"].map(bed=>
              <label key={bed} style={{display:"flex",alignItems:"center",gap:"10px",cursor:"pointer",fontSize:"12px",color:C.muted}}>
                <input type="checkbox" defaultChecked={["Offerte in CHF exkl. MwSt","Ausführung gem. SIA-Normen und NIN","Werkvertrag nach OR Art. 363ff"].includes(bed)} style={{accentColor:C.gold}}/>
                {bed}
              </label>)}
          </div>
          <Field label="Weitere Bemerkungen / Eignungskriterien">
            <Textarea value={bemerkungen} onChange={setBemerkungen} placeholder="z.B. mind. 5 Jahre Erfahrung, ISO-Zertifizierung, Lokalunternehmen bevorzugt..." rows={3}/>
          </Field>
        </Card>
        <div style={{display:"flex",gap:"10px"}}>
          <Btn onClick={()=>setStep(2)} variant="outline" size="lg" style={{flex:1}}>← Zurück</Btn>
          <Btn onClick={()=>setStep(4)} variant="gold" size="lg" style={{flex:2}}>Vorschau →</Btn>
        </div>
      </div>}

      {/* ── STEP 4: Vorschau ── */}
      {step===4&&<div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"16px",padding:"20px",marginBottom:"14px"}}>
          {/* Kopf */}
          <div style={{borderBottom:`2px solid ${C.gold}`,paddingBottom:"14px",marginBottom:"16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"4px"}}>{AUSSCHREIBUNG_TYPEN.find(t=>t.id===ausTyp)?.label}</div>
                <div style={{fontSize:"17px",fontWeight:"800",color:C.main,marginBottom:"3px"}}>{titel}</div>
                <div style={{fontSize:"11px",color:C.dim}}>Projekt: {proj?.name} · {proj?.ort}</div>
              </div>
              <div style={{fontSize:"9px",color:C.dim,textAlign:"right"}}>
                <div style={{fontWeight:"700",color:C.main,marginBottom:"2px"}}>{firma.name}</div>
                <div>{firma.strasse}</div><div>{firma.plz} {firma.ort}</div>
              </div>
            </div>
          </div>

          {/* Vergabe/Fristen Info */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"16px"}}>
            {[["Vergabe",VERGABE_ARTEN.find(v=>v.id===vergabeArt)?.label],["Eingabefrist",eingabeFrist||"—"],["Ausführung",ausfBeginn?`${ausfBeginn} – ${ausfEnde}`:"—"]].map(([l,v])=>
              <div key={l} style={{background:"rgba(255,255,255,0.03)",borderRadius:"7px",padding:"7px 9px"}}>
                <div style={{fontSize:"8px",color:C.dim,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:"2px"}}>{l}</div>
                <div style={{fontSize:"10px",fontWeight:"600",color:C.main}}>{v}</div>
              </div>)}
          </div>

          {/* LV nach Gewerk */}
          {Object.entries(byGewerk).map(([gwId,positionen])=>{
            const gw=GEWERKE.find(g=>g.id===gwId);
            return <div key={gwId} style={{marginBottom:"16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"7px",padding:"7px 0",borderBottom:`2px solid ${gw?.color}44`,marginBottom:"8px"}}>
                <span style={{fontSize:"13px"}}>{gw?.icon}</span>
                <span style={{fontSize:"12px",fontWeight:"800",color:gw?.color}}>{gw?.label}</span>
                <span style={{fontSize:"9px",color:C.dim}}>BKP {gw?.bkp}</span>
              </div>
              {positionen.map((pos,i)=><div key={pos.key} style={{marginBottom:"8px",padding:"9px 0",borderBottom:`1px solid rgba(255,255,255,0.04)`}}>
                <div style={{display:"grid",gridTemplateColumns:"22px 1fr 50px 50px 80px",gap:"6px",alignItems:"flex-start",marginBottom:"4px"}}>
                  <span style={{fontSize:"10px",color:C.dim,fontWeight:"700",paddingTop:"1px"}}>{i+1}</span>
                  <div>
                    <div style={{fontSize:"12px",fontWeight:"700",color:C.main}}>{pos.bez}</div>
                    <div style={{fontSize:"9px",color:C.dim,marginTop:"1px"}}>BKP {pos.bkp}</div>
                    {ausTyp!=="funktional"&&<div style={{fontSize:"10px",color:C.dim,marginTop:"4px",lineHeight:"1.5"}}>{pos.beschrieb||pos.beschrieb}</div>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"10px",color:C.dim}}>Menge</div>
                    <div style={{fontSize:"11px",fontWeight:"600",color:C.main}}>{pos.menge}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"10px",color:C.dim}}>Einheit</div>
                    <div style={{fontSize:"11px",color:C.main}}>{pos.einheit}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"9px",color:C.dim,marginBottom:"3px"}}>CHF / Einheit</div>
                    <div style={{borderBottom:`1px solid ${C.muted}`,height:"16px",width:"75px"}}/>
                  </div>
                </div>
              </div>)}
              <div style={{display:"flex",justifyContent:"flex-end",gap:"8px",marginTop:"8px",paddingTop:"8px",borderTop:`1px solid ${C.border}`}}>
                <span style={{fontSize:"11px",color:C.dim}}>Zwischensumme {gw?.label}</span>
                <div style={{width:"80px",borderBottom:`1px solid ${C.muted}`,height:"16px"}}/>
              </div>
            </div>;
          })}

          {/* Total */}
          <div style={{padding:"12px",background:"rgba(200,169,110,0.06)",border:`1px solid rgba(200,169,110,0.2)`,borderRadius:"10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"14px",fontWeight:"800",color:C.main}}>Total exkl. MwSt</span>
            <div style={{width:"120px",borderBottom:`2px solid ${C.gold}`,height:"22px"}}/>
          </div>

          {bemerkungen&&<div style={{marginTop:"12px",padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:"8px"}}>
            <div style={{fontSize:"9px",color:C.dim,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"4px"}}>Besondere Bedingungen</div>
            <div style={{fontSize:"11px",color:C.muted,lineHeight:"1.6"}}>{bemerkungen}</div>
          </div>}
        </div>

        {vergabeArt==="einladung"&&einlFirmen.filter(f=>f.name).length>0&&<Card style={{padding:"14px",marginBottom:"14px"}}>
          <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Versand an</div>
          {einlFirmen.filter(f=>f.name).map((f,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:"12px",fontWeight:"600",color:C.main}}>{f.name}</span>
            <span style={{fontSize:"11px",color:C.blue}}>{f.email}</span>
          </div>)}
        </Card>}

        <div style={{display:"flex",gap:"10px"}}>
          <Btn onClick={()=>setStep(3)} variant="outline" size="lg" style={{flex:1}}>← Zurück</Btn>
          <Btn onClick={()=>{alert(`Ausschreibung "${titel}" mit ${checkedCount} Positionen erstellt!\n\nPDF-Export folgt mit Supabase Backend.`);onClose();}} variant="gold" size="lg" style={{flex:2}}>✓ Ausschreibung abschliessen</Btn>
        </div>
      </div>}
    </div>
  </div>;
}

function EBFRechner(){
  const {setNav}=useApp();

  const emptyRaum=()=>({id:Date.now()+Math.random(),bezeichnung:"",geschoss:"",nutzung:"wohnen",
    laenge:"",breite:"",anzahl:1,abzugKonstruktion:"",hoehe:"",notizen:""});
  const [raeume,setRaeume]=useState([emptyRaum()]);
  const [projektName,setProjektName]=useState("");
  const [projektNr,setProjektNr]=useState("");
  const [kanton,setKanton]=useState("ZH");
  const [gebaeudetyp,setGebaeudetyp]=useState("mfh");
  const [showInfo,setShowInfo]=useState(false);
  const [showDetail,setShowDetail]=useState({});
  const [activeTab,setActiveTab]=useState("ebf"); // ebf | kanton | normen

  const addRaum=()=>setRaeume(p=>[...p,emptyRaum()]);
  const delRaum=(id)=>setRaeume(p=>p.filter(r=>r.id!==id));
  const updRaum=(id,k,v)=>setRaeume(p=>p.map(r=>r.id===id?{...r,[k]:v}:r));
  const toggleDetail=(id)=>setShowDetail(p=>({...p,[id]:!p[id]}));

  const NUTZUNGEN=[
    {id:"wohnen",   label:"Wohnen (Kat. I)",           faktor:1.00,color:"#5B8FB9"},
    {id:"buero",    label:"Büro/Verwaltung (Kat. II)",  faktor:1.00,color:"#C8A96E"},
    {id:"schule",   label:"Schule/Bildung (Kat. III)",  faktor:1.00,color:"#6BAF7A"},
    {id:"gewerbe",  label:"Gewerbe (Kat. VI)",          faktor:1.00,color:"#E8735A"},
    {id:"verkauf",  label:"Verkauf (Kat. V)",           faktor:1.00,color:"#E8735A"},
    {id:"gastro",   label:"Gastronomie (Kat. VII)",     faktor:1.00,color:"#B478C8"},
    {id:"versamml", label:"Versammlung (Kat. IV)",      faktor:1.00,color:"#B478C8"},
    {id:"spital",   label:"Spital/Pflege (Kat. VIII)",  faktor:1.00,color:"#E87070"},
    {id:"industrie",label:"Industrie (Kat. IX)",        faktor:1.00,color:"#888"},
    {id:"lager",    label:"Lager/Nebenraum (unbeheizt)",faktor:0.00,color:"#555"},
    {id:"technik",  label:"Technikraum (unbeheizt)",    faktor:0.00,color:"#555"},
    {id:"garage",   label:"Garage/Einstellhalle",       faktor:0.00,color:"#555"},
    {id:"keller",   label:"Keller (unbeheizt)",         faktor:0.00,color:"#555"},
  ];

  const GESCHOSSE=["Untergeschoss","Erdgeschoss","1. Obergeschoss","2. Obergeschoss","3. Obergeschoss","Dachgeschoss"];

  const calcRaum=(r)=>{
    const l=parseFloat(r.laenge)||0;
    const b=parseFloat(r.breite)||0;
    const anz=parseFloat(r.anzahl)||1;
    const abzug=parseFloat(r.abzugKonstruktion)||0;
    const bruttoflaeche=l*b;
    const nettoflaeche=Math.max(0,bruttoflaeche-abzug);
    const nutz=NUTZUNGEN.find(n=>n.id===r.nutzung)||NUTZUNGEN[0];
    return {bruttoflaeche,nettoflaeche,ebf:nettoflaeche*nutz.faktor*anz,faktor:nutz.faktor,anz};
  };

  const totals=raeume.reduce((acc,r)=>{const c=calcRaum(r);return{brutto:acc.brutto+c.bruttoflaeche*c.anz,netto:acc.netto+c.nettoflaeche*c.anz,ebf:acc.ebf+c.ebf}},{brutto:0,netto:0,ebf:0});

  const byNutzung={};
  raeume.forEach(r=>{const c=calcRaum(r);if(!byNutzung[r.nutzung])byNutzung[r.nutzung]={ebf:0,brutto:0};byNutzung[r.nutzung].ebf+=c.ebf;byNutzung[r.nutzung].brutto+=c.bruttoflaeche*c.anz;});

  // PV Berechnung
  const kt=KANTONE_EBF[kanton]||KANTONE_EBF["ZH"];
  const pvKwp=totals.ebf>0?(totals.ebf*kt.pvWpM2/1000):0;
  const pvLimit=kt.pvLimit;
  const pvKwpEffektiv=pvLimit?Math.min(pvKwp,pvLimit):pvKwp;
  const pvUeberschreitetLimit=pvLimit&&pvKwp>pvLimit;

  const fmtM2=(v)=>v>0?`${v.toFixed(2)} m²`:"—";
  const fmtKwp=(v)=>v>0?`${v.toFixed(2)} kWp`:"—";

  const sInp={background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,
    borderRadius:"8px",padding:"8px 11px",color:C.main,fontSize:"13px",outline:"none",width:"100%"};
  const sTab=(active)=>({padding:"8px 14px",cursor:"pointer",borderRadius:"8px",fontSize:"12px",
    fontWeight:"700",border:`1px solid ${active?C.gold:C.border}`,
    background:active?"rgba(200,169,110,0.12)":"transparent",color:active?C.gold:C.muted,
    whiteSpace:"nowrap"});

  return <div style={{minHeight:"100vh",background:C.dark}}>
    <PageHeader title="EBF Rechner" subtitle="SIA 380 · MuKEn · Kantonale Vorschriften"/>

    <div style={{padding:"14px",maxWidth:"720px",margin:"0 auto",paddingBottom:"100px"}}>

      {/* TABS */}
      <div style={{display:"flex",gap:"8px",marginBottom:"16px",overflowX:"auto",paddingBottom:"4px"}}>
        {[["ebf","📐 EBF Berechnung"],["kanton","🗺 Kanton & PV-Pflicht"],["normen","📋 Normen & Gesetze"]].map(([id,l])=>
          <div key={id} style={sTab(activeTab===id)} onClick={()=>setActiveTab(id)}>{l}</div>)}
      </div>

      {/* ── TAB 1: EBF BERECHNUNG ── */}
      {activeTab==="ebf"&&<div>
        {/* Info */}
        <div style={{background:"rgba(200,169,110,0.08)",border:"1px solid rgba(200,169,110,0.2)",borderRadius:"12px",padding:"12px 14px",marginBottom:"14px",cursor:"pointer"}} onClick={()=>setShowInfo(!showInfo)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:C.gold}}>📐 Was ist die EBF? (SIA 380:2015)</span>
            <span style={{color:C.gold,fontSize:"12px"}}>{showInfo?"▲":"▼"}</span>
          </div>
          {showInfo&&<div style={{marginTop:"10px",fontSize:"11px",color:C.muted,lineHeight:"1.7"}}>
            <b style={{color:C.main}}>Energiebezugsfläche (EBF)</b> = Summe aller beheizten Geschossflächen (SIA 380:2015 Art. 3.1.3). Basis für Heizwärmebedarf, Warmwasser, Primärenergie, Minergie, GEAK, MuKEn-Nachweise, kantonale PV-Pflicht.<br/>
            <b style={{color:C.main}}>Zählt zur EBF:</b> Wohnungen, Büros, Schulräume, beheizte Treppenhäuser und Korridore.<br/>
            <b style={{color:C.main}}>Nicht zur EBF:</b> Unbeheizte Keller, Garagen, Technikräume, Balkone, Terrassen.
          </div>}
        </div>

        {/* Projektdaten */}
        <Card style={{padding:"14px",marginBottom:"12px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Projektdaten</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
            <Field label="Projektname / Bezeichnung">
              <input style={sInp} placeholder="z.B. MFH Kirchgasse, Winterthur" value={projektName} onChange={e=>setProjektName(e.target.value)}/>
            </Field>
            <Field label="Kanton (für PV-Pflicht & Normen)">
              <select style={sInp} value={kanton} onChange={e=>setKanton(e.target.value)}>
                {Object.entries(KANTONE_EBF).map(([k,v])=><option key={k} value={k} style={{background:"#1a1a18"}}>{v.name} ({k})</option>)}
              </select>
            </Field>
          </div>
        </Card>

        {/* Räume */}
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Räume / Zonen ({raeume.length} Einträge)</div>

        {raeume.map((r,idx)=>{
          const calc=calcRaum(r);
          const nutz=NUTZUNGEN.find(n=>n.id===r.nutzung)||NUTZUNGEN[0];
          const isOpen=showDetail[r.id];
          return <div key={r.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",marginBottom:"10px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <div style={{width:"22px",height:"22px",borderRadius:"6px",background:`${nutz.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"800",color:nutz.color,flexShrink:0}}>{idx+1}</div>
                <div style={{fontSize:"12px",fontWeight:"700",color:r.bezeichnung?C.main:C.dim}}>{r.bezeichnung||"Raum / Zone — Bezeichnung eingeben"}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                {calc.ebf>0&&<div style={{textAlign:"right"}}>
                  <div style={{fontSize:"14px",fontWeight:"800",color:nutz.faktor>0?C.gold:C.dim}}>{fmtM2(calc.ebf)}</div>
                  <div style={{fontSize:"9px",color:C.dim}}>EBF</div>
                </div>}
                <span onClick={()=>toggleDetail(r.id)} style={{color:C.dim,cursor:"pointer",fontSize:"15px",padding:"2px 5px"}}>{isOpen?"▲":"▼"}</span>
                {raeume.length>1&&<span onClick={()=>delRaum(r.id)} style={{color:C.red,cursor:"pointer",fontSize:"14px"}}>✕</span>}
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:"8px",marginBottom:"8px"}}>
              <Field label="Bezeichnung Raum / Zone">
                <input style={sInp} placeholder="z.B. Wohnung 1.1 (3.5 Zi.) · Treppenhaus EG · Büro 2.OG" value={r.bezeichnung} onChange={e=>updRaum(r.id,"bezeichnung",e.target.value)}/>
              </Field>
              <Field label="Geschoss">
                <select style={sInp} value={r.geschoss} onChange={e=>updRaum(r.id,"geschoss",e.target.value)}>
                  <option value="" style={{background:"#1a1a18"}}>— wählen —</option>
                  {GESCHOSSE.map(g=><option key={g} value={g} style={{background:"#1a1a18"}}>{g}</option>)}
                </select>
              </Field>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 70px",gap:"8px",marginBottom:"8px"}}>
              <Field label="Länge (m) — Innenmass">
                <input style={sInp} placeholder="z.B. 12.50" type="number" value={r.laenge} onChange={e=>updRaum(r.id,"laenge",e.target.value)}/>
              </Field>
              <Field label="Breite (m) — Innenmass">
                <input style={sInp} placeholder="z.B. 8.40" type="number" value={r.breite} onChange={e=>updRaum(r.id,"breite",e.target.value)}/>
              </Field>
              <Field label="Nutzung / SIA-Kategorie">
                <select style={sInp} value={r.nutzung} onChange={e=>updRaum(r.id,"nutzung",e.target.value)}>
                  {NUTZUNGEN.map(n=><option key={n.id} value={n.id} style={{background:"#1a1a18"}}>{n.label}{n.faktor===0?" ✗":""}</option>)}
                </select>
              </Field>
              <Field label="Anzahl">
                <input style={sInp} placeholder="1" type="number" min="1" value={r.anzahl} onChange={e=>updRaum(r.id,"anzahl",e.target.value)}/>
              </Field>
            </div>

            <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
              <span style={{fontSize:"10px",fontWeight:"700",color:nutz.color,background:`${nutz.color}18`,padding:"2px 9px",borderRadius:"10px"}}>{nutz.label} · f={nutz.faktor}</span>
              {nutz.faktor===0&&<span style={{fontSize:"10px",color:C.dim}}>⚠ Zählt NICHT zur EBF</span>}
              {calc.bruttoflaeche>0&&<span style={{fontSize:"10px",color:C.dim,marginLeft:"auto"}}>{calc.anzahl>1?`${calc.anzahl}× `:""}{fmtM2(calc.bruttoflaeche)} brutto{parseFloat(r.abzugKonstruktion)>0?` − ${r.abzugKonstruktion} m² = ${fmtM2(calc.nettoflaeche)} netto`:""} = <b style={{color:nutz.faktor>0?C.gold:C.dim}}>{fmtM2(calc.ebf)} EBF</b></span>}
            </div>

            {isOpen&&<div style={{borderTop:`1px solid ${C.border}`,paddingTop:"10px",marginTop:"10px"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                <Field label="Raumhöhe (m) — lichte Höhe fertig">
                  <input style={sInp} placeholder="z.B. 2.60 m" type="number" value={r.hoehe} onChange={e=>updRaum(r.id,"hoehe",e.target.value)}/>
                </Field>
                <Field label="Abzug Konstruktion (m²) — Stützen, Wände">
                  <input style={sInp} placeholder="z.B. 2.50 (Wanddicken, Stützen, Schächte)" type="number" value={r.abzugKonstruktion} onChange={e=>updRaum(r.id,"abzugKonstruktion",e.target.value)}/>
                </Field>
              </div>
              <Field label="Notizen / Besonderheiten" style={{marginTop:"8px"}}>
                <input style={sInp} placeholder="z.B. Dachschräge ab H=1.0m · Nicht beheizter Bereich · Gemäss Grundriss EG" value={r.notizen} onChange={e=>updRaum(r.id,"notizen",e.target.value)}/>
              </Field>
            </div>}
          </div>;
        })}

        <Btn onClick={addRaum} variant="outline" size="sm" full style={{marginBottom:"16px"}}>+ Raum / Zone hinzufügen</Btn>

        {/* RESULTAT */}
        {totals.ebf>0&&<div>
          <Card style={{padding:"16px",marginBottom:"14px",background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.25)"}}>
            <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Resultat EBF</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
              {[["Brutto","Alle Flächen",fmtM2(totals.brutto),C.dim],["Netto","nach Abzug Konstr.",fmtM2(totals.netto),C.muted],["EBF Total","SIA 380:2015",fmtM2(totals.ebf),C.gold]].map(([l,sub,v,c])=>
                <div key={l} style={{background:"rgba(255,255,255,0.04)",borderRadius:"10px",padding:"12px",textAlign:"center"}}>
                  <div style={{fontSize:"9px",color:C.dim,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"2px"}}>{l}</div>
                  <div style={{fontSize:"18px",fontWeight:"800",color:c,marginBottom:"2px"}}>{v}</div>
                  <div style={{fontSize:"9px",color:C.dim}}>{sub}</div>
                </div>)}
            </div>

            {/* PV Pflicht Resultat */}
            <div style={{background:"rgba(255,255,255,0.04)",border:`2px solid ${pvUeberschreitetLimit?C.green:C.gold}`,borderRadius:"12px",padding:"14px",marginBottom:"10px"}}>
              <div style={{fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"8px"}}>⚡ PV-Pflicht — Kanton {kt.name}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
                <div style={{textAlign:"center",background:"rgba(200,169,110,0.08)",borderRadius:"8px",padding:"10px"}}>
                  <div style={{fontSize:"11px",color:C.dim,marginBottom:"4px"}}>Faktor</div>
                  <div style={{fontSize:"22px",fontWeight:"900",color:C.gold}}>{kt.pvWpM2} <span style={{fontSize:"12px"}}>Wp/m²</span></div>
                  <div style={{fontSize:"9px",color:C.dim}}>× EBF</div>
                </div>
                <div style={{textAlign:"center",background:"rgba(200,169,110,0.08)",borderRadius:"8px",padding:"10px"}}>
                  <div style={{fontSize:"11px",color:C.dim,marginBottom:"4px"}}>Mindest-PV</div>
                  <div style={{fontSize:"22px",fontWeight:"900",color:C.gold}}>{fmtKwp(pvKwpEffektiv)}</div>
                  {pvUeberschreitetLimit&&<div style={{fontSize:"9px",color:C.green}}>Limit {pvLimit} kW → {fmtKwp(pvKwpEffektiv)}</div>}
                </div>
              </div>
              <div style={{fontSize:"10px",color:C.dim,lineHeight:"1.6",padding:"8px 10px",background:"rgba(255,255,255,0.03)",borderRadius:"8px"}}>
                <b style={{color:C.muted}}>Rechnung:</b> {fmtM2(totals.ebf)} EBF × {kt.pvWpM2} Wp/m² = <b style={{color:C.gold}}>{fmtKwp(pvKwp)}</b>
                {pvUeberschreitetLimit&&<> → limitiert auf <b style={{color:C.green}}>{pvLimit} kWp</b> (kant. Obergrenze)</>}<br/>
                <b style={{color:C.muted}}>Grundlage:</b> {kt.pvRegel}
              </div>
              {totals.ebf<300&&kt.pvMinFlaeche>0&&<div style={{marginTop:"8px",padding:"7px 10px",background:"rgba(232,115,90,0.1)",border:"1px solid rgba(232,115,90,0.3)",borderRadius:"8px"}}>
                <span style={{fontSize:"10px",color:"#E8735A"}}>⚠ EBF {fmtM2(totals.ebf)} unter Mindestgrösse {kt.pvMinFlaeche} m² → PV-Pflicht möglicherweise nicht anwendbar. Kantonale Vorschriften prüfen.</span>
              </div>}
            </div>

            {/* Vergleich alle Kantone quick */}
            <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"6px"}}>Vergleich: PV-Pflicht 20 Wp/m² Kantone</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"10px"}}>
              {Object.entries(KANTONE_EBF).filter(([k,v])=>v.pvWpM2===20).map(([k,v])=>
                <span key={k} onClick={()=>setKanton(k)} style={{fontSize:"10px",fontWeight:"700",color:"#E8735A",background:"rgba(232,115,90,0.12)",padding:"2px 8px",borderRadius:"5px",cursor:"pointer",border:`1px solid ${kanton===k?"#E8735A":"transparent"}`}}>{v.name} 20Wp</span>)}
              <span style={{fontSize:"10px",color:C.dim,padding:"2px 8px"}}>Restliche Kantone: 10 Wp/m²</span>
            </div>

            {/* Weitere EBF-Kennwerte */}
            <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"6px"}}>Orientierungswerte (EBF = {fmtM2(totals.ebf)})</div>
            {[
              ["Heizwärmebedarf Grenzwert MFH (SIA 380/1)","≤ 35 kWh/m² EBF·a",`= max. ${Math.round(totals.ebf*35).toLocaleString("de-CH")} kWh/a Heizenergie`],
              ["Heizwärmebedarf Minergie MFH","≤ 33 kWh/m² EBF·a",`= max. ${Math.round(totals.ebf*33).toLocaleString("de-CH")} kWh/a`],
              ["Gesamtenergie Minergie","≤ 60 kWh/m² EBF·a",`= max. ${Math.round(totals.ebf*60).toLocaleString("de-CH")} kWh/a`],
              ["Spez. Heizleistung MuKEn (Dimensionierung)","≤ 20 W/m² EBF",`= max. ${Math.round(totals.ebf*20/1000*10)/10} kW Heizanlage`],
              ["Kantonale PV-Pflicht",`${kt.pvWpM2} Wp/m² EBF`,fmtKwp(pvKwpEffektiv)],
            ].map(([l,v,calc])=><div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
              <div style={{flex:1}}>
                <div style={{fontSize:"10px",color:C.muted}}>{l}</div>
                <div style={{fontSize:"9px",color:C.dim}}>{calc}</div>
              </div>
              <span style={{fontSize:"10px",fontWeight:"700",color:C.gold,marginLeft:"10px",flexShrink:0}}>{v}</span>
            </div>)}
          </Card>

          {/* Protokoll */}
          <Card style={{padding:"14px",marginBottom:"14px"}}>
            <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Berechnungsprotokoll</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:"10px"}}>
                <thead><tr>{["Nr","Bezeichnung","Geschoss","Nutzung","L×B","Anz.","Brutto","EBF"].map(h=><th key={h} style={{padding:"5px 7px",textAlign:"left",color:C.dim,fontWeight:"700",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
                <tbody>{raeume.map((r,i)=>{
                  const c=calcRaum(r);const nutz=NUTZUNGEN.find(n=>n.id===r.nutzung)||NUTZUNGEN[0];
                  return <tr key={r.id} style={{borderBottom:`1px solid ${C.border}`,background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                    <td style={{padding:"4px 7px",color:C.dim,fontWeight:"700"}}>{i+1}</td>
                    <td style={{padding:"4px 7px",color:C.main,fontWeight:"600"}}>{r.bezeichnung||"—"}</td>
                    <td style={{padding:"4px 7px",color:C.dim}}>{r.geschoss||"—"}</td>
                    <td style={{padding:"4px 7px"}}><span style={{color:nutz.color,fontSize:"9px",background:`${nutz.color}15`,padding:"1px 5px",borderRadius:"3px"}}>{nutz.label.split(" (")[0]}</span></td>
                    <td style={{padding:"4px 7px",color:C.dim,fontFamily:"monospace",fontSize:"9px"}}>{r.laenge||"—"}×{r.breite||"—"}</td>
                    <td style={{padding:"4px 7px",color:C.dim,textAlign:"center"}}>{r.anzahl||1}</td>
                    <td style={{padding:"4px 7px",color:C.muted,textAlign:"right"}}>{c.bruttoflaeche>0?fmtM2(c.bruttoflaeche*c.anz):"—"}</td>
                    <td style={{padding:"4px 7px",fontWeight:"800",textAlign:"right",color:nutz.faktor>0?C.gold:C.dim}}>{c.ebf>0?fmtM2(c.ebf):"—"}</td>
                  </tr>;})}
                  <tr style={{background:"rgba(200,169,110,0.08)",borderTop:`2px solid ${C.gold}`}}>
                    <td colSpan="6" style={{padding:"6px 7px",fontWeight:"800",color:C.gold}}>TOTAL EBF</td>
                    <td style={{padding:"6px 7px",fontWeight:"700",color:C.muted,textAlign:"right"}}>{fmtM2(totals.brutto)}</td>
                    <td style={{padding:"6px 7px",fontWeight:"800",color:C.gold,textAlign:"right",fontSize:"12px"}}>{fmtM2(totals.ebf)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div style={{marginTop:"8px",fontSize:"9px",color:C.dim}}>SIA 380:2015 · Datum: {new Date().toLocaleDateString("de-CH")}{projektName?` · ${projektName}`:""}</div>
          </Card>
        </div>}
      </div>}

      {/* ── TAB 2: KANTON & PV ── */}
      {activeTab==="kanton"&&<div>
        <Card style={{padding:"14px",marginBottom:"14px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Kanton wählen</div>
          <select style={{...sInp,marginBottom:"12px",fontSize:"14px",fontWeight:"700"}} value={kanton} onChange={e=>setKanton(e.target.value)}>
            {Object.entries(KANTONE_EBF).map(([k,v])=><option key={k} value={k} style={{background:"#1a1a18"}}>{v.name} ({k}) — {v.pvWpM2} Wp/m² EBF</option>)}
          </select>

          {/* PV Pflicht Kanton */}
          <div style={{background:"rgba(200,169,110,0.08)",border:"2px solid rgba(200,169,110,0.3)",borderRadius:"12px",padding:"14px",marginBottom:"12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
              <div>
                <div style={{fontSize:"16px",fontWeight:"900",color:C.gold}}>{kt.pvWpM2} Wp/m² EBF</div>
                <div style={{fontSize:"11px",color:C.dim}}>PV-Mindestleistung</div>
              </div>
              <div style={{textAlign:"right"}}>
                {kt.pvLimit&&<div style={{fontSize:"11px",color:C.green}}>Max. {kt.pvLimit} kWp</div>}
                {kt.pvMinFlaeche>0?<div style={{fontSize:"11px",color:C.dim}}>Ab {kt.pvMinFlaeche} m² EBF</div>:<div style={{fontSize:"11px",color:"#E8735A",fontWeight:"700"}}>Alle Neubauten</div>}
              </div>
            </div>
            <div style={{fontSize:"10px",color:C.muted,lineHeight:"1.6",padding:"8px 10px",background:"rgba(255,255,255,0.03)",borderRadius:"8px",marginBottom:"10px"}}>{kt.pvRegel}</div>
            {totals.ebf>0&&<div style={{padding:"10px 12px",background:"rgba(200,169,110,0.06)",borderRadius:"8px"}}>
              <div style={{fontSize:"10px",color:C.dim,marginBottom:"4px"}}>Mit Ihrer EBF von {fmtM2(totals.ebf)}:</div>
              <div style={{fontSize:"16px",fontWeight:"900",color:C.gold}}>mind. {fmtKwp(pvKwpEffektiv)} PV installieren</div>
              {pvUeberschreitetLimit&&<div style={{fontSize:"10px",color:C.green}}>Rechnerisch {fmtKwp(pvKwp)} → limitiert auf {pvLimit} kWp</div>}
            </div>}
          </div>

          {/* Alle kantonalen Vorschriften */}
          <div style={{fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"8px"}}>Kantonale Vorschriften — was zu beachten ist</div>
          {kt.vorschriften.map((v,i)=>{
            const col=KAT_COLORS[v.kat]||C.muted;
            return <div key={i} style={{padding:"10px 12px",borderRadius:"10px",marginBottom:"8px",background:"rgba(255,255,255,0.02)",border:`1px solid ${v.pflicht?col+"44":"rgba(255,255,255,0.06)"}`}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px"}}>
                <span style={{fontSize:"9px",fontWeight:"700",color:col,background:`${col}18`,padding:"2px 7px",borderRadius:"4px"}}>{v.kat}</span>
                <span style={{fontSize:"12px",fontWeight:"700",color:v.pflicht?C.main:C.muted}}>{v.titel}</span>
                <span style={{marginLeft:"auto",fontSize:"9px",fontWeight:"700",color:v.pflicht?"#E8735A":C.dim,background:v.pflicht?"rgba(232,115,90,0.12)":"rgba(255,255,255,0.05)",padding:"2px 7px",borderRadius:"4px"}}>
                  {v.pflicht?"PFLICHT":"EMPFEHLUNG"}
                </span>
              </div>
              <div style={{fontSize:"10px",color:C.dim,lineHeight:"1.6"}}>{v.text}</div>
            </div>;
          })}
        </Card>

        {/* Übersicht alle Kantone */}
        <Card style={{padding:"14px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Übersicht alle 26 Kantone — PV-Pflicht</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"10px"}}>
              <thead><tr>{["Kanton","Wp/m² EBF","Obergrenze","Mind. EBF","Besonderheit"].map(h=><th key={h} style={{padding:"5px 8px",textAlign:"left",color:C.dim,fontWeight:"700",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
              <tbody>{Object.entries(KANTONE_EBF).map(([k,v],i)=>{
                const isSelected=k===kanton;
                const is20=v.pvWpM2===20;
                return <tr key={k} onClick={()=>setKanton(k)} style={{borderBottom:`1px solid ${C.border}`,background:isSelected?"rgba(200,169,110,0.08)":i%2===0?"rgba(255,255,255,0.02)":"transparent",cursor:"pointer"}}>
                  <td style={{padding:"5px 8px",fontWeight:"700",color:isSelected?C.gold:C.main}}>{v.name}</td>
                  <td style={{padding:"5px 8px"}}>
                    <span style={{fontWeight:"900",color:is20?"#E8735A":C.muted,fontSize:"12px"}}>{v.pvWpM2}</span>
                    <span style={{color:C.dim,fontSize:"9px"}}> Wp/m²</span>
                    {totals.ebf>0&&<div style={{fontSize:"9px",color:C.dim}}>→ {fmtKwp(Math.min(v.pvWpM2*totals.ebf/1000,v.pvLimit||99999))}</div>}
                  </td>
                  <td style={{padding:"5px 8px",color:v.pvLimit?C.green:C.dim}}>{v.pvLimit?`${v.pvLimit} kWp`:"—"}</td>
                  <td style={{padding:"5px 8px",color:v.pvMinFlaeche>0?C.dim:"#E8735A",fontSize:"9px"}}>{v.pvMinFlaeche>0?`${v.pvMinFlaeche} m²`:"Alle"}</td>
                  <td style={{padding:"5px 8px",color:C.dim,fontSize:"9px"}}>{is20?"⚡ verschärft":""}{v.pvMinFlaeche===0&&!is20?"alle Neubauten":""}</td>
                </tr>;})}
              </tbody>
            </table>
          </div>
        </Card>
      </div>}

      {/* ── TAB 3: NORMEN & GESETZE ── */}
      {activeTab==="normen"&&<div>
        <div style={{padding:"10px 14px",background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:"12px",marginBottom:"14px"}}>
          <div style={{fontSize:"11px",color:C.muted,lineHeight:"1.6"}}>
            Alle nachfolgenden Vorschriften verwenden die <b style={{color:C.gold}}>EBF als Bezugsgrösse</b>. Sie gelten schweizweit (Bund/MuKEn) oder kantonsspezifisch. Stand: März 2026.
          </div>
        </div>

        {/* Bundesvorschriften */}
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Bundesvorschriften & SIA-Normen — gelten in allen Kantonen</div>
        {BUNDESVORSCHRIFTEN.map((v,i)=>{
          const col=KAT_COLORS[v.kat]||C.muted;
          return <div key={i} style={{padding:"12px 14px",borderRadius:"10px",marginBottom:"8px",background:"rgba(255,255,255,0.02)",border:`1px solid ${v.pflicht?col+"44":"rgba(255,255,255,0.06)"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px",flexWrap:"wrap"}}>
              <span style={{fontSize:"9px",fontWeight:"700",color:col,background:`${col}18`,padding:"2px 7px",borderRadius:"4px"}}>{v.kat}</span>
              <span style={{fontSize:"12px",fontWeight:"700",color:v.pflicht?C.main:C.muted}}>{v.titel}</span>
              <span style={{marginLeft:"auto",fontSize:"9px",fontWeight:"700",color:v.pflicht?"#E8735A":C.dim,background:v.pflicht?"rgba(232,115,90,0.12)":"rgba(255,255,255,0.05)",padding:"2px 7px",borderRadius:"4px"}}>
                {v.pflicht?"PFLICHT":"EMPFEHLUNG"}
              </span>
            </div>
            <div style={{fontSize:"10px",color:C.dim,lineHeight:"1.6"}}>{v.text}</div>
            {totals.ebf>0&&v.titel.includes("Heizwärme")&&v.kat==="SIA"&&<div style={{marginTop:"6px",padding:"6px 10px",background:"rgba(200,169,110,0.06)",borderRadius:"6px",fontSize:"10px",color:C.muted}}>
              Mit Ihrer EBF {fmtM2(totals.ebf)}: max. <b style={{color:C.gold}}>{Math.round(totals.ebf*35).toLocaleString("de-CH")} kWh/a</b> Heizenergie (Grenzwert MFH)
            </div>}
            {totals.ebf>0&&v.titel.includes("Heizleistung")&&<div style={{marginTop:"6px",padding:"6px 10px",background:"rgba(200,169,110,0.06)",borderRadius:"6px",fontSize:"10px",color:C.muted}}>
              Mit Ihrer EBF {fmtM2(totals.ebf)}: Heizanlage max. <b style={{color:C.gold}}>{Math.round(totals.ebf*20/100)/10} kW</b> Nennleistung
            </div>}
          </div>;
        })}

        {/* Kantonale Vorschriften */}
        <div style={{fontSize:"9px",fontWeight:"700",color:C.blue,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px",marginTop:"16px"}}>Kanton {kt.name} — spezifische Vorschriften</div>
        {kt.vorschriften.map((v,i)=>{
          const col=KAT_COLORS[v.kat]||C.muted;
          return <div key={i} style={{padding:"12px 14px",borderRadius:"10px",marginBottom:"8px",background:"rgba(91,143,185,0.04)",border:`1px solid ${v.pflicht?col+"44":"rgba(91,143,185,0.1)"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"5px",flexWrap:"wrap"}}>
              <span style={{fontSize:"9px",fontWeight:"700",color:col,background:`${col}18`,padding:"2px 7px",borderRadius:"4px"}}>{v.kat}</span>
              <span style={{fontSize:"12px",fontWeight:"700",color:v.pflicht?C.main:C.muted}}>{v.titel}</span>
              <span style={{marginLeft:"auto",fontSize:"9px",fontWeight:"700",color:v.pflicht?"#E8735A":C.green,background:v.pflicht?"rgba(232,115,90,0.12)":"rgba(107,175,122,0.12)",padding:"2px 7px",borderRadius:"4px"}}>
                {v.pflicht?"PFLICHT":"EMPFEHLUNG"}
              </span>
            </div>
            <div style={{fontSize:"10px",color:C.dim,lineHeight:"1.6"}}>{v.text}</div>
          </div>;
        })}

        <div style={{marginTop:"12px",padding:"10px 14px",background:"rgba(255,255,255,0.02)",borderRadius:"10px"}}>
          <div style={{fontSize:"9px",color:C.dim,lineHeight:"1.5"}}>
            ⚠ <b style={{color:C.muted}}>Haftungsausschluss:</b> Diese Übersicht dient als Orientierungshilfe. Massgebend sind stets die aktuell gültigen kantonalen Energiegesetze und -verordnungen. Für rechtsverbindliche Auskünfte kantonale Energiefachstelle kontaktieren.
          </div>
        </div>
      </div>}

    </div>
  </div>;
}

// ─── Badge ───────────────────────────────────────────────────────────────

// ─── Positions Editor ─────────────────────────────────────────────────────
function NtPosEditor({pos,onChange}){
  const add=()=>onChange([...(pos||[]),{id:'p'+Date.now(),beschrieb:'',menge:'',einheit:'m²',ep:''}]);
  const del=id=>onChange((pos||[]).filter(p=>p.id!==id));
  const upd=(id,k,v)=>onChange((pos||[]).map(p=>p.id===id?{...p,[k]:v}:p));
  const total=(pos||[]).reduce((s,p)=>(parseFloat(p.menge)||0)*(parseFloat(p.ep)||0)+s,0);
  const cell={background:'none',border:'none',color:'#FFF',padding:'8px 10px',fontSize:'13px',outline:'none',width:'100%',fontFamily:'inherit'};
  return <div>
    <div style={{background:'rgba(255,255,255,.03)',border:`1px solid ${C.border}`,borderRadius:'10px',overflow:'hidden'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 80px 70px 95px 30px',background:'rgba(200,169,110,.06)',borderBottom:`1px solid ${C.border}`}}>
        {['Beschrieb','Menge','Einheit','EP (CHF)',''].map(h=><div key={h} style={{padding:'6px 10px',fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.05em'}}>{h}</div>)}
      </div>
      {(pos||[]).map((p,i)=><div key={p.id} style={{display:'grid',gridTemplateColumns:'1fr 80px 70px 95px 30px',borderBottom:i<(pos||[]).length-1?`1px solid rgba(255,255,255,.04)`:'none'}}>
        <input value={p.beschrieb} onChange={e=>upd(p.id,'beschrieb',e.target.value)} placeholder="Beschrieb…" style={{...cell,borderRight:`1px solid rgba(255,255,255,.04)`}}/>
        <input type="number" value={p.menge} onChange={e=>upd(p.id,'menge',e.target.value)} placeholder="0" style={{...cell,textAlign:'right',borderRight:`1px solid rgba(255,255,255,.04)`}}/>
        <input value={p.einheit} onChange={e=>upd(p.id,'einheit',e.target.value)} placeholder="m²" style={{...cell,textAlign:'center',borderRight:`1px solid rgba(255,255,255,.04)`}}/>
        <input type="number" value={p.ep} onChange={e=>upd(p.id,'ep',e.target.value)} placeholder="0.00" step="0.01" style={{...cell,textAlign:'right',borderRight:`1px solid rgba(255,255,255,.04)`}}/>
        <button onClick={()=>del(p.id)} style={{background:'none',border:'none',color:C.dim,cursor:'pointer',fontSize:'15px'}}>✕</button>
      </div>)}
    </div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'8px'}}>
      <Btn onClick={add} variant="ghost" size="sm">＋ Position</Btn>
      <div style={{fontFamily:'monospace',fontSize:'13px'}}>
        <span style={{color:C.dim}}>Netto: </span>
        <span style={{color:total<0?C.red:C.gold,fontWeight:'700',fontSize:'15px'}}> CHF {nt_fmtChf(total)}</span>
      </div>
    </div>
  </div>;
}

// ─── Form ─────────────────────────────────────────────────────────────────
function NtForm({init,count,onSave,onCancel}){
  const blank={nr:'NT-'+String(count+1).padStart(3,'0'),datum:NT_ISO(),titel:'',projekt:'',unternehmer:'',gew:'',art:'zusatz',beschrieb:'',mwst:'8.1',frist:'0',notiz:''};
  const [f,setF]=useState(init?{...init,mwst:String(init.mwst),frist:String(init.frist||0)}:blank);
  const [pos,setPos]=useState(init?.pos||[{id:'p1',beschrieb:'',menge:'',einheit:'m²',ep:''},{id:'p2',beschrieb:'',menge:'',einheit:'m²',ep:''}]);
  const [err,setErr]=useState({});
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  const save=()=>{
    const e={};
    if(!f.titel.trim())e.titel='Pflichtfeld';
    if(!f.nr.trim())e.nr='Pflichtfeld';
    setErr(e);
    if(Object.keys(e).length)return;
    const cleanPos=(pos||[]).filter(p=>p.beschrieb||p.menge||p.ep).map(p=>({...p,menge:parseFloat(p.menge)||0,ep:parseFloat(p.ep)||0}));
    onSave({...f,id:init?.id||('nt'+Date.now()),pos:cleanPos,mwst:parseFloat(f.mwst)||8.1,frist:parseInt(f.frist)||0,
      status:init?.status||'offen',
      verlauf:init?[...(init.verlauf||[]),{d:NT_ISO(),t:'Bearbeitet'}]:[{d:NT_ISO(),t:'Erstellt'}]});
  };

  return <div style={{background:C.card,border:`1px solid ${C.gold}55`,borderRadius:'14px',padding:'20px',marginBottom:'16px'}}>
    <div style={{fontSize:'15px',color:C.gold,fontWeight:'700',marginBottom:'14px'}}>
      {init?'✏ Nachtrag bearbeiten':'＋ Neuer Nachtrag — SIA 118 Art. 84–91'}
    </div>
    {/* Info box */}
    <div style={{background:'rgba(200,169,110,.06)',border:'1px solid rgba(200,169,110,.14)',borderRadius:'8px',padding:'9px 13px',marginBottom:'14px',fontSize:'12px',color:'#B09050',lineHeight:'1.55'}}>
      <b style={{color:C.gold}}>Art. 84</b> Bauherr kann Leistungen ändern solange Gesamtcharakter unberührt. <b style={{color:C.gold}}>Art. 87</b> Nachtragspreis auf Basis der ursprünglichen Kostengrundlage.
    </div>
    {/* Fields Row 1 */}
    <div style={{display:'grid',gridTemplateColumns:'120px 1fr',gap:'10px',marginBottom:'10px'}}>
      <Field label="Nr. *" error={err.nr}><Input value={f.nr} onChange={v=>upd('nr',v)} placeholder="NT-001"/></Field>
      <Field label="Titel *" error={err.titel}><Input value={f.titel} onChange={v=>upd('titel',v)} placeholder="Kurzbeschrieb des Nachtrags"/></Field>
    </div>
    {/* Fields Row 2 */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'10px'}}>
      <Field label="Datum"><input type="date" value={f.datum} onChange={e=>upd('datum',e.target.value)} style={{...sBase,fontSize:'14px'}}/></Field>
      <Field label="Art der Bestellungsänderung">
        <select value={f.art} onChange={e=>upd('art',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
          {NT_ARTS.map(a=><option key={a.v} value={a.v}>{a.l}</option>)}
        </select>
      </Field>
      <Field label="Projekt"><Input value={f.projekt} onChange={v=>upd('projekt',v)} placeholder="Projektname"/></Field>
      <Field label="Unternehmer"><Input value={f.unternehmer} onChange={v=>upd('unternehmer',v)} placeholder="Firma AG"/></Field>
      <Field label="Gewerk">
        <select value={f.gew} onChange={e=>upd('gew',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
          <option value="">— wählen —</option>
          {NT_GEW.map(g=><option key={g} value={g}>{g}</option>)}
        </select>
      </Field>
      <Field label="Frist (Tage)"><Input type="number" value={f.frist} onChange={v=>upd('frist',v)} placeholder="0"/></Field>
    </div>
    <Field label="Begründung" style={{marginBottom:'10px'}}>
      <Textarea value={f.beschrieb} onChange={v=>upd('beschrieb',v)} placeholder="Warum entstand dieser Nachtrag?"/>
    </Field>
    {/* Positions */}
    <div style={{marginBottom:'12px'}}>
      <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'7px'}}>Positionen (SIA 118 Art. 87)</div>
      <NtPosEditor pos={pos} onChange={setPos}/>
    </div>
    {/* MWST + Note */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:'10px',marginBottom:'14px'}}>
      <Field label="MWST %"><Input type="number" value={f.mwst} onChange={v=>upd('mwst',v)} placeholder="8.1"/></Field>
      <Field label="Notiz intern"><Input value={f.notiz} onChange={v=>upd('notiz',v)} placeholder="z.B. Angebot liegt vor"/></Field>
    </div>
    <div style={{display:'flex',gap:'8px'}}>
      <Btn onClick={save} variant="gold">✓ Speichern</Btn>
      <Btn onClick={onCancel} variant="ghost">Abbrechen</Btn>
    </div>
  </div>;

// ─── Single Card ──────────────────────────────────────────────────────────
function NtCard({n,onEdit,onDelete,onStatus}){
  const [open,setOpen]=useState(false);
  const netto=nt_netto(n);
  const sc=NT_ST[n.status]||{c:C.dim,bg:'transparent'};
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${sc.c}`,borderRadius:'12px',marginBottom:'10px',overflow:'hidden'}}>
    {/* Header */}
    <div onClick={()=>setOpen(p=>!p)} style={{display:'flex',alignItems:'center',gap:'10px',padding:'13px 16px',cursor:'pointer'}}>
      <span style={{fontFamily:'monospace',fontSize:'11px',color:C.dim,minWidth:'58px',flexShrink:0}}>{n.nr}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.titel}</div>
        <div style={{fontSize:'11px',color:C.muted,marginTop:'1px'}}>{[n.gew,n.unternehmer].filter(Boolean).join(' · ')}</div>
      </div>
      <NtBadge status={n.status}/>
      <span style={{fontFamily:'monospace',fontSize:'13px',fontWeight:'700',color:netto<0?C.red:C.gold,flexShrink:0,marginLeft:'4px'}}>
        {netto<0?'−':'+'} CHF {nt_fmtChf(Math.abs(netto))}
      </span>
      <span style={{color:C.dim,fontSize:'10px',marginLeft:'2px',transition:'transform .2s',display:'inline-block',transform:open?'rotate(180deg)':'none'}}>▼</span>
    </div>
    {/* Body */}
    {open&&<div style={{padding:'0 16px 16px',borderTop:`1px solid ${C.border}`}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginTop:'12px'}}>
        {[['Datum',nt_fmtDate(n.datum)],['Projekt',n.projekt||'—'],['Art',(NT_ARTS.find(a=>a.v===n.art)||{l:n.art}).l],['Unternehmer',n.unternehmer||'—']].map(([l,v])=>
          <div key={l}><div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'2px'}}>{l}</div><div style={{fontSize:'13px',color:'#EEE'}}>{v}</div></div>
        )}
        {n.beschrieb&&<div style={{gridColumn:'1/-1'}}><div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'2px'}}>Beschrieb</div><div style={{fontSize:'13px',color:C.muted,lineHeight:'1.6'}}>{n.beschrieb}</div></div>}
      </div>
      {(n.pos||[]).length>0&&<NtPosTable n={n}/>}
      {n.frist>0&&<div style={{marginTop:'10px',padding:'8px 12px',background:'rgba(224,160,64,.08)',border:'1px solid rgba(224,160,64,.25)',borderRadius:'8px',fontSize:'12px',color:'#E0A040'}}>⏱ Bauzeitverlängerung +{n.frist} Tage (Art. 90)</div>}
      {(n.verlauf||[]).length>0&&<div style={{marginTop:'12px'}}>
        <div style={{fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'6px'}}>Verlauf</div>
        {n.verlauf.map((v,i)=><div key={i} style={{display:'flex',gap:'10px',padding:'5px 0',borderBottom:`1px solid rgba(255,255,255,.04)`,fontSize:'12px'}}>
          <span style={{color:C.dim,fontFamily:'monospace',minWidth:'80px',flexShrink:0}}>{nt_fmtDate(v.d)}</span>
          <span style={{color:C.muted}}>{v.t}</span>
        </div>)}
      </div>}
      <div style={{display:'flex',gap:'8px',marginTop:'14px',paddingTop:'12px',borderTop:`1px solid ${C.border}`,flexWrap:'wrap'}}>
        <Btn onClick={()=>onEdit(n)} variant="ghost" size="sm">✏ Bearbeiten</Btn>
        <Btn onClick={()=>onStatus(n)} variant="outline" size="sm">↕ Status</Btn>
