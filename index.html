// ── Shared UI ─────────────────────────────────────────────────────────────────
const C = {gold:"#C8A96E",dark:"#0D0D0B",mid:"#1A1A17",card:"#171715",border:"rgba(255,255,255,0.08)",main:"#F0EDE8",muted:"#AAAAAA",dim:"#555",green:"#6BAF7A",red:"#E8735A",blue:"#5B8FB9"};
const iBase = (f,e) => ({background:"rgba(255,255,255,0.06)",border:`1px solid ${e?"rgba(232,115,90,0.6)":f?"rgba(200,169,110,0.5)":"rgba(255,255,255,0.12)"}`,borderRadius:10,padding:"12px 14px",color:C.main,fontSize:15,outline:"none",width:"100%",boxSizing:"border-box",fontFamily:"inherit",WebkitAppearance:"none"});

const TxtInput = ({value,onChange,placeholder,error,type="text"}) => {
  const [f,setF] = useState(false);
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
    onFocus={()=>setF(true)} onBlur={()=>setF(false)} style={iBase(f,error)} autoComplete="off" autoCorrect="off" autoCapitalize="off"/>;
};

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({onLogin}) {
  const [mode,setMode]=useState("login");
  const [f,setF]=useState({email:"",password:"",name:"",rolle:"planer",fb:"bauphysik",confirmPw:""});
  const [err,setErr]=useState({});
  const [loading,setLoading]=useState(false);
  const [users,setUsers]=useState(DEMO_USERS);
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  const validate=()=>{
    const e={};
    if(!f.email.trim())e.email="Pflichtfeld";
    else if(!/\S+@\S+\.\S+/.test(f.email))e.email="Ungültige E-Mail";
    if(!f.password)e.password="Pflichtfeld";
    if(mode==="register"){
      if(!f.name.trim())e.name="Name erforderlich";
      if(f.password.length<6)e.password="Mind. 6 Zeichen";
      if(f.password!==f.confirmPw)e.confirmPw="Stimmt nicht überein";
      if(users.find(u=>u.email===f.email))e.email="Bereits registriert";
    }
    setErr(e); return Object.keys(e).length===0;
  };

  const submit=()=>{
    if(!validate())return; setLoading(true);
    setTimeout(()=>{
      if(mode==="login"){
        const u=users.find(u=>u.email===f.email&&u.password===f.password);
        if(!u){setErr({password:"E-Mail oder Passwort falsch"});setLoading(false);return;}
        onLogin(u);
      } else {
        const ini=f.name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
        const cols=["#C8A96E","#6BAF7A","#5B8FB9","#E8735A","#B478C8"];
        const nu={id:Date.now(),email:f.email,password:f.password,name:f.name,rolle:f.rolle,fachbereich:f.fb,kuerzel:ini,farbe:cols[users.length%cols.length]};
        setUsers(p=>[...p,nu]); onLogin(nu);
      }
      setLoading(false);
    },500);
  };

  return (
    <div style={{minHeight:"100vh",background:C.dark,display:"flex",flexDirection:"column",padding:"0 0 20px"}}>
      {/* Header */}
      <div style={{background:"rgba(255,255,255,0.02)",borderBottom:`1px solid ${C.border}`,padding:"52px 24px 24px",textAlign:"center"}}>
        <div style={{width:52,height:52,borderRadius:14,background:"linear-gradient(135deg,#C8A96E,#E8C98E)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,fontWeight:900,color:C.dark,margin:"0 auto 12px"}}>B</div>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:"-0.02em",marginBottom:3}}>BauPlan Schweiz</div>
        <div style={{fontSize:12,color:C.dim}}>Energienachweise für Fachplaner</div>
      </div>

      <div style={{flex:1,padding:"20px 20px 0",overflowY:"auto"}}>
        {/* Tabs */}
        <div style={{display:"flex",gap:3,background:"rgba(255,255,255,0.04)",borderRadius:11,padding:4,border:`1px solid ${C.border}`,marginBottom:24}}>
          {[["login","Anmelden"],["register","Registrieren"]].map(([id,lbl])=>(
            <button key={id} onClick={()=>{setMode(id);setErr({});}} style={{flex:1,padding:"10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:14,fontWeight:700,fontFamily:"inherit",background:mode===id?"rgba(200,169,110,0.2)":"transparent",color:mode===id?C.gold:"#555"}}>{lbl}</button>
          ))}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {mode==="register"&&<Fld label="Name" required error={err.name}><TxtInput value={f.name} onChange={v=>upd("name",v)} placeholder="Vor- und Nachname" error={err.name}/></Fld>}
          <Fld label="E-Mail" required error={err.email}><TxtInput value={f.email} onChange={v=>upd("email",v)} placeholder="name@buero.ch" type="email" error={err.email}/></Fld>
          <Fld label="Passwort" required error={err.password}><TxtInput value={f.password} onChange={v=>upd("password",v)} placeholder={mode==="register"?"Mind. 6 Zeichen":"Passwort"} type="password" error={err.password}/></Fld>
          {mode==="register"&&<>
            <Fld label="Passwort bestätigen" required error={err.confirmPw}><TxtInput value={f.confirmPw} onChange={v=>upd("confirmPw",v)} placeholder="Wiederholen" type="password" error={err.confirmPw}/></Fld>
            <Fld label="Fachbereich" required>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {FACHBEREICHE_USER.map(fb=>(
                  <button key={fb.id} onClick={()=>upd("fb",fb.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:10,cursor:"pointer",border:`1px solid ${f.fb===fb.id?"rgba(200,169,110,0.5)":C.border}`,background:f.fb===fb.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)"}}>
                    <span style={{fontSize:18}}>{fb.icon}</span><span style={{fontSize:13,fontWeight:600,color:f.fb===fb.id?C.gold:"#888"}}>{fb.label}</span>
                  </button>
                ))}
              </div>
            </Fld>
            <Fld label="Rolle" required>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {ROLLEN.map(r=>(
                  <button key={r.id} onClick={()=>upd("rolle",r.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 14px",borderRadius:11,cursor:"pointer",textAlign:"left",border:`1px solid ${f.rolle===r.id?`${r.color}55`:C.border}`,background:f.rolle===r.id?`${r.color}12`:"rgba(255,255,255,0.03)"}}>
                    <span style={{fontSize:18,color:f.rolle===r.id?r.color:"#555"}}>{r.icon}</span>
                    <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:f.rolle===r.id?r.color:"#AAA"}}>{r.label}</div><div style={{fontSize:11,color:C.dim}}>{r.desc}</div></div>
                    <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${f.rolle===r.id?r.color:"#333"}`,background:f.rolle===r.id?r.color:"transparent",flexShrink:0}}/>
                  </button>
                ))}
              </div>
            </Fld>
          </>}
          <button onClick={submit} disabled={loading} style={{padding:"15px",borderRadius:12,cursor:"pointer",background:loading?"rgba(200,169,110,0.4)":"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:16,fontWeight:800,fontFamily:"inherit",marginTop:6}}>
            {loading?"⏳ Bitte warten…":mode==="login"?"Anmelden →":"Konto erstellen →"}
          </button>

          {mode==="login"&&(
            <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:12,padding:16,marginTop:4}}>
              <div style={{fontSize:11,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Demo-Zugänge (tippen zum Ausfüllen)</div>
              {DEMO_USERS.map(u=>(
                <div key={u.id} onClick={()=>setF(p=>({...p,email:u.email,password:u.password}))} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <Avatar user={u} size={32}/>
                    <div><div style={{fontSize:13,fontWeight:600,color:"#DDD"}}>{u.name}</div><div style={{fontSize:11,color:C.dim}}>{u.email}</div></div>
                  </div>
                  <RolleBadge rolle={u.rolle}/>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({projekte,onProjekt,onNeu,canEdit}) {
  const {user}=useAuth();
  const [filter,setFilter]=useState("all");
  const filtered=projekte.filter(p=>filter==="all"||p.typ===filter);
  const stats={total:projekte.length,aktiv:projekte.filter(p=>["planung","ausfuehrung","abschluss"].includes(p.status)).length,offene:projekte.reduce((a,p)=>a+Object.values(p.nachweisStatus).filter(v=>!v).length,0)};

  return (
    <div style={{paddingBottom:90}}>
      {/* Header */}
      <div style={{background:"rgba(255,255,255,0.02)",borderBottom:`1px solid ${C.border}`,padding:"56px 20px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:22,fontWeight:800,letterSpacing:"-0.02em",marginBottom:2}}>Dashboard</div>
            <div style={{fontSize:12,color:C.dim}}>Hallo {user.name} · {ROLLEN.find(r=>r.id===user.rolle)?.label}</div>
          </div>
          <Avatar user={user} size={38}/>
        </div>
      </div>

      <div style={{padding:"16px 16px 0"}}>
        {/* Stats */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:18}}>
          {[["Total",stats.total,null],["Aktiv",stats.aktiv,"#C8A96E"],["Off. NW",stats.offene,"#E8735A"]].map(([l,v,ac])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 12px",textAlign:"center"}}>

                <div style={{height:3,background:`linear-gradient(90deg,${tc},transparent)`}}/>
                <div style={{padding:"14px 16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>

                        <span style={{fontSize:9,fontWeight:700,color:tc,background:`${tc}18`,padding:"2px 7px",borderRadius:4,textTransform:"uppercase"}}>{p.typ.toUpperCase()}</span>
                        <span style={{fontSize:9,fontWeight:600,color:s.color,background:s.bg,padding:"2px 7px",borderRadius:4,textTransform:"uppercase"}}>{s.label}</span>
                      </div>

                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
                    {[["Bauherrschaft",p.bauherrschaft],["Deadline",p.deadline]].map(([k,v])=>(
                      <div key={k}><div style={{fontSize:9,color:C.dim,marginBottom:2,letterSpacing:"0.05em"}}>{k.toUpperCase()}</div><div style={{fontSize:12,color:"#BBB"}}>{v}</div></div>
                    ))}
                  </div>
                  <ProgressBar value={p.fortschritt}/>
                  <div style={{marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                      {nwList.map(n=>(
                        <span key={n.id} style={{fontSize:9,fontWeight:600,padding:"2px 7px",borderRadius:4,background:p.nachweisStatus[n.id]?"rgba(107,175,122,0.15)":"rgba(255,255,255,0.06)",color:p.nachweisStatus[n.id]?C.green:"#555",border:`1px solid ${p.nachweisStatus[n.id]?"rgba(107,175,122,0.3)":"rgba(255,255,255,0.08)"}`}}>
                          {p.nachweisStatus[n.id]?"✓ ":"○ "}{n.norm}

                      ))}
                    </div>

          {canEdit&&(
            <div onClick={onNeu} style={{border:"2px dashed rgba(255,255,255,0.1)",borderRadius:14,padding:28,display:"flex",alignItems:"center",justifyContent:"center",gap:10,cursor:"pointer",color:"#444"}}>
              <span style={{fontSize:28}}>+</span><span style={{fontSize:14,fontWeight:600}}>Neues Projekt</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Wizard ────────────────────────────────────────────────────────────────────
function Wizard({onBack,onSave}) {
  const [step,setStep]=useState(1);const [done,setDone]=useState(false);const [err,setErr]=useState({});
  const [s1,setS1]=useState({name:"",ort:"",kanton:"",status:"planung"});
  const [s2,setS2]=useState({bauherrName:"",fachplanerTyp:"",planerName:""});
  const [s3,setS3]=useState({gebaeudekat:"",bgf:"",deadline:""});
  const upd=setter=>(k,v)=>setter(p=>({...p,[k]:v}));
  const validate=()=>{
    const e={};
    if(step===1){if(!s1.name.trim())e.name="Pflichtfeld";if(!s1.ort.trim())e.ort="Pflichtfeld";if(!s1.kanton)e.kanton="Pflichtfeld";}
    if(step===2){if(!s2.bauherrName.trim())e.bauherrName="Pflichtfeld";if(!s2.fachplanerTyp)e.fachplanerTyp="Pflichtfeld";}
    if(step===3){if(!s3.gebaeudekat)e.gebaeudekat="Pflichtfeld";if(!s3.bgf)e.bgf="Pflichtfeld";}
    setErr(e); return Object.keys(e).length===0;
  };
  const next=()=>{if(validate()){setStep(s=>s+1);setErr({});}};
  const back=()=>{setStep(s=>s-1);setErr({});};
  const submit=()=>{
    if(!validate())return;
    const ids=NW_DB.filter(n=>n.gtyp.includes(s3.gebaeudekat)&&n.fb.includes(s2.fachplanerTyp)).slice(0,3).map(n=>n.id);
    const ns={}; ids.forEach(id=>ns[id]=false);
    onSave({id:Date.now(),name:s1.name,ort:s1.ort,kanton:s1.kanton,typ:s2.fachplanerTyp,gebaeudekat:s3.gebaeudekat,status:s1.status,bauherrschaft:s2.bauherrName,bgf:`${parseInt(s3.bgf).toLocaleString("de-CH")} m²`,deadline:s3.deadline||"—",fortschritt:0,nachweise:ids,nachweisStatus:ns});
    setDone(true);
  };

  if(done) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"70vh",gap:20,padding:28,textAlign:"center"}}>
      <div style={{width:80,height:80,borderRadius:"50%",background:"linear-gradient(135deg,#6BAF7A,#8BD4A0)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,boxShadow:"0 0 0 16px rgba(107,175,122,0.1)"}}>✓</div>
      <div><div style={{fontSize:22,fontWeight:800,marginBottom:6}}>Projekt erstellt!</div><div style={{fontSize:13,color:C.dim}}>Jetzt im Dashboard sichtbar.</div></div>
      <button onClick={onBack} style={{padding:"14px 32px",borderRadius:12,cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:15,fontWeight:800,fontFamily:"inherit"}}>Zum Dashboard →</button>
    </div>
  );

  const stepLabels=["Projektinfos","Beteiligte","Details"];
  return (
    <div style={{paddingBottom:90}}>
      <div style={{background:"rgba(255,255,255,0.02)",borderBottom:`1px solid ${C.border}`,padding:"56px 20px 16px"}}>
        <div style={{fontSize:20,fontWeight:800,letterSpacing:"-0.02em",marginBottom:12}}>Neues Projekt</div>
        <div style={{display:"flex",gap:6}}>
          {[1,2,3].map(n=>(
            <div key={n} style={{flex:1,height:4,borderRadius:2,background:n<=step?(n<step?C.green:C.gold):"rgba(255,255,255,0.1)",transition:"all 0.3s"}}/>
          ))}
        </div>
        <div style={{fontSize:12,color:C.dim,marginTop:8}}>{stepLabels[step-1]} · Schritt {step}/3</div>
      </div>
      <div style={{padding:"20px 20px 0"}}>
        {step===1&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Fld label="Projektname" required error={err.name}><TxtInput value={s1.name} onChange={v=>upd(setS1)("name",v)} placeholder="z.B. Wohnüberbauung Zürichberg" error={err.name}/></Fld>
          <div style={{display:"grid",gridTemplateColumns:"1fr 100px",gap:12}}>
            <Fld label="Ort" required error={err.ort}><TxtInput value={s1.ort} onChange={v=>upd(setS1)("ort",v)} placeholder="z.B. Zürich" error={err.ort}/></Fld>
            <Fld label="Kanton" required error={err.kanton}>
              <select value={s1.kanton} onChange={e=>upd(setS1)("kanton",e.target.value)} style={{...iBase(false,err.kanton),appearance:"none",cursor:"pointer"}}>
                <option value="">KT</option>
                {KANTONE.map(k=><option key={k} value={k}>{k}</option>)}
              </select>
            </Fld>
          </div>
          <Fld label="Status"><div style={{display:"flex",gap:8}}>
            {[{id:"planung",l:"Planung"},{id:"ausfuehrung",l:"Ausführung"},{id:"abschluss",l:"Abschluss"}].map(s=>(
              <button key={s.id} onClick={()=>upd(setS1)("status",s.id)} style={{flex:1,padding:"11px 6px",borderRadius:10,cursor:"pointer",border:`1px solid ${s1.status===s.id?"rgba(200,169,110,0.5)":C.border}`,background:s1.status===s.id?"rgba(200,169,110,0.15)":"rgba(255,255,255,0.03)",color:s1.status===s.id?C.gold:"#666",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>{s.l}</button>
            ))}
          </div></Fld>
        </div>}
        {step===2&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Fld label="Bauherrschaft" required error={err.bauherrName}><TxtInput value={s2.bauherrName} onChange={v=>upd(setS2)("bauherrName",v)} placeholder="z.B. Müller Immobilien AG" error={err.bauherrName}/></Fld>
          <Fld label="Fachplaner-Typ" required error={err.fachplanerTyp}>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {FACHPLANER.map(t=>(
                <button key={t.id} onClick={()=>upd(setS2)("fachplanerTyp",t.id)} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:12,cursor:"pointer",textAlign:"left",border:`1px solid ${s2.fachplanerTyp===t.id?`${t.color}55`:C.border}`,background:s2.fachplanerTyp===t.id?`${t.color}12`:"rgba(255,255,255,0.03)"}}>
                  <span style={{width:38,height:38,borderRadius:10,background:s2.fachplanerTyp===t.id?`${t.color}22`:"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{t.icon}</span>
                  <div><div style={{fontSize:14,fontWeight:700,color:s2.fachplanerTyp===t.id?t.color:"#AAA"}}>{t.label}</div><div style={{fontSize:11,color:C.dim}}>{t.desc}</div></div>
                  <div style={{marginLeft:"auto",width:18,height:18,borderRadius:"50%",border:`2px solid ${s2.fachplanerTyp===t.id?t.color:"#333"}`,background:s2.fachplanerTyp===t.id?t.color:"transparent",flexShrink:0}}/>
                </button>
              ))}
            </div>
          </Fld>
          <Fld label="Zuständiger Planer"><TxtInput value={s2.planerName} onChange={v=>upd(setS2)("planerName",v)} placeholder="Vor- und Nachname"/></Fld>
        </div>}
        {step===3&&<div style={{display:"flex",flexDirection:"column",gap:16}}>
          <Fld label="Gebäudekategorie" required error={err.gebaeudekat}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {GEBAEUDETYPEN.map(g=>(
                <button key={g.id} onClick={()=>upd(setS3)("gebaeudekat",g.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderRadius:11,cursor:"pointer",border:`1px solid ${s3.gebaeudekat===g.id?"rgba(200,169,110,0.4)":C.border}`,background:s3.gebaeudekat===g.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)"}}>
                  <span style={{fontSize:20}}>{g.icon}</span><span style={{fontSize:13,fontWeight:600,color:s3.gebaeudekat===g.id?C.gold:"#888"}}>{g.label}</span>
                </button>
              ))}
            </div>
          </Fld>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Fld label="BGF (m²)" required error={err.bgf}><TxtInput value={s3.bgf} onChange={v=>upd(setS3)("bgf",v)} placeholder="z.B. 4200" type="number" error={err.bgf}/></Fld>
            <Fld label="Deadline"><input type="date" value={s3.deadline} onChange={e=>upd(setS3)("deadline",e.target.value)} style={{...iBase(false,false),colorScheme:"dark"}}/></Fld>
          </div>
        </div>}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:24,gap:12}}>
          <button onClick={step===1?onBack:back} style={{padding:"14px 20px",borderRadius:12,cursor:"pointer",background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,color:"#888",fontSize:14,fontWeight:600,fontFamily:"inherit"}}>{step===1?"✕ Abbrechen":"← Zurück"}</button>
          {step<3?<button onClick={next} style={{flex:1,padding:"14px",borderRadius:12,cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:14,fontWeight:800,fontFamily:"inherit"}}>Weiter →</button>
                 :<button onClick={submit} style={{flex:1,padding:"14px",borderRadius:12,cursor:"pointer",background:"linear-gradient(135deg,#6BAF7A,#8BD4A0)",border:"none",color:C.dark,fontSize:14,fontWeight:800,fontFamily:"inherit"}}>✓ Projekt erstellen</button>}
        </div>
      </div>
    </div>
  );
}

// ── Energienachweise ──────────────────────────────────────────────────────────
function Energienachweise() {
  const [tab,setTab]=useState("assistent");
  const [gtyp,setGtyp]=useState("");const [bautyp,setBautyp]=useState("");const [fb,setFb]=useState("alle");

    if(!gtyp||!bautyp)return[];
    return NW_DB.filter(n=>n.gtyp.includes(gtyp)&&(bautyp==="neubau"?n.neu:n.san)&&(fb==="alle"||n.fb.includes(fb))).sort((a,b)=>(b.pflicht?1:0)-(a.pflicht?1:0));
  },[gtyp,bautyp,fb]);
  const bib=useMemo(()=>NW_DB.filter(n=>(katF==="alle"||n.kat===katF)&&(!search||n.norm.toLowerCase().includes(search.toLowerCase())||n.titel.toLowerCase().includes(search.toLowerCase()))),[search,katF]);

    <div style={{paddingBottom:90}}>

        <div style={{fontSize:18,fontWeight:800}}>{sel.norm}</div>
      </div>
      <div style={{padding:"16px"}}>
        <div style={{background:KAT_C[sel.kat]?.bg,border:`1px solid ${KAT_C[sel.kat]?.bd}`,borderRadius:14,padding:18,marginBottom:16}}>
          <div style={{display:"flex",gap:7,marginBottom:8}}>
            <span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:5,background:KAT_C[sel.kat]?.bg,border:`1px solid ${KAT_C[sel.kat]?.bd}`,color:KAT_C[sel.kat]?.tx}}>{sel.kat}</span>
            {sel.pflicht&&<span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:5,background:"rgba(232,115,90,0.15)",border:"1px solid rgba(232,115,90,0.35)",color:C.red}}>PFLICHT</span>}

          <div style={{fontSize:20,fontWeight:800,marginBottom:4}}>{sel.norm}</div>
          <div style={{fontSize:13,color:"#AAA"}}>{sel.titel}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>

            <div key={k} style={{background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"12px 14px"}}>
              <div style={{fontSize:9,color:C.dim,letterSpacing:"0.06em",marginBottom:4}}>{k.toUpperCase()}</div>
              <div style={{fontSize:13,color:"#CCC",fontWeight:600}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:12,padding:16}}>
          <div style={{fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Anwendung</div>

// ── Profil ────────────────────────────────────────────────────────────────────
function Profil({onLogout,onUpdateUser}) {
  const {user}=useAuth();
  const [f,setF]=useState({name:user.name,fb:user.fachbereich});
  const [saved,setSaved]=useState(false);
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));
  const save=()=>{
    const ini=f.name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
    onUpdateUser({...user,name:f.name,fachbereich:f.fb,kuerzel:ini});
    setSaved(true); setTimeout(()=>setSaved(false),2000);
  };
  const rol=ROLLEN.find(r=>r.id===user.rolle);
  return (
    <div style={{paddingBottom:90}}>
      <div style={{background:"rgba(255,255,255,0.02)",borderBottom:`1px solid ${C.border}`,padding:"56px 20px 20px",display:"flex",alignItems:"center",gap:16}}>
        <Avatar user={{...user,name:f.name,kuerzel:f.name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase()||user.kuerzel}} size={52}/>
        <div><div style={{fontSize:20,fontWeight:800,marginBottom:4}}>{f.name||user.name}</div><RolleBadge rolle={user.rolle}/></div>
      </div>
      <div style={{padding:"16px"}}>
        <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:14,padding:18,marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:14}}>Persönliche Daten</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <Fld label="Name"><TxtInput value={f.name} onChange={v=>upd("name",v)} placeholder="Vor- und Nachname"/></Fld>
            <Fld label="E-Mail"><div style={{...iBase(false,false),color:"#555",fontSize:14}}>{user.email}</div></Fld>
          </div>
        </div>
        <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:14,padding:18,marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Fachbereich</div>

        </div>
        <div style={{background:`${rol?.color}10`,border:`1px solid ${rol?.color}30`,borderRadius:14,padding:16,marginBottom:20,display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:24,color:rol?.color}}>{rol?.icon}</span>

// ── Hauptapp ──────────────────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [allUsers,setAllUsers]=useState(DEMO_USERS);
  const [page,setPage]=useState("dashboard");
  const [projekte,setProjekte]=useState(INIT_PROJEKTE);
  const [detailProjekt,setDetailProjekt]=useState(null);

  const handleLogin=u=>{setUser(u);setPage("dashboard");};
  const handleLogout=()=>{setUser(null);setPage("dashboard");setDetailProjekt(null);};
  const handleUpdateUser=updated=>{setAllUsers(p=>p.map(u=>u.id===updated.id?updated:u));setUser(updated);};
  const handleUpdateRolle=updated=>setAllUsers(p=>p.map(u=>u.id===updated.id?updated:u));
  const handleSaveProjekt=p=>{setProjekte(prev=>[...prev,p]);setPage("dashboard");};
  const handleProjekt=p=>{setDetailProjekt(p);setPage("detail");};
  const handleBackFromDetail=()=>{setDetailProjekt(null);setPage("dashboard");};

  if(!user) return <AuthScreen onLogin={handleLogin}/>;

  const canEdit=["admin","planer"].includes(user.rolle);
  const isAdmin=user.rolle==="admin";

  // Profil-Tab immer vorhanden
  const navTabs=[
    {id:"dashboard",ic:"▦",l:"Dashboard"},
    ...(canEdit?[{id:"neu",ic:"+",l:"Neu"}]:[]),
    {id:"nachweise",ic:"◈",l:"Nachweise"},
    ...(isAdmin?[{id:"users",ic:"◉",l:"Benutzer"}]:[]),
    {id:"profil",ic:"◯",l:"Profil"},
  ];

  const showTabBar = page!=="detail" && page!=="neu";

  return (
    <AuthCtx.Provider value={{user,setUser}}>
      <div style={{minHeight:"100vh",background:C.dark}}>
        {page==="dashboard" && <Dashboard projekte={projekte} onProjekt={handleProjekt} onNeu={()=>setPage("neu")} canEdit={canEdit}/>}
        {page==="detail"    && detailProjekt && <ProjektDetail p={detailProjekt} onBack={handleBackFromDetail}/>}
        {page==="neu"       && canEdit && <Wizard onBack={()=>setPage("dashboard")} onSave={handleSaveProjekt}/>}
        {page==="nachweise" && <Energienachweise/>}
        {page==="users"     && isAdmin && <UserManagement allUsers={allUsers} onUpdateRolle={handleUpdateRolle}/>}
        {page==="profil"    && <Profil onLogout={handleLogout} onUpdateUser={handleUpdateUser}/>}
        {showTabBar && <TabBar page={page} setPage={p=>{setDetailProjekt(null);setPage(p);}} canEdit={canEdit} isAdmin={isAdmin}/>}
      </div>
    </AuthCtx.Provider>
  );
}

const PhasenTimeline = ({ projekt, onStatusChange, onPhasenClick }) => {
  const gruppen = [...new Set(SIA_PHASEN.map(p=>p.gruppe))];
  return (
    <div>
      {gruppen.map(gruppe => {
        const phasen = SIA_PHASEN.filter(p=>p.gruppe===gruppe);
        return (
          <div key={gruppe} style={{marginBottom:18}}>
            <div style={{fontSize:9,fontWeight:700,color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8}}>{gruppe}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {phasen.map((phase,i) => {
                const statusId = projekt.phasenStatus[phase.id] || "nicht_begonnen";
                const s = PHASEN_STATUS.find(x=>x.id===statusId);
                const isAktiv = projekt.aktivPhase === phase.id;
                return (
                  <div key={phase.id} style={{position:"relative",display:"flex",alignItems:"center"}}>
                    <div onClick={()=>onPhasenClick(phase)} style={{
                      background: isAktiv ? `${phase.color}22` : "rgba(255,255,255,0.03)",
                      border:`2px solid ${isAktiv ? phase.color : s.color+"44"}`,
                      borderRadius:10, padding:"10px 14px", cursor:"pointer",
                      transition:"all 0.15s", minWidth:100,
                    }}
                      onMouseEnter={e=>{e.currentTarget.style.borderColor=phase.color;e.currentTarget.style.background=`${phase.color}15`;}}
                      onMouseLeave={e=>{e.currentTarget.style.borderColor=isAktiv?phase.color:s.color+"44";e.currentTarget.style.background=isAktiv?`${phase.color}22`:"rgba(255,255,255,0.03)";}}
                    >
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                        <span style={{fontSize:13,fontWeight:800,color:phase.color}}>SIA {phase.nr}</span>
                        {isAktiv && <span style={{fontSize:9,fontWeight:700,color:phase.color,background:`${phase.color}20`,padding:"1px 5px",borderRadius:3}}>AKTIV</span>}
                      </div>
                      <div style={{fontSize:11,color:C.muted,marginBottom:7,lineHeight:1.3}}>{phase.label}</div>
                      <StatusBadge statusId={statusId} small/>
                    </div>
                    {i < phasen.length-1 && <div style={{width:16,height:1,background:C.border,flexShrink:0}}/>}
                  </div>
                );
              })}

        );
      })}
    </div>
  );
};

    const updated = { ...localProjekt, phasenStatus: { ...localProjekt.phasenStatus, [phase.id]: newStatusId }};

    onUpdate(updated);
  };

  const addDokument = () => {
    if(!uploadName.trim()) return;

      id: Date.now(), name: uploadName, typ: uploadTyp,

        ...localProjekt.plaene,

    setLocalProjekt(updated);
    onUpdate(updated);
    setUploadName("");

const BKPUebersicht = ({ projekt, onUpdate }) => {
  const [editId, setEditId] = useState(null);
  const [editBudget, setEditBudget] = useState("");
  const [editAktuell, setEditAktuell] = useState("");

  const saveEdit = (bkpId) => {
    const updated = {
      ...projekt,
      bkpKosten: {
        ...projekt.bkpKosten,
        [bkpId]: { budget: parseInt(editBudget)||0, aktuell: parseInt(editAktuell)||0 }
      }
    };
    onUpdate(updated);
    setEditId(null);
  };

  const totalBudget = Object.values(projekt.bkpKosten||{}).filter((_,i)=>Object.keys(projekt.bkpKosten)[i].length===1).reduce((a,v)=>a+(v.budget||0),0);
  const totalAktuell = Object.values(projekt.bkpKosten||{}).filter((_,i)=>Object.keys(projekt.bkpKosten)[i].length===1).reduce((a,v)=>a+(v.aktuell||0),0);

  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:20}}>
        {[
          ["BKP Budget Total", formatCHF(projekt.bkpSumme), C.gold],
          ["Aktuelle Kosten", formatCHF(Object.values(projekt.bkpKosten||{}).reduce((a,v)=>a+(v.aktuell||0),0)), C.blue],
          ["Differenz", formatCHF(projekt.bkpSumme - Object.values(projekt.bkpKosten||{}).reduce((a,v)=>a+(v.aktuell||0),0)), C.green],
        ].map(([l,v,c])=>(
          <Card key={l} style={{padding:"14px 16px"}}>
            <div style={{fontSize:9,color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>{l}</div>
            <div style={{fontSize:18,fontWeight:800,color:c,letterSpacing:"-0.02em"}}>{v}</div>
          </Card>
        ))}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {BKP.map(bkp => {
          const kosten = projekt.bkpKosten?.[bkp.id];
          const isEditing = editId === bkp.id;
          const pct = kosten ? formatPct(kosten.aktuell, kosten.budget) : 0;
          const ueber = kosten && kosten.aktuell > kosten.budget;

          return (
            <div key={bkp.id} style={{
              background: bkp.sub ? "rgba(255,255,255,0.02)" : C.card,
              border:`1px solid ${C.border}`,
              borderRadius:10, padding:"12px 14px",
              marginLeft: bkp.sub ? 16 : 0,
              borderLeft: bkp.sub ? `3px solid ${bkp.color}44` : `1px solid ${C.border}`,
            }}>
              {isEditing ? (
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:bkp.color,marginBottom:8}}>BKP {bkp.nr} — {bkp.label}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div>
                      <div style={{fontSize:9,color:C.dim,marginBottom:4}}>BUDGET (CHF)</div>
                      <input type="number" value={editBudget} onChange={e=>setEditBudget(e.target.value)}
                        style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 10px",color:C.main,fontSize:12,outline:"none",width:"100%",boxSizing:"border-box",fontFamily:"inherit"}}/>
                    </div>
                    <div>
                      <div style={{fontSize:9,color:C.dim,marginBottom:4}}>AKTUELL (CHF)</div>
                      <input type="number" value={editAktuell} onChange={e=>setEditAktuell(e.target.value)}
                        style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 10px",color:C.main,fontSize:12,outline:"none",width:"100%",boxSizing:"border-box",fontFamily:"inherit"}}/>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setEditId(null)} style={{flex:1,padding:"7px",borderRadius:7,cursor:"pointer",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,color:"#777",fontSize:11,fontFamily:"inherit"}}>Abbrechen</button>
                    <button onClick={()=>saveEdit(bkp.id)} style={{flex:2,padding:"7px",borderRadius:7,cursor:"pointer",background:"linear-gradient(135deg,#6BAF7A,#8BD4A0)",border:"none",color:C.dark,fontSize:11,fontWeight:700,fontFamily:"inherit"}}>✓ Speichern</button>
                  </div>
                </div>
              ) : (
                <div onClick={()=>{setEditId(bkp.id);setEditBudget(kosten?.budget||"");setEditAktuell(kosten?.aktuell||"");}} style={{cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:kosten?8:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:bkp.sub?10:12,fontWeight:700,color:bkp.color}}>BKP {bkp.nr}</span>
                      <span style={{fontSize:bkp.sub?11:12,color:C.muted}}>{bkp.label}</span>
                    </div>
                    {kosten ? (
                      <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                        <span style={{fontSize:10,color:ueber?C.red:C.green,fontWeight:700}}>{pct}%</span>
                        <span style={{fontSize:11,color:ueber?C.red:C.muted,fontWeight:600}}>{formatCHF(kosten.aktuell)}</span>
                        <span style={{fontSize:10,color:C.dim}}>/ {formatCHF(kosten.budget)}</span>
                      </div>
                    ) : (
                      <span style={{fontSize:10,color:"#444",fontStyle:"italic"}}>+ Kosten erfassen</span>
                    )}
                  </div>
                  {kosten && (
                    <div style={{height:3,background:"rgba(255,255,255,0.06)",borderRadius:2}}>
                      <div style={{height:"100%",borderRadius:2,width:`${Math.min(pct,100)}%`,background:ueber?"linear-gradient(90deg,#E8735A,#CC4444)":"linear-gradient(90deg,"+bkp.color+","+bkp.color+"88)",transition:"width 0.6s"}}/>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// BETEILIGTE
// ══════════════════════════════════════════════════════════════════════════════
const BeteiligtePanel = ({ projekt, onUpdate }) => {
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ fb:"hlk", name:"", email:"" });

  const add = () => {
    if(!form.name.trim()) return;
    const updated = { ...projekt, beteiligte: [...(projekt.beteiligte||[]), {...form}] };
    onUpdate(updated); setShowAdd(false); setForm({fb:"hlk",name:"",email:""});
  };
  const remove = (idx) => {
    const updated = { ...projekt, beteiligte: projekt.beteiligte.filter((_,i)=>i!==idx) };
    onUpdate(updated);
  };

  return (
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        {(projekt.beteiligte||[]).map((b,i) => {
          const fb = FACHBEREICHE.find(f=>f.id===b.fb);
          return (
            <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:38,height:38,borderRadius:"50%",background:`${fb?.color||"#888"}22`,border:`2px solid ${fb?.color||"#888"}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:fb?.color,flexShrink:0}}>{fb?.icon||"?"}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:C.main,marginBottom:3}}>{b.name}</div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <FbChip fbId={b.fb} small/>
                  {b.email&&<span style={{fontSize:10,color:C.dim}}>{b.email}</span>}
                </div>
              </div>
              <button onClick={()=>remove(i)} style={{background:"rgba(232,115,90,0.1)",border:"1px solid rgba(232,115,90,0.2)",color:C.red,borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>✕</button>
            </div>
          );
        })}
      </div>

      {showAdd ? (
        <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.2)",borderRadius:12,padding:16}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Beteiligten hinzufügen</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:12}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {FACHBEREICHE.map(fb=>(
                <button key={fb.id} onClick={()=>setForm(p=>({...p,fb:fb.id}))} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 11px",borderRadius:7,cursor:"pointer",border:`1px solid ${form.fb===fb.id?`${fb.color}55`:C.border}`,background:form.fb===fb.id?`${fb.color}15`:"rgba(255,255,255,0.02)",color:form.fb===fb.id?fb.color:"#666",fontSize:10,fontWeight:600,fontFamily:"inherit"}}>
                  {fb.icon} {fb.label}
                </button>
              ))}
            </div>
            <input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Name"
              style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.main,fontSize:13,outline:"none",fontFamily:"inherit"}}/>
            <input value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))} placeholder="E-Mail (optional)"
              style={{background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.main,fontSize:13,outline:"none",fontFamily:"inherit"}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setShowAdd(false)} style={{flex:1,padding:"9px",borderRadius:8,cursor:"pointer",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,color:"#777",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>Abbrechen</button>
            <button onClick={add} style={{flex:2,padding:"9px",borderRadius:8,cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:12,fontWeight:800,fontFamily:"inherit"}}>+ Hinzufügen</button>
          </div>
        </div>
      ) : (
        <button onClick={()=>setShowAdd(true)} style={{width:"100%",padding:"11px",borderRadius:10,cursor:"pointer",border:"1px dashed rgba(200,169,110,0.3)",background:"rgba(200,169,110,0.05)",color:C.gold,fontSize:12,fontWeight:600,fontFamily:"inherit"}}>+ Beteiligten hinzufügen</button>
      )}
    </div>
  );
};

// PROJEKT DETAIL
// ══════════════════════════════════════════════════════════════════════════════
const TABS = [
  { id:"phasen",     label:"SIA-Phasen",  icon:"◎" },
  { id:"plaene",     label:"Pläne",       icon:"📐" },
  { id:"kosten",     label:"BKP Kosten",  icon:"CHF" },
  { id:"beteiligte", label:"Team",        icon:"◉" },
];

const ProjektDetail = ({ projekt: initProjekt, onBack, onUpdate }) => {
  const [projekt, setProjekt] = useState(initProjekt);
  const [activeTab, setActiveTab] = useState("phasen");
  const [activePhase, setActivePhase] = useState(null);

  const handleUpdate = (updated) => { setProjekt(updated); onUpdate(updated); };

  const aktivPhaseObj = SIA_PHASEN.find(p=>p.id===projekt.aktivPhase);
  const gesamtDokumente = Object.values(projekt.plaene||{}).reduce((a,phasen)=>a+Object.values(phasen).reduce((b,plaene)=>b+plaene.length,0),0);
  const freigegebeneNachweise = Object.values(projekt.phasenStatus||{}).filter(s=>s==="freigegeben").length;

  // Alle Pläne flach für "Pläne"-Tab
  const allePlaeneFlach = Object.entries(projekt.plaene||{}).flatMap(([fb,phasen])=>
    Object.entries(phasen).flatMap(([phaseId,plaene])=>
      plaene.map(p=>({...p, fb, phaseId}))
    )
  );

  return (
    <div style={{minHeight:"100vh",background:C.dark}}>
      {/* Header */}
      <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"16px 24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:12}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:9,padding:"8px 14px",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>← Zurück</button>
          <div style={{minWidth:0}}>
            <div style={{fontSize:20,fontWeight:800,color:C.main,letterSpacing:"-0.02em",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{projekt.name}</div>
            <div style={{fontSize:12,color:C.dim,marginTop:2}}>{projekt.bauherrschaft} · {projekt.ort}, {projekt.kanton}</div>
          </div>
        </div>

        {/* Quick Stats */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
          {[
            ["Aktive Phase", aktivPhaseObj ? `SIA ${aktivPhaseObj.nr}` : "—", C.gold],
            ["BGF", `${projekt.bgf?.toLocaleString("de-CH")} m²`, C.muted],
            ["Pläne", gesamtDokumente, C.blue],
            ["Phasen ✓", `${freigegebeneNachweise}/${SIA_PHASEN.length}`, C.green],
          ].map(([l,v,c])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.04)",borderRadius:9,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:16,fontWeight:800,color:c,letterSpacing:"-0.02em"}}>{v}</div>
              <div style={{fontSize:9,color:C.dim,marginTop:2,letterSpacing:"0.05em",textTransform:"uppercase"}}>{l}</div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.03)",borderRadius:10,padding:4,border:`1px solid ${C.border}`}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{flex:1,padding:"8px 6px",borderRadius:7,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",transition:"all 0.15s",background:activeTab===t.id?"rgba(200,169,110,0.18)":"transparent",color:activeTab===t.id?C.gold:"#555"}}>
              <span style={{marginRight:4}}>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{padding:"20px 24px"}}>
        {/* SIA PHASEN TAB */}
        {activeTab==="phasen"&&(
          <div>
            <SectionTitle sub="Klicke auf eine Phase für Details und Statusverwaltung">SIA-Phasen Übersicht</SectionTitle>
            <PhasenTimeline projekt={projekt} onStatusChange={handleUpdate} onPhasenClick={setActivePhase}/>
            {/* Phasen-Fortschritt gesamt */}
            <Card style={{padding:"16px 18px",marginTop:20}}>
              <div style={{fontSize:11,fontWeight:700,color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:12}}>Gesamtfortschritt Phasen</div>
              <div style={{display:"flex",gap:3}}>
                {SIA_PHASEN.map(phase=>{
                  const s=PHASEN_STATUS.find(x=>x.id===(projekt.phasenStatus[phase.id]||"nicht_begonnen"));
                  return <div key={phase.id} title={`SIA ${phase.nr}: ${s.label}`} style={{flex:1,height:8,borderRadius:2,background:s.color,opacity:s.id==="nicht_begonnen"?0.2:1,transition:"all 0.3s"}}/>;
                })}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
                {[...new Set(SIA_PHASEN.map(p=>p.gruppe))].map(g=><span key={g} style={{fontSize:9,color:C.dim}}>{g}</span>)}
              </div>
            </Card>
          </div>
        )}

        {/* PLÄNE TAB */}
        {activeTab==="plaene"&&(
          <div>
            <SectionTitle sub={`${allePlaeneFlach.length} Dokumente total`}>Pläne & Dokumente</SectionTitle>
            {/* Gruppiert nach Phase */}
            {SIA_PHASEN.map(phase=>{
              const phasenPlaene = allePlaeneFlach.filter(p=>p.phaseId===phase.id);
              if(phasenPlaene.length===0) return null;
              return (
                <div key={phase.id} style={{marginBottom:20}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                    <span style={{fontSize:12,fontWeight:800,color:phase.color}}>SIA {phase.nr}</span>
                    <span style={{fontSize:12,color:C.muted}}>{phase.label}</span>
                    <span style={{fontSize:10,color:C.dim,background:"rgba(255,255,255,0.05)",padding:"1px 7px",borderRadius:10}}>{phasenPlaene.length}</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>
                    {phasenPlaene.map(plan=>{
                      const fb=FACHBEREICHE.find(f=>f.id===plan.fb);
                      return (
                        <div key={plan.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:700,color:C.main,marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{plan.name}</div>
                            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                              {fb&&<FbChip fbId={plan.fb} small/>}
                              <span style={{fontSize:9,color:C.dim}}>{plan.typ} · V{plan.version} · {plan.datum}</span>
                            </div>
                          </div>
                          <StatusBadge statusId={plan.status} small/>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            {allePlaeneFlach.length===0&&(
              <div style={{border:"1px dashed rgba(255,255,255,0.08)",borderRadius:12,padding:"40px 20px",textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:8}}>📐</div>
                <div style={{fontSize:14,color:C.dim}}>Noch keine Pläne vorhanden</div>
                <div style={{fontSize:12,color:"#444",marginTop:4}}>Öffne eine SIA-Phase um Pläne hinzuzufügen</div>
              </div>
            )}
          </div>
        )}

        {/* BKP KOSTEN TAB */}
        {activeTab==="kosten"&&(
          <div>
            <SectionTitle sub="Klicke auf eine Kostengruppe zum Bearbeiten">BKP-Kostengliederung</SectionTitle>
            <BKPUebersicht projekt={projekt} onUpdate={handleUpdate}/>
          </div>
        )}

        {/* BETEILIGTE TAB */}
        {activeTab==="beteiligte"&&(
          <div>
            <SectionTitle sub={`${(projekt.beteiligte||[]).length} Beteiligte`}>Projektteam</SectionTitle>
            <BeteiligtePanel projekt={projekt} onUpdate={handleUpdate}/>
          </div>
        )}
      </div>

      {/* Phase Detail Modal */}
      {activePhase && (
        <PhaseDetailModal
          phase={activePhase} projekt={projekt}
          onClose={()=>setActivePhase(null)}
          onUpdate={handleUpdate}
        />
      )}
    </div>
  );
};

const ProjektListe = ({ projekte, onProjekt, onNeu }) => {
  const [search, setSearch] = useState("");
  const filtered = projekte.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.ort.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{minHeight:"100vh",background:C.dark,fontFamily:"'DM Sans','Helvetica Neue',Arial,sans-serif",color:C.main}}>

      <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"24px 24px 20px"}}>

          <div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
              <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#C8A96E,#E8C98E)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900,color:C.dark}}>B</div>
              <div>
                <div style={{fontSize:16,fontWeight:800,letterSpacing:"-0.02em"}}>BauPlan Schweiz</div>
                <div style={{fontSize:9,color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase"}}>Projektverwaltung</div>
              </div>
            </div>
          </div>
          <button onClick={onNeu} style={{padding:"9px 16px",borderRadius:9,cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:12,fontWeight:700,fontFamily:"inherit",display:"flex",alignItems:"center",gap:5}}>+ Neues Projekt</button>
        </div>

        {/* Stats Übersicht */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
          {[
            ["Projekte", projekte.length, C.gold],
            ["In Realisierung", projekte.filter(p=>["51","52"].includes(p.aktivPhase)).length, C.red],
            ["In Planung", projekte.filter(p=>["31","32","33"].includes(p.aktivPhase)).length, C.blue],
          ].map(([l,v,c])=>(
            <div key={l} style={{background:"rgba(255,255,255,0.04)",borderRadius:9,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:800,color:c,letterSpacing:"-0.03em"}}>{v}</div>
              <div style={{fontSize:9,color:C.dim,marginTop:2,textTransform:"uppercase",letterSpacing:"0.06em"}}>{l}</div>
            </div>
          ))}
        </div>

        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Projekt suchen..."
          style={{width:"100%",background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:9,padding:"10px 14px",color:C.main,fontSize:13,outline:"none",fontFamily:"inherit",boxSizing:"border-box"}}/>
      </div>

      {/* Projektliste */}
      <div style={{padding:"16px 24px"}}>
        {filtered.map(p=>{
          const aktivPhase = SIA_PHASEN.find(x=>x.id===p.aktivPhase);
          const gesamtDoks = Object.values(p.plaene||{}).reduce((a,ph)=>a+Object.values(ph).reduce((b,pl)=>b+pl.length,0),0);
          const phasenFreigegeben = Object.values(p.phasenStatus||{}).filter(s=>s==="freigegeben").length;
          const phasenTotal = SIA_PHASEN.length;
          const fortschrittPct = Math.round((phasenFreigegeben/phasenTotal)*100);
          const bkpAktuell = Object.values(p.bkpKosten||{}).reduce((a,v)=>a+(v.aktuell||0),0);

          return (
            <Card key={p.id} onClick={()=>onProjekt(p)} style={{padding:0,marginBottom:12,overflow:"hidden"}}>
              <div style={{height:3,background:`linear-gradient(90deg,${aktivPhase?.color||C.gold},transparent)`}}/>
              <div style={{padding:"16px 18px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                  <div style={{flex:1,marginRight:12}}>
                    <div style={{fontSize:16,fontWeight:700,color:C.main,marginBottom:4,lineHeight:1.3}}>{p.name}</div>
                    <div style={{fontSize:12,color:C.dim}}>{p.bauherrschaft} · {p.ort}, {p.kanton}</div>
                  </div>
                  <div style={{flexShrink:0}}>
                    {aktivPhase && (
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,fontWeight:800,color:aktivPhase.color}}>SIA {aktivPhase.nr}</div>
                        <div style={{fontSize:10,color:C.dim}}>{aktivPhase.label}</div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Phasen Mini-Balken */}
                <div style={{marginBottom:12}}>
                  <div style={{display:"flex",gap:2,marginBottom:4}}>
                    {SIA_PHASEN.map(phase=>{
                      const s=PHASEN_STATUS.find(x=>x.id===(p.phasenStatus[phase.id]||"nicht_begonnen"));
                      const isAktiv = p.aktivPhase===phase.id;
                      return <div key={phase.id} title={`SIA ${phase.nr}`} style={{flex:1,height:6,borderRadius:1,background:s.color,opacity:s.id==="nicht_begonnen"?0.15:1,outline:isAktiv?`2px solid ${phase.color}`:undefined,outlineOffset:1}}/>;
                    })}
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:9,color:C.dim}}>SIA 11</span>
                    <span style={{fontSize:9,color:C.green,fontWeight:700}}>{phasenFreigegeben}/{phasenTotal} Phasen ✓</span>
                    <span style={{fontSize:9,color:C.dim}}>SIA 61</span>
                  </div>
                </div>

                {/* Kennzahlen */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                  {[
                    ["BGF", `${(p.bgf||0).toLocaleString("de-CH")} m²`],
                    ["BKP Total", p.bkpSumme?`CHF ${(p.bkpSumme/1000000).toFixed(1)}M`:"—"],
                    ["Aktuell", bkpAktuell?`CHF ${(bkpAktuell/1000000).toFixed(1)}M`:"—"],
                    ["Dokumente", gesamtDoks],
                  ].map(([k,v])=>(
                    <div key={k} style={{textAlign:"center"}}>
                      <div style={{fontSize:12,fontWeight:700,color:C.muted}}>{v}</div>
                      <div style={{fontSize:9,color:C.dim,marginTop:1,textTransform:"uppercase",letterSpacing:"0.05em"}}>{k}</div>
                    </div>
                  ))}
                </div>

                {/* Beteiligte Avatare */}
                {p.beteiligte?.length>0&&(
                  <div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:6}}>
                    <div style={{display:"flex",gap:-6}}>
                      {p.beteiligte.slice(0,4).map((b,i)=>{
                        const fb=FACHBEREICHE.find(f=>f.id===b.fb);
                        return <div key={i} title={`${b.name} (${fb?.label})`} style={{width:24,height:24,borderRadius:"50%",background:`${fb?.color||"#888"}22`,border:`2px solid ${C.dark}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:fb?.color,marginLeft:i>0?-8:0,zIndex:p.beteiligte.length-i}}>{fb?.icon}</div>;
                      })}
                    </div>
                    <span style={{fontSize:10,color:C.dim}}>{p.beteiligte.length} Beteiligte</span>
                  </div>
                )}
              </div>
            </Card>
          );
        })}

        {filtered.length===0&&(
          <div style={{textAlign:"center",padding:"60px 20px",color:C.dim}}>
            <div style={{fontSize:32,marginBottom:10}}>◎</div>
            <div style={{fontSize:14}}>Keine Projekte gefunden</div>
          </div>
        )}
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════════════════════
// NEUES PROJEKT FORMULAR
// ══════════════════════════════════════════════════════════════════════════════
const KANTONE = ["AG","AI","AR","BE","BL","BS","FR","GE","GL","GR","JU","LU","NE","NW","OW","SG","SH","SO","SZ","TG","TI","UR","VD","VS","ZG","ZH"];

const NeuProjektForm = ({ onSave, onBack }) => {
  const [f, setF] = useState({ name:"", ort:"", kanton:"", bauherrschaft:"", bgf:"", bkpSumme:"", aktivPhase:"31" });
  const [beteiligte, setBeteiligte] = useState([]);
  const [addFb, setAddFb] = useState("pl_gt");
  const [addName, setAddName] = useState("");
  const [errors, setErrors] = useState({});
  const upd = (k,v) => setF(p=>({...p,[k]:v}));

  const addBeteiligter = () => {
    if(!addName.trim()) return;
    setBeteiligte(p=>[...p,{fb:addFb,name:addName,email:""}]);
    setAddName("");
  };

  const validate = () => {
    const e = {};
    if(!f.name.trim()) e.name="Pflichtfeld";
    if(!f.ort.trim()) e.ort="Pflichtfeld";
    if(!f.kanton) e.kanton="Pflichtfeld";
    if(!f.bauherrschaft.trim()) e.bauherrschaft="Pflichtfeld";
    setErrors(e); return Object.keys(e).length===0;
  };

  const save = () => {
    if(!validate()) return;
    const initStatus = {};
    SIA_PHASEN.forEach(p=>initStatus[p.id]="nicht_begonnen");
    onSave({
      id: Date.now(), name:f.name, ort:f.ort, kanton:f.kanton,
      bauherrschaft:f.bauherrschaft, bgf:parseInt(f.bgf)||0,
      bkpSumme:parseInt(f.bkpSumme)||0, aktivPhase:f.aktivPhase,
      beteiligte, phasenStatus:initStatus, plaene:{}, bkpKosten:{}, dokumente:[],
    });
  };

  const iBase = {background:"rgba(255,255,255,0.05)",border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 14px",color:C.main,fontSize:13,outline:"none",width:"100%",boxSizing:"border-box",fontFamily:"inherit"};

  return (
    <div style={{minHeight:"100vh",background:C.dark,fontFamily:"'DM Sans','Helvetica Neue',Arial,sans-serif",color:C.main}}>
      <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"20px 24px",display:"flex",alignItems:"center",gap:14}}>
        <button onClick={onBack} style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${C.border}`,borderRadius:9,padding:"8px 14px",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Zurück</button>
        <div style={{fontSize:18,fontWeight:800,letterSpacing:"-0.02em"}}>Neues Projekt</div>
      </div>

      <div style={{padding:"20px 24px",display:"flex",flexDirection:"column",gap:20,maxWidth:680,margin:"0 auto"}}>
        {/* Grunddaten */}
        <Card style={{padding:20}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:16}}>Projektdaten</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>
              <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>PROJEKTNAME *</div>
              <input value={f.name} onChange={e=>upd("name",e.target.value)} placeholder="z.B. Wohnüberbauung Zürichberg" style={{...iBase,borderColor:errors.name?"rgba(232,115,90,0.6)":C.border}}/>
              {errors.name&&<div style={{fontSize:10,color:C.red,marginTop:3}}>{errors.name}</div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 100px",gap:12}}>
              <div>
                <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>ORT *</div>
                <input value={f.ort} onChange={e=>upd("ort",e.target.value)} placeholder="z.B. Zürich" style={{...iBase,borderColor:errors.ort?"rgba(232,115,90,0.6)":C.border}}/>
              </div>
              <div>
                <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>KANTON *</div>
                <select value={f.kanton} onChange={e=>upd("kanton",e.target.value)} style={{...iBase,appearance:"none"}}>
                  <option value="">KT</option>
                  {KANTONE.map(k=><option key={k} value={k}>{k}</option>)}
                </select>
              </div>
            </div>
            <div>
              <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>BAUHERRSCHAFT *</div>
              <input value={f.bauherrschaft} onChange={e=>upd("bauherrschaft",e.target.value)} placeholder="z.B. Müller Immobilien AG" style={{...iBase,borderColor:errors.bauherrschaft?"rgba(232,115,90,0.6)":C.border}}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <div>
                <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>BGF (m²)</div>
                <input type="number" value={f.bgf} onChange={e=>upd("bgf",e.target.value)} placeholder="z.B. 4200" style={iBase}/>
              </div>
              <div>
                <div style={{fontSize:10,color:C.dim,marginBottom:5,letterSpacing:"0.05em"}}>BKP TOTAL (CHF)</div>
                <input type="number" value={f.bkpSumme} onChange={e=>upd("bkpSumme",e.target.value)} placeholder="z.B. 12500000" style={iBase}/>
              </div>
            </div>
          </div>
        </Card>

        {/* Aktive Phase */}
        <Card style={{padding:20}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:14}}>Aktuelle SIA-Phase</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {SIA_PHASEN.map(phase=>(
              <button key={phase.id} onClick={()=>upd("aktivPhase",phase.id)} style={{
                padding:"8px 14px",borderRadius:9,cursor:"pointer",
                border:`2px solid ${f.aktivPhase===phase.id?phase.color:"rgba(255,255,255,0.08)"}`,
                background:f.aktivPhase===phase.id?`${phase.color}18`:"rgba(255,255,255,0.02)",
                color:f.aktivPhase===phase.id?phase.color:"#666",
                fontSize:11,fontWeight:700,fontFamily:"inherit",transition:"all 0.15s",
              }}>SIA {phase.nr} — {phase.kurz}</button>
            ))}
          </div>
        </Card>

        {/* Beteiligte */}
        <Card style={{padding:20}}>
          <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:14}}>Projektteam</div>
          <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
            {beteiligte.map((b,i)=>{
              const fb=FACHBEREICHE.find(f=>f.id===b.fb);
              return <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:9,padding:"9px 12px"}}>
                <span style={{color:fb?.color,fontSize:14}}>{fb?.icon}</span>
                <span style={{fontSize:12,color:C.muted,flex:1}}>{b.name}</span>
                <FbChip fbId={b.fb} small/>
                <button onClick={()=>setBeteiligte(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:14,padding:"0 4px"}}>✕</button>
              </div>;
            })}
          </div>
          <div style={{display:"flex",gap:8}}>
            <select value={addFb} onChange={e=>setAddFb(e.target.value)} style={{...iBase,flex:"0 0 140px",appearance:"none"}}>
              {FACHBEREICHE.map(fb=><option key={fb.id} value={fb.id}>{fb.icon} {fb.label}</option>)}
            </select>
            <input value={addName} onChange={e=>setAddName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBeteiligter()} placeholder="Name" style={{...iBase,flex:1}}/>
            <button onClick={addBeteiligter} style={{padding:"0 18px",borderRadius:9,cursor:"pointer",background:"rgba(200,169,110,0.15)",border:"1px solid rgba(200,169,110,0.3)",color:C.gold,fontSize:18,fontFamily:"inherit",flexShrink:0}}>+</button>
          </div>
        </Card>

        <button onClick={save} style={{padding:"15px",borderRadius:12,cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:15,fontWeight:800,fontFamily:"inherit"}}>
          ✓ Projekt erstellen
        </button>
      </div>
    </div>
  );
};



// ══════════════════════════════════════════════════════════════════════════════
// MASTER APP — ALLE MODULE
// ══════════════════════════════════════════════════════════════════════════════
function MasterApp() {
  const [user, setUser] = useState(null);
  const [allUsers, setAllUsers] = useState(DEMO_USERS);
  const [mainTab, setMainTab] = useState("projekte");
  const [projekte, setProjekte] = useState(INIT_PROJEKTE);
  const [aktivProjekt, setAktivProjekt] = useState(null);
  const [view, setView] = useState("liste"); // liste | detail | neu

  const handleLogin  = u => { setUser(u); setMainTab("projekte"); setView("liste"); };
  const handleLogout = () => { setUser(null); setMainTab("projekte"); setView("liste"); };
  const handleUpdateUser = u => { setAllUsers(p => p.map(x => x.id === u.id ? u : x)); setUser(u); };
  const handleUpdateProjekt = u => { setProjekte(p => p.map(x => x.id === u.id ? u : x)); setAktivProjekt(u); };
  const handleSaveProjekt = p => { setProjekte(prev => [...prev, p]); setView("liste"); };
  const openProjekt = p => { setAktivProjekt(p); setView("detail"); };

  if (!user) return <AuthScreen onLogin={handleLogin}/>;

  const canEdit = ["admin","planer"].includes(user.rolle);
  const showTabBar = !(view === "detail" || view === "neu");

  const TABS = [
    { id:"projekte", ic:"▦", l:"Projekte" },
    ...(canEdit ? [{ id:"neu", ic:"+", l:"Neu" }] : []),
    { id:"nachweise", ic:"◈", l:"Nachweise" },
    { id:"profil",   ic:"◯", l:"Profil" },
  ];

  return (
    <AuthCtx.Provider value={{ user }}>
      <div style={{ minHeight:"100vh", background:"#0D0D0B" }}>

        {/* Projektverwaltung Views */}
        {mainTab === "projekte" && view === "liste" && (
          <ProjektListe projekte={projekte} onProjekt={openProjekt} onNeu={() => setView("neu")}/>
        )}
        {mainTab === "projekte" && view === "detail" && aktivProjekt && (
          <ProjektDetail
            initProjekt={aktivProjekt}
            onBack={() => setView("liste")}
            onUpdate={handleUpdateProjekt}
          />
        )}
        {mainTab === "projekte" && view === "neu" && canEdit && (
          <NeuProjektForm onSave={handleSaveProjekt} onBack={() => setView("liste")}/>
        )}

        {/* Energienachweise */}
        {mainTab === "nachweise" && <Energienachweise/>}

        {/* Profil */}
        {mainTab === "profil" && (
          <Profil onLogout={handleLogout} onUpdateUser={handleUpdateUser}/>
        )}

        {/* Bottom Tab Bar */}
        {showTabBar && (
          <div style={{ position:"fixed", bottom:0, left:0, right:0,
            background:"rgba(8,8,7,0.97)", borderTop:"1px solid rgba(255,255,255,0.08)",
            display:"flex", zIndex:200, paddingBottom:"env(safe-area-inset-bottom)", backdropFilter:"blur(20px)" }}>
            {TABS.map(t => (
              <button key={t.id} onClick={() => {
                if (t.id === "neu") { setView("neu"); setMainTab("projekte"); }
                else { setMainTab(t.id); if (t.id === "projekte") setView("liste"); }
              }} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center",
                justifyContent:"center", padding:"10px 4px 8px", border:"none",
                background:"transparent", cursor:"pointer", gap:3, position:"relative" }}>
                <span style={{ fontSize: t.id==="neu"?24:17,
                  color: mainTab===t.id && !(t.id==="neu") ? "#C8A96E" : t.id==="neu" ? "#C8A96E" : "#555",
                  fontWeight: t.id==="neu" ? 300 : 400, lineHeight:1 }}>{t.ic}</span>
                <span style={{ fontSize:9, fontWeight:700,
                  color: mainTab===t.id ? "#C8A96E" : "#444",
                  letterSpacing:"0.04em" }}>{t.l}</span>
                {mainTab===t.id && t.id!=="neu" && (
                  <div style={{ position:"absolute", top:0, left:"25%", right:"25%",
                    height:2, background:"#C8A96E", borderRadius:"0 0 2px 2px" }}/>
                )}
              </button>
            ))}
          </div>
        )}
      </div>
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MasterApp/>);
</script>
</body>
</html>
