}

// ── OFFERTE FORMULAR (Modal/Fullscreen) ───────────────────────────────────
function OfferteFormular({projektId, onSave, onClose}){
  const {offerten,setOfferten,projekte,firma}=useApp();
  const proj=projekte.find(p=>p.id===projektId);
  const nextNr=`OFF-${String(offerten.filter(o=>o.projektId===projektId).length+1).padStart(2,"0")}`;

  // ── OFFERT-MODUS ────────────────────────────────────────────────────
  // "gesamt" | "phasengruppen" | "einzeln"
  const [modus,setModus]=useState("gesamt");

  // ── BASIS STATE ─────────────────────────────────────────────────────
  const [f,setF]=useState({nr:nextNr,titel:"Honorarofferte",datum:today(),gueltigBis:""});
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  // ── PHASENGRUPPEN ───────────────────────────────────────────────────
  // Gruppen: 30=SIA31+32+33, 40=SIA41, 50=SIA51+52, 60=SIA61
  const PHASEN_GRUPPEN=[
    {id:"g30",label:"Phase 30 — Planung",         phasen:["31","32","33"],anteile:{31:0.15,32:0.10,33:0.30},totalAnteil:0.55},
    {id:"g40",label:"Phase 40 — Ausschreibung",   phasen:["41"],          anteile:{41:0.10},totalAnteil:0.10},
    {id:"g50",label:"Phase 50 — Realisierung",    phasen:["51","52"],     anteile:{51:0.25,52:0.05},totalAnteil:0.30},
    {id:"g60",label:"Phase 60 — Bewirtschaftung", phasen:["61"],          anteile:{61:0.05},totalAnteil:0.05},
  ];

  // ── POSITIONEN STATE ─────────────────────────────────────────────────
  // Jede Position hat: id, typ (gesamt|gruppe|einzeln), phasen[], methode, betrag, bkpBasis, schwierigkeit, stunden[], details
  const emptyPos=(extra={})=>({
    id:Date.now()+Math.random(),
    typ:modus,
    phasen: modus==="gesamt"?["31","32","33","41","51","52","61"]:
            modus==="phasengruppen"?["31","32","33"]:["31"],
    gruppenIds: modus==="phasengruppen"?["g30"]:[],
    methode:"pauschal",
    betrag:"",
    bkpBasis:String(proj?.bkpSumme||""),
    sia108Schwierigkeit:3,
    stunden:"",
    stundenansatz:150,
    sia108StundenPos:[],
    details:"",
    ...extra
  });
  const [positionen,setPositionen]=useState([emptyPos()]);
  const updPos=(id,k,v)=>setPositionen(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));

  // ── ZAHLUNGSPLAN ─────────────────────────────────────────────────────
  const [zpModus,setZpModus]=useState("manuell"); // manuell | phasen
  const [zp,setZp]=useState([
    {id:1,bezeichnung:"1. Akonto",prozent:"30"},
    {id:2,bezeichnung:"2. Akonto",prozent:"40"},
    {id:3,bezeichnung:"Schlusszahlung",prozent:"30"},
  ]);

  // ── BERECHNUNG ───────────────────────────────────────────────────────
  const calcPos=(pos)=>{
    const basis=parseFloat(pos.bkpBasis)||parseFloat(proj?.bkpSumme)||0;
    if(pos.methode==="sia108"){
      return sia108Honorar(basis,pos.sia108Schwierigkeit||3);
    }
    if(pos.methode==="sia108_anteilig"){
      const total=sia108Honorar(basis,pos.sia108Schwierigkeit||3);
      // Sum up the anteil of all selected phases
      const anteil=(pos.phasen||[]).reduce((a,phId)=>{
        const ph=SIA108_PHASENANTEILE[phId];
        return a+(ph?ph.anteil:0);
      },0);
      return Math.round(total*anteil);
    }
    if(pos.methode==="sia108_stunden"){
      return (pos.sia108StundenPos||[]).reduce((a,s)=>a+(parseFloat(s.stunden)||0)*(parseFloat(s.ansatz)||0),0);
    }
    if(pos.methode==="sia"){
      return basis*(parseFloat(pos.prozent)||0)/100;
    }
    if(pos.methode==="stunden"){
      return (parseFloat(pos.stunden)||0)*(parseFloat(pos.stundenansatz)||0);
    }
    return parseFloat(pos.betrag)||0;
  };

  const subtotal=positionen.reduce((a,p)=>a+calcPos(p),0);
  const mwstSatz=parseFloat(firma.mwstSatz)||8.1;
  const mwstBetrag=subtotal*mwstSatz/100;
  const total=subtotal+mwstBetrag;

  // ── ZAHLUNGSPLAN GENERIEREN ──────────────────────────────────────────
  const getZpAusPhasen=()=>{
    // Build ZP from the phases in all positions
    const allPhasen=[...new Set(positionen.flatMap(p=>p.phasen||[]))];
    const res=[];
    PHASEN_GRUPPEN.forEach(g=>{
      const inOff=g.phasen.some(ph=>allPhasen.includes(ph));
      if(!inOff)return;
      const anteil=g.totalAnteil;
      const betrag=Math.round(total*anteil);
      res.push({id:g.id,bezeichnung:`Bei Abschluss ${g.label}`,prozent:String(Math.round(anteil*100)),betrag});
    });
    return res;
  };

  const zpRows=zpModus==="phasen"?getZpAusPhasen():zp;
  const zpTotal=zpRows.reduce((a,z)=>a+parseFloat(z.prozent||0),0);

  // ── SAVE ─────────────────────────────────────────────────────────────
  const save=()=>{
    if(!f.titel.trim())return;
    const off={id:Date.now(),projektId,...f,modus,positionen,
      subtotal,mwstSatz,mwstBetrag,total,
      zahlungsplan:zpRows,status:"entwurf",erstellt:today()};
    setOfferten(p=>[...p,off]);
    onSave&&onSave(off);
    onClose&&onClose();
  };

  // ── PHASEN TOGGLE HELPER ─────────────────────────────────────────────
  const togglePhase=(posId,phId)=>{
    setPositionen(p=>p.map(x=>{
      if(x.id!==posId)return x;
      const has=x.phasen.includes(phId);
      const next=has?x.phasen.filter(i=>i!==phId):[...x.phasen,phId];
      return {...x,phasen:next};
    }));
  };
  const toggleGruppe=(posId,gId)=>{
    const g=PHASEN_GRUPPEN.find(x=>x.id===gId);
    if(!g)return;
    setPositionen(p=>p.map(x=>{
      if(x.id!==posId)return x;
      const hasG=x.gruppenIds?.includes(gId);
      const nextG=hasG?(x.gruppenIds||[]).filter(i=>i!==gId):[...(x.gruppenIds||[]),gId];
      // Update phasen too
      const phasenOhneG=x.phasen.filter(ph=>!g.phasen.includes(ph));
      const nextPh=hasG?phasenOhneG:[...phasenOhneG,...g.phasen];
      return {...x,gruppenIds:nextG,phasen:nextPh};
    }));
  };

  // ── POSITION DETAIL: Betrag-Eingabe je nach Methode ──────────────────
  const renderPosInput=(pos)=>{
    const basis=parseFloat(pos.bkpBasis)||parseFloat(proj?.bkpSumme)||0;
    const sia108Total=sia108Honorar(basis,pos.sia108Schwierigkeit||3);
    const anteilSum=(pos.phasen||[]).reduce((a,phId)=>a+(SIA108_PHASENANTEILE[phId]?.anteil||0),0);
    const sia108Anteilig=Math.round(sia108Total*anteilSum);

    return <div>
      {/* Methode Wahl */}
      <Field label="Berechnungsmethode" style={{marginBottom:"10px"}}>
        <Select value={pos.methode} onChange={v=>updPos(pos.id,"methode",v)} options={(()=>{
          const base=[
            {value:"pauschal",        label:"Pauschal — frei definiert"},
            {value:"sia108_stunden",  label:"⭐ SIA 108 — Stundenhonorar (Art. 5.4)"},
            {value:"sia",             label:"% vom BKP (manuell)"},
            {value:"stunden",         label:"Stundenhonorar (manuell)"},
          ];
          // Gesamthonorar Kurve: nur bei gesamt oder phasengruppen sinnvoll
          if(modus==="gesamt"||modus==="phasengruppen") return [
            {value:"sia108",          label:"⭐ SIA 108 — Gesamthonorar (Kurve)"},
            {value:"sia108_anteilig", label:"⭐ SIA 108 — anteilig (gewählte Phasen)"},
            ...base,
          ];
          // Einzelphasen: nur anteilig oder pauschal/stunden
          return [
            {value:"sia108_anteilig", label:"⭐ SIA 108 — anteilig (diese Phase)"},
            ...base,
          ];
        })()}/>
      </Field>

      {/* PAUSCHAL */}
      {pos.methode==="pauschal"&&<div>
        <Field label="Pauschalbetrag (CHF)" style={{marginBottom:"8px"}}>
          <Input value={pos.betrag} onChange={v=>updPos(pos.id,"betrag",v)} placeholder="0.00" type="number"/>
        </Field>
        {parseFloat(pos.betrag)>0&&(pos.phasen||[]).length>0&&modus!=="gesamt"&&(()=>{
          const total=parseFloat(pos.betrag);
          const anteilSum=(pos.phasen||[]).reduce((a,phId)=>a+(SIA108_PHASENANTEILE[phId]?.anteil||0),0);
          // If we have anteil info, show breakdown; otherwise split equally
          const hasSia=(pos.phasen||[]).every(phId=>SIA108_PHASENANTEILE[phId]);
          return <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:"10px",padding:"10px 12px",marginBottom:"8px"}}>
            <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Aufschlüsselung auf Phasen</div>
            {(pos.phasen||[]).sort().map(phId=>{
              const ph=SIA.find(x=>x.id===phId);
              const phInfo=SIA108_PHASENANTEILE[phId];
              const anteil=hasSia&&anteilSum>0?(phInfo?.anteil||0)/anteilSum:1/(pos.phasen||[]).length;
              const betrag=Math.round(total*anteil);
              return <div key={phId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"700",color:C.main}}>SIA {ph?.nr} — {ph?.kurz}</span>
                  {hasSia&&<span style={{fontSize:"9px",color:C.dim,marginLeft:"8px"}}>{Math.round(anteil*100)}% (SIA 108 Anteil)</span>}
                </div>
                <span style={{fontSize:"12px",fontWeight:"800",color:C.gold}}>{fmtCHF(betrag)}</span>
              </div>;
            })}
            {!hasSia&&<div style={{fontSize:"9px",color:C.dim,marginTop:"5px"}}>* Gleichmässig aufgeteilt (keine SIA 108 Anteile verfügbar)</div>}
          </div>;
        })()}
        {parseFloat(pos.betrag)>0&&modus==="gesamt"&&(()=>{
          const total=parseFloat(pos.betrag);
          return <div style={{background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.15)",borderRadius:"10px",padding:"10px 12px",marginBottom:"8px"}}>
            <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Aufschlüsselung gemäss SIA 108 Anteile</div>
            {Object.entries(SIA108_PHASENANTEILE).map(([phId,phInfo])=>{
              const ph=SIA.find(x=>x.id===phId);
              const betrag=Math.round(total*phInfo.anteil);
              return <div key={phId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${C.border}`}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"700",color:C.main}}>SIA {ph?.nr} — {ph?.kurz}</span>
                  <span style={{fontSize:"9px",color:C.dim,marginLeft:"8px"}}>{Math.round(phInfo.anteil*100)}%</span>
                </div>
                <span style={{fontSize:"12px",fontWeight:"800",color:C.gold}}>{fmtCHF(betrag)}</span>
              </div>;
            })}
          </div>;
        })()}
      </div>}

      {/* SIA 108 BASIS (für sia108 und sia108_anteilig) */}
      {(pos.methode==="sia108"||pos.methode==="sia108_anteilig")&&<div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px",marginBottom:"8px"}}>
          <Field label="Anrechenbare Kosten CHF" hint="BKP 26+27+28">
            <Input value={pos.bkpBasis} onChange={v=>updPos(pos.id,"bkpBasis",v)} placeholder={String(proj?.bkpSumme||"")} type="number"/>
          </Field>
          <Field label="Schwierigkeitsgrad (1–5)">
            <Select value={pos.sia108Schwierigkeit||3} onChange={v=>updPos(pos.id,"sia108Schwierigkeit",parseInt(v))}
              options={SIA108_SCHWIERIGKEIT.map(s=>({value:s.id,label:s.label}))}/>
          </Field>
        </div>
        <div style={{fontSize:"10px",color:C.dim,padding:"6px 10px",background:"rgba(255,255,255,0.03)",borderRadius:"6px",marginBottom:"8px"}}>
          {SIA108_SCHWIERIGKEIT.find(s=>s.id===(pos.sia108Schwierigkeit||3))?.desc}
        </div>
        {basis>0&&<div style={{background:"rgba(200,169,110,0.08)",borderRadius:"8px",padding:"10px 12px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"3px"}}>
            <span style={{fontSize:"11px",color:C.muted}}>Gesamthonorar Kurve (Schwg. {pos.sia108Schwierigkeit||3})</span>
            <span style={{fontSize:"11px",color:C.muted}}>{fmtCHF(sia108Total)}</span>
          </div>
          {pos.methode==="sia108_anteilig"&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:"3px"}}>
            <span style={{fontSize:"11px",color:C.muted}}>Anteil gewählte Phasen ({Math.round(anteilSum*100)}%)</span>
            <span style={{fontSize:"11px",color:C.muted}}>{fmtCHF(sia108Anteilig)}</span>
          </div>}
          <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${C.border}`,paddingTop:"6px",marginTop:"4px"}}>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>Honorar (netto)</span>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>{fmtCHF(calcPos(pos))}</span>
          </div>
        </div>}
        {/* Phase breakdown for sia108_anteilig */}
        {pos.methode==="sia108_anteilig"&&basis>0&&(pos.phasen||[]).length>0&&<div style={{marginTop:"6px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"5px"}}>Aufschlüsselung pro Phase</div>
          {(pos.phasen||[]).sort().map(phId=>{
            const ph=SIA108_PHASENANTEILE[phId];
            if(!ph)return null;
            const b=Math.round(sia108Total*ph.anteil);
            return <div key={phId} style={{display:"flex",justifyContent:"space-between",padding:"4px 8px",borderRadius:"5px",marginBottom:"2px",background:"rgba(255,255,255,0.03)"}}>
              <span style={{fontSize:"11px",color:C.muted}}>{ph.label}</span>
              <div><span style={{fontSize:"10px",color:C.dim,marginRight:"8px"}}>{Math.round(ph.anteil*100)}%</span>
              <span style={{fontSize:"11px",fontWeight:"700",color:C.muted}}>{fmtCHF(b)}</span></div>
            </div>;
          })}
        </div>}
      </div>}

      {/* SIA 108 STUNDEN */}
      {pos.methode==="sia108_stunden"&&<div style={{background:"rgba(200,169,110,0.06)",border:`1px solid rgba(200,169,110,0.2)`,borderRadius:"10px",padding:"12px"}}>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Stundenansätze SIA 108 Art. 5.4</div>
        {SIA108_STUNDENANSAETZE.map(sa=>{
          const ex=(pos.sia108StundenPos||[]).find(x=>x.id===sa.id)||{stunden:""};
          const sub=(parseFloat(ex.stunden)||0)*sa.ansatz;
          return <div key={sa.id} style={{display:"grid",gridTemplateColumns:"1fr 80px 80px",gap:"8px",alignItems:"center",marginBottom:"8px"}}>
            <div><div style={{fontSize:"11px",fontWeight:"600",color:C.main}}>{sa.label}</div>
            <div style={{fontSize:"10px",color:C.dim}}>CHF {sa.ansatz}/h</div></div>
            <Input value={ex.stunden} onChange={v=>{
              const upd=(pos.sia108StundenPos||[]).filter(x=>x.id!==sa.id);
              if(v)upd.push({id:sa.id,stunden:v,ansatz:sa.ansatz});
              updPos(pos.id,"sia108StundenPos",upd);
            }} placeholder="0" type="number"/>
            <div style={{fontSize:"11px",color:C.muted,textAlign:"right",fontWeight:sub>0?"700":"400"}}>{sub>0?fmtCHF(sub):""}</div>
          </div>;
        })}
        {calcPos(pos)>0&&<div style={{display:"flex",justifyContent:"space-between",paddingTop:"8px",borderTop:`1px solid ${C.border}`}}>
          <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>Total Stunden</span>
          <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>{fmtCHF(calcPos(pos))}</span>
        </div>}
      </div>}

      {/* % VOM BKP MANUELL */}
      {pos.methode==="sia"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px"}}>
        <Field label="BKP Basis (CHF)"><Input value={pos.bkpBasis} onChange={v=>updPos(pos.id,"bkpBasis",v)} placeholder={String(proj?.bkpSumme||0)} type="number"/></Field>
        <Field label="Prozentsatz (%)"><Input value={pos.prozent} onChange={v=>updPos(pos.id,"prozent",v)} placeholder="z.B. 3.5" type="number"/></Field>
      </div>}

      {/* STUNDEN MANUELL */}
      {pos.methode==="stunden"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"9px"}}>
        <Field label="Stunden"><Input value={pos.stunden} onChange={v=>updPos(pos.id,"stunden",v)} placeholder="0" type="number"/></Field>
        <Field label="Ansatz (CHF/h)"><Input value={pos.stundenansatz} onChange={v=>updPos(pos.id,"stundenansatz",v)} placeholder="150" type="number"/></Field>
      </div>}
    </div>;
  };

  // ── RENDER ────────────────────────────────────────────────────────────
  return <div style={{background:C.card,borderRadius:"14px",padding:"18px",marginBottom:"16px"}}>

    {/* Header + Basisdaten */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
      <div style={{fontSize:"14px",fontWeight:"800",color:C.gold}}>Neue Offerte</div>
      {onClose&&<span onClick={onClose} style={{color:C.dim,cursor:"pointer",fontSize:"18px"}}>✕</span>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"100px 1fr",gap:"10px",marginBottom:"10px"}}>
      <Field label="Offerten-Nr."><Input value={f.nr} onChange={v=>upd("nr",v)} placeholder="OFF-01"/></Field>
      <Field label="Titel"><Input value={f.titel} onChange={v=>upd("titel",v)} placeholder="Honorarofferte"/></Field>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
      <Field label="Datum"><Input value={f.datum} onChange={v=>upd("datum",v)} type="date"/></Field>
      <Field label="Gültig bis"><Input value={f.gueltigBis} onChange={v=>upd("gueltigBis",v)} type="date"/></Field>
    </div>

    {/* ── MODUS WAHL ── */}
    <div style={{marginBottom:"18px"}}>
      <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Offert-Art</div>
      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
        {[
          {id:"gesamt",        icon:"◈", title:"Gesamtofferte",    desc:"Alle Phasen — ein Gesamtpreis, aufgeteilt auf alle Phasen"},
          {id:"phasengruppen", icon:"◑", title:"Phasengruppen",    desc:"Phasen 30 / 40 / 50 / 60 einzeln offerieren — je ein Preis pro Gruppe"},
          {id:"einzeln",       icon:"○", title:"Einzelphasen",     desc:"Jede SIA-Phase einzeln offerieren — volle Kontrolle über jeden Preis"},
        ].map(m=><div key={m.id} onClick={()=>{setModus(m.id);setPositionen([emptyPos({typ:m.id,
          phasen:m.id==="gesamt"?["31","32","33","41","51","52","61"]:m.id==="phasengruppen"?["31","32","33"]:["31"],
          gruppenIds:m.id==="phasengruppen"?["g30"]:[],
          methode:m.id==="einzeln"?"sia108_anteilig":"sia108",
        })]);}}
          style={{padding:"12px 14px",borderRadius:"10px",cursor:"pointer",border:`2px solid ${modus===m.id?C.gold:"rgba(255,255,255,0.08)"}`,background:modus===m.id?"rgba(200,169,110,0.08)":"rgba(255,255,255,0.02)"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"3px"}}>
            <span style={{fontSize:"16px",color:modus===m.id?C.gold:"#555"}}>{m.icon}</span>
            <span style={{fontSize:"13px",fontWeight:"700",color:modus===m.id?C.gold:C.main}}>{m.title}</span>
          </div>
          <div style={{fontSize:"11px",color:C.dim,paddingLeft:"24px"}}>{m.desc}</div>
        </div>)}
      </div>
    </div>

    {/* ── POSITIONEN ── */}
    <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Honorarpositionen</div>

    {positionen.map((pos,posIdx)=>{
      const betrag=calcPos(pos);
      return <div key={pos.id} style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",marginBottom:"12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <span style={{fontSize:"12px",fontWeight:"700",color:C.main}}>Position {posIdx+1}</span>
            {/* Mini phase chips in header */}
            <div style={{display:"flex",flexWrap:"wrap",gap:"4px",marginTop:"5px"}}>
              {(pos.phasen||[]).sort().map(phId=>{
                const ph=SIA.find(x=>x.id===phId);
                return <span key={phId} style={{fontSize:"9px",fontWeight:"700",color:C.blue,background:"rgba(91,143,185,0.15)",padding:"1px 6px",borderRadius:"4px"}}>
                  {ph?.nr}·{ph?.kurz}
                </span>;
              })}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            {betrag>0&&<span style={{fontSize:"14px",fontWeight:"800",color:C.gold}}>{fmtCHF(betrag)}</span>}
            {positionen.length>1&&<span onClick={()=>setPositionen(p=>p.filter(x=>x.id!==pos.id))} style={{color:C.red,cursor:"pointer",fontSize:"14px"}}>✕</span>}
          </div>
        </div>

        {/* ── GESAMT: zeige alle Phasen, kein Picker ── */}
        {modus==="gesamt"&&<div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"6px"}}>Enthaltene Phasen (alle)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>
            {["31","32","33","41","51","52","61"].map(phId=>{
              const ph=SIA.find(x=>x.id===phId);
              return <span key={phId} style={{fontSize:"10px",fontWeight:"700",color:C.gold,background:"rgba(200,169,110,0.12)",padding:"3px 9px",borderRadius:"5px"}}>
                SIA {ph?.nr} {ph?.kurz}
              </span>;
            })}
          </div>
        </div>}

        {/* ── PHASENGRUPPEN: Gruppen anklicken ── */}
        {modus==="phasengruppen"&&<div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"6px"}}>Phasengruppen wählen</div>
          <div style={{display:"flex",flexDirection:"column",gap:"7px"}}>
            {PHASEN_GRUPPEN.map(g=>{
              const sel=(pos.gruppenIds||[]).includes(g.id);
              return <div key={g.id} onClick={()=>toggleGruppe(pos.id,g.id)}
                style={{padding:"9px 12px",borderRadius:"9px",cursor:"pointer",border:`2px solid ${sel?C.gold:"rgba(255,255,255,0.08)"}`,background:sel?"rgba(200,169,110,0.08)":"rgba(255,255,255,0.02)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:sel?"5px":"0"}}>
                  <span style={{fontSize:"12px",fontWeight:"700",color:sel?C.gold:C.muted}}>{sel?"☑":"☐"} {g.label}</span>
                  <span style={{fontSize:"10px",color:C.dim}}>{Math.round(g.totalAnteil*100)}% des Gesamthonorars</span>
                </div>
                {sel&&<div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                  {g.phasen.map(phId=>{
                    const ph=SIA.find(x=>x.id===phId);
                    const phInfo=SIA108_PHASENANTEILE[phId];
                    return <span key={phId} style={{fontSize:"9px",color:C.dim,background:"rgba(255,255,255,0.06)",padding:"2px 7px",borderRadius:"4px"}}>
                      SIA {ph?.nr} {ph?.kurz} · {phInfo?Math.round(phInfo.anteil*100)+"%":""}
                    </span>;
                  })}
                </div>}
              </div>;
            })}
          </div>
          {/* Wenn mehrere Gruppen gewählt: Hinweis dass man mehrere Positionen erstellen soll */}
          <div style={{marginTop:"8px",padding:"6px 10px",background:"rgba(91,143,185,0.06)",border:"1px solid rgba(91,143,185,0.15)",borderRadius:"6px"}}>
            <span style={{fontSize:"10px",color:C.blue}}>💡 Für unterschiedliche Preise/Methoden pro Gruppe → separate Positionen erstellen</span>
          </div>
        </div>}

        {/* ── EINZELN: Jede Phase einzeln wählen ── */}
        {modus==="einzeln"&&<div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"6px"}}>Phase wählen</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
            {SIA.filter(ph=>["31","32","33","41","51","52","61"].includes(ph.id)).map(ph=>{
              const sel=(pos.phasen||[]).includes(ph.id);
              return <div key={ph.id} onClick={()=>{
                // Einzeln = nur eine Phase pro Position
                updPos(pos.id,"phasen",[ph.id]);
              }}
                style={{padding:"7px 12px",borderRadius:"8px",cursor:"pointer",fontSize:"11px",fontWeight:"700",
                  border:`2px solid ${sel?ph.color:"rgba(255,255,255,0.08)"}`,
                  background:sel?`${ph.color}18`:"rgba(255,255,255,0.02)",
                  color:sel?ph.color:"#666"}}>
                SIA {ph.nr} · {ph.kurz}
              </div>;
            })}
          </div>
        </div>}

        {/* ── BETRAG EINGABE ── */}
        {renderPosInput(pos)}

        {/* Leistungsbeschrieb */}
        <Field label="Leistungsbeschrieb" style={{marginTop:"10px"}}>
          <Textarea value={pos.details} onChange={v=>updPos(pos.id,"details",v)} placeholder="Beschreibung der enthaltenen Leistungen..." rows={2}/>
        </Field>
      </div>;
    })}

    <Btn onClick={()=>setPositionen(p=>[...p,emptyPos({id:Date.now()+Math.random()})])} variant="outline" size="sm" full style={{marginBottom:"18px"}}>+ Position hinzufügen</Btn>

    {/* ── TOTAL ── */}
    <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px",marginBottom:"16px"}}>
      {[["Subtotal exkl. MwSt",fmtCHF(subtotal),false],[`MwSt ${mwstSatz}%`,fmtCHF(mwstBetrag),false]].map(([l,v,b])=>
        <div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
          <span style={{fontSize:"12px",color:C.muted}}>{l}</span>
          <span style={{fontSize:"12px",color:C.muted}}>{v}</span>
        </div>)}
      <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${C.border}`,paddingTop:"8px",marginTop:"4px"}}>
        <span style={{fontSize:"15px",fontWeight:"800",color:C.main}}>Total inkl. MwSt</span>
        <span style={{fontSize:"15px",fontWeight:"800",color:C.gold}}>{fmtCHF(total)}</span>
      </div>
    </div>

    {/* ── ZAHLUNGSPLAN ── */}
    <div style={{marginBottom:"16px"}}>
      <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Zahlungsplan</div>

      {/* Zahlungsplan Modus */}
      <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
        {[{id:"manuell",label:"Eigene Prozente"},{id:"phasen",label:"Gemäss Phasen"}].map(m=>
          <div key={m.id} onClick={()=>setZpModus(m.id)} style={{flex:1,padding:"9px",borderRadius:"9px",cursor:"pointer",textAlign:"center",border:`2px solid ${zpModus===m.id?C.gold:"rgba(255,255,255,0.08)"}`,background:zpModus===m.id?"rgba(200,169,110,0.08)":"rgba(255,255,255,0.02)"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:zpModus===m.id?C.gold:C.muted}}>{m.label}</span>
          </div>
        )}
      </div>

      {zpModus==="manuell"&&<div>
        {zp.map((z,i)=><div key={z.id} style={{display:"grid",gridTemplateColumns:"1fr 70px 32px",gap:"8px",alignItems:"center",marginBottom:"8px"}}>
          <Input value={z.bezeichnung} onChange={v=>setZp(p=>p.map(x=>x.id===z.id?{...x,bezeichnung:v}:x))} placeholder="Bezeichnung"/>
          <div style={{position:"relative"}}>
            <Input value={z.prozent} onChange={v=>setZp(p=>p.map(x=>x.id===z.id?{...x,prozent:v}:x))} placeholder="%" type="number"/>
            <span style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",fontSize:"11px",color:C.dim,pointerEvents:"none"}}>%</span>
          </div>
          {zp.length>1&&<span onClick={()=>setZp(p=>p.filter(x=>x.id!==z.id))} style={{color:C.red,cursor:"pointer",textAlign:"center",fontSize:"14px"}}>✕</span>}
        </div>)}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"4px"}}>
          <Btn onClick={()=>setZp(p=>[...p,{id:Date.now(),bezeichnung:"",prozent:""}])} variant="ghost" size="sm">+ Zeile</Btn>
          <span style={{fontSize:"11px",color:zpTotal===100?C.green:C.red,fontWeight:"700"}}>Total: {zpTotal}%</span>
        </div>
      </div>}

      {zpModus==="phasen"&&<div>
        {zpRows.map(z=><div key={z.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"rgba(255,255,255,0.03)",borderRadius:"8px",marginBottom:"6px"}}>
          <span style={{fontSize:"12px",color:C.muted}}>{z.bezeichnung}</span>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:"11px",color:C.dim}}>{z.prozent}%</div>
            <div style={{fontSize:"12px",fontWeight:"700",color:C.gold}}>{fmtCHF(total*parseFloat(z.prozent)/100)}</div>
          </div>
        </div>)}
        <div style={{fontSize:"10px",color:C.dim,marginTop:"6px"}}>Zahlungen fällig jeweils nach Abschluss der Phase</div>
      </div>}
    </div>

    {/* Save */}
    <Btn onClick={save} variant="gold" size="lg" full>✓ Offerte speichern</Btn>
  </div>;
}


function ProjektOfferten({projektId}){
  const {offerten,setOfferten,firma}=useApp();
  const [showForm,setShowForm]=useState(false);
  const [selOff,setSelOff]=useState(null);
  const pOfferten=offerten.filter(o=>o.projektId===projektId);
  const [loading,setLoading]=useState(false);

  const setStatus=(id,st)=>setOfferten(p=>p.map(x=>x.id===id?{...x,status:st}:x));

  if(showForm) return <OfferteFormular projektId={projektId} onSave={o=>{setShowForm(false);setSelOff(o.id);}} onClose={()=>setShowForm(false)}/>;

  // Detail-Ansicht einer Offerte
  if(selOff){
    const o=offerten.find(x=>x.id===selOff);
    if(!o) return null;
    const proj=useApp().projekte.find(p=>p.id===projektId);
    return <div>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>
        <Btn onClick={()=>setSelOff(null)} size="sm">← Alle Offerten</Btn>
        <div style={{flex:1,fontSize:"15px",fontWeight:"700"}}>{o.nr} — {o.titel}</div>
        <Btn onClick={async()=>{setLoading(true);try{await exportOffertePDF(o,proj||{},firma);}finally{setLoading(false);}}} variant="outline" size="sm">{loading?"⏳":"↓ PDF"}</Btn>
      </div>

      {/* Status */}
      <Card style={{padding:"14px",marginBottom:"12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
          <div><OStatusBadge id={o.status}/><div style={{fontSize:"20px",fontWeight:"800",color:C.gold,marginTop:"6px"}}>{fmtCHF(o.totalInklMwst)}</div><div style={{fontSize:"10px",color:C.dim}}>inkl. {firma.mwstSatz||8.1}% MwSt</div></div>
          <div style={{textAlign:"right",fontSize:"10px",color:C.dim}}><div>Datum: {o.datum}</div>{o.gueltigBis&&<div>Gültig: {o.gueltigBis}</div>}</div>
        </div>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"7px"}}>Status ändern</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
          {OFFERT_STATUS.map(s=><div key={s.id} onClick={()=>setStatus(o.id,s.id)}
            style={{padding:"6px 12px",borderRadius:"7px",cursor:"pointer",fontSize:"11px",fontWeight:"700",
              border:`2px solid ${o.status===s.id?s.color:"rgba(255,255,255,0.08)"}`,
              background:o.status===s.id?s.bg:"rgba(255,255,255,0.02)",color:o.status===s.id?s.color:"#555"}}>
            {s.icon} {s.label}
          </div>)}
        </div>
      </Card>

      {/* Positionen */}
      <Card style={{padding:"14px",marginBottom:"12px"}}>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Positionen</div>
        {(o.positionen||[]).map((pos,i)=>{
          const ph=SIA.find(s=>s.id===pos.phaseId);
          return <div key={i} style={{borderBottom:i<(o.positionen||[]).length-1?`1px solid ${C.border}`:"none",paddingBottom:"10px",marginBottom:"10px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1,marginRight:"10px"}}>
                <div style={{fontSize:"13px",fontWeight:"700",color:C.main,marginBottom:"3px"}}>{ph?`SIA ${ph.nr} — ${ph.label}`:`Position ${i+1}`}</div>
                <div style={{fontSize:"10px",color:C.dim}}>{pos.methode==="sia"?`${pos.prozent}% von BKP ${fmtCHF(pos.bkpBasis)}`:pos.methode==="stunden"?`${pos.stunden}h × CHF ${pos.stundenansatz}`:"Pauschal"}</div>
                {pos.details&&<div style={{fontSize:"10px",color:C.dim,marginTop:"2px",fontStyle:"italic"}}>{pos.details}</div>}
              </div>
              <span style={{fontSize:"13px",fontWeight:"700",color:C.gold,flexShrink:0}}>{fmtCHF(pos.betrag)}</span>
            </div>
          </div>;
        })}
        <div style={{background:`${C.gold}08`,border:`1px solid ${C.gold}20`,borderRadius:"8px",padding:"12px",marginTop:"4px"}}>
          {[[`Subtotal`,fmtCHF(o.subtotal)],[`MwSt ${firma.mwstSatz||8.1}%`,fmtCHF(o.mwst)]].map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}><span style={{fontSize:"11px",color:C.muted}}>{l}</span><span style={{fontSize:"11px",color:C.muted}}>{v}</span></div>)}
          <div style={{display:"flex",justifyContent:"space-between",paddingTop:"7px",borderTop:`1px solid ${C.border}`}}>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>Total inkl. MwSt</span>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.gold}}>{fmtCHF(o.totalInklMwst)}</span>
          </div>
        </div>
      </Card>

      {/* Zahlungsplan */}
      {(o.zahlungsplan||[]).length>0&&<Card style={{padding:"14px"}}>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Zahlungsplan</div>
        {(o.zahlungsplan||[]).map((z,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<(o.zahlungsplan||[]).length-1?`1px solid ${C.border}`:"none"}}>
          <div><div style={{fontSize:"12px",fontWeight:"600",color:C.main}}>{z.bezeichnung}</div><div style={{fontSize:"10px",color:C.dim}}>{z.prozent}%</div></div>
          <span style={{fontSize:"13px",fontWeight:"700",color:C.gold}}>{fmtCHF(o.totalInklMwst*(parseFloat(z.prozent)||0)/100)}</span>
        </div>)}
      </Card>}
    </div>;
  }

  // Liste
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
      <div style={{fontSize:"13px",color:C.dim}}>{pOfferten.length} Offerten</div>
      <Btn onClick={()=>setShowForm(true)} variant="gold" size="sm">+ Neue Offerte</Btn>
    </div>

    {pOfferten.length===0&&<div style={{border:"1px dashed rgba(200,169,110,0.2)",borderRadius:"12px",padding:"32px 20px",textAlign:"center"}}>
      <div style={{fontSize:"28px",marginBottom:"10px"}}>📋</div>
      <div style={{fontSize:"13px",color:C.dim,marginBottom:"8px"}}>Noch keine Offerten für dieses Projekt</div>
      <Btn onClick={()=>setShowForm(true)} variant="outline" size="md">+ Erste Offerte erstellen</Btn>
    </div>}

    {pOfferten.map(o=><Card key={o.id} onClick={()=>setSelOff(o.id)} style={{padding:"0",marginBottom:"10px",overflow:"hidden"}}>
      <div style={{height:"3px",background:`linear-gradient(90deg,${o.status==="angenommen"?C.green:o.status==="wartend"?"#E8B45A":C.gold},transparent)`}}/>
      <div style={{padding:"13px 15px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}>
          <div style={{flex:1,marginRight:"10px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"4px"}}>
              <span style={{fontSize:"11px",fontWeight:"700",color:C.gold}}>{o.nr}</span>
              <OStatusBadge id={o.status} small/>
            </div>
            <div style={{fontSize:"14px",fontWeight:"700",color:C.main,marginBottom:"2px"}}>{o.titel}</div>
            <div style={{fontSize:"10px",color:C.dim}}>Datum: {o.datum}{o.gueltigBis?` | Gültig: ${o.gueltigBis}`:""}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:"14px",fontWeight:"800",color:C.gold}}>{fmtCHF(o.totalInklMwst)}</div>
            <div style={{fontSize:"9px",color:C.dim}}>{(o.positionen||[]).length} Pos. | inkl. MwSt</div>
          </div>
        </div>
        {(o.zahlungsplan||[]).length>0&&<div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
          {(o.zahlungsplan||[]).map((z,i)=><span key={i} style={{fontSize:"9px",color:C.dim,background:"rgba(255,255,255,0.05)",padding:"2px 7px",borderRadius:"10px"}}>{z.bezeichnung}: {z.prozent}%</span>)}
        </div>}
      </div>
    </Card>)}
  </div>;
}

// ── RECHNUNGEN TAB (im Projekt) ───────────────────────────────────────────
function ProjektRechnungen({projektId}){
  const {rechnungen,setRechnungen,offerten,projekte,firma}=useApp();
  const [showForm,setShowForm]=useState(false);
  const [selRech,setSelRech]=useState(null);
  const [loading,setLoading]=useState(false);
  const pRechnungen=rechnungen.filter(r=>r.projektId===projektId);
  const pOfferten=offerten.filter(o=>o.projektId===projektId);

  const mwstSatz=parseFloat(firma.mwstSatz)||8.1;
  const totalOffen=pRechnungen.filter(r=>r.status!=="bezahlt").reduce((a,r)=>a+(r.betrag||0)*(1+mwstSatz/100),0);
  const totalBezahlt=pRechnungen.filter(r=>r.status==="bezahlt").reduce((a,r)=>a+(r.betrag||0)*(1+mwstSatz/100),0);

  const setStatus=(id,st)=>setRechnungen(p=>p.map(x=>x.id===id?{...x,status:st}:x));

  if(showForm) return <RechnungFormular projektId={projektId} onSave={r=>{setShowForm(false);setSelRech(r.id);}} onClose={()=>setShowForm(false)}/>;

  // Detail
  if(selRech){
    const r=rechnungen.find(x=>x.id===selRech);
    if(!r) return null;
    const off=offerten.find(o=>o.id===r.offerteId);
    const proj=projekte.find(p=>p.id===projektId);
    const betragNum=parseFloat(r.betrag)||0;
    const mwstB=betragNum*mwstSatz/100;
    return <div>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px"}}>
        <Btn onClick={()=>setSelRech(null)} size="sm">← Alle Rechnungen</Btn>
        <div style={{flex:1,fontSize:"15px",fontWeight:"700"}}>{r.nr}</div>
        <Btn onClick={async()=>{setLoading(true);try{await exportRechnungPDF(r,off,proj||{},firma);}finally{setLoading(false);}}} variant="outline" size="sm">{loading?"⏳":"↓ PDF"}</Btn>
      </div>

      <Card style={{padding:"14px",marginBottom:"12px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
          <div><RStatusBadge id={r.status}/><div style={{fontSize:"20px",fontWeight:"800",color:C.green,marginTop:"6px"}}>{fmtCHF(betragNum+mwstB)}</div><div style={{fontSize:"10px",color:C.dim}}>inkl. {mwstSatz}% MwSt</div></div>
          <div style={{textAlign:"right",fontSize:"10px",color:C.dim}}><div>Datum: {r.datum}</div><div style={{color:r.status==="überfällig"?C.red:C.dim}}>Fällig: {r.faellig||"—"}</div></div>
        </div>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"7px"}}>Status ändern</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
          {RECH_STATUS.map(s=><div key={s.id} onClick={()=>setStatus(r.id,s.id)}
            style={{padding:"6px 12px",borderRadius:"7px",cursor:"pointer",fontSize:"11px",fontWeight:"700",
              border:`2px solid ${r.status===s.id?s.color:"rgba(255,255,255,0.08)"}`,
              background:r.status===s.id?s.bg:"rgba(255,255,255,0.02)",color:r.status===s.id?s.color:"#555"}}>
            {s.icon} {s.label}
          </div>)}
        </div>
      </Card>

      <Card style={{padding:"14px",marginBottom:"12px"}}>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Details</div>
        {[["Bezeichnung",r.bezeichnung||"—"],["Beschreibung",r.beschreibung||"—"],["Offerte Referenz",off?`${off.nr} — ${fmtCHF(off.totalInklMwst)}`:"—"]].map(([k,v])=><div key={k} style={{marginBottom:"9px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:"3px"}}>{k}</div>
          <div style={{fontSize:"12px",color:C.main}}>{v}</div>
        </div>)}
        <div style={{background:`${C.green}08`,border:`1px solid ${C.green}20`,borderRadius:"8px",padding:"12px",marginTop:"4px"}}>
          {[[`Nettobetrag`,fmtCHF(betragNum)],[`MwSt ${mwstSatz}%`,fmtCHF(mwstB)]].map(([l,v])=><div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}><span style={{fontSize:"11px",color:C.muted}}>{l}</span><span style={{fontSize:"11px",color:C.muted}}>{v}</span></div>)}
          <div style={{display:"flex",justifyContent:"space-between",paddingTop:"7px",borderTop:`1px solid ${C.border}`}}>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.green}}>Total</span>
            <span style={{fontSize:"13px",fontWeight:"800",color:C.green}}>{fmtCHF(betragNum+mwstB)}</span>
          </div>
        </div>
      </Card>

      <Card style={{padding:"14px"}}>
        <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Zahlungsangaben</div>
        {[["IBAN",firma.iban||"—"],["Bank",firma.bank||"—"],["Kontoinhaber",firma.name||"—"],["Zahlungsfrist",`${firma.zahlungsfrist||30} Tage`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:"11px",color:C.dim}}>{k}</span>
          <span style={{fontSize:"11px",color:C.muted,fontWeight:"600"}}>{v}</span>
        </div>)}
      </Card>
    </div>;
  }

  // Liste
  return <div>
    {/* Übersicht */}
    {pRechnungen.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"14px"}}>
      {[[fmtCHF(totalOffen),"Offen",C.gold],[fmtCHF(totalBezahlt),"Bezahlt",C.green]].map(([v,l,c])=><Card key={l} style={{padding:"12px 14px"}}>
        <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:"4px"}}>{l}</div>
        <div style={{fontSize:"15px",fontWeight:"800",color:c}}>{v}</div>
      </Card>)}
    </div>}

    {/* Offerten-Fortschritt */}
    {pOfferten.filter(o=>o.status==="angenommen").map(o=>{
      const oGestellt=pRechnungen.filter(r=>r.offerteId===o.id).reduce((a,r)=>a+(r.betrag||0)*(1+mwstSatz/100),0);
      const pct=(oGestellt/o.totalInklMwst)*100;
      return <Card key={o.id} style={{padding:"12px 14px",marginBottom:"10px",background:"rgba(107,175,122,0.05)",border:"1px solid rgba(107,175,122,0.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:C.green}}>📋 {o.nr} — {o.titel}</div>
          <div style={{fontSize:"11px",color:C.dim}}>{fmtCHF(oGestellt)} / {fmtCHF(o.totalInklMwst)}</div>
        </div>
        <ProgBar pct={pct} color={`linear-gradient(90deg,${C.green},${C.green}88)`} h={5}/>
        <div style={{fontSize:"9px",color:C.green,marginTop:"3px",textAlign:"right"}}>{Math.round(pct)}% verrechnet</div>
      </Card>;
    })}

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
      <div style={{fontSize:"13px",color:C.dim}}>{pRechnungen.length} Rechnungen</div>
      <Btn onClick={()=>setShowForm(true)} variant="green" size="sm">🧾 Neue Rechnung</Btn>
    </div>

    {pRechnungen.length===0&&<div style={{border:"1px dashed rgba(107,175,122,0.2)",borderRadius:"12px",padding:"32px 20px",textAlign:"center"}}>
      <div style={{fontSize:"28px",marginBottom:"10px"}}>🧾</div>
      <div style={{fontSize:"13px",color:C.dim,marginBottom:"8px"}}>Noch keine Rechnungen für dieses Projekt</div>
      <Btn onClick={()=>setShowForm(true)} variant="outline" size="md">🧾 Erste Rechnung erstellen</Btn>
    </div>}

    {pRechnungen.map(r=>{
      const off=offerten.find(o=>o.id===r.offerteId);
      const betragNum=parseFloat(r.betrag)||0;
      const totalInkl=betragNum*(1+mwstSatz/100);
      return <Card key={r.id} onClick={()=>setSelRech(r.id)} style={{padding:"0",marginBottom:"10px",overflow:"hidden"}}>
        <div style={{height:"3px",background:`linear-gradient(90deg,${r.status==="bezahlt"?C.green:r.status==="überfällig"?C.red:C.gold},transparent)`}}/>
        <div style={{padding:"13px 15px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
            <div style={{flex:1,marginRight:"10px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:"4px"}}>
                <span style={{fontSize:"11px",fontWeight:"700",color:C.green}}>{r.nr}</span>
                <RStatusBadge id={r.status} small/>
              </div>
              <div style={{fontSize:"13px",fontWeight:"700",color:C.main,marginBottom:"2px"}}>{r.bezeichnung}</div>
              {off&&<div style={{fontSize:"10px",color:C.dim}}>Ref: Offerte {off.nr}</div>}
              <div style={{fontSize:"10px",color:r.status==="überfällig"?C.red:C.dim}}>Fällig: {r.faellig||"—"}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:"14px",fontWeight:"800",color:r.status==="bezahlt"?C.green:C.gold}}>{fmtCHF(totalInkl)}</div>
              <div style={{fontSize:"9px",color:C.dim}}>inkl. MwSt</div>
            </div>
          </div>
        </div>
      </Card>;
    })}
  </div>;
}

// ENERGIENACHWEISE MODULE
// ═══════════════════════════════════════════════════════════════════════════
function Energienachweise(){
  const [tab,setTab]=useState("assistent");
  const [gtyp,setGtyp]=useState("");
  const [bautyp,setBautyp]=useState("");
  const [fb,setFb]=useState("alle");
  const [search,setSearch]=useState("");
  const [katF,setKatF]=useState("alle");
  const [sel,setSel]=useState(null);

  const empf=useMemo(()=>{
    if(!gtyp||!bautyp)return[];
    return NW_DB.filter(n=>n.gtyp.includes(gtyp)&&(bautyp==="neubau"?n.neu:n.san)&&(fb==="alle"||n.fb.includes(fb))).sort((a,b)=>(b.pflicht?1:0)-(a.pflicht?1:0));
  },[gtyp,bautyp,fb]);

  const bib=useMemo(()=>NW_DB.filter(n=>(katF==="alle"||n.kat===katF)&&(!search||n.norm.toLowerCase().includes(search.toLowerCase())||n.titel.toLowerCase().includes(search.toLowerCase()))),[search,katF]);

  if(sel){const kc=KATC[sel.kat];return <div style={{minHeight:"100vh",background:C.dark,paddingBottom:"100px"}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"52px 18px 16px",display:"flex",alignItems:"center",gap:"12px"}}>
      <Btn onClick={()=>setSel(null)} size="sm">←</Btn>
      <div style={{fontSize:"17px",fontWeight:"800"}}>{sel.norm}</div>
    </div>
    <div style={{padding:"16px 18px"}}>
      <div style={{background:kc?.bg,border:`1px solid ${kc?.bd}`,borderRadius:"14px",padding:"18px",marginBottom:"14px"}}>
        <div style={{display:"flex",gap:"7px",marginBottom:"8px"}}>
          <KatBadge kat={sel.kat}/>
          {sel.pflicht&&<span style={{fontSize:"10px",fontWeight:"700",padding:"3px 9px",borderRadius:"5px",background:"rgba(232,115,90,0.15)",border:"1px solid rgba(232,115,90,0.35)",color:C.red}}>PFLICHT</span>}
        </div>
        <div style={{fontSize:"20px",fontWeight:"800",marginBottom:"4px"}}>{sel.norm}</div>
        <div style={{fontSize:"13px",color:C.muted}}>{sel.titel}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
        {[["Neubau",sel.neu?"✓ Ja":"— Nein"],["Sanierung",sel.san?"✓ Ja":"— Nein"],["Aufwand",sel.auf],["Fachbereich",sel.fb.join(", ")]].map(([k,v])=><Card key={k} style={{padding:"11px 13px"}}>
          <div style={{fontSize:"9px",color:C.dim,letterSpacing:"0.06em",marginBottom:"4px"}}>{k.toUpperCase()}</div>
          <div style={{fontSize:"12px",color:C.muted,fontWeight:"600"}}>{v}</div>
        </Card>)}
      </div>
    </div>
  </div>;}

  return <div style={{minHeight:"100vh",background:C.dark,paddingBottom:"100px"}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"52px 18px 16px"}}>
      <div style={{fontSize:"22px",fontWeight:"800",letterSpacing:"-0.02em",marginBottom:"12px"}}>Energienachweise</div>
      <TabBar2 tabs={[{id:"assistent",l:"⚙ Assistent"},{id:"bibliothek",l:"◈ Bibliothek"}]} active={tab} onChange={setTab}/>
    </div>
    <div style={{padding:"16px 18px"}}>
      {tab==="assistent"&&<div>
        <div style={{marginBottom:"12px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Gebäudetyp</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"}}>
            {GTYP.map(g=><div key={g.id} onClick={()=>setGtyp(g.id)} style={{display:"flex",alignItems:"center",gap:"9px",padding:"10px 12px",borderRadius:"10px",cursor:"pointer",border:`1px solid ${gtyp===g.id?"rgba(200,169,110,0.4)":C.border}`,background:gtyp===g.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)"}}>
              <span style={{fontSize:"18px"}}>{g.icon}</span>
              <span style={{fontSize:"12px",fontWeight:"600",color:gtyp===g.id?C.gold:"#888"}}>{g.label}</span>
            </div>)}
          </div>
        </div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          {[["neubau","🏗 Neubau"],["sanierung","🔧 Sanierung"]].map(([id,l])=><div key={id} onClick={()=>setBautyp(id)} style={{flex:1,padding:"11px",borderRadius:"10px",cursor:"pointer",border:`1px solid ${bautyp===id?"rgba(200,169,110,0.4)":C.border}`,background:bautyp===id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)",color:bautyp===id?C.gold:"#666",fontSize:"13px",fontWeight:"700",textAlign:"center"}}>{l}</div>)}
        </div>
        <div style={{display:"flex",gap:"5px",marginBottom:"16px",overflowX:"auto",paddingBottom:"4px"}}>
          {[{id:"alle",l:"Alle"},{id:"bauphysik",l:"Bauphysik ◻"},{id:"hlk",l:"HLK ♨"},{id:"elektro",l:"Elektro ⚡"}].map(f2=><div key={f2.id} onClick={()=>setFb(f2.id)} style={{padding:"7px 13px",borderRadius:"20px",border:`1px solid ${fb===f2.id?"rgba(200,169,110,0.35)":C.border}`,background:fb===f2.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)",color:fb===f2.id?C.gold:"#666",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap",cursor:"pointer",flexShrink:0}}>{f2.l}</div>)}
        </div>
        {gtyp&&bautyp?<div>
          <div style={{padding:"9px 13px",borderRadius:"9px",background:"rgba(200,169,110,0.07)",border:"1px solid rgba(200,169,110,0.15)",marginBottom:"11px",display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:"12px",color:C.muted}}><span style={{color:C.gold,fontWeight:"700"}}>{empf.length}</span> Nachweise</span>
            <span style={{fontSize:"11px",color:C.red,fontWeight:"700"}}>{empf.filter(n=>n.pflicht).length} Pflicht</span>
          </div>
          {empf.map(n=>{const kc=KATC[n.kat];return <Card key={n.id} onClick={()=>setSel(n)} style={{padding:"13px",marginBottom:"8px",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:"2px",background:`linear-gradient(90deg,${kc.tx}88,transparent)`}}/>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
              <div style={{display:"flex",gap:"5px"}}><KatBadge kat={n.kat}/>{n.pflicht&&<span style={{fontSize:"9px",fontWeight:"700",padding:"2px 7px",borderRadius:"4px",background:"rgba(232,115,90,0.15)",border:"1px solid rgba(232,115,90,0.3)",color:C.red}}>PFLICHT</span>}</div>
              <span style={{fontSize:"9px",fontWeight:"700",color:AUFC[n.auf]}}>{n.auf}</span>
            </div>
            <div style={{fontSize:"14px",fontWeight:"700",color:C.main,marginBottom:"2px"}}>{n.norm}</div>
            <div style={{fontSize:"11px",color:"#666"}}>{n.titel}</div>
          </Card>;})}
        </div>:<div style={{border:"2px dashed rgba(255,255,255,0.08)",borderRadius:"14px",padding:"38px 20px",textAlign:"center"}}>
          <div style={{fontSize:"30px",marginBottom:"10px"}}>◈</div>
          <div style={{fontSize:"14px",fontWeight:"600",color:C.dim}}>Gebäudetyp & Massnahme wählen</div>
        </div>}
      </div>}
      {tab==="bibliothek"&&<div>
        <Input value={search} onChange={setSearch} placeholder="Norm suchen... (z.B. SIA, MINERGIE)" style={{marginBottom:"11px"}}/>
        <div style={{display:"flex",gap:"5px",marginBottom:"12px",overflowX:"auto",paddingBottom:"4px"}}>
          {[{id:"alle",l:"Alle"},...Object.keys(KATC).map(k=>({id:k,l:k}))].map(k=>{const kc=k.id!=="alle"?KATC[k.id]:null;return <div key={k.id} onClick={()=>setKatF(k.id)} style={{padding:"6px 12px",borderRadius:"18px",border:`1px solid ${katF===k.id?(kc?kc.bd:"rgba(200,169,110,0.35)"):C.border}`,background:katF===k.id?(kc?kc.bg:"rgba(200,169,110,0.12)"):"rgba(255,255,255,0.03)",color:katF===k.id?(kc?kc.tx:C.gold):"#666",fontSize:"11px",fontWeight:"600",whiteSpace:"nowrap",cursor:"pointer",flexShrink:0}}>{k.l}</div>;}) }
        </div>
        {bib.map(n=>{const kc=KATC[n.kat];return <Card key={n.id} onClick={()=>setSel(n)} style={{padding:"13px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}><KatBadge kat={n.kat}/><span style={{fontSize:"9px",fontWeight:"700",color:AUFC[n.auf]}}>{n.auf}</span></div>
          <div style={{fontSize:"14px",fontWeight:"700",color:C.main,marginBottom:"2px"}}>{n.norm}</div>
          <div style={{fontSize:"11px",color:"#666"}}>{n.titel}</div>
        </Card>;})}
      </div>}
    </div>
  </div>;
}

// PROFIL & FIRMA EINSTELLUNGEN
// ═══════════════════════════════════════════════════════════════════════════
function Profil({onLogoutToOnboarding}){
  const {user,setUser,users,setUsers,firma,setFirma,setNav}=useApp();
  const [ptab,setPtab]=useState("profil");
  const [logoUrl,setLogoUrl]=useState(firma.logoUrl||"");
  const [agbText,setAgbText]=useState(firma.agbText||"");
  const [showNewUser,setShowNewUser]=useState(false);
  const [newUser,setNewUser]=useState({name:"",email:"",rolle:"planer",fb:"pl_gt"});
  const [logoSaved,setLogoSaved]=useState(false);
  const fileInputRef=useRef(null);
  const [name,setName]=useState(user.name);
  const [ufb,setUfb]=useState(user.fb);
  const [profSaved,setProfSaved]=useState(false);
  const [f,setF]=useState({...firma});
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));
  const [firmaSaved,setFirmaSaved]=useState(false);
  const rol=ROLLEN.find(r=>r.id===user.rolle);
  const ini=name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase()||user.kuerzel;

  const saveProfil=()=>{const u={...user,name,fb:ufb,kuerzel:ini};setUsers(p=>p.map(x=>x.id===u.id?u:x));setUser(u);setProfSaved(true);setTimeout(()=>setProfSaved(false),2000);};
  const saveFirma=()=>{setFirma(f);setFirmaSaved(true);setTimeout(()=>setFirmaSaved(false),2000);};

  return <div style={{minHeight:"100vh",background:C.dark,paddingBottom:"100px"}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:"52px 18px 16px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"14px",marginBottom:"14px"}}>
        <Avatar user={{...user,name,kuerzel:ini}} size={50}/>
        <div>
          <div style={{fontSize:"19px",fontWeight:"800",marginBottom:"5px"}}>{name||user.name}</div>
          {rol&&<span style={{fontSize:"9px",fontWeight:"700",color:rol.color,background:`${rol.color}20`,padding:"3px 9px",borderRadius:"4px"}}>{rol.icon} {rol.label}</span>}
        </div>
      </div>
      <TabBar2 tabs={[{id:"profil",l:"👤 Profil"},{id:"firma",l:"🏢 Firma"},{id:"team",l:"👥 Team"},{id:"agb",l:"📄 AGB"}]} active={ptab} onChange={setPtab}/>
    </div>

    <div style={{padding:"16px 18px",display:"flex",flexDirection:"column",gap:"14px"}}>
      {ptab==="profil"&&<>
        <Card style={{padding:"16px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Persönliche Daten</div>
          <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
            <Field label="Name"><Input value={name} onChange={setName} placeholder="Vor- und Nachname"/></Field>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"11px 14px",color:"#555",fontSize:"14px"}}>{user.email}</div>
          </div>
        </Card>
        <Card style={{padding:"16px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Fachbereich</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"}}>
            {FBS.map(fb=><div key={fb.id} onClick={()=>setUfb(fb.id)} style={{display:"flex",alignItems:"center",gap:"8px",padding:"9px 11px",borderRadius:"9px",cursor:"pointer",border:`1px solid ${ufb===fb.id?`${fb.color}55`:C.border}`,background:ufb===fb.id?`${fb.color}12`:"rgba(255,255,255,0.03)"}}>
              <span style={{fontSize:"15px"}}>{fb.icon}</span><span style={{fontSize:"11px",fontWeight:"600",color:ufb===fb.id?fb.color:"#888"}}>{fb.label}</span>
            </div>)}
          </div>
        </Card>
        {rol&&<div style={{background:`${rol.color}10`,border:`1px solid ${rol.color}30`,borderRadius:"12px",padding:"14px",display:"flex",alignItems:"center",gap:"12px"}}>
          <span style={{fontSize:"22px",color:rol.color}}>{rol.icon}</span>
          <div><div style={{fontSize:"13px",fontWeight:"700",color:rol.color}}>{rol.label}</div><div style={{fontSize:"11px",color:C.dim,marginTop:"1px"}}>Rollen werden vom Admin vergeben</div></div>
        </div>}
        <Btn onClick={saveProfil} variant={profSaved?"green":"gold"} size="lg" full>{profSaved?"✓ Gespeichert!":"Profil speichern"}</Btn>
        <Btn onClick={()=>{if(typeof onLogoutToOnboarding==="function")onLogoutToOnboarding();}} variant="danger" size="lg" full>⎋ Abmelden</Btn>
      </>}

      {ptab==="firma"&&<>
        <Card style={{padding:"16px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Firmendaten</div>
          {/* Logo */}
          <div style={{marginBottom:"14px"}}>
            <div style={{fontSize:"10px",color:C.dim,marginBottom:"7px",letterSpacing:"0.06em",textTransform:"uppercase"}}>Firmenlogo</div>
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <div style={{width:"56px",height:"56px",borderRadius:"10px",background:"rgba(200,169,110,0.1)",border:"1px solid rgba(200,169,110,0.3)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
                {logoUrl?<img src={logoUrl} alt="Logo" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
                :<span style={{fontSize:"22px",fontWeight:"900",color:C.gold}}>B</span>}
              </div>
              <div style={{flex:1}}>
                <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
                  const file=e.target.files[0];
                  if(!file)return;
                  const reader=new FileReader();
                  reader.onload=ev=>{setLogoUrl(ev.target.result);setFirma(p=>({...p,logoUrl:ev.target.result}));};
                  reader.readAsDataURL(file);
                }}/>
                <Btn onClick={()=>fileInputRef.current?.click()} variant="outline" size="sm">📎 Logo hochladen</Btn>
                {logoUrl&&<Btn onClick={()=>{setLogoUrl("");setFirma(p=>({...p,logoUrl:""}));}} variant="danger" size="sm" style={{marginLeft:"8px"}}>Entfernen</Btn>}
                <div style={{fontSize:"10px",color:C.dim,marginTop:"5px"}}>PNG, JPG oder SVG · Wird auf PDFs verwendet</div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
            <Field label="Firmenname"><Input value={f.name} onChange={v=>upd("name",v)} placeholder="Mein Ingenieurbüro AG"/></Field>
            <div style={{display:"grid",gridTemplateColumns:"1fr 100px",gap:"10px"}}>
              <Field label="Strasse & Nr."><Input value={f.strasse} onChange={v=>upd("strasse",v)} placeholder="Musterstrasse 1"/></Field>
              <Field label="PLZ"><Input value={f.plz} onChange={v=>upd("plz",v)} placeholder="8001" type="number"/></Field>
            </div>
            <Field label="Ort"><Input value={f.ort} onChange={v=>upd("ort",v)} placeholder="Zürich"/></Field>
            <Field label="E-Mail"><Input value={f.email} onChange={v=>upd("email",v)} placeholder="info@buero.ch" type="email"/></Field>
            <Field label="Telefon"><Input value={f.tel} onChange={v=>upd("tel",v)} placeholder="+41 44 000 00 00"/></Field>
          </div>
        </Card>
        <Card style={{padding:"16px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>MwSt & Zahlungsangaben</div>
          <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
            <Field label="MwSt-Nummer"><Input value={f.mwstNr} onChange={v=>upd("mwstNr",v)} placeholder="CHE-123.456.789 MWST"/></Field>
            <Field label="MwSt-Satz (%)" hint="Standard Schweiz: 8.1%"><Input value={f.mwstSatz} onChange={v=>upd("mwstSatz",v)} placeholder="8.1" type="number"/></Field>
            <Field label="IBAN"><Input value={f.iban} onChange={v=>upd("iban",v)} placeholder="CH56 0483 5012 3456 7800 9"/></Field>
            <Field label="Bank"><Input value={f.bank} onChange={v=>upd("bank",v)} placeholder="Zürcher Kantonalbank"/></Field>
            <Field label="Zahlungsfrist (Tage)"><Input value={f.zahlungsfrist} onChange={v=>upd("zahlungsfrist",v)} placeholder="30" type="number"/></Field>
          </div>
        </Card>

      {/* TEAM TAB */}
      {ptab==="team"&&<>
        <Card style={{padding:"16px",marginBottom:"14px"}}>
          <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Registrierte Mitarbeiter</div>
          {users.map((u,i)=>{
            const r=ROLLEN.find(x=>x.id===u.rolle);
            const fb=FBS.find(x=>x.id===u.fb);
            return <div key={u.id} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 0",borderBottom:i<users.length-1?`1px solid ${C.border}`:"none"}}>
              <div style={{width:"36px",height:"36px",borderRadius:"50%",background:`${u.farbe}33`,border:`2px solid ${u.farbe}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"800",color:u.farbe,flexShrink:0}}>{u.kuerzel}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:"13px",fontWeight:"700",color:C.main}}>{u.name}</div>
                <div style={{fontSize:"10px",color:C.dim}}>{u.email}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"4px",alignItems:"flex-end"}}>
                <span style={{fontSize:"9px",fontWeight:"700",color:r?.color,background:`${r?.color}20`,padding:"2px 8px",borderRadius:"4px"}}>{r?.label}</span>
                {fb&&<span style={{fontSize:"9px",color:fb.color,background:`${fb.color}15`,padding:"1px 6px",borderRadius:"3px"}}>{fb.icon} {fb.label}</span>}
              </div>
            </div>;
          })}
        </Card>

        {user.rolle==="admin"&&<>
          {showNewUser?<Card style={{padding:"16px",marginBottom:"14px",background:"rgba(200,169,110,0.04)",border:"1px solid rgba(200,169,110,0.2)"}}>
            <div style={{fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"}}>Neuen Mitarbeiter erstellen</div>
            <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
              <Field label="Name" required><Input value={newUser.name} onChange={v=>setNewUser(p=>({...p,name:v}))} placeholder="Vor- und Nachname"/></Field>
              <Field label="E-Mail" required><Input value={newUser.email} onChange={v=>setNewUser(p=>({...p,email:v}))} placeholder="name@buero.ch" type="email"/></Field>
              <Field label="Rolle">
                <Select value={newUser.rolle} onChange={v=>setNewUser(p=>({...p,rolle:v}))} options={ROLLEN.map(r=>({value:r.id,label:r.label}))}/>
              </Field>
              <Field label="Fachbereich">
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px"}}>
                  {FBS.slice(0,8).map(fb=><div key={fb.id} onClick={()=>setNewUser(p=>({...p,fb:fb.id}))}
                    style={{display:"flex",alignItems:"center",gap:"6px",padding:"7px 10px",borderRadius:"8px",cursor:"pointer",border:`1px solid ${newUser.fb===fb.id?`${fb.color}55`:C.border}`,background:newUser.fb===fb.id?`${fb.color}12`:"rgba(255,255,255,0.02)"}}>
                    <span style={{fontSize:"13px"}}>{fb.icon}</span>
                    <span style={{fontSize:"10px",fontWeight:"600",color:newUser.fb===fb.id?fb.color:"#888"}}>{fb.label}</span>
                  </div>)}
                </div>
              </Field>
            </div>
            <div style={{display:"flex",gap:"8px",marginTop:"12px"}}>
              <Btn onClick={()=>setShowNewUser(false)} size="sm">Abbrechen</Btn>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"4px"}}>
                <Field label="Selbstkosten CHF/h"><Input value={newUser.maKosten||""} onChange={v=>setNewUser(p=>({...p,maKosten:parseFloat(v)||0}))} placeholder="z.B. 85" type="number"/></Field>
                <Field label="Verkaufspreis CHF/h"><Input value={newUser.maVerkauf||""} onChange={v=>setNewUser(p=>({...p,maVerkauf:parseFloat(v)||0}))} placeholder="z.B. 125" type="number"/></Field>
              </div>
              <Btn onClick={()=>{
                if(!newUser.name.trim()||!newUser.email.trim())return;
                const ini=newUser.name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
                const cols=["#C8A96E","#6BAF7A","#5B8FB9","#E8735A","#B478C8"];
                const nu={id:Date.now(),email:newUser.email,name:newUser.name,rolle:newUser.rolle,fb:newUser.fb,kuerzel:ini,farbe:cols[users.length%5],password:"temp1234",eingeladen:true,maKosten:newUser.maKosten||0,maVerkauf:newUser.maVerkauf||0};
                setUsers(p=>[...p,nu]);
                setNewUser({name:"",email:"",rolle:"planer",fb:"pl_gt"});
                setShowNewUser(false);
                alert(`Mitarbeiter ${newUser.name} erstellt. Temporäres Passwort: temp1234`);
              }} variant="gold" size="sm">✓ Erstellen & Einladen</Btn>
            </div>
          </Card>
          :<Btn onClick={()=>setShowNewUser(true)} variant="outline" size="lg" full>+ Neuen Mitarbeiter erstellen</Btn>}
        </>}
      </>}

      {/* AGB TAB */}
      {ptab==="agb"&&<>

        <Btn onClick={saveFirma} variant={firmaSaved?"green":"gold"} size="lg" full>{firmaSaved?"✓ Gespeichert!":"Firmenangaben speichern"}</Btn>

      </>}
    </div>
  </div>;
}

// ── ONBOARDING FORM COMPONENTS — module level to prevent focus loss ──
function OInp({value,onChange,placeholder,type="text"}){
  return <input type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"10px",padding:"11px 14px",color:"#F0EDE8",fontSize:"14px",outline:"none",width:"100%",WebkitAppearance:"none"}}/>;
}
function OFld({label,error,children}){
  return <div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"12px"}}>
    <div style={{fontSize:"10px",fontWeight:"700",letterSpacing:"0.07em",color:error?"#E8735A":"#555",textTransform:"uppercase"}}>{label}</div>
    {children}
    {error&&<div style={{fontSize:"10px",color:"#E8735A"}}>{error}</div>}
  </div>;
}
function OStepBar({s}){
  const steps=["plan","register","payment"];
  const idx=steps.indexOf(s);
  return <div style={{display:"flex",gap:"6px",marginBottom:"1.5rem"}}>
    {steps.map((st,i)=><div key={st} style={{flex:1,height:"3px",borderRadius:"2px",background:i<=idx?"#C8A96E":"rgba(255,255,255,0.12)"}}/>)}
  </div>;
}

          <div style={{width:"60px",height:"60px",borderRadius:"50%",background:"rgba(107,175,122,0.15)",border:"2px solid #6BAF7A",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>

          <div style={{fontSize:"10px",fontWeight:"700",color:"#C8A96E",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Firmenlogo (optional)</div>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <div style={{width:"52px",height:"52px",borderRadius:"10px",background:"rgba(200,169,110,0.1)",border:"2px dashed rgba(200,169,110,0.3)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
              {regForm.logoUrl?<img src={regForm.logoUrl} style={{width:"100%",height:"100%",objectFit:"contain"}}/>:<span style={{fontSize:"20px",fontWeight:"900",color:"#C8A96E"}}>B</span>}

            <div>
              <input type="file" id="logo-upload" accept="image/*" style={{display:"none"}} onChange={e=>{
                const file=e.target.files[0];if(!file)return;

        {/* Firma ergänzen */}

          </div>
        </div>

        <button onClick={enterApp} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",color:"#0D0D0B",fontSize:"15px",fontWeight:"800",cursor:"pointer",marginBottom:"10px"}}>Los geht's →</button>
        <div style={{textAlign:"center",fontSize:"11px",color:"#444"}}>Diese Angaben kannst du später unter Profil → Firma ändern</div>

        <div style={{display:"flex",alignItems:"center",gap:"8px",margin:"12px 0"}}>

          {DEMO_USERS.map((u,i)=>{const r=ROLLEN.find(x=>x.id===u.rolle);return <div key={u.id} onClick={()=>enterAppDirect(u)}
            style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<DEMO_USERS.length-1?"1px solid rgba(255,255,255,0.06)":"none",cursor:"pointer"}}>

    </div>
  </div>;

// ── Stunden erfassen Modal ────────────────────────────────────────────────
function StundenErfassenModal({onClose, prefillProjektId}){
  const {stunden,setStunden,projekte,user}=useApp();
  const [f,setF]=useState({
    datum:today(),
    vonZeit:"08:00",
    bisZeit:"17:00",
    stunden:"",
    manualMode:false, // true = Stunden direkt eingeben, false = Von/Bis Zeit
    projektId:prefillProjektId||"",
    phaseId:"33",
    taetigkeit:"",
    bemerkung:"",
  });
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  // Calculate stunden from von/bis
  const calcStunden=()=>{
    if(!f.vonZeit||!f.bisZeit)return 0;
    const [vh,vm]=f.vonZeit.split(":").map(Number);
    const [bh,bm]=f.bisZeit.split(":").map(Number);
    const diff=(bh*60+bm)-(vh*60+vm);
    return Math.max(0,Math.round(diff/60*4)/4); // round to 0.25
  };
  const effectiveStunden=f.manualMode?parseFloat(f.stunden)||0:calcStunden();

  const proj=projekte.find(p=>p.id===parseInt(f.projektId)||p.id===f.projektId);

  const save=()=>{
    if(!f.projektId||effectiveStunden<=0)return;
    const entry={
      id:Date.now(),
      userId:user.id,
      userName:user.name,
      userKuerzel:user.kuerzel,
      userFarbe:user.farbe,
      datum:f.datum,
      vonZeit:f.manualMode?"":f.vonZeit,
      bisZeit:f.manualMode?"":f.bisZeit,
      stunden:effectiveStunden,
      projektId:parseInt(f.projektId)||f.projektId,
      phaseId:f.phaseId,
      taetigkeit:f.taetigkeit,
      bemerkung:f.bemerkung,
      erfasst:new Date().toISOString(),
    };
    setStunden(p=>[...p,entry]);
    onClose();
  };

  return <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div style={{background:C.card,borderRadius:"16px 16px 0 0",padding:"20px",width:"100%",maxWidth:"600px",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
        <div style={{fontSize:"16px",fontWeight:"800",color:C.gold}}>⏱ Stunden erfassen</div>
        <span onClick={onClose} style={{color:C.dim,cursor:"pointer",fontSize:"20px"}}>✕</span>
      </div>

      {/* Datum */}
      <Field label="Datum" style={{marginBottom:"12px"}}>
        <Input value={f.datum} onChange={v=>upd("datum",v)} type="date"/>
      </Field>

      {/* Zeit Modus Toggle */}
      <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
        {[{id:false,label:"Von / Bis Uhrzeit"},{id:true,label:"Stunden direkt"}].map(m=>
          <div key={String(m.id)} onClick={()=>upd("manualMode",m.id)}
            style={{flex:1,padding:"8px",borderRadius:"9px",cursor:"pointer",textAlign:"center",
              border:`2px solid ${f.manualMode===m.id?C.gold:"rgba(255,255,255,0.08)"}`,
              background:f.manualMode===m.id?"rgba(200,169,110,0.08)":"rgba(255,255,255,0.02)"}}>
            <span style={{fontSize:"12px",fontWeight:"700",color:f.manualMode===m.id?C.gold:C.muted}}>{m.label}</span>
          </div>
        )}
      </div>

      {/* Zeit Eingabe */}
      {!f.manualMode&&<div style={{marginBottom:"12px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"6px"}}>
          <Field label="Von">
            <Input value={f.vonZeit} onChange={v=>upd("vonZeit",v)} type="time"/>
          </Field>
          <Field label="Bis">
            <Input value={f.bisZeit} onChange={v=>upd("bisZeit",v)} type="time"/>
          </Field>
        </div>
        {effectiveStunden>0&&<div style={{padding:"8px 12px",background:"rgba(200,169,110,0.08)",borderRadius:"8px",textAlign:"center"}}>
          <span style={{fontSize:"16px",fontWeight:"800",color:C.gold}}>{effectiveStunden.toFixed(2)} Std.</span>
          <span style={{fontSize:"11px",color:C.dim,marginLeft:"8px"}}>{f.vonZeit} – {f.bisZeit} Uhr</span>
        </div>}
      </div>}

      {f.manualMode&&<Field label="Anzahl Stunden" style={{marginBottom:"12px"}}>
        <div style={{position:"relative"}}>
          <Input value={f.stunden} onChange={v=>upd("stunden",v)} placeholder="z.B. 1.5" type="number"/>
          <span style={{position:"absolute",right:"12px",top:"50%",transform:"translateY(-50%)",fontSize:"11px",color:C.dim}}>h</span>
        </div>

        <Select value={f.taetigkeit} onChange={v=>upd("taetigkeit",v)} options={[
          {value:"",label:"— Wählen —"},
          {value:"Planung",label:"Planung"},
          {value:"Berechnungen",label:"Berechnungen"},
          {value:"Pläne zeichnen",label:"Pläne zeichnen"},
          {value:"Koordination",label:"Koordination"},
          {value:"Besprechung",label:"Besprechung / Meeting"},
          {value:"Baubegehung",label:"Baubegehung"},
          {value:"Rapportierung",label:"Rapportierung"},
          {value:"Ausschreibung",label:"Ausschreibung / LV"},
          {value:"Bauleitung",label:"Bauleitung"},
          {value:"Inbetriebnahme",label:"Inbetriebnahme"},
          {value:"Administration",label:"Administration"},
          {value:"Sonstiges",label:"Sonstiges"},

      {/* Bemerkung */}

      <Btn onClick={save} disabled={!f.projektId||effectiveStunden<=0} variant="gold" size="lg" full>
        ✓ {effectiveStunden>0?`${effectiveStunden.toFixed(2)} Std. speichern`:"Stunden eingeben"}
      </Btn>
    </div>
  </div>;
}

// ── Stunden Global (eigene Seite) ─────────────────────────────────────────
function StundenGlobal(){
  const {stunden,setStunden,projekte,users,user,setNav}=useApp();
  const isAdmin=user.rolle==="admin";
  const [showModal,setShowModal]=useState(false);
  const [filterProjekt,setFilterProjekt]=useState("alle");
  const [filterUser,setFilterUser]=useState(isAdmin?"alle":user.id);

  // Each user only sees their own stunden unless admin
  const myStunden=isAdmin
    ?(filterUser==="alle"?stunden:stunden.filter(s=>s.userId===parseInt(filterUser)||s.userId===filterUser))
    :stunden.filter(s=>s.userId===user.id);

  const filtered=filterProjekt==="alle"?myStunden:myStunden.filter(s=>s.projektId===parseInt(filterProjekt)||s.projektId===filterProjekt);

  // Group by week
  const byDate={};

  return <div style={{minHeight:"100vh",background:C.dark}}>

        {isAdmin&&<Select value={filterUser} onChange={setFilterUser} style={{minWidth:"140px",fontSize:"12px"}}

      {/* Summary Cards */}

        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px"}}>
