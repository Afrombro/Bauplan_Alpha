const BTB_LS = 'bp_bautagebuch_v1';
const BTB_WETTER = ['☀ Sonnig','⛅ Bewölkt','🌧 Regen','❄ Schnee','🌫 Nebel','🌩 Gewitter'];

function BautagebuchSeite() {
  const {projekte} = useApp();
  const [entries, setEntries] = useState(()=>{ try{const d=localStorage.getItem(BTB_LS);return d?JSON.parse(d):[];}catch(e){return [];} });
  const [showForm, setShowForm] = useState(false);
  const [selProj,  setSelProj] = useState('alle');

  const save = arr => { setEntries(arr); try{localStorage.setItem(BTB_LS,JSON.stringify(arr));}catch(e){} };

  const visible = entries.filter(e=>selProj==='alle'||String(e.projektId)===String(selProj))
    .sort((a,b)=>b.datum.localeCompare(a.datum));

  const EntryForm = ({onSave,onCancel}) => {
    const [f,setF] = useState({datum:new Date().toISOString().split('T')[0],projektId:projekte[0]?.id||'',wetter:'☀ Sonnig',temp:'',anwesend:'',fortschritt:'',probleme:'',massnahmen:'',notiz:''});
    const upd=(k,v)=>setF(p=>({...p,[k]:v}));
    return <div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:'14px',padding:'18px',marginBottom:'14px'}}>
      <div style={{fontSize:'14px',color:C.gold,fontWeight:'700',marginBottom:'12px'}}>📖 Neuer Tagebucheintrag</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'10px'}}>
        <Field label="Datum"><input type="date" value={f.datum} onChange={e=>upd('datum',e.target.value)} style={{...sBase,fontSize:'14px'}}/></Field>
        <Field label="Projekt">
          <select value={f.projektId} onChange={e=>upd('projektId',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
            {projekte.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </Field>
        <Field label="Wetter">
          <select value={f.wetter} onChange={e=>upd('wetter',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
            {BTB_WETTER.map(w=><option key={w} value={w}>{w}</option>)}
          </select>
        </Field>
        <Field label="Temperatur (°C)"><Input value={f.temp} onChange={v=>upd('temp',v)} placeholder="z.B. +8°C"/></Field>
      </div>
      <Field label="Anwesende (Firmen/Personen)" style={{marginBottom:'10px'}}><Input value={f.anwesend} onChange={v=>upd('anwesend',v)} placeholder="z.B. Bau AG: 4 Mann, Elektriker: 2 Mann"/></Field>
      <Field label="Baufortschritt" style={{marginBottom:'10px'}}><Textarea value={f.fortschritt} onChange={v=>upd('fortschritt',v)} placeholder="Was wurde heute ausgeführt?"/></Field>
      <Field label="Probleme / Besonderheiten" style={{marginBottom:'10px'}}><Textarea value={f.probleme} onChange={v=>upd('probleme',v)} placeholder="Probleme, Behinderungen, Überraschungen…"/></Field>
      <Field label="Massnahmen / Entscheide" style={{marginBottom:'10px'}}><Input value={f.massnahmen} onChange={v=>upd('massnahmen',v)} placeholder="Sofortmassnahmen, wer informiert?"/></Field>
      <Field label="Interne Notiz" style={{marginBottom:'12px'}}><Input value={f.notiz} onChange={v=>upd('notiz',v)} placeholder="Für interne Zwecke"/></Field>
      <div style={{display:'flex',gap:'8px'}}>
        <Btn onClick={()=>{if(!f.projektId)return;onSave({...f,id:'btb'+Date.now()});}} variant="gold">✓ Speichern</Btn>
        <Btn onClick={onCancel} variant="ghost">Abbrechen</Btn>
      </div>
    </div>;
  };

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(107,175,122,.12)',border:'1px solid rgba(107,175,122,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>📖</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>Bautagebuch</div>
          <div style={{fontSize:'12px',color:C.dim}}>SIA 118 Art. 58 — Dokumentation Baufortschritt</div>
        </div>
        <Btn onClick={()=>setShowForm(true)} variant="gold" size="sm" style={{marginLeft:'auto'}}>＋ Eintrag</Btn>
      </div>
      <select value={selProj} onChange={e=>setSelProj(e.target.value)} style={{...sBase,fontSize:'13px',background:C.card}}>
        <option value="alle">Alle Projekte</option>
        {projekte.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
      </select>
    </div>
    <div style={{padding:'14px 18px'}}>
      {showForm&&<EntryForm onSave={e=>{const u=[e,...entries];save(u);setShowForm(false);}} onCancel={()=>setShowForm(false)}/>}
      {visible.length===0&&<div style={{textAlign:'center',padding:'50px',color:C.dim}}>
        <div style={{fontSize:'36px',marginBottom:'10px',opacity:.3}}>📝</div>
        <div style={{fontSize:'14px',color:C.muted}}>Noch keine Einträge</div>
        <div style={{fontSize:'12px',marginTop:'4px'}}>Dokumentiere den Baufortschritt täglich</div>
      </div>}
      {visible.map(e=>{
        const proj=projekte.find(p=>p.id==e.projektId||p.id===parseInt(e.projektId));
        return <div key={e.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.green}`,borderRadius:'12px',padding:'14px 16px',marginBottom:'8px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}}>
            <div>
              <div style={{fontSize:'13px',fontWeight:'700',color:C.gold,fontFamily:'monospace'}}>{e.datum&&new Date(e.datum).toLocaleDateString('de-CH',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</div>
              <div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>{proj?.name||'—'} · {e.wetter} {e.temp&&`· ${e.temp}`}</div>
            </div>
            {e.anwesend&&<span style={{fontSize:'11px',color:C.muted,background:'rgba(255,255,255,.04)',padding:'2px 8px',borderRadius:'5px'}}>👷 {e.anwesend.substring(0,30)}</span>}
          </div>
          {e.fortschritt&&<div style={{fontSize:'13px',color:'#DDD',lineHeight:'1.5',marginBottom:'6px'}}><span style={{color:C.dim,fontSize:'10px',textTransform:'uppercase',letterSpacing:'.04em'}}>Fortschritt: </span>{e.fortschritt}</div>}
          {e.probleme&&<div style={{fontSize:'13px',color:'#DDD',lineHeight:'1.5',background:'rgba(232,115,90,.06)',borderRadius:'6px',padding:'6px 10px',marginBottom:'6px'}}><span style={{color:C.red,fontSize:'10px',textTransform:'uppercase',letterSpacing:'.04em'}}>⚠ Problem: </span>{e.probleme}</div>}
          {e.massnahmen&&<div style={{fontSize:'13px',color:'#DDD',lineHeight:'1.5'}}><span style={{color:C.gold,fontSize:'10px',textTransform:'uppercase',letterSpacing:'.04em'}}>→ Massnahme: </span>{e.massnahmen}</div>}
        </div>;
      })}
    </div>
  </div>;
}

function QrCodeDisplay({text, size}) {
  const s = size||160;
  const url = `https://api.qrserver.com/v1/create-qr-code/?size=${s}x${s}&data=${encodeURIComponent(text)}&bgcolor=12120f&color=C8A96E&margin=2`;
  return <img src={url} alt="QR Code" style={{width:s,height:s,borderRadius:'8px',border:`1px solid ${C.border}`,display:'block'}}/>;
}

function QrSeite() {
  const {projekte} = useApp();
  const [selProj,setSelProj] = useState(projekte[0]?.id||null);
  const p = projekte.find(x=>x.id==selProj||x.id===parseInt(selProj));
  const url = p?`https://afrombro.github.io/Bauplan_Alpha/?projekt=${p.id}`:'';

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(200,169,110,.12)',border:'1px solid rgba(200,169,110,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>🔗</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>QR-Code Baustelle</div>
          <div style={{fontSize:'12px',color:C.dim}}>Direktlink per QR-Code am Eingang aufhängen</div>
        </div>
      </div>
    </div>
    <div style={{padding:'18px',maxWidth:'500px',margin:'0 auto'}}>
      <Field label="Projekt auswählen" style={{marginBottom:'20px'}}>
        <select value={selProj||''} onChange={e=>setSelProj(e.target.value)} style={{...sBase,fontSize:'14px',background:C.card}}>
          {projekte.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>
      {p&&<>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'14px',padding:'24px',textAlign:'center',marginBottom:'14px'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:'16px'}}>
            <QrCodeDisplay text={url} size={180}/>
          </div>
          <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',marginBottom:'4px'}}>{p.name}</div>
          <div style={{fontSize:'11px',color:C.dim,fontFamily:'monospace',marginBottom:'12px',wordBreak:'break-all'}}>{url}</div>
          <div style={{fontSize:'12px',color:C.muted,background:'rgba(255,255,255,.04)',borderRadius:'8px',padding:'10px'}}>
            QR-Code ausdrucken und am Baustelleneingang aufhängen. Besucher und Monteure können direkt auf die Projektseite zugreifen.
          </div>
        </div>
        <Btn onClick={()=>{const a=document.createElement('a');a.href=`https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}&bgcolor=12120f&color=C8A96E&margin=4`;a.download=`QR_${p.name.replace(/\s/g,'_')}.png`;a.click();}} variant="gold" full>⬇ QR-Code herunterladen</Btn>
      </>}
    </div>
  </div>;
}

// 4. UNTERNEHMER-BEWERTUNGEN
// ═══════════════════════════════════════════════════════════════════════════

const UBW_LS = 'bp_ubw_v1';

function StarRating({value, onChange}) {
  const [hover,setHover] = useState(0);
  return <div style={{display:'flex',gap:'3px'}}>
    {[1,2,3,4,5].map(n=><span key={n} onClick={()=>onChange&&onChange(n)} onMouseEnter={()=>onChange&&setHover(n)} onMouseLeave={()=>setHover(0)} style={{fontSize:'20px',cursor:onChange?'pointer':'default',color:(hover||value)>=n?'#E0A040':'rgba(255,255,255,.15)',transition:'color .1s'}}>★</span>)}
  </div>;
}

function UnternehmerBewertungen() {
  const kontakte = JSON.parse(localStorage.getItem('bp_kontakte_v1')||'[]');
  const unternehmer = kontakte.filter(k=>k.typ==='unternehmer'||k.typ==='lieferant');
  const [bwts,setBwts]   = useState(()=>{try{return JSON.parse(localStorage.getItem(UBW_LS)||'{}');}catch(e){return {};}});
  const [selK,setSelK]   = useState(null);
  const [showForm,setShowForm]=useState(false);

  const saveBwt = (kId,bwt) => {
    const upd={...bwts,[kId]:[...(bwts[kId]||[]),bwt]};
    setBwts(upd);localStorage.setItem(UBW_LS,JSON.stringify(upd));
    setShowForm(false);
  };

  const avgRating = kId => {
    const bs=bwts[kId]||[];
    if(!bs.length)return 0;
    return bs.reduce((a,b)=>a+(b.gesamt||0),0)/bs.length;
  };

  const BwtForm=({kontakt,onSave,onCancel})=>{
    const [f,setF]=useState({datum:new Date().toISOString().split('T')[0],projekt:'',puenktlichkeit:0,qualitaet:0,kommunikation:0,preis:0,text:''});
    const upd=(k,v)=>setF(p=>({...p,[k]:v}));
    const ges=f.puenktlichkeit>0?((f.puenktlichkeit+f.qualitaet+f.kommunikation+f.preis)/4):0;
    return <div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
      <div style={{fontSize:'13px',color:C.gold,fontWeight:'700',marginBottom:'12px'}}>⭐ Bewertung für {kontakt.name}</div>
      <Field label="Projekt" style={{marginBottom:'10px'}}><Input value={f.projekt} onChange={v=>upd('projekt',v)} placeholder="Welches Projekt?"/></Field>
      {[['puenktlichkeit','Pünktlichkeit'],['qualitaet','Qualität'],['kommunikation','Kommunikation'],['preis','Preis/Leistung']].map(([k,l])=>
        <div key={k} style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'8px'}}>
          <span style={{fontSize:'12px',color:C.muted,minWidth:'110px'}}>{l}</span>
          <StarRating value={f[k]} onChange={v=>upd(k,v)}/>
        </div>
      )}
      <Field label="Kommentar" style={{marginBottom:'12px'}}><Textarea value={f.text} onChange={v=>upd('text',v)} placeholder="Erfahrungen, Empfehlung…"/></Field>
      <div style={{display:'flex',gap:'8px'}}>
        <Btn onClick={()=>{if(!ges)return;onSave({...f,gesamt:parseFloat(ges.toFixed(1)),id:'bwt'+Date.now()});}} variant="gold" size="sm">✓ Speichern</Btn>
        <Btn onClick={onCancel} variant="ghost" size="sm">Abbrechen</Btn>
      </div>
    </div>;
  };

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(224,160,64,.12)',border:'1px solid rgba(224,160,64,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>⭐</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>Unternehmer-Bewertungen</div>
          <div style={{fontSize:'12px',color:C.dim}}>Private Bewertungen — nur intern sichtbar</div>
        </div>
      </div>
    </div>
    <div style={{padding:'14px 18px'}}>
      {unternehmer.length===0&&<div style={{textAlign:'center',padding:'40px',color:C.dim}}>
        Zuerst Unternehmer im Finanzen → Kontakte erfassen.
      </div>}
      {unternehmer.map(k=>{
        const avg=avgRating(k.id);
        const bs=bwts[k.id]||[];
        const isSelected=selK?.id===k.id;
        return <div key={k.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',marginBottom:'8px',overflow:'hidden'}}>
          <div onClick={()=>setSelK(isSelected?null:k)} style={{display:'flex',alignItems:'center',gap:'12px',padding:'13px 15px',cursor:'pointer'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF'}}>{k.name}</div>
              <div style={{fontSize:'11px',color:C.dim,marginTop:'1px'}}>{k.ort||''} · {bs.length} Bewertung{bs.length!==1?'en':''}</div>
            </div>
            <div style={{textAlign:'right'}}>
              {avg>0?<StarRating value={Math.round(avg)}/>:<span style={{fontSize:'11px',color:C.dim}}>Noch keine Bewertung</span>}
              {avg>0&&<div style={{fontSize:'12px',fontWeight:'700',color:'#E0A040',marginTop:'2px'}}>{avg.toFixed(1)} / 5</div>}
            </div>
          </div>
          {isSelected&&<div style={{padding:'0 15px 15px',borderTop:`1px solid ${C.border}`}}>
            {showForm&&selK?.id===k.id&&<BwtForm kontakt={k} onSave={bwt=>saveBwt(k.id,bwt)} onCancel={()=>setShowForm(false)}/>}
            <Btn onClick={()=>setShowForm(true)} variant="outline" size="sm" style={{marginBottom:'10px'}}>＋ Bewertung hinzufügen</Btn>
            {bs.slice().reverse().map(b=><div key={b.id} style={{background:'rgba(255,255,255,.03)',borderRadius:'8px',padding:'10px',marginBottom:'6px'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'5px'}}>
                <span style={{fontSize:'12px',color:C.muted}}>{b.projekt||'Allgemein'}</span>
                <StarRating value={Math.round(b.gesamt||0)}/>
              </div>
              {b.text&&<div style={{fontSize:'12px',color:'#CCC'}}>{b.text}</div>}
            </div>)}
          </div>}
        </div>;
      })}

function MaengelProjekt({projektId, projektName}) {
  const [maengel,setMaengel] = useState(()=>ml_load().filter(m=>String(m.projektId)===String(projektId)));
  const [showForm,setShowForm] = useState(false);
  const [selM,setSelM]       = useState(null);
  const [statusFil,setStatusFil] = useState('alle');
  const [search,setSearch]   = useState('');

  const saveAll = arr => {
    const alle = ml_load().filter(m=>String(m.projektId)!==String(projektId));
    ml_save([...alle,...arr]);
    setMaengel(arr);
  };

  const handleSave = m => {
    const upd = maengel.find(x=>x.id===m.id) ? maengel.map(x=>x.id===m.id?m:x) : [m,...maengel];
    saveAll(upd); setSelM(null); setShowForm(false);
  };
  const handleDelete = id => { if(!window.confirm('Mangel löschen?'))return; saveAll(maengel.filter(m=>m.id!==id)); setSelM(null); };

  const nextNr = () => 'M-'+String(maengel.length+1).padStart(3,'0');
  const visible = maengel.filter(m=>{
    if(statusFil!=='alle'&&m.status!==statusFil) return false;
    if(search){const q=search.toLowerCase();if(!(m.titel+(m.beschreibung||'')+(m.ort||'')).toLowerCase().includes(q))return false;}
    return true;
  });

  const stats = Object.keys(ML_STATUS).map(k=>({k,n:maengel.filter(m=>m.status===k).length,s:ML_STATUS[k]}));
  const totalOffen = maengel.filter(m=>m.status!=='behoben'&&m.status!=='abgelehnt').length;
  const kritisch   = maengel.filter(m=>m.prioritaet==='kritisch'&&m.status!=='behoben').length;

  const NewForm = ({onSave,onCancel}) => {
    const [f,setF] = useState({id:'m'+Date.now(),nr:nextNr(),projektId,datum:ML_ISO(),titel:'',beschreibung:'',gewerk:'',prioritaet:'normal',status:'offen',ort:'',zugewiesen:'',frist:'',fotos:[],kommentare:[]});
    const upd=(k,v)=>setF(p=>({...p,[k]:v}));
    return <div style={{background:C.card,border:`1px solid ${C.gold}44`,borderRadius:'14px',padding:'18px',marginBottom:'14px'}}>
      <div style={{fontSize:'14px',color:C.gold,fontWeight:'700',marginBottom:'13px'}}>⚠ Neuer Mangel erfassen</div>
      <div style={{display:'grid',gridTemplateColumns:'90px 1fr',gap:'10px',marginBottom:'10px'}}>
        <Field label="Nr."><Input value={f.nr} onChange={v=>upd('nr',v)}/></Field>
        <Field label="Bezeichnung *"><Input value={f.titel} onChange={v=>upd('titel',v)} placeholder="Riss in Wand OG, Undichte Leitung etc."/></Field>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'10px'}}>
        <Field label="Gewerk">
          <select value={f.gewerk} onChange={e=>upd('gewerk',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
            <option value="">— wählen —</option>
            {ML_GEWERKE.map(g=><option key={g}>{g}</option>)}
          </select>
        </Field>
        <Field label="Priorität">
          <select value={f.prioritaet} onChange={e=>upd('prioritaet',e.target.value)} style={{...sBase,fontSize:'14px',background:C.mid}}>
            {Object.entries(ML_PRIO).map(([k,v])=><option key={k} value={k}>{v.ic} {v.l}</option>)}
          </select>
        </Field>
        <Field label="Ort / Bauteil"><Input value={f.ort} onChange={v=>upd('ort',v)} placeholder="z.B. 1. OG Bad Süd"/></Field>
        <Field label="Behebungsfrist"><input type="date" value={f.frist} onChange={e=>upd('frist',e.target.value)} style={{...sBase,fontSize:'14px'}}/></Field>
        <Field label="Zugewiesen an" style={{gridColumn:'1/-1'}}><Input value={f.zugewiesen} onChange={v=>upd('zugewiesen',v)} placeholder="Firma AG oder Person"/></Field>
      </div>
      <Field label="Beschreibung" style={{marginBottom:'12px'}}><Textarea value={f.beschreibung} onChange={v=>upd('beschreibung',v)} placeholder="Genaue Beschreibung, Ausmass, betroffene Fläche…"/></Field>
      <div style={{display:'flex',gap:'8px'}}>
        <Btn onClick={()=>{if(!f.titel.trim())return;onSave(f);}} variant="gold">✓ Mangel speichern</Btn>
        <Btn onClick={onCancel} variant="ghost">Abbrechen</Btn>
      </div>
    </div>;
  };

  return <div>
    {/* Stats bar */}
    {maengel.length>0&&<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px',marginBottom:'14px'}}>
      {[
        [maengel.length,'Total',C.gold],[totalOffen,'Offen',totalOffen>0?'#E0A040':C.green],
        [kritisch,'Kritisch',kritisch>0?C.red:C.dim],[maengel.filter(m=>m.status==='behoben').length,'Behoben',C.green],
      ].map(([v,l,c])=><div key={l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'10px',textAlign:'center'}}>
        <div style={{fontSize:'20px',fontWeight:'800',color:c,lineHeight:'1'}}>{v}</div>
        <div style={{fontSize:'10px',color:C.dim,marginTop:'2px',textTransform:'uppercase',letterSpacing:'.04em'}}>{l}</div>
      </div>)}
    </div>}

    {/* Controls */}
    <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap',alignItems:'center'}}>
      <Btn onClick={()=>setShowForm(true)} variant="gold" size="sm">⚠ Mangel erfassen</Btn>
      <div style={{display:'flex',alignItems:'center',gap:'5px',background:C.card,border:`1px solid ${C.border}`,borderRadius:'18px',padding:'4px 12px',flex:1,minWidth:'140px'}}>
        <span style={{color:C.dim,fontSize:'12px'}}>🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suchen…" style={{background:'none',border:'none',color:'#FFF',fontSize:'12px',outline:'none',flex:1}}/>
      </div>
    </div>
    <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'12px'}}>
      {[{k:'alle',l:'Alle'}, ...Object.entries(ML_STATUS).map(([k,s])=>({k,l:s.l,c:s.c}))].map(f=>(
        <button key={f.k} onClick={()=>setStatusFil(f.k)} style={{padding:'3px 10px',borderRadius:'14px',border:`1px solid ${statusFil===f.k?(f.c||C.gold):C.border}`,background:statusFil===f.k?`${(f.c||C.gold)}18`:'transparent',color:statusFil===f.k?(f.c||C.gold):'#888',fontSize:'11px',cursor:'pointer'}}>{f.l}</button>
      ))}
    </div>

    {showForm&&<NewForm onSave={m=>{handleSave({...m,kommentare:[{text:'Mangel erfasst.',datum:ML_ISO(),autor:'Du'}]});setShowForm(false);}} onCancel={()=>setShowForm(false)}/>}

    {visible.length===0&&!showForm&&<div style={{textAlign:'center',padding:'40px',color:C.dim}}>
      <div style={{fontSize:'32px',marginBottom:'10px',opacity:.3}}>{maengel.length===0?'✅':'🔍'}</div>
      <div style={{fontSize:'14px',color:C.muted}}>{maengel.length===0?'Keine Mängel erfasst':'Keine Ergebnisse'}</div>
    </div>}

    {visible.map(m=><MlMangel key={m.id} m={m} onClick={()=>setSelM(m)}/>)}

    {selM&&<MlDetailModal m={selM} onClose={()=>setSelM(null)} onSave={handleSave} onDelete={handleDelete} projektName={projektName}/>}
  </div>;
}

const BKP_HAUPT = [
  {nr:'1',l:'Grundstück',sub:[]},
  {nr:'2',l:'Vorbereitung',sub:['21 Abbruch','22 Umgebung Bestand','23 Versorgungsleitungen']},
  {nr:'3',l:'Baukonstruktion',sub:['30 Baugrube','31 Fundament','32 Tragkonstruktion','33 Äussere Wandkonstruktion','34 Innere Wandkonstruktion','35 Decken','36 Treppen','37 Dach']},
  {nr:'4',l:'Technik',sub:['40 Elektroanlagen','41 Heizanlagen','42 Lüftungsanlagen','43 Kälteanlagen','44 Sanitäranlagen','45 Transportanlagen']},
  {nr:'5',l:'Bedachung',sub:[]},
  {nr:'6',l:'Ausbau',sub:['61 Fenster/Aussentüren','62 Innentüren','63 Bodenbeläge','64 Wandbekleidungen','65 Deckenverkleidungen','66 Malerarbeiten','67 Küche/Sanitäreinrichtung']},
  {nr:'7',l:'Ausstattung',sub:[]},
  {nr:'8',l:'Umgebung',sub:['81 Umgebung','82 Erschliessung','83 Aussenanlagen']},
  {nr:'9',l:'Ausstattung/Honorare',sub:['91 Baunebenkosten','92 Honorare']},
];

const LK_LS = (pId) => `bp_kostplan_${pId}_v1`;

function LiveKostenkontrolle({projektId}) {
  const {offerten,rechnungen,firma} = useApp();
  const mwst = parseFloat(firma.mwstSatz)||8.1;

  const [budgets, setBudgets] = useState(()=>{
    try{const d=localStorage.getItem(LK_LS(projektId));return d?JSON.parse(d):{};} catch(e){return {};}
  });
  const saveBudgets = obj => { setBudgets(obj); try{localStorage.setItem(LK_LS(projektId),JSON.stringify(obj));}catch(e){} };

  const pOff  = offerten.filter(o=>o.projektId===projektId&&o.status==='angenommen');
  const pRech = rechnungen.filter(r=>r.projektId===projektId);

  const totalBudget   = Object.values(budgets).reduce((a,v)=>a+(parseFloat(v)||0),0);
  const totalOfferten = pOff.reduce((a,o)=>a+(parseFloat(o.totalNetto)||0),0);
  const totalRechnungen=pRech.filter(r=>r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0),0);
  const pctGenutzt    = totalBudget>0?totalRechnungen/totalBudget*100:0;

  const BarCell = ({budget, verbucht}) => {
    const pct = budget>0?Math.min(verbucht/budget*100,110):0;
    const col  = pct>100?C.red:pct>80?'#E0A040':C.green;
    return <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
      <div style={{flex:1,height:'5px',background:'rgba(255,255,255,.08)',borderRadius:'3px',overflow:'hidden'}}>
        <div style={{height:'100%',width:`${Math.min(pct,100)}%`,background:col,borderRadius:'3px',transition:'width .3s'}}/>
      </div>
      <span style={{fontSize:'10px',fontWeight:'700',color:col,minWidth:'32px',textAlign:'right'}}>{pct.toFixed(0)}%</span>
    </div>;
  };

  return <div>
    {/* Summary */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'14px'}}>
      {[
        {l:'Gesamtbudget',v:`CHF ${(totalBudget/1000).toFixed(0)}k`,c:C.gold,sub:'inkl. aller BKP'},
        {l:'Vergeben (Offerten)',v:`CHF ${(totalOfferten/1000).toFixed(0)}k`,c:C.blue,sub:`${totalBudget>0?((totalOfferten/totalBudget)*100).toFixed(0):0}% des Budgets`},
        {l:'Verbucht (Rechnungen)',v:`CHF ${(totalRechnungen/1000).toFixed(0)}k`,c:pctGenutzt>90?C.red:C.green,sub:`${pctGenutzt.toFixed(0)}% ausgeschöpft`},
      ].map(item=><div key={item.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px',textAlign:'center'}}>
        <div style={{fontSize:'18px',fontWeight:'800',color:item.c,letterSpacing:'-.01em'}}>{item.v}</div>
        <div style={{fontSize:'10px',color:C.dim,marginTop:'2px',textTransform:'uppercase',letterSpacing:'.04em'}}>{item.l}</div>
        <div style={{fontSize:'11px',color:C.muted,marginTop:'2px'}}>{item.sub}</div>
      </div>)}
    </div>

    {/* Art. 86 warning */}
    {BKP_HAUPT.some(bkp=>{
      const bgt=parseFloat(budgets[bkp.nr])||0;
      const off=pOff.filter(o=>o.bkpNr===bkp.nr).reduce((a,o)=>a+(parseFloat(o.totalNetto)||0),0);
      return bgt>0&&off/bgt>0.85;
    })&&<div style={{background:'rgba(224,160,64,.08)',border:'1px solid rgba(224,160,64,.25)',borderRadius:'9px',padding:'10px 14px',marginBottom:'12px',fontSize:'12px',color:'#E0A040'}}>
      ⚠ <strong>Art. 86 SIA 118:</strong> Eine oder mehrere BKP-Positionen nähern sich der 20%-Abweichungsschwelle. EP-Neuberechnung könnte nötig werden.
    </div>}

    {/* BKP Table */}
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',overflow:'hidden'}}>
      <div style={{display:'grid',gridTemplateColumns:'50px 1fr 110px 110px 1fr',background:'rgba(200,169,110,.07)',borderBottom:`1px solid ${C.border}`}}>
        {['BKP','Bezeichnung','Budget CHF','Vergeben CHF','Auslastung'].map(h=><div key={h} style={{padding:'7px 10px',fontSize:'10px',color:C.dim,textTransform:'uppercase',letterSpacing:'.04em',fontWeight:'600'}}>{h}</div>)}
      </div>
      {BKP_HAUPT.map(bkp=>{
        const bgt = parseFloat(budgets[bkp.nr])||0;
        const off = pOff.filter(o=>o.bkpNr===bkp.nr).reduce((a,o)=>a+(parseFloat(o.totalNetto)||0),0);
        return <div key={bkp.nr} style={{display:'grid',gridTemplateColumns:'50px 1fr 110px 110px 1fr',borderBottom:`1px solid rgba(255,255,255,.04)`,alignItems:'center'}}>
          <div style={{padding:'8px 10px',fontSize:'11px',color:C.gold,fontFamily:'monospace',fontWeight:'700'}}>{bkp.nr}</div>
          <div style={{padding:'8px 10px',fontSize:'13px',color:'#DDD'}}>{bkp.l}</div>
          <div style={{padding:'4px 6px'}}>
            <input type="number" value={budgets[bkp.nr]||''} onChange={e=>saveBudgets({...budgets,[bkp.nr]:e.target.value})} placeholder="0" style={{background:'none',border:`1px solid ${C.border}`,borderRadius:'6px',color:'#FFF',padding:'4px 8px',fontSize:'12px',width:'100%',outline:'none',fontFamily:'monospace'}}/>
          </div>
          <div style={{padding:'8px 10px',fontSize:'12px',color:off>bgt&&bgt>0?C.red:C.muted,fontFamily:'monospace',textAlign:'right'}}>{off>0?`CHF ${(off/1000).toFixed(0)}k`:'—'}</div>
          <div style={{padding:'8px 10px'}}>
            {bgt>0?<BarCell budget={bgt} verbucht={off}/>:<span style={{fontSize:'10px',color:C.dim}}>Kein Budget</span>}
          </div>
        </div>;
      })}
    </div>
    <div style={{fontSize:'11px',color:C.dim,marginTop:'8px',padding:'0 4px'}}>
      Budget direkt in die Felder eingeben (in CHF). Wird pro Projekt gespeichert. Vergabe-Werte kommen aus den genehmigten Offerten.
    </div>
  </div>;
}

function BauherrenPortal() {
  const {projekte, setNav, offerten, rechnungen, stunden, firma} = useApp();
  const [selProjId, setSelProjId] = useState(projekte[0]?.id||null);
  const [view,      setView]      = useState('dashboard'); // dashboard | nachtraege | rechnungen | dossier
  const [nachtraege] = useState(()=>{ try{return JSON.parse(localStorage.getItem('bp_nt_v1')||'[]');}catch(e){return [];} });
  const [approvals, setApprovals] = useState(()=>{ try{return JSON.parse(localStorage.getItem('bp_portal_approvals')||'{}');}catch(e){return {};} });
  const mwst = parseFloat(firma.mwstSatz)||8.1;

  const p     = projekte.find(x=>x.id==selProjId||x.id===parseInt(selProjId));
  if(!p) return null;

  const pNt   = nachtraege.filter(n=>n.projekt===p.name||String(n.projektId)===String(p.id));
  const pOff  = offerten.filter(o=>o.projektId===p.id);
  const pRech = rechnungen.filter(r=>r.projektId===p.id);
  const ap    = SIA.find(s=>s.id===p.aktivPhase);

  const pendNt     = pNt.filter(n=>n.status==='eingereicht'||n.status==='offen');
  const offeneRech = pRech.filter(r=>r.status!=='bezahlt');
  const bezahltRech= pRech.filter(r=>r.status==='bezahlt');
  const totalOffen = offeneRech.reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);

  const approve = (id, action) => {
    const upd = {...approvals,[id]:{action,datum:new Date().toLocaleDateString('de-CH')}};
    setApprovals(upd);
    localStorage.setItem('bp_portal_approvals',JSON.stringify(upd));
  };

  const GOLD  = '#C8A96E';
  const phasePct = (() => {
    const done = SIA.filter(s=>(p.phasenStatus[s.id]||'')!=='nicht_begonnen'&&(p.phasenStatus[s.id]||'')!=='freigegeben').length;
    return Math.round(done/SIA.length*100);
  })();

  return <div style={{minHeight:'100vh',background:'#0A0A09',color:'#EEE',paddingBottom:'40px'}}>
    {/* Portal Header */}
    <div style={{background:`linear-gradient(135deg,#1A180E,#14120A)`,borderBottom:'1px solid rgba(200,169,110,.15)',padding:'24px 20px 0'}}>
      <div style={{display:'flex',alignItems:'center',gap:'14px',marginBottom:'18px'}}>
        <div style={{width:'48px',height:'48px',borderRadius:'12px',background:'linear-gradient(135deg,#C8A96E,#E8C98E)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'900',color:'#0A0A09',fontSize:'22px',flexShrink:0}}>B</div>
        <div>
          <div style={{fontSize:'13px',color:'rgba(200,169,110,.7)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:'2px'}}>Bauherren-Portal</div>
          <div style={{fontSize:'20px',fontWeight:'800',color:'#FFF'}}>{p.name}</div>
          <div style={{fontSize:'12px',color:'rgba(255,255,255,.4)'}}>{p.strasse} · {p.plz} {p.ort}</div>
        </div>
        {pendNt.length>0&&<div style={{marginLeft:'auto',background:'rgba(232,115,90,.2)',border:'1px solid rgba(232,115,90,.3)',borderRadius:'10px',padding:'6px 12px',textAlign:'center'}}>
          <div style={{fontSize:'18px',fontWeight:'800',color:C.red}}>{pendNt.length}</div>
          <div style={{fontSize:'10px',color:'rgba(232,115,90,.8)'}}>Ausstehend</div>
        </div>}
      </div>
      {/* Nav */}
      <div style={{display:'flex',gap:'2px',overflowX:'auto'}}>
        {[{id:'dashboard',l:'Übersicht'},{id:'nachtraege',l:`Nachträge ${pendNt.length>0?'('+pendNt.length+')':''}`},{id:'rechnungen',l:'Finanzen'},{id:'dokumente',l:'Dokumente'}].map(t=>
          <button key={t.id} onClick={()=>setView(t.id)} style={{padding:'9px 16px',borderRadius:'7px 7px 0 0',border:'none',fontSize:'12px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',background:view===t.id?'#0A0A09':'transparent',color:view===t.id?GOLD:'rgba(255,255,255,.5)',borderBottom:view===t.id?`2px solid ${GOLD}`:'2px solid transparent'}}>{t.l}</button>
        )}
      </div>
    </div>

    <div style={{padding:'20px',maxWidth:'720px',margin:'0 auto'}}>
      {/* --- DASHBOARD --- */}
      {view==='dashboard'&&<div>
        <div style={{background:`rgba(200,169,110,.05)`,border:`1px solid rgba(200,169,110,.15)`,borderRadius:'14px',padding:'18px',marginBottom:'14px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
            <div style={{flex:1}}>
              <div style={{fontSize:'12px',color:'rgba(200,169,110,.7)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'4px'}}>Aktuelle SIA-Phase</div>
              <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>{ap?`SIA ${ap.nr} — ${ap.label}`:'Nicht gestartet'}</div>
            </div>
            <div style={{textAlign:'center'}}>
              <svg width="70" height="70" viewBox="0 0 70 70">
                <circle cx="35" cy="35" r="28" fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="7"/>
                <circle cx="35" cy="35" r="28" fill="none" stroke={GOLD} strokeWidth="7"
                  strokeDasharray={`${phasePct*1.76} 176`} strokeDashoffset="44" strokeLinecap="round"/>
                <text x="35" y="38" textAnchor="middle" fontSize="14" fontWeight="700" fill={GOLD}>{phasePct}%</text>
              </svg>
            </div>
          </div>
          <div style={{display:'flex',gap:'4px',flexWrap:'wrap',marginTop:'12px'}}>
            {SIA.map(s=>{
              const st=p.phasenStatus[s.id]||'nicht_begonnen';
              return <div key={s.id} title={`SIA ${s.nr} ${s.label}: ${st}`} style={{width:'8px',height:'8px',borderRadius:'50%',background:st==='freigegeben'?C.green:st!=='nicht_begonnen'?GOLD:'rgba(255,255,255,.1)'}}/>;
            })}
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'14px'}}>
          {[
            {l:'Nachträge ausstehend', v:pendNt.length, c:pendNt.length>0?'#E0A040':C.green, sub:'Ihre Genehmigung nötig'},
            {l:'Offene Rechnungen', v:`CHF ${(totalOffen/1000).toFixed(0)}k`, c:offeneRech.length>0?GOLD:C.green, sub:`${offeneRech.length} Rechnung${offeneRech.length!==1?'en':''}`},
            {l:'Bezahlte Rechnungen', v:bezahltRech.length, c:C.green, sub:`CHF ${(bezahltRech.reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0)/1000).toFixed(0)}k total`},
            {l:'Projektstart', v:p.datum||'—', c:'rgba(255,255,255,.6)', sub:'Baubeginn'},
          ].map(item=><div key={item.l} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',borderRadius:'11px',padding:'14px'}}>
            <div style={{fontSize:'18px',fontWeight:'800',color:item.c,lineHeight:'1'}}>{item.v}</div>
            <div style={{fontSize:'11px',color:'rgba(255,255,255,.5)',textTransform:'uppercase',letterSpacing:'.04em',margin:'4px 0 2px'}}>{item.l}</div>
            <div style={{fontSize:'11px',color:'rgba(255,255,255,.35)'}}>{item.sub}</div>
          </div>)}
        </div>

        {pendNt.length>0&&<div style={{background:'rgba(224,160,64,.08)',border:'1px solid rgba(224,160,64,.2)',borderRadius:'12px',padding:'14px',cursor:'pointer'}} onClick={()=>setView('nachtraege')}>
          <div style={{fontSize:'13px',fontWeight:'700',color:'#E0A040',marginBottom:'4px'}}>⚠ {pendNt.length} Nachtrag{pendNt.length!==1?'e':''} erfordern Ihre Genehmigung</div>
          <div style={{fontSize:'12px',color:'rgba(255,255,255,.5)'}}>Bitte prüfen und genehmigen oder ablehnen →</div>
        </div>}
      </div>}

      {/* --- NACHTRÄGE --- */}
      {view==='nachtraege'&&<div>
        <div style={{fontSize:'13px',color:'rgba(255,255,255,.5)',marginBottom:'14px'}}>Bitte prüfen Sie die eingereichten Nachträge. Ihre Genehmigung ist rechtlich bindend nach SIA 118 Art. 84.</div>
        {pNt.length===0&&<div style={{textAlign:'center',padding:'40px',color:'rgba(255,255,255,.3)'}}>Keine Nachträge für dieses Projekt.</div>}
        {pNt.map(n=>{
          const netto=((n.pos||n.positionen||[]).reduce((a,p)=>(parseFloat(p.menge)||0)*(parseFloat(p.ep)||0)+a,0));
          const approval=approvals[n.id];
          const isPend=n.status==='eingereicht'||n.status==='offen';
          return <div key={n.id} style={{background:'rgba(255,255,255,.04)',border:`1px solid ${approval?.action==='approved'?'rgba(107,175,122,.3)':approval?.action==='rejected'?'rgba(232,115,90,.3)':'rgba(255,255,255,.1)'}`,borderRadius:'12px',padding:'16px',marginBottom:'10px'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'10px',flexWrap:'wrap',gap:'6px'}}>
              <div>
                <div style={{fontSize:'12px',color:GOLD,fontFamily:'monospace',marginBottom:'2px'}}>{n.nr}</div>
                <div style={{fontSize:'15px',fontWeight:'700',color:'#FFF'}}>{n.titel}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:'16px',fontWeight:'800',color:netto<0?C.red:GOLD}}>CHF {netto.toLocaleString('de-CH',{minimumFractionDigits:2})}</div>
                <div style={{fontSize:'10px',color:'rgba(255,255,255,.4)'}}>exkl. MWST</div>
              </div>
            </div>
            {n.beschrieb&&<div style={{fontSize:'13px',color:'rgba(255,255,255,.6)',lineHeight:'1.6',marginBottom:'12px'}}>{n.beschrieb}</div>}
            {approval
              ? <div style={{padding:'8px 12px',borderRadius:'8px',background:approval.action==='approved'?'rgba(107,175,122,.12)':'rgba(232,115,90,.12)',fontSize:'12px',color:approval.action==='approved'?C.green:C.red}}>
                  {approval.action==='approved'?'✓ Von Ihnen genehmigt':'✕ Von Ihnen abgelehnt'} · {approval.datum}
                </div>
              : isPend&&<div style={{display:'flex',gap:'8px'}}>
                  <button onClick={()=>approve(n.id,'approved')} style={{flex:1,padding:'10px',borderRadius:'9px',border:'1px solid rgba(107,175,122,.3)',background:'rgba(107,175,122,.12)',color:C.green,fontWeight:'700',cursor:'pointer',fontSize:'13px'}}>✓ Genehmigen</button>
                  <button onClick={()=>approve(n.id,'rejected')} style={{flex:1,padding:'10px',borderRadius:'9px',border:'1px solid rgba(232,115,90,.3)',background:'rgba(232,115,90,.12)',color:C.red,fontWeight:'700',cursor:'pointer',fontSize:'13px'}}>✕ Ablehnen</button>
                </div>
            }
          </div>;
        })}
      </div>}

      {/* --- FINANZEN --- */}
      {view==='rechnungen'&&<div>
        {offeneRech.length>0&&<div style={{background:'rgba(200,169,110,.07)',border:'1px solid rgba(200,169,110,.15)',borderRadius:'12px',padding:'14px',marginBottom:'14px'}}>
          <div style={{fontSize:'13px',fontWeight:'700',color:GOLD,marginBottom:'2px'}}>Offene Rechnungen: CHF {totalOffen.toLocaleString('de-CH',{minimumFractionDigits:2})}</div>
          <div style={{fontSize:'12px',color:'rgba(255,255,255,.4)'}}>Bitte überweisen Sie offene Beträge auf das angegebene Konto.</div>
        </div>}
        {[...offeneRech,...bezahltRech].map(r=><div key={r.id} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',borderRadius:'11px',padding:'13px 15px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:'13px',fontWeight:'600',color:'#FFF'}}>{r.bezeichnung||r.nr}</div>
            <div style={{fontSize:'11px',color:'rgba(255,255,255,.4)',marginTop:'1px'}}>{r.datum&&new Date(r.datum).toLocaleDateString('de-CH')}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:'14px',fontWeight:'700',color:GOLD}}>CHF {((parseFloat(r.betrag)||0)*(1+mwst/100)).toLocaleString('de-CH',{minimumFractionDigits:2})}</div>
            <span style={{fontSize:'10px',fontWeight:'700',color:r.status==='bezahlt'?C.green:'#E0A040',background:r.status==='bezahlt'?'rgba(107,175,122,.15)':'rgba(224,160,64,.15)',padding:'1px 7px',borderRadius:'6px'}}>{r.status==='bezahlt'?'Bezahlt':'Offen'}</span>
          </div>
        </div>)}
        {pRech.length===0&&<div style={{textAlign:'center',padding:'40px',color:'rgba(255,255,255,.3)'}}>Noch keine Rechnungen vorhanden.</div>}
        {firma.iban&&<div style={{background:'rgba(255,255,255,.03)',borderRadius:'10px',padding:'12px 14px',marginTop:'12px',fontSize:'12px',color:'rgba(255,255,255,.5)'}}>
          Bankverbindung: IBAN {firma.iban} · {firma.bank||''}
        </div>}
      </div>}

      {/* --- DOKUMENTE --- */}
      {view==='dokumente'&&<div>
        <div style={{fontSize:'13px',color:'rgba(255,255,255,.5)',marginBottom:'14px'}}>Projektdokumente die für Sie freigegeben wurden:</div>
        {[{ic:'📐',l:'Grundrisspläne',d:'Freigegeben zur Ausführung',f:'GR_EG_OG_DG.pdf'},{ic:'⚡',l:'Elektroinstallationsplan',d:'Rev. 3, aktuell',f:'ELP_REV3.pdf'},{ic:'🔥',l:'Heizungsplan HLKSE',d:'Für Baugenehmigung',f:'HLKSE_Plan.pdf'},{ic:'📊',l:'Kostenzusammenstellung',d:'Stand Baugenehmigung',f:'KZS_Stand_BG.pdf'}].map(d=><div key={d.l} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.08)',borderRadius:'10px',padding:'12px 14px',marginBottom:'7px',display:'flex',alignItems:'center',gap:'12px'}}>
          <div style={{fontSize:'24px',flexShrink:0}}>{d.ic}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:'13px',fontWeight:'600',color:'#FFF'}}>{d.l}</div>
            <div style={{fontSize:'11px',color:'rgba(255,255,255,.4)'}}>{d.d}</div>
          </div>
          <button style={{padding:'6px 12px',borderRadius:'7px',border:`1px solid rgba(200,169,110,.2)`,background:'rgba(200,169,110,.08)',color:GOLD,fontSize:'11px',cursor:'pointer'}}>⬇ {d.f}</button>
        </div>)}
      </div>}
    </div>
  </div>;
}



function GebaeudeDossierModal({projekt, onClose}) {
  const {offerten, rechnungen, stunden, firma} = useApp();
  const [nachtraege] = useState(()=>{ try{return JSON.parse(localStorage.getItem('bp_nt_v1')||'[]');}catch(e){return [];} });
  const [generated, setGenerated] = useState(false);
  const [loading,   setLoading]   = useState(false);
  const p    = projekt;
  const mwst = parseFloat(firma.mwstSatz)||8.1;

  const pNt   = nachtraege.filter(n=>String(n.projektId)===String(p.id)||n.projekt===p.name);
  const pOff  = offerten.filter(o=>o.projektId===p.id);
  const pRech = rechnungen.filter(r=>r.projektId===p.id);
  const pStd  = stunden.filter(s=>s.projektId===p.id);
  const ap    = SIA.find(s=>s.id===p.aktivPhase);
  const totalRech = pRech.filter(r=>r.status==='bezahlt').reduce((a,r)=>a+(parseFloat(r.betrag)||0)*(1+mwst/100),0);
  const totalStd  = pStd.reduce((a,s)=>a+(s.stunden||0),0);

  const generateDossier = () => {
    setLoading(true);
    setTimeout(() => {
      // Build HTML sections using array join — NO nested template literals
      const today = new Date().toLocaleDateString('de-CH',{day:'2-digit',month:'long',year:'numeric'});
      const css = [
        '* { box-sizing: border-box; margin: 0; padding: 0; }',
        'body { font-family: Helvetica Neue, Helvetica, Arial, sans-serif; color: #1a1a18; background: #fff; }',
        '.header { background: linear-gradient(135deg, #1A180E, #2A2418); color: #fff; padding: 40px; }',
        '.logo { font-size: 28px; font-weight: 900; color: #C8A96E; margin-bottom: 6px; }',
        '.subtitle { font-size: 12px; color: rgba(200,169,110,.7); text-transform: uppercase; letter-spacing: .08em; }',
        '.proj-title { font-size: 32px; font-weight: 800; color: #fff; margin: 16px 0 4px; }',
        '.proj-sub { font-size: 14px; color: rgba(255,255,255,.6); }',
        '.section { padding: 28px 40px; border-bottom: 1px solid #E8E4D8; }',
        '.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #888; margin-bottom: 14px; border-bottom: 1px solid #E8E4D8; padding-bottom: 8px; }',
        '.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }',
        '.kpi { background: #F8F7F4; border-radius: 10px; padding: 14px; text-align: center; }',
        '.kpi-val { font-size: 20px; font-weight: 800; }',
        '.kpi-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-top: 3px; }',
        '.field-row { display: flex; gap: 8px; margin-bottom: 7px; }',
        '.field-label { width: 160px; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }',
        '.field-value { font-size: 13px; color: #1a1a18; font-weight: 500; }',
        '.phase-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #F0EDE8; }',
        '.phase-num { width: 50px; font-size: 11px; font-weight: 700; color: #C8A96E; }',
        '.phase-name { flex: 1; font-size: 13px; }',
        '.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }',
        '.done { background: #EAF7ED; color: #2D7A3A; }',
        '.running { background: #FEF6E4; color: #9A6B00; }',
        '.pending { background: #F4F4F2; color: #888; }',
        'table { width: 100%; border-collapse: collapse; margin-top: 8px; }',
        'th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #888; padding: 6px 8px; border-bottom: 1px solid #E8E4D8; text-align: left; }',
        'td { font-size: 12px; padding: 6px 8px; border-bottom: 1px solid #F4F2EE; }',
        '.footer { background: #F8F7F4; padding: 20px 40px; font-size: 11px; color: #888; }',
      ].join('\n');

      const fields = [
        ['Bauherrschaft', p.bauherrschaft||'—'],
        ['Adresse', (p.strasse||'—') + ', ' + (p.plz||'') + ' ' + (p.ort||'')],
        ['Kanton', p.kanton||'—'],
        ['Projektstart', p.datum||'—'],
        ['Aktuelle Phase', ap ? ('SIA ' + ap.nr + ' — ' + ap.label) : '—'],
        ['Planungsbüro', firma.name||'BauPlan Schweiz'],
        ['Planerkontakt', firma.email||firma.telefon||'—'],
      ];

      const fieldRows = fields.map(function(pair) {
        return '<div class="field-row"><div class="field-label">' + pair[0] + '</div><div class="field-value">' + pair[1] + '</div></div>';
      }).join('');

      const phaseRows = SIA.map(function(s) {
        const st = (p.phasenStatus && p.phasenStatus[s.id]) || 'nicht_begonnen';
        const badge = st === 'freigegeben' ? 'done' : st !== 'nicht_begonnen' ? 'running' : 'pending';
        const label = st === 'freigegeben' ? 'Abgeschlossen' : st === 'in_bearbeitung' ? 'Laufend' : st !== 'nicht_begonnen' ? 'Gestartet' : 'Ausstehend';
        return '<div class="phase-row"><div class="phase-num">SIA ' + s.nr + '</div><div class="phase-name">' + s.label + '</div><span class="badge ' + badge + '">' + label + '</span></div>';
      }).join('');

      var ntSection = '';
      if (pNt.length > 0) {
        var ntRows = pNt.map(function(n) {
          var net = (n.pos||n.positionen||[]).reduce(function(a,pp){ return a+(parseFloat(pp.menge)||0)*(parseFloat(pp.ep)||0); }, 0);
          return '<tr><td>' + (n.nr||'') + '</td><td>' + (n.titel||'') + '</td><td>' + (n.status||'') + '</td><td>CHF ' + net.toLocaleString('de-CH',{minimumFractionDigits:2}) + '</td></tr>';
        }).join('');
        ntSection = '<div class="section"><div class="section-title">Nachtraege (' + pNt.length + ')</div><table><thead><tr><th>Nr.</th><th>Titel</th><th>Status</th><th>Betrag CHF</th></tr></thead><tbody>' + ntRows + '</tbody></table></div>';
      }

      var rechSection = '';
      if (pRech.length > 0) {
        var rechRows = pRech.map(function(r) {
          var b = (parseFloat(r.betrag)||0)*(1+mwst/100);
          return '<tr><td>' + (r.datum ? new Date(r.datum).toLocaleDateString('de-CH') : '') + '</td><td>' + (r.bezeichnung||r.nr||'') + '</td><td>' + (r.status||'') + '</td><td>CHF ' + b.toLocaleString('de-CH',{minimumFractionDigits:2}) + '</td></tr>';
        }).join('');
        rechSection = '<div class="section"><div class="section-title">Rechnungen</div><table><thead><tr><th>Datum</th><th>Bezeichnung</th><th>Status</th><th>Betrag inkl. MWST</th></tr></thead><tbody>' + rechRows + '</tbody></table></div>';
      }

      var beteiligte = (p.beteiligte||[{funktion:'Fachplaner',firma:firma.name||'—',kontakt:firma.email||'—'}]).map(function(b) {
        return '<div class="field-row"><div class="field-label">' + (b.funktion||'—') + '</div><div class="field-value">' + (b.firma||b.name||'—') + (b.kontakt?' · '+b.kontakt:'') + '</div></div>';
      }).join('');

      const html = '<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Gebaeude-Dossier - ' + p.name + '</title><style>' + css + '</style></head><body>' +
        '<div class="header"><div class="logo">BauPlan Schweiz</div><div class="subtitle">Gebaeude-Dossier - Uebergabe-Dokumentation</div><div class="proj-title">' + p.name + '</div><div class="proj-sub">' + (p.strasse||'') + ', ' + (p.plz||'') + ' ' + (p.ort||'') + ' - Generiert: ' + today + '</div></div>' +
        '<div class="section"><div class="section-title">Projektuebersicht</div>' +
        '<div class="grid-4"><div class="kpi"><div class="kpi-val">' + (p.bgf||p.ebf||'—') + '</div><div class="kpi-lbl">BGF m2</div></div>' +
        '<div class="kpi"><div class="kpi-val">CHF ' + (totalRech/1000).toFixed(0) + 'k</div><div class="kpi-lbl">Rechnungen</div></div>' +
        '<div class="kpi"><div class="kpi-val">' + pNt.length + '</div><div class="kpi-lbl">Nachtraege</div></div>' +
        '<div class="kpi"><div class="kpi-val">' + totalStd.toFixed(0) + 'h</div><div class="kpi-lbl">Stunden</div></div></div>' +
        fieldRows + '</div>' +
        '<div class="section"><div class="section-title">SIA-Phasen</div>' + phaseRows + '</div>' +
        ntSection + rechSection +
        '<div class="section"><div class="section-title">Garantie und Maengelhaftung</div>' +
        '<div class="field-row"><div class="field-label">Garantiedauer</div><div class="field-value">2 Jahre ab Abnahme (OR 371 / SIA 118 Art. 172)</div></div>' +
        '<div class="field-row"><div class="field-label">Kontakt Mängel</div><div class="field-value">' + (firma.name||'—') + ' - ' + (firma.email||firma.telefon||'—') + '</div></div></div>' +
        '<div class="section"><div class="section-title">Beteiligte Planer</div>' + beteiligte + '</div>' +
        '<div class="footer"><div>Generiert mit BauPlan Schweiz - ' + (firma.name||'') + ' - ' + today + '</div><div>Kein Ersatz fuer offizielle Abnahmeprotokolle.</div></div>' +
        '</body></html>';

      const blob = new Blob([html], {type: 'text/html'});
      const url  = URL.createObjectURL(blob);
      const w    = window.open(url, '_blank');
      if (!w) {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Dossier_' + p.name.replace(/\s/g,'_') + '.html';
        a.click();
      }
      setLoading(false);
      setGenerated(true);
    }, 400);
  };

  const SECTIONS = [
    {ic:'🏗',l:'Projektdaten & Grundinfos',d:'Name, Adresse, Bauherrschaft, Kanton, Kenndaten'},
    {ic:'📊',l:'SIA-Phasen Abschlussübersicht',d:'Alle 9 Phasen mit Status'},

    {ic:'⚡',l:'Technische Infos',d:'Planungsbüro, Kontakte'},

  return <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.82)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}}>

        <div>

          <div style={{fontSize:'12px',color:C.dim}}>{p.name} · SIA 108 Phase 52</div>
        </div>
        <button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',color:C.dim,cursor:'pointer',fontSize:'20px'}}>✕</button>
      </div>

      <div style={{background:'rgba(107,175,122,.06)',border:'1px solid rgba(107,175,122,.15)',borderRadius:'10px',padding:'10px 14px',marginBottom:'16px',fontSize:'12px',color:C.green}}>
        Vollständiges Übergabe-Dossier in einem Klick. 3 Tage Arbeit → 30 Sekunden.

      <div style={{marginBottom:'18px'}}>
        {SECTIONS.map(s=><div key={s.l} style={{display:'flex',gap:'10px',padding:'8px 0',borderBottom:`1px solid rgba(255,255,255,.04)`}}>
          <span style={{fontSize:'16px',flexShrink:0}}>{s.ic}</span>
          <div style={{flex:1}}>
            <div style={{fontSize:'13px',color:'#FFF',fontWeight:'500'}}>{s.l}</div>
            <div style={{fontSize:'11px',color:C.dim,marginTop:'1px'}}>{s.d}</div>
          </div>
          <span style={{fontSize:'14px',color:C.green,flexShrink:0}}>✓</span>
        </div>)}
      </div>

      {generated
        ? <div style={{background:'rgba(107,175,122,.08)',border:'1px solid rgba(107,175,122,.2)',borderRadius:'10px',padding:'14px',textAlign:'center'}}>
            <div style={{fontSize:'20px',marginBottom:'6px'}}>✅</div>
            <div style={{fontSize:'14px',fontWeight:'700',color:C.green}}>Dossier erfolgreich generiert!</div>

            </div>
          </div>
        : <Btn onClick={generateDossier} variant="gold" full>{loading?'⏳ Generiert…':'📦 Dossier jetzt generieren'}</Btn>
      }
    </div>
  </div>;
}

function BaubewilligungsChecker() {
  const {projekte} = useApp();
  const [typ,  setTyp]   = useState('neubau_wohn');
  const [kant, setKant]  = useState('ZH');

  const uni    = data.universal||{};

  const allDoks= [...(uni.dokumente||[]), ...(kanto.extra||[])];

        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>Baubewilligungs-Checker</div>
          <div style={{fontSize:'12px',color:C.dim}}>Unterlagen-Checkliste nach Kanton & Projekttyp</div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'10px'}}>
        <Field label="Projekttyp">
          <select value={typ} onChange={e=>setTyp(e.target.value)} style={{...sBase,fontSize:'13px',background:C.card}}>
            {BBW_TYPEN.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
          </select>
        </Field>
        <Field label="Kanton">
          <select value={kant} onChange={e=>setKant(e.target.value)} style={{...sBase,fontSize:'13px',background:C.card}}>
            {KANTONE.map(k=><option key={k} value={k}>{k}</option>)}
          </select>
        </Field>
      </div>
    </div>

    <div style={{padding:'14px 18px'}}>
      {/* Progress */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'14px 16px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'14px'}}>
        <div style={{flex:1}}>
          <div style={{fontSize:'12px',color:C.dim,marginBottom:'6px'}}>Vollständigkeit: <strong style={{color:pctChecked===100?C.green:C.gold}}>{pctChecked}%</strong></div>
          <div style={{height:'6px',background:'rgba(255,255,255,.08)',borderRadius:'3px',overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pctChecked}%`,background:pctChecked===100?C.green:C.gold,borderRadius:'3px',transition:'width .3s'}}/>

        </div>

      </div>

      {/* Info block */}
      <div style={{background:'rgba(91,143,185,.06)',border:'1px solid rgba(91,143,185,.15)',borderRadius:'10px',padding:'13px 15px',marginBottom:'14px'}}>
        <div style={{fontSize:'11px',color:C.dim,textTransform:'uppercase',letterSpacing:'.04em',marginBottom:'6px'}}>Rechtliche Grundlage</div>
        <div style={{fontSize:'13px',color:'#EEE'}}>{uni.norm}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginTop:'10px'}}>

            <div style={{fontSize:'10px',color:C.dim,marginBottom:'2px'}}>Fristen</div>

          </div>
          <div>
            <div style={{fontSize:'10px',color:C.dim,marginBottom:'2px'}}>Gebühren</div>
            <div style={{fontSize:'12px',color:C.muted}}>{uni.kosten}</div>

        </div>

      {/* Kantonale Sonderfälle */}
      {kanto.extra&&kanto.extra.length>0&&<div style={{background:'rgba(224,160,64,.07)',border:'1px solid rgba(224,160,64,.2)',borderRadius:'10px',padding:'12px 14px',marginBottom:'14px'}}>

            {done?'✓':''}
          </div>
          <div style={{fontSize:'13px',color:done?C.dim:'#DDD',textDecoration:done?'line-through':'none',flex:1}}>{dok}</div>
          {i>=((uni.dokumente||[]).length)&&<span style={{fontSize:'9px',color:'#E0A040',background:'rgba(224,160,64,.12)',padding:'1px 6px',borderRadius:'4px',flexShrink:0}}>{kant}</span>}
        </div>;
      })}
    </div>
  </div>;
}

const NH_LS = (pId) => `bp_nachhaltigkeit_${pId}`;

function NachhaltigkeitsCockpit() {
  const {projekte} = useApp();
  const [selProj, setSelProj] = useState(projekte[0]?.id||null);
  const p = projekte.find(x=>x.id==selProj||x.id===parseInt(selProj));
  const [data,setData] = useState(()=>{
    try{return JSON.parse(localStorage.getItem(NH_LS(selProj))||'{}');}catch(e){return {};}
  });

  const load = pId => { try{return JSON.parse(localStorage.getItem(NH_LS(pId))||'{}');}catch(e){return {};} };
  const saveD = (pId,d) => { try{localStorage.setItem(NH_LS(pId),JSON.stringify(d));}catch(e){} };
  const upd = (k,v) => { const nd={...data,[k]:v}; setData(nd); saveD(selProj,nd); };

  const MINERGIE_ZIELE = [
    {k:'luftdicht',l:'Luftdichtigkeitstest (Blower Door) ≤0.6 h⁻¹',norm:'MINERGIE-P'},
    {k:'lueftung', l:'Kontrollierte Wohnungslüftung vorhanden',norm:'MINERGIE'},
    {k:'haushalt', l:'Haushaltstrom-Anforderungen erfüllt',norm:'MINERGIE'},
    {k:'energie',  l:'Heizwärmebedarf ≤33 kWh/m² EBF·a',norm:'SIA 380/1'},
    {k:'pv',       l:'PV-Anlage vorhanden oder Voranfrage',norm:'MuKEn'},
    {k:'grau',     l:'Graue Energie berechnet (optional)',norm:'SNBS'},
  ];

  const done2000W = ['oeffentlich','mobi_konzept','energie_pflicht','gebaeude_smart'].filter(k=>data[k]).length;

  return <div style={{minHeight:'100vh',background:C.dark,paddingBottom:'90px'}}>
    <div style={{background:C.mid,borderBottom:`1px solid ${C.border}`,padding:'52px 18px 16px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'12px'}}>
        <div style={{width:'40px',height:'40px',background:'rgba(107,175,122,.12)',border:'1px solid rgba(107,175,122,.25)',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px'}}>🌱</div>
        <div>
          <div style={{fontSize:'22px',fontWeight:'800',color:'#FFF'}}>Nachhaltigkeits-Cockpit</div>
          <div style={{fontSize:'12px',color:C.dim}}>MINERGIE · SIA 380/1 · MuKEn · 2000-Watt</div>
        </div>
      </div>
      <Field label="Projekt">
        <select value={selProj||''} onChange={e=>{setSelProj(e.target.value);setData(load(e.target.value));}} style={{...sBase,fontSize:'13px',background:C.card}}>
          {projekte.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>
    </div>

    <div style={{padding:'14px 18px'}}>
      {/* MINERGIE */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',marginBottom:'12px',overflow:'hidden'}}>
        <div style={{padding:'14px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF'}}>MINERGIE / SIA 380/1 Checkliste</div>
            <div style={{fontSize:'11px',color:C.dim,marginTop:'2px'}}>Schweizer Energiestandard für Gebäude</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:'18px',fontWeight:'800',color:C.green}}>{MINERGIE_ZIELE.filter(z=>data[z.k]).length}/{MINERGIE_ZIELE.length}</div>
            <div style={{fontSize:'10px',color:C.dim}}>erfüllt</div>
          </div>
        </div>
        {MINERGIE_ZIELE.map((z,i)=><div key={z.k} onClick={()=>upd(z.k,!data[z.k])} style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px 16px',borderBottom:i<MINERGIE_ZIELE.length-1?`1px solid rgba(255,255,255,.04)`:'none',cursor:'pointer'}}>
          <div style={{width:'20px',height:'20px',borderRadius:'5px',border:`1.5px solid ${data[z.k]?C.green:'rgba(255,255,255,.2)'}`,background:data[z.k]?'rgba(107,175,122,.2)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',color:C.green,flexShrink:0}}>
            {data[z.k]?'✓':''}
          </div>
          <div style={{flex:1,fontSize:'13px',color:data[z.k]?C.dim:'#DDD',textDecoration:data[z.k]?'line-through':'none'}}>{z.l}</div>
          <span style={{fontSize:'10px',color:C.blue,background:'rgba(91,143,185,.1)',padding:'1px 7px',borderRadius:'5px',flexShrink:0}}>{z.norm}</span>
        </div>)}
      </div>

      {/* CO2 / Energie Inputs */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF',marginBottom:'14px'}}>Energiedaten Gebäude</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
          {[
            {k:'heizwarm',   l:'Heizwärmebedarf (kWh/m²·a)',pl:'z.B. 35',ziel:'≤35 (SIA 380/1)',ok:v=>parseFloat(v)<=35},
            {k:'gesamtenergie',l:'Gesamtenergie (kWh/m²·a)',pl:'z.B. 50',ziel:'≤60 (MINERGIE)',ok:v=>parseFloat(v)<=60},
            {k:'pv_kwp',     l:'PV-Leistung (kWp)',pl:'z.B. 12',ziel:'Förderung ab 3kWp',ok:v=>parseFloat(v)>=3},
            {k:'co2_kg',     l:'CO₂-Äquivalent (kg/m²·a)',pl:'z.B. 8',ziel:'≤12 SNBS',ok:v=>parseFloat(v)<=12},
          ].map(f=>{
            const val=data[f.k]||'';
            const isOk=val&&f.ok(val);
            return <div key={f.k}>
              <Field label={f.l}>
                <Input type="number" value={val} onChange={v=>upd(f.k,v)} placeholder={f.pl}/>
              </Field>
              {val&&<div style={{fontSize:'11px',color:isOk?C.green:C.red,marginTop:'3px',fontWeight:'600'}}>
                {isOk?'✓ Ziel erreicht':'⚠ Ziel: '+f.ziel}
              </div>}
            </div>;
          })}
        </div>
      </div>

      {/* 2000-Watt */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
          <div style={{fontSize:'14px',fontWeight:'700',color:'#FFF'}}>2000-Watt-Gesellschaft</div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:'16px',fontWeight:'800',color:done2000W===4?C.green:C.gold}}>{done2000W}/4</div>
            <div style={{fontSize:'10px',color:C.dim}}>Kriterien</div>
          </div>
        </div>
        {[
          {k:'oeffentlich',     l:'Gute ÖV-Anbindung vorhanden'},
          {k:'mobi_konzept',    l:'Mobilitätskonzept ausgearbeitet'},
          {k:'energie_pflicht', l:'Energiepflicht MuKEn erfüllt'},
          {k:'gebaeude_smart',  l:'Smart-Home / Gebäudeautomation geplant'},
        ].map(item=><div key={item.k} onClick={()=>upd(item.k,!data[item.k])} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:`1px solid rgba(255,255,255,.04)`,cursor:'pointer'}}>
          <div style={{width:'18px',height:'18px',borderRadius:'4px',border:`1.5px solid ${data[item.k]?C.green:'rgba(255,255,255,.2)'}`,background:data[item.k]?'rgba(107,175,122,.2)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:C.green,flexShrink:0}}>
            {data[item.k]?'✓':''}
          </div>
          <span style={{fontSize:'13px',color:data[item.k]?C.dim:'#DDD',textDecoration:data[item.k]?'line-through':'none'}}>{item.l}</span>
        </div>)}
      </div>

      <div style={{fontSize:'11px',color:C.dim,textAlign:'center',lineHeight:'1.5'}}>
        Daten werden pro Projekt gespeichert. Kein Ersatz für offizielle MINERGIE-Zertifizierung oder SIA-Nachweis.
      </div>
    </div>
  </div>;
}

      {/* Logo header */}
      <div style={{padding:"14px 12px 12px",display:"flex",alignItems:"center",gap:"10px",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{width:"32px",height:"32px",borderRadius:"9px",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",color:C.dark,fontSize:"16px",flexShrink:0}}>B</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"14px",fontWeight:"700",color:"#FFF",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>BauPlan Schweiz</div>
          <div style={{fontSize:"10px",color:C.dim}}>Navigation</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:"18px",padding:"2px 6px",borderRadius:"5px",flexShrink:0}}>✕</button>
      </div>

      {/* Nav items */}
      <div style={{padding:"8px 6px",flex:1}}>

        {/* Projekte */}
        <div style={itemSt(nav.page==="projekte"||nav.page==="projekt-detail"||nav.page==="neu-projekt")} onClick={()=>toggle("projekte")}>
          <span style={{fontSize:"15px"}}>📁</span>
          <span style={{flex:1}}>Projekte</span>
          {chev(exp.projekte)}
        </div>

        {exp.projekte && <>
          {projekte.map(p => {
            const pKey  = "p_"+p.id;
            const pAct  = isAct("projekt-detail", p.id);
            const ap    = SIA.find(x=>x.id===p.aktivPhase);
            return <div key={p.id}>
              <div style={subSt(pAct)} onClick={()=>toggle(pKey)}>
                <span style={{fontSize:"10px",color:pAct?C.gold:C.dim}}>▷</span>
                <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                {exp[pKey]
                  ? <span style={{fontSize:"8px",color:C.dim}}>▼</span>
                  : <span style={{fontSize:"8px",color:C.dim}}>▶</span>
                }
              </div>
              {exp[pKey] && <>
                <div style={deepSt(pAct && !exp["ptab_"+p.id])} onClick={e=>{e.stopPropagation();go("projekt-detail",p.id);}}>
                  <span style={{fontSize:"12px"}}>📂</span> Projekt öffnen
                </div>
                {PROJ_TABS.map(t =>
                  <div key={t.id} style={deepSt(false)} onClick={e=>{e.stopPropagation();setNav({page:"projekt-detail",id:p.id,_tab:t.id});if(window.innerWidth<1024)onClose();}}>
                    <span style={{fontSize:"11px"}}>{t.ic}</span> {t.l}
                  </div>
                )}
              </>}
            </div>;
          })}
          <div style={subSt(isAct("neu-projekt"))} onClick={()=>go("neu-projekt")}>
            <span style={{fontSize:"13px",color:C.gold}}>＋</span>
            <span style={{color:C.gold}}>Neues Projekt</span>
          </div>
        </>}

        {sep}

        <div style={itemSt(isAct("nachtraege"))} onClick={()=>go("nachtraege")}>
          <span style={{fontSize:"15px"}}>📋</span> Nachträge
        </div>
        <div style={itemSt(isAct("stunden_global"))} onClick={()=>go("stunden_global")}>
          <span style={{fontSize:"15px"}}>⏱</span> Stunden
        </div>

        {sep}

        <div style={itemSt(isAct("ebf"))} onClick={()=>go("ebf")}>
          <span style={{fontSize:"13px",fontWeight:"700"}}>m²</span> EBF-Rechner
        </div>
        <div style={itemSt(isAct("nachweise"))} onClick={()=>go("nachweise")}>
          <span style={{fontSize:"15px"}}>⚡</span> Energienachweise
        </div>

        {sep}

        <div style={itemSt(isAct("finanzen"))} onClick={()=>go("finanzen")}>
          <span style={{fontSize:"15px"}}>💼</span> Finanzen
        </div>
        <div style={itemSt(isAct("fristen"))} onClick={()=>go("fristen")}>
          <span style={{fontSize:"15px"}}>📅</span> Fristen & Termine
        </div>
        {sep}
        <div style={itemSt(isAct("baufhuette"))} onClick={()=>go("baufhuette")}>
          <span style={{fontSize:"15px"}}>🏚</span> Bauhütte
        </div>
        <div style={itemSt(isAct("wissen"))} onClick={()=>go("wissen")}>
          <span style={{fontSize:"15px"}}>📚</span> Wissensdatenbank
        </div>
        {sep}
        <div style={itemSt(isAct("bautagebuch"))} onClick={()=>go("bautagebuch")}>
          <span style={{fontSize:"15px"}}>📖</span> Bautagebuch
        </div>
        <div style={itemSt(isAct("vorlagen"))} onClick={()=>go("vorlagen")}>
          <span style={{fontSize:"15px"}}>📄</span> Vorlagen-Bibliothek
        </div>
        <div style={itemSt(isAct("baubewilligung"))} onClick={()=>go("baubewilligung")}>
          <span style={{fontSize:"15px"}}>🏛</span> Baubewilligungs-Checker
        </div>
        <div style={itemSt(isAct("nachhaltigkeit"))} onClick={()=>go("nachhaltigkeit")}>
          <span style={{fontSize:"15px"}}>🌱</span> Nachhaltigkeits-Cockpit
        </div>
        <div style={itemSt(isAct("normen"))} onClick={()=>go("normen")}>
          <span style={{fontSize:"15px"}}>📡</span> Normen-Tracker
        </div>
        <div style={itemSt(isAct("stellen"))} onClick={()=>go("stellen")}>
          <span style={{fontSize:"15px"}}>💼</span> Stellenbörse
        </div>
        <div style={itemSt(isAct("bewertungen"))} onClick={()=>go("bewertungen")}>
          <span style={{fontSize:"15px"}}>⭐</span> Bewertungen
        </div>
        <div style={itemSt(isAct("qrcode"))} onClick={()=>go("qrcode")}>
          <span style={{fontSize:"15px"}}>🔗</span> QR-Code
        </div>
        {sep}
        <div style={itemSt(isAct("profil"))} onClick={()=>go("profil")}>
          <span style={{fontSize:"15px"}}>◯</span> Profil & Einstellungen
        </div>
      </div>

      {/* Footer */}
      <div style={{padding:"10px 12px",borderTop:`1px solid ${C.border}`,flexShrink:0,textAlign:"center",fontSize:"10px",color:C.dim}}>
        BauPlan Schweiz · Alpha
      </div>
    </div>
  </>;
}



function App(){
  const [appState,setAppState]=useState("onboarding"); // onboarding | app
  const [user,setUser]=useState(null);
  const [users,setUsers]=useState(DEMO_USERS);
  const [projekte,setProjekte]=useState(INIT_PROJEKTE);
  const [offerten,setOfferten]=useState(INIT_OFFERTEN);
  const [rechnungen,setRechnungen]=useState(INIT_RECHNUNGEN);
  const [stunden,setStunden]=useState(INIT_STUNDEN);
  const [firma,setFirma]=useState(INIT_FIRMA);
  const [nav,setNav]=useState({page:"projekte"});
  const [sidebarOpen,setSidebarOpen]=useState(window.innerWidth>=1024);

  const enterApp=(userData)=>{
    // If user brought custom firma data, update firma state
    if(userData.firma){setFirma(p=>({...p,...userData.firma}));}
    const u={...userData};delete u.firma;
    setUser(u);
    setUsers(p=>[...p.filter(x=>x.email!==u.email),u]);
    setAppState("app");
  };

  // For direct demo login
  window.enterAppDirect=(u)=>{setUser(u);setAppState("app");};

  if(appState==="onboarding") return <Onboarding onComplete={enterApp}/>;

  const ctx={user,setUser,users,setUsers,projekte,setProjekte,offerten,setOfferten,rechnungen,setRechnungen,stunden,setStunden,firma,setFirma,nav,setNav};
  const canEdit=["admin","planer"].includes(user.rolle);
  const showNav=nav.page!=="neu-projekt";

  const renderPage=()=>{
    const {page,id}=nav;
    if(page==="projekte")       return <ProjektListe/>;
    if(page==="projekt-detail") return <ProjektDetail id={id}/>;
    if(page==="neu-projekt")    return <NeuProjekt/>;
    if(page==="nachweise")      return <Energienachweise/>;
    if(page==="stunden_global")  return <StundenGlobal/>;
    if(page==="ebf")             return <EBFRechner/>;
    if(page==="nachtraege")      return <NachtraegeSeite/>;
    if(page==="wissen")          return <WissenSeite/>;
    if(page==="finanzen")        return <FinanzenSeite/>;
    if(page==="fristen")         return <FristenKalender/>;
    if(page==="baufhuette")      return <BauhüttePage/>;
    if(page==="bautagebuch")     return <BautagebuchSeite/>;
    if(page==="vorlagen")        return <VorlagenBibliothek/>;
    if(page==="qrcode")          return <QrSeite/>;
    if(page==="bewertungen")     return <UnternehmerBewertungen/>;
    if(page==="normen")          return <NormenTracker/>;
    if(page==="stellen")         return <StellenBoerse/>;
    if(page==="bauherren-portal") return <BauherrenPortal/>;
    if(page==="baubewilligung")   return <BaubewilligungsChecker/>;
    if(page==="nachhaltigkeit")   return <NachhaltigkeitsCockpit/>;
    if(page==="profil")          return <Profil onLogoutToOnboarding={()=>{setUser(null);setAppState("onboarding");}}/>;
    return <ProjektListe/>;
  };

  return <AppCtx.Provider value={ctx}>
    <div style={{minHeight:"100vh",background:C.dark}}>
      <SidebarNav open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
      {sidebarOpen&&window.innerWidth<1024&&<div onClick={()=>setSidebarOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:48}}/>}
      <button onClick={()=>setSidebarOpen(p=>!p)} style={{position:"fixed",top:"12px",left:sidebarOpen&&window.innerWidth>=1024?"254px":"12px",zIndex:60,background:"rgba(15,15,13,0.92)",backdropFilter:"blur(10px)",border:`1px solid ${C.border}`,color:C.muted,borderRadius:"10px",width:"38px",height:"38px",fontSize:"17px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"left .22s"}}>{sidebarOpen?"←":"☰"}</button>
      <div style={{marginLeft:sidebarOpen&&window.innerWidth>=1024?"242px":"0",transition:"margin-left .22s"}}>
        {renderPage()}
        {showNav&&<BottomNav nav={nav} setNav={setNav} canEdit={canEdit}/>}
      </div>
    </div>
  </AppCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
