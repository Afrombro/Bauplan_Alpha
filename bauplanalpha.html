// ── HELPERS ───────────────────────────────────────────────────────────────────
const h = (tag, props, ...ch) => {
  const el = document.createElement(tag);
  if (props) Object.entries(props).forEach(([k,v]) => {
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "value" && (tag==="input"||tag==="select"||tag==="textarea")) el.value = v;
    else if (k === "checked") el.checked = v;
    else if (k === "disabled") el.disabled = v;
    else if (k === "htmlFor") el.htmlFor = v;
    else if (k === "type") el.type = v;
    else if (k !== "key") el.setAttribute(k, v);
  });
  ch.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(c) : c);
  });
  return el;
};
const div = (s,...c) => { const e=h("div",null,...c); if(s) Object.assign(e.style,s); return e; };
const span = (txt, s) => { const e=h("span",null,txt); if(s) Object.assign(e.style,s); return e; };
const btn = (txt, onClick, s, cls) => { const e=h("button",{onClick},txt); if(s) Object.assign(e.style,s); if(cls) e.className=cls; return e; };
const inp = (val, onChange, placeholder, type="text", cls="inp") => {
  const e = h("input",{type,placeholder,value:val});
  e.className = cls;
  e.addEventListener("input", ev => onChange(ev.target.value));
  return e;
};
const sel = (val, onChange, options, cls="inp") => {
  const e = h("select");
  e.className = cls;
  options.forEach(o => {
    const opt = h("option", null, o.label || o);
    opt.value = o.value !== undefined ? o.value : o;
    if ((o.value||o) === val) opt.selected = true;
    e.appendChild(opt);
  });
  e.addEventListener("change", ev => onChange(ev.target.value));
  return e;
};
const fld = (label, required, err, child) => {
  const wrap = div(null);
  const lbl = h("div",{class:"lbl"}, label + (required ? " *" : ""));
  if (required) lbl.querySelector ? null : null; // label color
  lbl.style.color = err ? C.red : C.dim;
  wrap.appendChild(lbl);
  wrap.appendChild(child);
  if (err) { const e = div({fontSize:"10px",color:C.red,marginTop:"3px"},err); wrap.appendChild(e); }
  return wrap;
};
const avatar = (user, size=32) => {
  const e = div({width:size+"px",height:size+"px",borderRadius:"50%",flexShrink:"0",background:`${user.farbe}33`,border:`2px solid ${user.farbe}55`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:(size*0.33)+"px",fontWeight:"800",color:user.farbe}, user.kuerzel);
  return e;
};
const rolBadge = (rolleId, small) => {

};
const stBadge = (stId, small) => {
  const s = PST.find(x=>x.id===stId)||PST[0];
  const e = div({display:"inline-flex",alignItems:"center",gap:"3px",fontSize:small?"9px":"10px",fontWeight:"700",color:s.color,background:s.bg,padding:small?"2px 6px":"4px 9px",borderRadius:"4px",textTransform:"uppercase",whiteSpace:"nowrap"});
  e.appendChild(span(s.icon)); e.appendChild(span(" "+s.label));

};
const katBadge = (kat) => {
  const kc = KATC[kat]; if(!kc) return span(kat);
  return span(kat, {fontSize:"9px",fontWeight:"700",padding:"2px 7px",borderRadius:"4px",background:kc.bg,border:`1px solid ${kc.bd}`,color:kc.tx});
};
const card = (children, style={}, onClick) => {
  const e = div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",...style});
  children.forEach(c => c && e.appendChild(c));
  if (onClick) {
    e.style.cursor = "pointer";
    e.addEventListener("click", onClick);
    e.addEventListener("mouseenter", ()=>e.style.borderColor="rgba(200,169,110,0.3)");
    e.addEventListener("mouseleave", ()=>e.style.borderColor=C.border);
  }
  return e;
};
const progBar = (pct, color, height=4) => {

};
const phaseBarMini = (phasenStatus, aktivPhase) => {

function authScreen() {
  const {authMode:mode, authForm:f, authErr:err, users} = STATE;
  const upd = (k,v) => setState(s=>({authForm:{...s.authForm,[k]:v}}));

  const page = div({minHeight:"100vh",background:C.dark,display:"flex",flexDirection:"column"});

  // Header
  const hdr = div({background:"rgba(255,255,255,0.02)",borderBottom:`1px solid ${C.border}`,padding:"52px 24px 24px",textAlign:"center"});
  const logo = div({width:"56px",height:"56px",borderRadius:"15px",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"28px",fontWeight:"900",color:C.dark,margin:"0 auto 14px"}, "B");

  hdr.appendChild(div({fontSize:"24px",fontWeight:"800",letterSpacing:"-0.02em",marginBottom:"4px"},"BauPlan Schweiz"));

  const body = div({flex:"1",padding:"20px",overflowY:"auto"});

  // Tabs
  const tabRow = div({display:"flex",gap:"3px",background:"rgba(255,255,255,0.04)",borderRadius:"11px",padding:"4px",border:`1px solid ${C.border}`,marginBottom:"22px"});

    tabRow.appendChild(b);

  body.appendChild(tabRow);

  const form = div({display:"flex",flexDirection:"column",gap:"14px"});

  if (mode==="register") {
    const ni = inp(f.name, v=>upd("name",v), "Vor- und Nachname", "text", err.name?"inp err":"inp");
    form.appendChild(fld("Name", true, err.name, ni));
  }

  const ei = inp(f.email, v=>upd("email",v), "name@buero.ch", "email", err.email?"inp err":"inp");
  form.appendChild(fld("E-Mail", true, err.email, ei));
  const pi = inp(f.pw, v=>upd("pw",v), mode==="register"?"Mind. 6 Zeichen":"Passwort", "password", err.pw?"inp err":"inp");
  form.appendChild(fld("Passwort", true, err.pw, pi));

  if (mode==="register") {
    const ci = inp(f.cpw, v=>upd("cpw",v), "Wiederholen", "password", err.cpw?"inp err":"inp");
    form.appendChild(fld("Bestätigen", true, err.cpw, ci));

    // Fachbereich
    const fbWrap = div({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"});
    FBS.forEach(fb => {
      const b = div({display:"flex",alignItems:"center",gap:"9px",padding:"10px 12px",borderRadius:"10px",cursor:"pointer",border:`1px solid ${f.fb===fb.id?`${fb.color}55`:C.border}`,background:f.fb===fb.id?`${fb.color}12`:"rgba(255,255,255,0.03)"});
      b.appendChild(span(fb.icon,{fontSize:"16px"}));
      b.appendChild(span(fb.label,{fontSize:"11px",fontWeight:"600",color:f.fb===fb.id?fb.color:"#888"}));
      b.addEventListener("click",()=>upd("fb",fb.id));
      fbWrap.appendChild(b);
    });
    form.appendChild(fld("Fachbereich", true, null, fbWrap));

    // Rolle
    const rWrap = div({display:"flex",flexDirection:"column",gap:"7px"});
    ROLLEN.forEach(r => {
      const b = div({display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",borderRadius:"11px",cursor:"pointer",border:`1px solid ${f.rolle===r.id?`${r.color}55`:C.border}`,background:f.rolle===r.id?`${r.color}12`:"rgba(255,255,255,0.03)"});
      b.appendChild(span(r.icon,{fontSize:"18px",color:f.rolle===r.id?r.color:"#555"}));
      const info = div(null); info.appendChild(div({fontSize:"13px",fontWeight:"700",color:f.rolle===r.id?r.color:"#AAA"},r.label)); info.appendChild(div({fontSize:"10px",color:C.dim},r.desc));
      b.appendChild(info); b.style.flex="1";
      const dot = div({width:"16px",height:"16px",borderRadius:"50%",border:`2px solid ${f.rolle===r.id?r.color:"#333"}`,background:f.rolle===r.id?r.color:"transparent",flexShrink:"0",marginLeft:"auto"});
      b.appendChild(dot);
      b.addEventListener("click",()=>upd("rolle",r.id));
      rWrap.appendChild(b);
    });
    form.appendChild(fld("Rolle", true, null, rWrap));
  }

  // Submit
  const submitBtn = btn(mode==="login"?"Anmelden →":"Konto erstellen →", () => {
    const e={};
    if(!f.email.trim())e.email="Pflichtfeld";
    else if(!/\S+@\S+\.\S+/.test(f.email))e.email="Ungültige E-Mail";
    if(!f.pw)e.pw="Pflichtfeld";
    if(mode==="register"){
      if(!f.name.trim())e.name="Pflichtfeld";
      if(f.pw.length<6)e.pw="Mind. 6 Zeichen";
      if(f.pw!==f.cpw)e.cpw="Stimmt nicht überein";
      if(users.find(u=>u.email===f.email))e.email="Bereits registriert";
    }
    if(Object.keys(e).length>0){setState({authErr:e});return;}
    if(mode==="login"){
      const u=users.find(u=>u.email===f.email&&u.password===f.pw);
      if(!u){setState({authErr:{pw:"E-Mail oder Passwort falsch"}});return;}
      setState({user:u,tab:"projekte",view:"liste"});
    } else {
      const ini=f.name.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
      const cols=["#C8A96E","#6BAF7A","#5B8FB9","#E8735A","#B478C8"];
      const nu={id:Date.now(),email:f.email,password:f.pw,name:f.name,rolle:f.rolle,fb:f.fb,kuerzel:ini,farbe:cols[users.length%5]};
      setState(s=>({users:[...s.users,nu],user:nu,tab:"projekte",view:"liste"}));
    }
  }, {padding:"15px",borderRadius:"12px",cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:"16px",fontWeight:"800",marginTop:"4px",width:"100%"});
  form.appendChild(submitBtn);

  // Demo users
  if (mode==="login") {
    const demoBox = div({background:"rgba(200,169,110,0.06)",border:"1px solid rgba(200,169,110,0.18)",borderRadius:"12px",padding:"16px",marginTop:"8px"});
    demoBox.appendChild(div({fontSize:"10px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"},"Demo (tippen zum Ausfüllen)"));
    DEMO_USERS.forEach((u,i) => {
      const row = div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<DEMO_USERS.length-1?`1px solid ${C.border}`:"none",cursor:"pointer"});
      const left = div({display:"flex",alignItems:"center",gap:"9px"});
      left.appendChild(avatar(u,30));
      const info = div(null); info.appendChild(div({fontSize:"12px",fontWeight:"600",color:"#DDD"},u.name)); info.appendChild(div({fontSize:"10px",color:C.dim},u.email));
      left.appendChild(info); row.appendChild(left);
      row.appendChild(rolBadge(u.rolle, true));
      row.addEventListener("click",()=>setState({authForm:{...STATE.authForm,email:u.email,pw:u.password}}));
      demoBox.appendChild(row);
    });
    form.appendChild(demoBox);
  }

  body.appendChild(form);
  page.appendChild(body);
  return page;
}

// ── PROJEKT LISTE ─────────────────────────────────────────────────────────────

    c.addEventListener("mouseenter",()=>c.style.borderColor="rgba(200,169,110,0.3)");
    c.addEventListener("mouseleave",()=>c.style.borderColor=C.border);
    c.addEventListener("click",()=>setState({aktivProjekt:p,view:"detail",detailTab:"phasen"}));

    const topBar = div({height:"3px",background:`linear-gradient(90deg,${ap?.color||C.gold},transparent)`});
    c.appendChild(topBar);

    const inner = div({padding:"14px 16px"});

    // Title row
    const tr = div({display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"});
    const tl = div({flex:"1",marginRight:"10px"});
    tl.appendChild(div({fontSize:"15px",fontWeight:"700",color:C.main,lineHeight:"1.3",marginBottom:"3px"},p.name));
    tl.appendChild(div({fontSize:"11px",color:C.dim},`${p.bauherrschaft} · ${p.ort}, ${p.kanton}`));
    tr.appendChild(tl);
    if(ap){const ph=div({textAlign:"right",flexShrink:"0"});ph.appendChild(div({fontSize:"11px",fontWeight:"800",color:ap.color},`SIA ${ap.nr}`));ph.appendChild(div({fontSize:"9px",color:C.dim},ap.label));tr.appendChild(ph);}
    inner.appendChild(tr);

    // Phase bar
    const pb = div({marginBottom:"8px"});
    pb.appendChild(phaseBarMini(p.phasenStatus||{},p.aktivPhase));
    pb.appendChild(div({fontSize:"9px",color:C.green,fontWeight:"700",textAlign:"right"},`${freiPh}/${SIA.length} Phasen freigegeben`));
    inner.appendChild(pb);

    // Kennzahlen
    const kz = div({display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"6px"});
    [[`${(p.bgf||0).toLocaleString("de-CH")}m²`,"BGF"],[fmtM(p.bkpSumme),"Budget"],[fmtM(bkpAkt),"Aktuell"],[allePl,"Pläne"]].forEach(([v,l])=>{
      const kk = div({textAlign:"center"});
      kk.appendChild(div({fontSize:"11px",fontWeight:"700",color:C.muted},""+v));
      kk.appendChild(div({fontSize:"8px",color:C.dim,marginTop:"1px",textTransform:"uppercase",letterSpacing:"0.04em"},l));
      kz.appendChild(kk);
    });
    inner.appendChild(kz);

    // Team
    if((p.beteiligte||[]).length>0){
      const team = div({marginTop:"10px",paddingTop:"9px",borderTop:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:"5px"});
      (p.beteiligte||[]).slice(0,5).forEach((b,i)=>{
        const fb=FBS.find(f=>f.id===b.fb);
        const av=div({width:"22px",height:"22px",borderRadius:"50%",background:`${fb?.color||"#888"}22`,border:`2px solid ${C.dark}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",color:fb?.color,marginLeft:i>0?"-7px":"0",zIndex:""+(10-i)},fb?.icon||"?");
        team.appendChild(av);
      });
      team.appendChild(span(`${(p.beteiligte||[]).length} Beteiligte`,{fontSize:"9px",color:C.dim,marginLeft:"5px"}));
      inner.appendChild(team);
    }

    c.appendChild(inner);
    body.appendChild(c);
  });

  if(projekte.length===0){
    const empty=div({textAlign:"center",padding:"50px 20px",color:C.dim});
    empty.appendChild(div({fontSize:"28px",marginBottom:"8px"},"◎"));
    empty.appendChild(div(null,"Noch keine Projekte"));
    body.appendChild(empty);
  }

  page.appendChild(body);
  return page;
}

// ── PROJEKT DETAIL ────────────────────────────────────────────────────────────

  TABS.forEach(t=>{
    const b = btn("", ()=>setState({detailTab:t.id}), {flex:"1",padding:"7px 4px",borderRadius:"7px",border:"none",cursor:"pointer",fontSize:"10px",fontWeight:"700",background:tab===t.id?"rgba(200,169,110,0.18)":"transparent",color:tab===t.id?C.gold:"#555"});
    b.appendChild(span(t.ic+" ")); b.appendChild(span(t.l));
    tabRow.appendChild(b);
  });
  hdr.appendChild(tabRow);
  page.appendChild(hdr);

  const body = div({padding:"16px 18px",paddingBottom:"30px"});

  // ── PHASEN TAB ──
  if(tab==="phasen"){
    // Overall bar
    const overallCard = div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"14px 16px",marginBottom:"16px"});
    overallCard.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"},"Gesamtfortschritt"));
    overallCard.appendChild(phaseBarMini(p.phasenStatus||{},p.aktivPhase));
    const fl = div({display:"flex",justifyContent:"space-between",marginTop:"5px"});
    fl.appendChild(span("Init",{fontSize:"9px",color:C.dim}));
    fl.appendChild(span(`${freiPh}/${SIA.length} freigegeben`,{fontSize:"9px",color:C.green,fontWeight:"700"}));
    fl.appendChild(span("Bewi",{fontSize:"9px",color:C.dim}));
    overallCard.appendChild(fl);
    body.appendChild(overallCard);

    // Gruppen
    const gruppen=[...new Set(SIA.map(x=>x.gruppe))];
    gruppen.forEach(gruppe => {
      const gl = div({fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"8px"},gruppe);
      body.appendChild(gl);
      const col = div({display:"flex",flexDirection:"column",gap:"7px",marginBottom:"16px"});
      SIA.filter(ph=>ph.gruppe===gruppe).forEach(phase=>{
        const statusId = p.phasenStatus[phase.id]||"nicht_begonnen";

        const isAkt = p.aktivPhase===phase.id;
        const dokAnz = Object.values(p.plaene||{}).reduce((a,phs)=>a+(phs[phase.id]||[]).length,0);

        const pc = div({background:isAkt?`${phase.color}10`:"rgba(255,255,255,0.03)",border:`2px solid ${isAkt?phase.color:s.color+"33"}`,borderRadius:"12px",padding:"12px 14px",cursor:"pointer",transition:"all 0.15s"});

        pbox.appendChild(span(phase.nr,{fontSize:"11px",fontWeight:"900",color:phase.color}));
        pl.appendChild(pbox);
        const pi2 = div(null);

        pi2.appendChild(pnr);
        pi2.appendChild(stBadge(statusId,true));
        pl.appendChild(pi2);
        prow.appendChild(pl);
        const pr = div({textAlign:"right",flexShrink:"0"});

        prow.appendChild(pr);

        pc.addEventListener("click",()=>setState({activePhase:phase,showPhaseModal:true,showPhaseUpload:false,upName:"",upTyp:"Grundriss",upFb:(p.beteiligte?.[0]?.fb||"hlk")}));

      empty.appendChild(div({fontSize:"28px",marginBottom:"8px"},"📐"));
      empty.appendChild(div(null,"Noch keine Pläne — öffne eine SIA-Phase"));

  // ── BKP TAB ──

          ii.style.fontSize="12px"; ii.style.padding="8px 10px";
          ff.appendChild(ii); gr.appendChild(ff);

      ub.appendChild(fbr);
      const ubrow=div({display:"flex",gap:"8px"});
      ubrow.appendChild(btn("Abbrechen",()=>setState({showPhaseUpload:false}),{flex:"1",padding:"9px",borderRadius:"9px",cursor:"pointer",background:"rgba(255,255,255,0.04)",border:`1px solid ${C.border}`,color:"#777",fontSize:"12px",fontWeight:"600"}));

    if(allesPlaene.length>0){

  return page;

// ── NEU PROJEKT ───────────────────────────────────────────────────────────────
function neuProjekt() {
  let draft = {name:"",ort:"",kanton:"",bauherrschaft:"",bgf:"",bkpSumme:"",aktivPhase:"31"};
  let beteiligte = [];
  let addFbLocal = "pl_gt";

  const ni=inp("",v=>{draft.name=v;},"z.B. Wohnüberbauung Zürichberg");
  const oi=inp("",v=>{draft.ort=v;},"z.B. Zürich");
  const ki=sel("",v=>{draft.kanton=v;},[{value:"",label:"KT"},...KANTONE.map(k=>({value:k,label:k}))]);
  const bi=inp("",v=>{draft.bauherrschaft=v;},"z.B. Müller Immobilien AG");

  const bkpi=inp("",v=>{draft.bkpSumme=v;},"z.B. 12500000","number");

  gForm.appendChild(fld("Projektname",true,null,ni));

  oRow.appendChild(fld("Ort",true,null,oi));
  oRow.appendChild(fld("Kanton",true,null,ki));
  gForm.appendChild(oRow);
  gForm.appendChild(fld("Bauherrschaft",true,null,bi));
  const bRow=div({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"});
  bRow.appendChild(fld("BGF (m²)",false,null,bgi));
  bRow.appendChild(fld("BKP Total (CHF)",false,null,bkpi));
  gForm.appendChild(bRow);
  grundCard.appendChild(gForm);
  body.appendChild(grundCard);

  // Aktive Phase
  const phCard=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"18px"});
  phCard.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"},"Aktuelle SIA-Phase"));
  const phRow=div({display:"flex",flexWrap:"wrap",gap:"6px"});
  let selPhase="31";
  SIA.forEach(ph=>{
    const b=div({padding:"7px 12px",borderRadius:"8px",cursor:"pointer",border:`2px solid ${selPhase===ph.id?ph.color:"rgba(255,255,255,0.08)"}`,background:selPhase===ph.id?`${ph.color}18`:"rgba(255,255,255,0.02)",color:selPhase===ph.id?ph.color:"#666",fontSize:"11px",fontWeight:"700"},`SIA ${ph.nr} · ${ph.kurz}`);
    b.addEventListener("click",()=>{selPhase=ph.id;draft.aktivPhase=ph.id;phRow.querySelectorAll("div").forEach((x,i)=>{x.style.borderColor=SIA[i].id===ph.id?SIA[i].color:"rgba(255,255,255,0.08)";x.style.background=SIA[i].id===ph.id?`${SIA[i].color}18`:"rgba(255,255,255,0.02)";x.style.color=SIA[i].id===ph.id?SIA[i].color:"#666";});});
    phRow.appendChild(b);
  });
  phCard.appendChild(phRow);
  body.appendChild(phCard);

  // Team
  const teamCard=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"12px",padding:"18px"});
  teamCard.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"},"Projektteam"));
  const teamList=div({display:"flex",flexDirection:"column",gap:"7px",marginBottom:"9px"});

  const renderTeam=()=>{
    teamList.innerHTML="";
    beteiligte.forEach((b,i)=>{
      const fb=FBS.find(f=>f.id===b.fb);
      const row=div({display:"flex",alignItems:"center",gap:"9px",background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:"9px",padding:"8px 11px"});
      row.appendChild(span(fb?.icon||"?",{color:fb?.color||"#888",fontSize:"14px"}));
      row.appendChild(span(b.name,{fontSize:"12px",color:C.muted,flex:"1"}));
      if(fb)row.appendChild(span(`${fb.icon} ${fb.label}`,{fontSize:"9px",fontWeight:"700",color:fb.color,background:`${fb.color}18`,padding:"1px 6px",borderRadius:"3px"}));
      row.appendChild(btn("✕",()=>{beteiligte=beteiligte.filter((_,j)=>j!==i);renderTeam();},{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:"13px",padding:"0 3px"}));
      teamList.appendChild(row);
    });
  };

  teamCard.appendChild(teamList);

  const fbSelRow=div({display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"9px"});
  let curFb="pl_gt";
  FBS.forEach(fb=>{
    const b=btn(`${fb.icon} ${fb.label}`,()=>{curFb=fb.id;fbSelRow.querySelectorAll("button").forEach((x,i)=>{x.style.border=`1px solid ${FBS[i].id===fb.id?`${FBS[i].color}55`:C.border}`;x.style.background=FBS[i].id===fb.id?`${FBS[i].color}15`:"rgba(255,255,255,0.02)";x.style.color=FBS[i].id===fb.id?FBS[i].color:"#666";});},{display:"flex",alignItems:"center",gap:"5px",padding:"5px 9px",borderRadius:"6px",cursor:"pointer",border:`1px solid ${fb.id===curFb?`${fb.color}55`:C.border}`,background:fb.id===curFb?`${fb.color}15`:"rgba(255,255,255,0.02)",color:fb.id===curFb?fb.color:"#666",fontSize:"10px",fontWeight:"600"});
    fbSelRow.appendChild(b);

  teamCard.appendChild(fbSelRow);

  const addRow=div({display:"flex",gap:"8px"});
  const ni2=inp("",v=>{addNameLocal=v;},"Name des Beteiligten"); ni2.style.flex="1";
  ni2.addEventListener("keydown",e=>{if(e.key==="Enter"&&addNameLocal.trim()){beteiligte=[...beteiligte,{fb:curFb,name:addNameLocal}];addNameLocal="";ni2.value="";renderTeam();}});
  const addBtn=btn("+",()=>{if(addNameLocal.trim()){beteiligte=[...beteiligte,{fb:curFb,name:addNameLocal}];addNameLocal="";ni2.value="";renderTeam();}},{padding:"0 18px",borderRadius:"9px",cursor:"pointer",background:"rgba(200,169,110,0.15)",border:"1px solid rgba(200,169,110,0.3)",color:C.gold,fontSize:"20px",flexShrink:"0"});
  addRow.appendChild(ni2); addRow.appendChild(addBtn);
  teamCard.appendChild(addRow);
  body.appendChild(teamCard);

  // Save
  body.appendChild(btn("✓ Projekt erstellen",()=>{
    const e={};
    if(!draft.name.trim())e.name="Pflichtfeld";
    if(!draft.ort.trim())e.ort="Pflichtfeld";
    if(!draft.kanton)e.kanton="Pflichtfeld";
    if(!draft.bauherrschaft.trim())e.bauherrschaft="Pflichtfeld";
    if(Object.keys(e).length>0){alert("Bitte alle Pflichtfelder ausfüllen.");return;}
    const ps=initPS();
    const newP={id:Date.now(),name:draft.name,ort:draft.ort,kanton:draft.kanton,bauherrschaft:draft.bauherrschaft,bgf:parseInt(draft.bgf)||0,bkpSumme:parseInt(draft.bkpSumme)||0,aktivPhase:draft.aktivPhase||"31",beteiligte,phasenStatus:ps,plaene:{},bkpKosten:{}};
    setState(s=>({projekte:[...s.projekte,newP],view:"liste"}));
  },{padding:"15px",borderRadius:"12px",cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:"15px",fontWeight:"800",width:"100%"}));

  page.appendChild(body);
  return page;
}

    bc.appendChild(tags);
    bc.appendChild(div({fontSize:"20px",fontWeight:"800",marginBottom:"4px"},sel.norm));
    bc.appendChild(div({fontSize:"13px",color:C.muted},sel.titel));
    body.appendChild(bc);
    const grid=div({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"16px"});
    [["Neubau",sel.neu?"✓ Ja":"— Nein"],["Sanierung",sel.san?"✓ Ja":"— Nein"],["Aufwand",sel.auf],["Fachbereich",sel.fb.join(", ")]].forEach(([k,v])=>{
      const cc=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"11px 13px"});
      cc.appendChild(div({fontSize:"9px",color:C.dim,letterSpacing:"0.06em",marginBottom:"4px"},k.toUpperCase()));
      cc.appendChild(div({fontSize:"12px",color:C.muted,fontWeight:"600"},v));
      grid.appendChild(cc);
    });
    body.appendChild(grid);
    page.appendChild(body);
    return page;
  }

  const empf = (!gtyp||!bautyp)?[]:NW.filter(n=>n.gt.includes(gtyp)&&(bautyp==="neubau"?n.neu:n.san)&&(fb==="alle"||n.fb.includes(fb))).sort((a,b)=>(b.pflicht?1:0)-(a.pflicht?1:0));
  const bib = NW.filter(n=>(katF==="alle"||n.kat===katF)&&(!search||n.norm.toLowerCase().includes(search.toLowerCase())||n.titel.toLowerCase().includes(search.toLowerCase())));

  const page=div({minHeight:"100vh",background:C.dark,paddingBottom:"100px"});
  const hdr=div({background:"#141412",borderBottom:`1px solid ${C.border}`,padding:"52px 18px 16px"});
  hdr.appendChild(div({fontSize:"22px",fontWeight:"800",letterSpacing:"-0.02em",marginBottom:"12px"},"Energienachweise"));
  const tabRow=div({display:"flex",gap:"3px",background:"rgba(255,255,255,0.04)",borderRadius:"11px",padding:"4px",border:`1px solid ${C.border}`});
  [["assistent","⚙ Assistent"],["bibliothek","◈ Bibliothek"]].forEach(([id,l])=>{
    tabRow.appendChild(btn(l,()=>setState({nwTab:id}),{flex:"1",padding:"9px",borderRadius:"8px",border:"none",cursor:"pointer",fontSize:"13px",fontWeight:"700",background:tab===id?"rgba(200,169,110,0.2)":"transparent",color:tab===id?C.gold:"#555"}));
  });
  hdr.appendChild(tabRow);
  page.appendChild(hdr);

  const body=div({padding:"16px 18px"});

  if(tab==="assistent"){
    body.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.dim,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"},"Gebäudetyp wählen"));
    const gGrid=div({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px",marginBottom:"12px"});
    GTYP.forEach(g=>{
      const b=div({display:"flex",alignItems:"center",gap:"9px",padding:"10px 12px",borderRadius:"10px",cursor:"pointer",border:`1px solid ${gtyp===g.id?"rgba(200,169,110,0.4)":C.border}`,background:gtyp===g.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)"});
      b.appendChild(span(g.icon,{fontSize:"18px"}));
      b.appendChild(span(g.label,{fontSize:"12px",fontWeight:"600",color:gtyp===g.id?C.gold:"#888"}));
      b.addEventListener("click",()=>setState({nwGtyp:g.id}));
      gGrid.appendChild(b);
    });
    body.appendChild(gGrid);
    const btRow=div({display:"flex",gap:"8px",marginBottom:"12px"});
    [["neubau","🏗 Neubau"],["sanierung","🔧 Sanierung"]].forEach(([id,l])=>{
      btRow.appendChild(btn(l,()=>setState({nwBautyp:id}),{flex:"1",padding:"11px",borderRadius:"10px",cursor:"pointer",border:`1px solid ${bautyp===id?"rgba(200,169,110,0.4)":C.border}`,background:bautyp===id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)",color:bautyp===id?C.gold:"#666",fontSize:"13px",fontWeight:"700"}));
    });
    body.appendChild(btRow);
    const fbRow=div({display:"flex",gap:"5px",marginBottom:"16px",overflowX:"auto",paddingBottom:"4px"});
    [{id:"alle",l:"Alle"},{id:"bauphysik",l:"Bauphysik ◻"},{id:"hlk",l:"HLK ♨"},{id:"elektro",l:"Elektro ⚡"}].forEach(f=>{
      fbRow.appendChild(btn(f.l,()=>setState({nwFb:f.id}),{padding:"7px 13px",borderRadius:"20px",border:`1px solid ${fb===f.id?"rgba(200,169,110,0.35)":C.border}`,background:fb===f.id?"rgba(200,169,110,0.12)":"rgba(255,255,255,0.03)",color:fb===f.id?C.gold:"#666",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap",cursor:"pointer",flexShrink:"0"}));
    });
    body.appendChild(fbRow);
    if(gtyp&&bautyp){
      const ri=div({padding:"9px 13px",borderRadius:"9px",background:"rgba(200,169,110,0.07)",border:"1px solid rgba(200,169,110,0.15)",marginBottom:"11px",display:"flex",justifyContent:"space-between"});
      ri.appendChild(span("",{fontSize:"12px",color:C.muted}));
      ri.firstChild.appendChild(span(`${empf.length}`,{color:C.gold,fontWeight:"700"}));
      ri.firstChild.appendChild(span(" Nachweise"));
      ri.appendChild(span(`${empf.filter(n=>n.pflicht).length} Pflicht`,{fontSize:"11px",color:C.red,fontWeight:"700"}));
      body.appendChild(ri);
      empf.forEach(n=>{
        const kc=KATC[n.kat];
        const nc=div({background:"rgba(255,255,255,0.04)",border:`1px solid ${kc.bd}`,borderRadius:"12px",padding:"13px",marginBottom:"8px",cursor:"pointer",position:"relative",overflow:"hidden"});
        const tb=div({position:"absolute",top:"0",left:"0",right:"0",height:"2px",background:`linear-gradient(90deg,${kc.tx}88,transparent)`});
        nc.appendChild(tb);
        const tr=div({display:"flex",justifyContent:"space-between",marginBottom:"6px"});
        const tl=div({display:"flex",gap:"5px"});
        tl.appendChild(katBadge(n.kat));
        if(n.pflicht)tl.appendChild(span("PFLICHT",{fontSize:"9px",fontWeight:"700",padding:"2px 7px",borderRadius:"4px",background:"rgba(232,115,90,0.15)",border:"1px solid rgba(232,115,90,0.3)",color:C.red}));
        tr.appendChild(tl);
        tr.appendChild(span(n.auf,{fontSize:"9px",fontWeight:"700",color:AUFC[n.auf]}));
        nc.appendChild(tr);
        nc.appendChild(div({fontSize:"14px",fontWeight:"700",color:C.main,marginBottom:"2px"},n.norm));
        nc.appendChild(div({fontSize:"11px",color:"#666"},n.titel));
        nc.addEventListener("click",()=>setState({nwSel:n}));
        body.appendChild(nc);
      });
    } else {
      const empty=div({border:"2px dashed rgba(255,255,255,0.08)",borderRadius:"14px",padding:"38px 20px",textAlign:"center"});
      empty.appendChild(div({fontSize:"30px",marginBottom:"10px"},"◈"));
      empty.appendChild(div({fontSize:"14px",fontWeight:"600",color:C.dim},"Gebäudetyp & Massnahme wählen"));
      body.appendChild(empty);
    }
  } else {
    const si=inp(search,v=>setState({nwSearch:v}),"Norm suchen... (z.B. SIA, MINERGIE)");
    si.style.marginBottom="11px"; si.style.display="block";
    body.appendChild(si);
    const kr=div({display:"flex",gap:"5px",marginBottom:"12px",overflowX:"auto",paddingBottom:"4px"});
    [{id:"alle",l:"Alle"},...Object.keys(KATC).map(k=>({id:k,l:k}))].forEach(k=>{
      const kc=k.id!=="alle"?KATC[k.id]:null;
      kr.appendChild(btn(k.l,()=>setState({nwKat:k.id}),{padding:"6px 12px",borderRadius:"18px",border:`1px solid ${katF===k.id?(kc?kc.bd:"rgba(200,169,110,0.35)"):C.border}`,background:katF===k.id?(kc?kc.bg:"rgba(200,169,110,0.12)"):"rgba(255,255,255,0.03)",color:katF===k.id?(kc?kc.tx:C.gold):"#666",fontSize:"11px",fontWeight:"600",whiteSpace:"nowrap",cursor:"pointer",flexShrink:"0"}));
    });
    body.appendChild(kr);
    bib.forEach(n=>{
      const kc=KATC[n.kat];
      const nc=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"11px",padding:"13px",marginBottom:"8px",cursor:"pointer"});
      const tr=div({display:"flex",justifyContent:"space-between",marginBottom:"6px"});
      tr.appendChild(katBadge(n.kat));
      tr.appendChild(span(n.auf,{fontSize:"9px",fontWeight:"700",color:AUFC[n.auf]}));
      nc.appendChild(tr);
      nc.appendChild(div({fontSize:"14px",fontWeight:"700",color:C.main,marginBottom:"2px"},n.norm));
      nc.appendChild(div({fontSize:"11px",color:"#666"},n.titel));
      nc.addEventListener("click",()=>setState({nwSel:n}));
      body.appendChild(nc);
    });
  }

  page.appendChild(body);
  return page;
}

// ── PROFIL ────────────────────────────────────────────────────────────────────
function profilPage() {
  const {user} = STATE;
  let localName = STATE.profName || user.name;
  let localFb = STATE.profFb || user.fb;
  const rol = ROLLEN.find(r=>r.id===user.rolle);
  const ini = localName.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase()||user.kuerzel;

  const page=div({minHeight:"100vh",background:C.dark,paddingBottom:"100px"});
  const hdr=div({background:"#141412",borderBottom:`1px solid ${C.border}`,padding:"52px 18px 20px",display:"flex",alignItems:"center",gap:"14px"});
  hdr.appendChild(avatar({...user,name:localName,kuerzel:ini},50));
  const hi=div(null);
  hi.appendChild(div({fontSize:"19px",fontWeight:"800",marginBottom:"5px"},localName||user.name));
  hi.appendChild(rolBadge(user.rolle,false));
  hdr.appendChild(hi);
  page.appendChild(hdr);

  const body=div({padding:"16px 18px",display:"flex",flexDirection:"column",gap:"14px"});

  const dataCard=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px"});
  dataCard.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"},"Persönliche Daten"));
  const ni=inp(localName,v=>{localName=v;setState({profName:v});},"Vor- und Nachname");
  dataCard.appendChild(fld("Name",false,null,ni));
  const em=div({...Object.fromEntries(Object.entries(Object.assign({},Object.fromEntries(["background","rgba(255,255,255,0.06)","border","1px solid rgba(255,255,255,0.1)","borderRadius","10px","padding","11px 14px","color","#555","fontSize","14px","-webkit-appearance","none"].reduce((a,v,i,arr)=>i%2===0?[...a,[v,arr[i+1]]]:a,[])))))},user.email);
  Object.assign(em.style,{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"10px",padding:"11px 14px",color:"#555",fontSize:"14px",marginTop:"10px"});
  em.textContent=user.email;
  dataCard.appendChild(em);
  body.appendChild(dataCard);

  const fbCard=div({background:C.card,border:`1px solid ${C.border}`,borderRadius:"14px",padding:"16px"});
  fbCard.appendChild(div({fontSize:"9px",fontWeight:"700",color:C.gold,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"12px"},"Fachbereich"));
  const fbGrid=div({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px"});
  FBS.forEach(fb=>{
    const b=div({display:"flex",alignItems:"center",gap:"8px",padding:"9px 11px",borderRadius:"9px",cursor:"pointer",border:`1px solid ${localFb===fb.id?`${fb.color}55`:C.border}`,background:localFb===fb.id?`${fb.color}12`:"rgba(255,255,255,0.03)"});
    b.appendChild(span(fb.icon,{fontSize:"15px"}));
    b.appendChild(span(fb.label,{fontSize:"11px",fontWeight:"600",color:localFb===fb.id?fb.color:"#888"}));
    b.addEventListener("click",()=>{localFb=fb.id;setState({profFb:fb.id});});
    fbGrid.appendChild(b);
  });
  fbCard.appendChild(fbGrid);
  body.appendChild(fbCard);

  if(rol){
    const rolCard=div({background:`${rol.color}10`,border:`1px solid ${rol.color}30`,borderRadius:"12px",padding:"14px",display:"flex",alignItems:"center",gap:"12px"});
    rolCard.appendChild(span(rol.icon,{fontSize:"22px",color:rol.color}));
    const ri=div(null); ri.appendChild(div({fontSize:"13px",fontWeight:"700",color:rol.color},rol.label)); ri.appendChild(div({fontSize:"11px",color:C.dim,marginTop:"1px"},rol.desc));
    rolCard.appendChild(ri);
    body.appendChild(rolCard);
  }

  let saved=false;
  const saveBtn=btn("Änderungen speichern",()=>{
    if(!saved){
      const ini2=localName.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase()||user.kuerzel;
      const updated={...user,name:localName,fb:localFb,kuerzel:ini2};
      setState(s=>({users:s.users.map(u=>u.id===updated.id?updated:u),user:updated,profSaved:true}));
      saveBtn.textContent="✓ Gespeichert!";
      saveBtn.style.background="linear-gradient(135deg,#6BAF7A,#8BD4A0)";
      setTimeout(()=>{saveBtn.textContent="Änderungen speichern";saveBtn.style.background="linear-gradient(135deg,#C8A96E,#E8C98E)";},2000);
    }
  },{padding:"14px",borderRadius:"11px",cursor:"pointer",background:"linear-gradient(135deg,#C8A96E,#E8C98E)",border:"none",color:C.dark,fontSize:"14px",fontWeight:"800",width:"100%",transition:"all 0.2s"});
  body.appendChild(saveBtn);
  body.appendChild(btn("⎋ Abmelden",()=>setState({user:null,tab:"projekte",view:"liste"}),{padding:"13px",borderRadius:"11px",cursor:"pointer",background:"rgba(232,115,90,0.08)",border:"1px solid rgba(232,115,90,0.25)",color:C.red,fontSize:"13px",fontWeight:"700",width:"100%"}));

  page.appendChild(body);
  return page;
}

// ── TAB BAR ───────────────────────────────────────────────────────────────────
function tabBar() {
  const {tab, user} = STATE;
  const canEdit = ["admin","planer"].includes(user?.rolle);
  const TABS=[{id:"projekte",ic:"▦",l:"Projekte"},...(canEdit?[{id:"neu",ic:"+",l:"Neu"}]:[]),{id:"nachweise",ic:"◈",l:"Nachweise"},{id:"profil",ic:"◯",l:"Profil"}];
  const bar = div({position:"fixed",bottom:"0",left:"0",right:"0",background:"rgba(8,8,7,0.97)",borderTop:`1px solid ${C.border}`,display:"flex",zIndex:"200",paddingBottom:"env(safe-area-inset-bottom)"});
  TABS.forEach(t=>{
    const b=div({flex:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"10px 4px 8px",cursor:"pointer",gap:"3px",position:"relative"});
    const isActive = tab===t.id;
    const ic=span(t.ic,{fontSize:t.id==="neu"?"24px":"17px",color:isActive?C.gold:"#555",fontWeight:t.id==="neu"?"300":"400",lineHeight:"1",display:"block"});
    const lb=span(t.l,{fontSize:"9px",fontWeight:"700",color:isActive?C.gold:"#444",letterSpacing:"0.04em",display:"block"});
    if(isActive && t.id!=="neu"){const act=div({position:"absolute",top:"0",left:"25%",right:"25%",height:"2px",background:C.gold,borderRadius:"0 0 2px 2px"});b.appendChild(act);}
    b.appendChild(ic); b.appendChild(lb);
    b.addEventListener("click",()=>{
      if(t.id==="neu"){setState({view:"neu",tab:"projekte"});}
      else{setState({tab:t.id,view:t.id==="projekte"?"liste":STATE.view});}
    });
    bar.appendChild(b);
  });
  return bar;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const {user, tab, view} = STATE;

  if (!user) { app.appendChild(authScreen()); return; }

  const showBar = !(view==="detail"||view==="neu");

  let content;
  if(tab==="projekte" && view==="liste") content = projektListe();
  else if(tab==="projekte" && view==="detail") content = projektDetail();
  else if(tab==="projekte" && view==="neu") content = neuProjekt();
  else if(tab==="nachweise") content = energienachweise();
  else if(tab==="profil") content = profilPage();
  else content = projektListe();

  app.appendChild(content);
  if(showBar) app.appendChild(tabBar());
}

render();
</script>
</body>
</html>
